<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My surveys | Pingu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* ═══ Pingu design system — base (copy verbatim into each page's <style>) ═══ */
        :root {
            /* Brand + status palette */
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --secondary: #FFC857;
            --accent: #00D9FF;
            --dark: #1A1A2E;
            --dark-light: #252541;
            --dark-lighter: #2F2F4A;
            --text: #EAEAEA;
            --text-dim: #9A9AB0;
            --success: #4ECCA3;
            --error: #FF6B6B;
            --warning: #FFC857;
            --in-progress: #00D9FF;
            --complete: #4ECCA3;
            --aborted: #FF6B6B;
            --cancelled: #9A9AB0;
            --short-notice: #90ee90;
            --on-hold: #FFDE00;
            --scheduled: #FF6B35;
            /* Surfaces & type */
            --bg: #161628;
            --surface: #1F1F35;
            --surface-2: #252541;
            --line: rgba(255,255,255,0.07);
            --line-2: rgba(255,255,255,0.12);
            --text-strong: #F4F4F8;
            --text-soft: #C8C8D6;
            --radius: 10px;
            --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: var(--font); font-size: 14px; line-height: 1.5;
            background: var(--bg); color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        button, input, select, textarea { font-family: inherit; }
        a { color: var(--accent); }
        .ico { width: 16px; height: 16px; flex: 0 0 auto; vertical-align: -3px; }
        .ico-lg { width: 20px; height: 20px; flex: 0 0 auto; }

        /* ── App bar + Pingu wordmark ── */
        .appbar {
            position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            height: 64px; padding: 0 28px;
            background: rgba(22, 22, 40, 0.92);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line);
        }
        .appbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .logo { display: inline-flex; align-items: center; text-decoration: none; }
        .wordmark {
            font-family: 'Inter', var(--font); font-weight: 800; font-size: 28px;
            letter-spacing: -0.045em; line-height: 1; color: var(--text-strong); padding-top: 6px;
        }
        .i-stem { position: relative; display: inline-block; }
        .i-paw {
            position: absolute; left: 50%; top: -0.17em; transform: translateX(-50%) rotate(-10deg);
            width: 0.5em; height: 0.5em; fill: var(--primary);
            filter: drop-shadow(0 1px 4px rgba(255,107,53,0.35));
            transition: transform .2s ease;
        }
        .logo:hover .i-paw { transform: translateX(-50%) rotate(4deg) scale(1.08); }
        .logo:hover .wordmark { color: #fff; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-soft); text-decoration: none; font-size: 13px; font-weight: 500;
            padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; cursor: pointer;
            transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .back-btn:hover { background: var(--surface-2); color: var(--text-strong); border-color: rgba(255,255,255,0.2); }

        /* ── Page layout ── */
        .container { padding: 24px 28px 40px; }
        .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
        h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-strong); line-height: 1.2; }
        h2 { font-size: 16px; font-weight: 600; color: var(--text-strong); letter-spacing: -0.01em; }
        h3 { font-size: 14px; font-weight: 600; color: var(--text-strong); }
        .muted { color: var(--text-dim); }
        .toolbar { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }

        /* ── Panels / cards ── */
        .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
        .panel + .panel { margin-top: 16px; }
        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -2px 0 14px; }
        .panel-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--text-strong); }
        .panel-title .ico { color: var(--primary); }

        /* ── Form controls ── */
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-label { color: var(--text-dim); font-size: 11.5px; font-weight: 500; }
        .control-input {
            height: 38px; background: var(--surface); border: 1px solid var(--line-2);
            color: var(--text-strong); padding: 0 12px; border-radius: 8px; font-size: 13.5px; width: 100%;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        textarea.control-input { height: auto; min-height: 84px; padding: 9px 11px; resize: vertical; }
        .control-input:hover { border-color: rgba(255,255,255,0.2); }
        .control-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.22); }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); cursor: pointer; }
        input[type="checkbox"], input[type="radio"] { accent-color: var(--primary); }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 7px;
            height: 38px; padding: 0 16px; border-radius: 8px; cursor: pointer;
            font-size: 13.5px; font-weight: 600; text-decoration: none; white-space: nowrap;
            border: 1px solid transparent; transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--surface-2); color: var(--text-strong); border-color: var(--line-2); }
        .btn-secondary:hover { background: var(--dark-lighter); border-color: rgba(255,255,255,0.25); }
        .btn-ghost { background: transparent; color: var(--text-soft); border-color: var(--line-2); }
        .btn-ghost:hover { background: var(--surface-2); color: var(--text-strong); }
        .btn-danger { background: rgba(255,107,107,0.12); color: #FF8A8A; border-color: rgba(255,107,107,0.4); }
        .btn-danger:hover { background: rgba(255,107,107,0.22); }
        .btn-success { background: rgba(78,204,163,0.14); color: var(--success); border-color: rgba(78,204,163,0.45); }
        .btn-success:hover { background: rgba(78,204,163,0.24); }
        .btn-sm { height: 32px; padding: 0 12px; font-size: 12.5px; }
        .btn:disabled, button:disabled { opacity: .45; cursor: not-allowed; }
        .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; height: 38px; }
        .seg button { background: var(--surface); color: var(--text-soft); border: 0; padding: 0 12px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .seg button + button { border-left: 1px solid var(--line-2); }
        .seg button:hover, .seg button.active { background: var(--surface-2); color: var(--text-strong); }

        /* ── KPI tiles ── */
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
        .stat-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; }
        .stat-label { display: flex; align-items: center; gap: 7px; color: var(--text-dim); font-size: 12px; font-weight: 500; white-space: nowrap; }
        .stat-label .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
        .stat-value { font-size: 22px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.02em; line-height: 1.25; margin-top: 2px; font-variant-numeric: tabular-nums; }

        /* ── Tables ── */
        .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
        thead th {
            position: sticky; top: 0; z-index: 2; background: var(--surface);
            text-align: left; padding: 10px 14px; font-size: 11.5px; font-weight: 600; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--line-2); white-space: nowrap;
        }
        tbody td { padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--text-soft); vertical-align: middle; }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover td { background: rgba(255,255,255,0.025); }
        td.strong, .cell-strong { color: var(--text-strong); font-weight: 600; }
        .mono { font-family: var(--mono); font-size: 12.5px; }

        /* ── Badges / status pills ── */
        .badge {
            --c: var(--text-dim);
            display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
            padding: 2px 9px; border-radius: 999px; color: var(--text-strong);
            background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
        }
        .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
        .badge.plain::before { display: none; }
        .tag { font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 4px; background: rgba(255,255,255,0.1); color: var(--text-soft); letter-spacing: .03em; }

        /* ── Notices ── */
        .notice { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 13px;
                  background: rgba(255,255,255,0.03); border: 1px solid var(--line-2); color: var(--text-soft); }
        .notice .ico { margin-top: 1px; }
        .notice.info    { border-color: rgba(0,217,255,0.35);  background: rgba(0,217,255,0.06); }
        .notice.success { border-color: rgba(78,204,163,0.4);  background: rgba(78,204,163,0.07); color: var(--success); }
        .notice.warning { border-color: rgba(255,200,87,0.4);  background: rgba(255,200,87,0.07); color: var(--warning); }
        .notice.error   { border-color: rgba(255,107,107,0.45); background: rgba(255,107,107,0.08); color: #FF8A8A; }

        /* ── Modals ── */
        .modal { display: none; position: fixed; inset: 0; background: rgba(10,10,22,0.72); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
        .modal.show, .modal.active, .modal.open { display: flex; }
        .modal-content { background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; width: 100%; max-width: 680px; max-height: 88vh; overflow-y: auto; box-shadow: 0 30px 80px -20px rgba(0,0,0,0.75); }
        .modal-header { position: sticky; top: 0; z-index: 2; background: var(--surface); display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
        .modal-title { font-size: 17px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.01em; }
        .modal-body { padding: 18px 20px 22px; }
        .close-btn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; border-radius: 8px; color: var(--text-dim); cursor: pointer; font-size: 20px; line-height: 1; }
        .close-btn:hover { background: var(--surface-2); color: var(--text-strong); }

        /* ── Feedback ── */
        .toast { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: none; max-width: 420px; padding: 12px 16px 12px 14px; border-radius: 10px;
                 background: #26263F; color: var(--text-strong); font-size: 13.5px; border: 1px solid var(--line-2); border-left: 3px solid var(--success);
                 box-shadow: 0 16px 40px -12px rgba(0,0,0,0.7); }
        .toast.show { display: block; }
        .toast.error { border-left-color: var(--error); }
        .empty-state, .loading { text-align: center; padding: 56px 16px; color: var(--text-dim); }
        .empty-state h3 { color: var(--text-strong); font-size: 16px; margin-bottom: 4px; }
        .empty-state .ico-lg { width: 32px; height: 32px; color: var(--text-dim); margin-bottom: 10px; }
        .spinner { width: 22px; height: 22px; border: 2px solid var(--line-2); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        *::-webkit-scrollbar { width: 10px; height: 10px; }
        *::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
        *::-webkit-scrollbar-track { background: transparent; }
        @media (max-width: 768px) {
            .appbar, .container { padding-left: 14px; padding-right: 14px; }
            .wordmark { font-size: 24px; }
        }
        /* ═══ end base ═══ */

        /* ── Page: my surveys ── */
        :root { --kf: #B57BFF; }

        .welcome-pill { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 500; color: var(--text-soft);
                        padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line-2); }
        .welcome-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); flex: 0 0 auto; }

        /* KPI tiles */
        .stats-bar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
        .stat-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; }
        .stat-lbl { display: flex; align-items: center; gap: 7px; color: var(--text-dim); font-size: 12px; font-weight: 500; white-space: nowrap; }
        .stat-lbl .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
        .stat-val { font-size: 22px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.02em; line-height: 1.25; margin-top: 2px; font-variant-numeric: tabular-nums; }

        /* Filter bar */
        .filter-bar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; margin-bottom: 16px; }
        .filter-bar .control-group { min-width: 180px; }
        .filter-bar .control-group.grow { flex: 1; min-width: 200px; max-width: 420px; }
        .filter-select option { background: var(--surface); }
        .filter-input::placeholder { color: var(--text-dim); }

        /* States */
        .state-msg { text-align: center; padding: 56px 16px; color: var(--text-dim); display: none; }
        .state-msg.show { display: block; }
        .state-msg .icon { margin-bottom: 10px; color: var(--text-dim); }
        .state-msg .icon .ico { width: 32px; height: 32px; }

        /* Survey cards */
        .survey-list { display: flex; flex-direction: column; gap: 10px; }
        .survey-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; transition: border-color .15s ease; }
        .survey-card:hover { border-color: var(--line-2); }
        .card-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; cursor: pointer; user-select: none; transition: background .15s ease; }
        .card-header:hover { background: rgba(255,255,255,0.02); }
        .card-header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .type-icon { width: 38px; height: 38px; border-radius: 10px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; }
        .type-icon .ico { width: 18px; height: 18px; }
        .type-icon.battery-only      { background: rgba(0,217,255,0.12); color: var(--accent); }
        .type-icon.battery-and-solar { background: rgba(255,200,87,0.12); color: var(--secondary); }
        .type-icon.unknown           { background: rgba(255,107,53,0.12); color: var(--primary); }
        .card-meta { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
        .card-job { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--text-strong); }
        .card-date { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-dim); }
        .card-date .ico { width: 13px; height: 13px; }
        .card-header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
        .type-badge { --c: var(--text-dim); display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap; padding: 2px 9px; border-radius: 999px;
                      color: var(--text-strong); background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); }
        .type-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
        .badge-battery-only      { --c: var(--accent); }
        .badge-battery-and-solar { --c: var(--secondary); }
        .chevron { color: var(--text-dim); display: inline-flex; transition: transform .2s ease; flex: 0 0 auto; }
        .survey-card.open .chevron { transform: rotate(180deg); }

        .card-body { display: none; border-top: 1px solid var(--line); }
        .survey-card.open .card-body { display: block; }

        .section-block { padding: 16px 18px; border-bottom: 1px solid var(--line); }
        .section-block:last-child { border-bottom: none; }
        .section-title { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--text-strong); margin-bottom: 12px; }
        .section-title .ico { color: var(--primary); }

        .fields-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px 20px; }
        .field-item { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        .field-lbl { font-size: 12px; color: var(--text-dim); font-weight: 500; }
        .field-val { font-size: 14px; color: var(--text-strong); font-weight: 500; word-break: break-word; }
        .field-val.missing { color: var(--text-dim); font-style: italic; font-weight: 400; font-size: 13px; }
        .val-yes, .val-no, .val-na { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 1px 9px; border-radius: 999px; color: var(--text-strong);
                                     background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); }
        .val-yes::before, .val-no::before, .val-na::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
        .val-yes { --c: var(--complete); } .val-no { --c: var(--aborted); } .val-na { --c: var(--cancelled); }

        .materials-list { display: flex; flex-direction: column; gap: 6px; }
        .material-item { background: var(--bg); border: 1px solid var(--line); border-left: 3px solid var(--kf); border-radius: 8px; padding: 8px 12px; font-size: 13.5px; color: var(--text-strong); }
        .no-materials { color: var(--text-dim); font-style: italic; font-size: 13px; }

        .photos-grid { display: flex; flex-wrap: wrap; gap: 8px; }
        .photo-thumb { width: 76px; height: 76px; border-radius: 8px; object-fit: cover; border: 1px solid var(--line-2); cursor: pointer; transition: border-color .15s ease; background: var(--surface-2); }
        .photo-thumb:hover { border-color: var(--primary); }
        .photo-count { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

        .view-survey-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; padding: 12px 18px; background: rgba(255,255,255,0.015); border-bottom: 1px solid var(--line); }
        .view-survey-label { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-dim); }
        .view-survey-label .ico { width: 14px; height: 14px; }
        .view-survey-link { height: 34px; padding: 0 14px; font-size: 13px; }

        .ripper-block { padding: 16px 18px; border-bottom: 1px solid var(--line); }
        .ripper-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 600; color: var(--text-strong); margin-bottom: 12px; }
        .ripper-title > span:first-child { display: inline-flex; align-items: center; gap: 8px; }
        .ripper-title .ico { color: var(--primary); }
        .ripper-saved-chip { font-size: 12px; color: var(--text-dim); font-weight: 500; }
        .ripper-address-val { font-size: 14px; color: var(--text-strong); line-height: 1.6; margin-bottom: 12px; }
        .ripper-imgs-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .ripper-img-card { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
        .ripper-img-label { display: flex; align-items: center; gap: 7px; padding: 8px 12px; font-size: 12.5px; font-weight: 600; color: var(--text-soft); border-bottom: 1px solid var(--line); }
        .ripper-img-label .ico { width: 14px; height: 14px; color: var(--primary); }
        .ripper-img-card img { width: 100%; display: block; cursor: pointer; max-height: 240px; object-fit: contain; background: rgba(0,0,0,0.25); }
        .ripper-no-data { display: flex; align-items: center; gap: 8px; color: var(--text-dim); font-size: 13px; }
        .ripper-loading { display: flex; align-items: center; gap: 8px; color: var(--text-dim); font-size: 13px; padding: 4px 0; }
        .ripper-spinner { width: 14px; height: 14px; border: 2px solid var(--line-2); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; }

        /* Lightbox */
        .lightbox { position: fixed; inset: 0; background: rgba(10,10,22,0.94); z-index: 9000; display: none; align-items: center; justify-content: center; flex-direction: column; padding: 16px; cursor: zoom-out; }
        .lightbox.show { display: flex; }
        .lightbox img { max-width: 92vw; max-height: 80vh; border-radius: 10px; object-fit: contain; }
        .lightbox-label { color: var(--text-soft); font-size: 12.5px; margin-top: 10px; }
        .lightbox-close { position: absolute; top: 14px; right: 14px; width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center;
                          background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 8px; color: var(--text-strong); cursor: pointer; font-size: 24px; line-height: 1; }
        .lightbox-close:hover { background: var(--dark-lighter); }

        /* Toast: centred at bottom on this page */
        .toast { left: 50%; right: auto; transform: translateX(-50%); }

        /* Forward */
        .forward-btn { height: 32px; padding: 0 12px; font-size: 12.5px; }
        .fwd-modal { display: none; position: fixed; inset: 0; background: rgba(10,10,22,0.72); backdrop-filter: blur(4px); z-index: 8000; align-items: center; justify-content: center; padding: 16px; }
        .fwd-modal.show { display: flex; }
        .fwd-modal-box { background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; padding: 20px; width: 100%; max-width: 440px; box-shadow: 0 30px 80px -20px rgba(0,0,0,0.75); }
        .fwd-title { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.01em; }
        .fwd-title .ico { color: var(--primary); width: 18px; height: 18px; }
        .fwd-sub { font-size: 13px; color: var(--text-dim); margin: 2px 0 16px; }
        .fwd-sub span { font-family: var(--mono); font-size: 12.5px; color: var(--text-soft); }
        .fwd-input { height: 42px; margin-bottom: 14px; font-size: 14px; }
        .fwd-input::placeholder { color: var(--text-dim); }
        .fwd-actions { display: flex; gap: 8px; }
        .fwd-send { flex: 1; height: 40px; }
        .fwd-cancel { height: 40px; }
        .fwd-picklist-status { display: none; font-size: 12.5px; color: var(--text-soft); margin-bottom: 12px; padding: 8px 12px; background: var(--bg); border: 1px solid var(--line); border-left: 3px solid var(--kf); border-radius: 8px; }
        .fwd-picklist-status.show { display: block; }

        @media (max-width: 768px) {
            .stats-bar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .filter-bar .control-group, .filter-bar .control-group.grow { flex: 1 1 100%; max-width: none; min-width: 0; }
            .filter-bar .control-input { height: 44px; font-size: 16px; }
            .card-header { flex-direction: column; align-items: stretch; padding: 14px; }
            .card-header-right { justify-content: flex-start; }
            .card-header-right .chevron { margin-left: auto; }
            .section-block, .ripper-block, .view-survey-bar { padding-left: 14px; padding-right: 14px; }
            .fields-grid { grid-template-columns: 1fr 1fr; gap: 12px 14px; }
            .ripper-imgs-row { grid-template-columns: 1fr; }
            .view-survey-link { width: 100%; height: 40px; }
            .fwd-input { font-size: 16px; }
        }
    </style>
</head>
<body>
<header class="appbar">

<div class="container">

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getFirestore, collection, getDocs, query, where, orderBy, limit }
    from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const app = initializeApp({
    apiKey:            'AIzaSyAc_yJQ_rkzuOBh-Yxg0Q4eooXtB-tQjm0',
    authDomain:        'pingu-solar.firebaseapp.com',
    projectId:         'pingu-solar',
    storageBucket:     'pingu-solar.firebasestorage.app',
    messagingSenderId: '232764952866',
    appId:             '1:232764952866:web:5923b7f419de6355d6157b'
});
const db = getFirestore(app);

const ICONS = {
    battery:'<rect x="2" y="7" width="16" height="10" rx="2"/><path d="M22 11v2M6 11v2M10 11v2"/>',
    sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/>',
    clipboard:'<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12h6M9 16h6"/>',
    calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
    send:'<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',
    link:'<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.8 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
    external:'<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
    zap:'<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',
    home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
    building:'<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M16 6h.01M12 6h.01M12 10h.01M12 14h.01M16 10h.01M16 14h.01M8 10h.01M8 14h.01"/>',
    wrench:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"/>',
    package:'<path d="m7.5 4.3 9 5.1M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/>',
    pen:'<path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>',
    file:'<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>',
    inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1z"/>',
    alert:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
    pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>',
    map:'<path d="M14.1 5.9 9.9 3.8a2 2 0 0 0-1.8 0L3.6 6A1 1 0 0 0 3 7v12.4a1 1 0 0 0 1.4.9l3.7-1.8a2 2 0 0 1 1.8 0l4.2 2.1a2 2 0 0 0 1.8 0l4.5-2.2a1 1 0 0 0 .6-.9V5.1a1 1 0 0 0-1.4-.9l-3.7 1.8a2 2 0 0 1-1.8 0z"/><path d="M15 5.8v15M9 3.2v15"/>',
    chevronDown:'<path d="m6 9 6 6 6-6"/>'
};
const ICON = name => `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;

window._db = db;
window._fbQuery    = query;
window._fbColl     = collection;
window._fbWhere    = where;
window._fbOrderBy  = orderBy;
window._fbLimit    = limit;
window._fbGetDocs  = getDocs;

function getSessionName() {
    try {
        const raw = localStorage.getItem('loggedInEngineer');
        if (raw) { const p = JSON.parse(raw); if (p && p.name) return p.name.trim(); }
    } catch {}
    return null;
}

window._allSurveys = [];
// Cache for ripper data: jobNumber → pdfRipper object or null
window._ripperCache = {};

async function init() {
    const name = getSessionName();
    if (!name) { window.location.replace('teamlogin.html'); return; }

    document.getElementById('welcome-name').textContent = `Signed in as ${name}`;
    document.getElementById('loading-state').classList.add('show');

    try {
        const snap = await getDocs(
            query(collection(db, 'site-surveys'), orderBy('submittedAt', 'desc'))
        );
        const nameLower = name.toLowerCase();
        window._allSurveys = snap.docs
            .map(d => ({ _id: d.id, ...d.data() }))
            .filter(s => {
                const sv = (
                    s.surveyor ||
                    s.sections?.surveyDetails?.surveyor ||
                    s.sections?.surveyDetails?.conductedBy ||
                    ''
                ).trim().toLowerCase();
                return sv === nameLower;
            });

        updateStats();
        renderSurveys();
    } catch(e) {
        document.getElementById('survey-list').innerHTML =
            `<div class="state-msg show"><div class="icon" style="color:var(--error)">${ICON('alert')}</div>Error loading surveys: ${esc(e.message)}</div>`;
    } finally {
        document.getElementById('loading-state').classList.remove('show');
    }
}

function updateStats() {
    const s = window._allSurveys;
    const now = new Date();
    const curMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
    document.getElementById('stat-total').textContent  = s.length;
    document.getElementById('stat-bo').textContent     = s.filter(x=>x.surveyType==='battery-only').length;
    document.getElementById('stat-bas').textContent    = s.filter(x=>x.surveyType==='battery-and-solar').length;
    document.getElementById('stat-month').textContent  = s.filter(x=>(x.submittedAt||'').startsWith(curMonth)).length;
}

window.renderSurveys = function() {
    const typeFilter = document.getElementById('type-filter').value;
    const jobFilter  = document.getElementById('job-filter').value.trim().toLowerCase();
    const filtered   = window._allSurveys.filter(s => {
        if (typeFilter && s.surveyType !== typeFilter) return false;
        if (jobFilter && !(s.jobNumber||'').toLowerCase().includes(jobFilter)) return false;
        return true;
    });
    const listEl  = document.getElementById('survey-list');
    const emptyEl = document.getElementById('empty-state');
    if (!filtered.length) { emptyEl.classList.add('show'); listEl.innerHTML = ''; return; }
    emptyEl.classList.remove('show');
    listEl.innerHTML = filtered.map((s, i) => buildCard(s, i)).join('');
};

// ── Fetch ripper data for a job (with caching) ─────────────────────────────
async function fetchRipperData(jobNumber) {
    if (!jobNumber) return null;
    if (jobNumber in window._ripperCache) return window._ripperCache[jobNumber];

    try {
        const snap = await getDocs(
            query(collection(db, 'Solar-jobs'), where('Job Number', '==', jobNumber))
        );
        const ripDoc = snap.docs.find(d => d.data()?.pdfRipper);
        const ripper = ripDoc ? ripDoc.data().pdfRipper : null;
        window._ripperCache[jobNumber] = ripper;
        return ripper;
    } catch(e) {
        console.warn('Ripper fetch failed:', e);
        window._ripperCache[jobNumber] = null;
        return null;
    }
}

// ── Card builder ─────────────────────────────────────────────────────────────
function buildCard(s, i) {
    const type      = s.surveyType || 'unknown';
    const typeLabel = type === 'battery-only' ? 'Battery Only' : type === 'battery-and-solar' ? 'Battery & Solar' : 'Unknown';
    const typeIcon  = type === 'battery-only' ? ICON('battery') : type === 'battery-and-solar' ? ICON('sun') : ICON('clipboard');
    const badgeCls  = type === 'battery-only' ? 'badge-battery-only' : type === 'battery-and-solar' ? 'badge-battery-and-solar' : '';
    const submitted = s.submittedAt ? fmtDatetime(s.submittedAt) : '—';
    const sec       = s.sections || {};
    const id        = `card-${i}`;
    const surveyLink = `surveyview.html?id=${encodeURIComponent(s._id)}`;

    return `
    <div class="survey-card" id="${id}">
        <div class="card-header" onclick="toggleCard('${id}')">
            <div class="card-header-left">
                <div class="type-icon ${type}">${typeIcon}</div>
                <div class="card-meta">
                    <div class="card-job">Job #${esc(s.jobNumber || '—')}</div>
                    <div class="card-date">${ICON('calendar')}${submitted}</div>
                </div>
            </div>
            <div class="card-header-right">
                <span class="type-badge ${badgeCls}">${typeLabel}</span>
                <button class="forward-btn btn btn-secondary btn-sm" onclick="openFwdModal(${i}, event)" title="Forward this survey by email">${ICON('send')}Forward</button>
                <span class="chevron">${ICON('chevronDown')}</span>
            </div>
        </div>
        <div class="card-body">
            <!-- View Survey bar -->
            <div class="view-survey-bar">
                <span class="view-survey-label">${ICON('link')}Shared survey report</span>
                <a class="view-survey-link btn btn-primary" href="${surveyLink}" target="_blank">
                    ${ICON('external')}View full survey report
                </a>
            </div>
            ${buildCardBody(s, sec, type, i)}
        </div>
    </div>`;
}

function buildCardBody(s, sec, type, cardIdx) {
    const sd = sec.surveyDetails || {};
    const el = sec.electricalSystem || {};
    const am = sec.additionalMaterials || [];
    let html = '';

    html += `<div class="section-block">
        <div class="section-title">${ICON('calendar')}Survey details</div>
        <div class="fields-grid">
            ${field('Conducted On', fmtDatetime(sd.conductedOn || sd.conducted_on || ''))}
            ${field('Customer Present', radioVal(sd.customerPresent))}
            ${field('Risk Assessment', radioVal(sec.riskAssessment?.riskAssessmentDone))}
        </div>
    </div>`;

    html += `<div class="section-block">
        <div class="section-title">${ICON('zap')}Electrical system</div>
        <div class="fields-grid">
            ${field('Meter Position',    el.meterPosition)}
            ${field('Meter Work Needed', el.meterWorkNeeded)}
            ${el.meterWorkDetails ? field('Meter Work Details', el.meterWorkDetails) : ''}
            ${field('Fuse Rating',       el.fuseRating)}
            ${field('Earthing System',   el.earthingSystem)}
            ${field('Gas Bonded',        radioVal(el.gasBonded))}
            ${el.gasBondingEquipment ? field('Gas Bonding Equip.', el.gasBondingEquipment) : ''}
            ${field('Water Bonded',      radioVal(el.waterBonded))}
            ${el.waterBondingEquipment ? field('Water Bonding Equip.', el.waterBondingEquipment) : ''}
            ${field('Cable Run',         el.cableRun)}
            ${field('Cable Run Length',  el.cableRunLength != null ? el.cableRunLength + ' m' : null)}
            ${field('Battery Location',  el.batteryLocation)}
            ${field('Surface Type',      el.surfaceType)}
            ${(el.batteryWidth || el.batteryDepth || el.batteryLength)
                ? field('Dimensions (W/D/L)', `${el.batteryWidth||0} / ${el.batteryDepth||0} / ${el.batteryLength||0} mm`)
                : ''}
            ${field('Render / Cladding', el.renderCladding)}
            ${field('WiFi Signal',       el.wifiSignal)}
        </div>
        ${photoRow('Meter Position Photos',   el.meterPositionPhotos)}
        ${photoRow('Earthing System Photos',  el.earthingSystemPhotos)}
        ${photoRow('Cable Run Photos',        el.cableRunPhotos)}
        ${photoRow('Battery Location Photos', el.batteryLocationPhotos)}
        ${photoRow('Surface Photos',          el.surfacePhotos)}
    </div>`;

    if (type === 'battery-and-solar') {
        const pi = sec.propertyInternal || {};
        const pe = sec.propertyExternal || {};
        const sc = sec.scaffolding || {};

        html += `<div class="section-block">
            <div class="section-title">${ICON('home')}Property (internal)</div>
            <div class="fields-grid">
                ${field('Loft Accessible', radioVal(pi.loftAccessible))}
                ${field('Loft Ladder',     radioVal(pi.loftLadder))}
                ${field('Loft Boarded',    radioVal(pi.loftBoarded))}
                ${field('Asbestos',        radioVal(pi.asbestos))}
                ${field('Rafter W/D',      pi.rafterWidth!=null ? `${pi.rafterWidth} / ${pi.rafterDepth} mm` : null)}
                ${field('Web W/D/L',       pi.webWidth!=null ? `${pi.webWidth} / ${pi.webDepth} / ${pi.webLength} mm` : null)}
                ${field('Truss Spacing',   pi.trussSpacing!=null ? pi.trussSpacing+' mm' : null)}
                ${field('Deflection',      radioVal(pi.deflection))}
                ${field('Rot / Damage',    radioVal(pi.rotDamage))}
                ${field('Roof Concern',    radioVal(pi.roofConcern))}
                ${field('Dwarf Walls',     radioVal(pi.dwarfWalls))}
                ${field('Structural Work', radioVal(pi.structuralWork))}
            </div>
            ${photoRow('Loft Space Photos', pi.loftSpacePhotos)}
        </div>`;

        html += `<div class="section-block">
            <div class="section-title">${ICON('building')}Property (external)</div>
            <div class="fields-grid">
                ${field('Proposed Design Fits', radioVal(pe.proposedDesignFit))}
                ${pe.proposedDesignReasonWhyNot ? field('Design Reason', pe.proposedDesignReasonWhyNot) : ''}
                ${field('Roof Covering',   pe.roofCovering)}
                ${field('No. of Stories',  pe.numberStories)}
                ${field('Roof Condition',  pe.roofCondition)}
                ${field('Roof Work Age',   pe.roofWorkAge != null ? pe.roofWorkAge+' yrs ago' : null)}
                ${field('Roof Obstructions', radioVal(pe.roofObstructions))}
                ${pe.obstructionsDescription ? field('Obstruction Detail', pe.obstructionsDescription) : ''}
                ${field('Shading',         radioVal(pe.roofShading))}
            </div>
            ${photoRow('Property Photos',       pe.propertyPhotos)}
            ${photoRow('Roof Covering Photos',  pe.roofCoveringPhotos)}
            ${photoRow('Roof Condition Photos', pe.roofConditionPhotos)}
        </div>`;

        html += `<div class="section-block">
            <div class="section-title">${ICON('wrench')}Scaffolding</div>
            <div class="fields-grid">
                ${field('Access Type',         sc.accessType)}
                ${field('Parking Available',   radioVal(sc.parkingAvailable))}
                ${field('Overhead Powerlines', radioVal(sc.overheadPowerlines))}
                ${field('On Pavement/Highway', radioVal(sc.propertyOnPavement))}
                ${field('Ground Type',         sc.groundType)}
                ${field('Access Issues',       sc.accessIssues)}
                ${field('Gutter Obstacles',    radioVal(sc.gutterObstacles))}
                ${sc.gutterObstaclesDescription ? field('Obstacle Detail', sc.gutterObstaclesDescription) : ''}
                ${sc.lowerRoofs ? field('Lower Roofs', sc.lowerRoofs) : ''}
            </div>
            ${photoRow('Ground Type Photos', sc.groundTypePhotos)}
        </div>`;
    }

    html += `<div class="section-block">
        <div class="section-title">${ICON('package')}Additional materials requested</div>
        ${am.length
            ? `<div class="materials-list">${am.map(m => `<div class="material-item">${esc(m)}</div>`).join('')}</div>`
            : `<div class="no-materials">None requested</div>`}
    </div>`;

    const signoff = sec.customerSignOff || {};
    if (signoff.name || signoff.date) {
        html += `<div class="section-block">
            <div class="section-title">${ICON('pen')}Customer sign-off</div>
            <div class="fields-grid">
                ${field('Customer Name', signoff.name)}
                ${field('Sign-off Date', fmtDate(signoff.date))}
            </div>
        </div>`;
    }

    // PDF Ripper block — lazy loaded when card opens
    html += `<div class="ripper-block" id="ripper-block-${cardIdx}">
        <div class="ripper-title">
            <span>${ICON('file')}PDF Ripper data</span>
            <span class="ripper-saved-chip" id="ripper-chip-${cardIdx}"></span>
        </div>
        <div id="ripper-content-${cardIdx}">
            <div class="ripper-loading">
                <div class="ripper-spinner"></div> Loading…
            </div>
        </div>
    </div>`;

    // Trigger ripper load when card is toggled (set via JS after render)
    setTimeout(() => {
        const survey = window._allSurveys[cardIdx];
        if (survey?.jobNumber) {
            fetchRipperData(survey.jobNumber).then(ripper => {
                renderRipperBlock(cardIdx, ripper);
            });
        } else {
            renderRipperBlock(cardIdx, null);
        }
    }, 0);

    return html;
}

function renderRipperBlock(cardIdx, d) {
    const contentEl = document.getElementById(`ripper-content-${cardIdx}`);
    const chipEl    = document.getElementById(`ripper-chip-${cardIdx}`);
    if (!contentEl) return;

    if (!d) {
        contentEl.innerHTML = `<div class="ripper-no-data">${ICON('inbox')}No PDF Ripper data saved for this job.</div>`;
        return;
    }

    if (d.savedAt) {
        chipEl.textContent = `Saved ${new Date(d.savedAt).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}`;
    }

    let html = '';

    if (d.address) {
        html += `<div style="margin-bottom:4px">
            <div class="field-lbl" style="margin-bottom:2px">Address</div>
            <div class="ripper-address-val">${esc(d.address).replace(/\n/g,'<br>')}</div>
        </div>`;
    }

    const hasLayout     = !!d.proposedLayoutUrl;
    const hasAssessment = !!d.siteAssessmentUrl;

    if (hasLayout || hasAssessment) {
        html += `<div class="ripper-imgs-row">`;
        if (hasLayout) {
            html += `<div class="ripper-img-card">
                <div class="ripper-img-label">${ICON('map')}Proposed layout (p.3)</div>
                <img src="${esc(d.proposedLayoutUrl)}" alt="Proposed Layout"
                     onclick="openLightbox('${esc(d.proposedLayoutUrl)}','Proposed Layout')"
                     loading="lazy">
            </div>`;
        }
        if (hasAssessment) {
            html += `<div class="ripper-img-card">
                <div class="ripper-img-label">${ICON('clipboard')}Site assessment (p.4)</div>
                <img src="${esc(d.siteAssessmentUrl)}" alt="Site Assessment"
                     onclick="openLightbox('${esc(d.siteAssessmentUrl)}','Site Assessment')"
                     loading="lazy">
            </div>`;
        }
        html += `</div>`;
    }

    if (!d.address && !hasLayout && !hasAssessment) {
        html = `<div class="ripper-no-data">Record found but no displayable data.</div>`;
    }

    contentEl.innerHTML = html;
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function radioVal(v) {
    if (!v) return null;
    const map = { Yes:'<span class="val-yes">Yes</span>', No:'<span class="val-no">No</span>', 'N/A':'<span class="val-na">N/A</span>' };
    return map[v] || v;
}

function field(label, value) {
    const hasVal = value !== null && value !== undefined && value !== '';
    const display = hasVal
        ? (typeof value === 'string' && value.includes('<') ? value : esc(String(value)))
        : 'Not recorded';
    return `<div class="field-item">
        <div class="field-lbl">${label}</div>
        <div class="field-val${hasVal?'':' missing'}">${display}</div>
    </div>`;
}

function photoRow(label, urls) {
    if (!Array.isArray(urls) || !urls.length) return '';
    const thumbs = urls.map(u =>
        `<img class="photo-thumb" src="${esc(u)}" alt="Photo" onclick="openLightbox('${esc(u)}','${esc(label)}')" loading="lazy">`
    ).join('');
    return `<div style="margin-top:14px">
        <div class="field-lbl" style="margin-bottom:6px">${label}</div>
        <div class="photos-grid">${thumbs}</div>
        <div class="photo-count">${urls.length} photo${urls.length!==1?'s':''}</div>
    </div>`;
}

function esc(t) {
    const d = document.createElement('div');
    d.textContent = String(t ?? '');
    return d.innerHTML;
}

function fmtDatetime(str) {
    if (!str) return '—';
    const d = new Date(str);
    return isNaN(d) ? str : d.toLocaleString('en-GB', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function fmtDate(str) {
    if (!str) return '—';
    const d = new Date(str + (str.length===10?'T00:00:00':''));
    return isNaN(d) ? str : d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}

// ── Interactions ──────────────────────────────────────────────────────────────
window.toggleCard = function(id) {
    document.getElementById(id).classList.toggle('open');
};

window.openLightbox = function(url, label) {
    document.getElementById('lightbox-img').src    = url;
    document.getElementById('lightbox-label').textContent = label || '';
    document.getElementById('lightbox').classList.add('show');
};
window.closeLightbox = function(e) {
    if (e && e.target !== document.getElementById('lightbox') && e.target !== document.querySelector('.lightbox-close')) return;
    document.getElementById('lightbox').classList.remove('show');
    document.getElementById('lightbox-img').src = '';
};

// ── Boot ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', init);
</script>

<!-- Forward Survey Modal -->
<div class="fwd-modal" id="fwd-modal">
    <div class="fwd-modal-box">
        <div class="fwd-title"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>Forward survey</div>
        <div class="fwd-sub" id="fwd-sub">Job #<span id="fwd-job-ref">—</span></div>
        <div class="fwd-picklist-status" id="fwd-picklist-status">Loading picklist data…</div>
        <input type="email" class="fwd-input control-input" id="fwd-email" placeholder="Enter recipient email address…">
        <div class="fwd-actions">
            <button class="fwd-cancel btn btn-ghost" onclick="closeFwdModal()">Cancel</button>
            <button class="fwd-send btn btn-primary" id="fwd-send-btn" onclick="sendForward()">Send</button>
        </div>
    </div>
</div>

<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script type="text/javascript">
(function(){ emailjs.init('ziLnha91scpGjFABh'); })();

let _fwdSurvey   = null;
let _fwdPicklist = null;

function openFwdModal(idx, event) {
    event.stopPropagation();
    _fwdSurvey   = window._allSurveys[idx];
    _fwdPicklist = null;

    document.getElementById('fwd-job-ref').textContent    = _fwdSurvey.jobNumber || '—';
    document.getElementById('fwd-email').value            = '';
    document.getElementById('fwd-send-btn').disabled      = false;
    document.getElementById('fwd-send-btn').textContent   = 'Send';
    document.getElementById('fwd-modal').classList.add('show');
    setTimeout(() => document.getElementById('fwd-email').focus(), 120);

    if (_fwdSurvey.jobNumber) {
        const statusEl = document.getElementById('fwd-picklist-status');
        statusEl.textContent = 'Loading picklist data…';
        statusEl.classList.add('show');

        fetchPicklistForJob(_fwdSurvey.jobNumber)
            .then(pl => {
                _fwdPicklist = pl;
                statusEl.textContent = pl
                    ? 'Picklist data loaded — will be included in email'
                    : 'No picklist found for this job';
            })
            .catch(() => {
                _fwdPicklist = null;
                statusEl.textContent = 'Could not load picklist';
            });
    }
}

async function fetchPicklistForJob(jobNumber) {
    try {
        const q = window._fbQuery(
            window._fbColl(window._db, 'picklists'),
            window._fbWhere('jobNumber', '==', jobNumber),
            window._fbOrderBy('savedAt', 'desc'),
            window._fbLimit(1)
        );
        const snap = await window._fbGetDocs(q);
        if (snap.empty) return null;
        return snap.docs[0].data();
    } catch (e) {
        console.warn('Picklist fetch error:', e);
        return null;
    }
}

function buildPicklistSummary(pl) {
    if (!pl) return null;
    const lines = ['', '════════════════════════════════', 'PICKLIST DATA', '════════════════════════════════'];

    const savedDate = pl.savedAt
        ? new Date(pl.savedAt).toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'})
        : '—';
    lines.push(`Picklist saved: ${savedDate}`);

    if (pl.specs && Object.keys(pl.specs).length) {
        lines.push('', '--- System Configuration ---');
        ['Type of System','Inverter Size','No. of Batteries','Battery','Retrofit','Enphase Pedestal','Enphase Branches','DC Expansion']
            .forEach(k => { if (pl.specs[k]) lines.push(`${k}: ${pl.specs[k]}`); });

        lines.push('', '--- Mounting & Hardware ---');
        ['Mounting System','Hook Type','Ave Hook Spacing','Hook Spacing','Min. Roof Anchors','Bird Mesh','Roof Type','Rafter Spacing']
            .forEach(k => { if (pl.specs[k]) lines.push(`${k}: ${pl.specs[k]}`); });

        lines.push('', '--- Electrical & Supply ---');
        ['Supply Cables','Submain Location','Trenching']
            .forEach(k => { if (pl.specs[k]) lines.push(`${k}: ${pl.specs[k]}`); });
    }

    if (pl.mountCheck && Object.keys(pl.mountCheck).length) {
        lines.push('', '--- Mount System Sense Check ---');
        ['# Portrait Panels','# Landscape Panels','Total Panels','Total Perimeter','End Clamps','Mid Clamps','Rail Length','# Roof Anchors','New Picklist Cost Saving']
            .forEach(k => { if (pl.mountCheck[k]) lines.push(`${k}: ${pl.mountCheck[k]}`); });
    }

    const flatArr = pl.panelFlat || (pl.panelGrid ? pl.panelGrid.flat() : null);
    if (flatArr) {
        const portrait  = flatArr.filter(v => v === 'P').length;
        const landscape = flatArr.filter(v => v === 'L').length;
        if (portrait || landscape) {
            lines.push('', '--- Roof Panel Layout ---');
            lines.push(`Portrait panels:  ${portrait}`);
            lines.push(`Landscape panels: ${landscape}`);
            lines.push(`Total panels:     ${portrait + landscape}`);
        }
    }

    if (Array.isArray(pl.kfPicklist) && pl.kfPicklist.length) {
        lines.push('', '--- KF Picklist Items ---');
        let totalQty = 0;
        pl.kfPicklist.forEach((it, i) => {
            const qty = parseFloat(it.qty);
            if (!isNaN(qty)) totalQty += qty;
            lines.push(`  ${i + 1}. ${it.partCode || '—'}  ×  ${it.qty || '—'}`);
        });
        lines.push(`  Total qty: ${totalQty}`);
    }

    return lines.join('\n');
}

function closeFwdModal() {
    document.getElementById('fwd-modal').classList.remove('show');
    document.getElementById('fwd-picklist-status').classList.remove('show');
    _fwdSurvey   = null;
    _fwdPicklist = null;
}

document.getElementById('fwd-modal').addEventListener('click', function(e) {
    if (e.target === this) closeFwdModal();
});

document.getElementById('fwd-email').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') sendForward();
});

function buildSurveySummary(s) {
    const sec  = s.sections || {};
    const sd   = sec.surveyDetails || {};
    const el   = sec.electricalSystem || {};
    const am   = sec.additionalMaterials || [];
    const type = s.surveyType === 'battery-only' ? 'Battery Only'
               : s.surveyType === 'battery-and-solar' ? 'Battery & Solar'
               : s.surveyType || 'Unknown';

    const lines = [
        '=== SURVEY SUMMARY ===',
        `Survey Type: ${type}`,
        `Job Number: ${s.jobNumber || '—'}`,
        `Submitted: ${s.submittedAt ? new Date(s.submittedAt).toLocaleString('en-GB') : '—'}`,
        `Survey Report: https://pingu-blue.vercel.app/surveyview.html?id=${encodeURIComponent(s._id)}`,
        '',
        '--- Survey Details ---',
        `Conducted On: ${sd.conductedOn || '—'}`,
        `Surveyor: ${sd.surveyor || '—'}`,
        `Customer Present: ${sd.customerPresent || '—'}`,
        '',
        '--- Electrical System ---',
        `Meter Position: ${el.meterPosition || '—'}`,
        `Meter Work Needed: ${el.meterWorkNeeded || '—'}`,
        el.meterWorkDetails ? `Meter Work Details: ${el.meterWorkDetails}` : '',
        `Fuse Rating: ${el.fuseRating || '—'}`,
        `Earthing System: ${el.earthingSystem || '—'}`,
        `Gas Bonded: ${el.gasBonded || '—'}`,
        el.gasBondingEquipment ? `Gas Bonding Equipment: ${el.gasBondingEquipment}` : '',
        `Water Bonded: ${el.waterBonded || '—'}`,
        el.waterBondingEquipment ? `Water Bonding Equipment: ${el.waterBondingEquipment}` : '',
        `Cable Run: ${el.cableRun || '—'}`,
        `Cable Run Length: ${el.cableRunLength != null ? el.cableRunLength + ' m' : '—'}`,
        `Battery Location: ${el.batteryLocation || '—'}`,
        `Surface Type: ${el.surfaceType || '—'}`,
        `Dimensions (W/D/L mm): ${el.batteryWidth||0} / ${el.batteryDepth||0} / ${el.batteryLength||0}`,
        `Render / Cladding: ${el.renderCladding || '—'}`,
        `WiFi Signal: ${el.wifiSignal || '—'}`,
    ];

    if (s.surveyType === 'battery-and-solar') {
        const pi = sec.propertyInternal || {};
        const pe = sec.propertyExternal || {};
        const sc = sec.scaffolding || {};
        lines.push(
            '', '--- Property (Internal) ---',
            `Loft Accessible: ${pi.loftAccessible || '—'}`,
            `Loft Ladder: ${pi.loftLadder || '—'}`,
            `Loft Boarded: ${pi.loftBoarded || '—'}`,
            `Asbestos: ${pi.asbestos || '—'}`,
            `Rafter W/D mm: ${pi.rafterWidth||0} / ${pi.rafterDepth||0}`,
            `Truss Spacing mm: ${pi.trussSpacing||0}`,
            `Deflection: ${pi.deflection || '—'}`,
            `Rot/Damage: ${pi.rotDamage || '—'}`,
            `Roof Concern: ${pi.roofConcern || '—'}`,
            '', '--- Property (External) ---',
            `Proposed Design Fits: ${pe.proposedDesignFit || '—'}`,
            pe.proposedDesignReasonWhyNot ? `Design Reason: ${pe.proposedDesignReasonWhyNot}` : '',
            `Roof Covering: ${pe.roofCovering || '—'}`,
            `No. of Stories: ${pe.numberStories || '—'}`,
            `Roof Condition: ${pe.roofCondition || '—'}`,
            `Roof Obstructions: ${pe.roofObstructions || '—'}`,
            pe.obstructionsDescription ? `Obstruction Detail: ${pe.obstructionsDescription}` : '',
            `Shading: ${pe.roofShading || '—'}`,
            '', '--- Scaffolding ---',
            `Access Type: ${sc.accessType || '—'}`,
            `Parking Available: ${sc.parkingAvailable || '—'}`,
            `Ground Type: ${sc.groundType || '—'}`,
            `Access Issues: ${sc.accessIssues || '—'}`,
            `Gutter Obstacles: ${sc.gutterObstacles || '—'}`,
            sc.gutterObstaclesDescription ? `Obstacle Detail: ${sc.gutterObstaclesDescription}` : '',
        );
    }

    if (am.length) {
        lines.push('', '--- Additional Materials ---');
        am.forEach(m => lines.push(m));
    }

    const signoff = sec.customerSignOff || {};
    if (signoff.name || signoff.date) {
        lines.push(
            '', '--- Customer Sign-off ---',
            `Name: ${signoff.name || '—'}`,
            `Date: ${signoff.date || '—'}`
        );
    }

    const picklistBlock = buildPicklistSummary(_fwdPicklist);
    if (picklistBlock) lines.push(picklistBlock);

    return lines.filter(l => l !== undefined && l !== '').join('\n');
}

async function sendForward() {
    const email = document.getElementById('fwd-email').value.trim();
    if (!email || !email.includes('@')) {
        document.getElementById('fwd-email').focus();
        document.getElementById('fwd-email').style.borderColor = 'var(--error)';
        setTimeout(() => document.getElementById('fwd-email').style.borderColor = '', 1200);
        return;
    }
    const btn = document.getElementById('fwd-send-btn');
    btn.disabled = true;
    btn.textContent = 'Sending…';

    try {
        const surveyLink = 'https://pingu-blue.vercel.app/surveyview.html?id=' + encodeURIComponent(_fwdSurvey._id);
        await emailjs.send('service_jovorbh', 'template_jvydnxi', {
            to_email:       email,
            job_number:     _fwdSurvey.jobNumber || '—',
            survey_type:    _fwdSurvey.surveyType === 'battery-only' ? 'Battery Only' : 'Battery & Solar',
            submitted_at:   _fwdSurvey.submittedAt ? new Date(_fwdSurvey.submittedAt).toLocaleString('en-GB') : '—',
            surveyor:       (_fwdSurvey.sections?.surveyDetails?.surveyor || '—'),
            survey_summary: buildSurveySummary(_fwdSurvey),
            survey_link:    surveyLink,
        });

        btn.textContent = 'Sent';
        showToast('Survey forwarded to ' + email);
        setTimeout(closeFwdModal, 1200);
    } catch(err) {
        console.error('EmailJS error:', err);
        btn.disabled = false;
        btn.textContent = 'Send';
        showToast('Failed to send — check email address', true);
    }
}

function showToast(msg, isError) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.borderColor = isError ? 'var(--error)' : 'var(--success)';
    t.style.color       = isError ? 'var(--error)' : 'var(--success)';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3200);
}
</script>
