<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Export Data | Pingu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* ═══ Pingu design system — base (copy verbatim into each page's <style>) ═══ */
        :root {
            /* Brand + status palette */
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --secondary: #FFC857;
            --accent: #00D9FF;
            --dark: #1A1A2E;
            --dark-light: #252541;
            --dark-lighter: #2F2F4A;
            --text: #EAEAEA;
            --text-dim: #9A9AB0;
            --success: #4ECCA3;
            --error: #FF6B6B;
            --warning: #FFC857;
            --in-progress: #00D9FF;
            --complete: #4ECCA3;
            --aborted: #FF6B6B;
            --cancelled: #9A9AB0;
            --short-notice: #90ee90;
            --on-hold: #FFDE00;
            --scheduled: #FF6B35;
            /* Surfaces & type */
            --bg: #161628;
            --surface: #1F1F35;
            --surface-2: #252541;
            --line: rgba(255,255,255,0.07);
            --line-2: rgba(255,255,255,0.12);
            --text-strong: #F4F4F8;
            --text-soft: #C8C8D6;
            --radius: 10px;
            --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: var(--font); font-size: 14px; line-height: 1.5;
            background: var(--bg); color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        button, input, select, textarea { font-family: inherit; }
        a { color: var(--accent); }
        .ico { width: 16px; height: 16px; flex: 0 0 auto; vertical-align: -3px; }
        .ico-lg { width: 20px; height: 20px; flex: 0 0 auto; }

        /* ── App bar + Pingu wordmark ── */
        .appbar {
            position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            height: 64px; padding: 0 28px;
            background: rgba(22, 22, 40, 0.92);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line);
        }
        .appbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .logo { display: inline-flex; align-items: center; text-decoration: none; }
        .wordmark {
            font-family: 'Inter', var(--font); font-weight: 800; font-size: 28px;
            letter-spacing: -0.045em; line-height: 1; color: var(--text-strong); padding-top: 6px;
        }
        .i-stem { position: relative; display: inline-block; }
        .i-paw {
            position: absolute; left: 50%; top: -0.17em; transform: translateX(-50%) rotate(-10deg);
            width: 0.5em; height: 0.5em; fill: var(--primary);
            filter: drop-shadow(0 1px 4px rgba(255,107,53,0.35));
            transition: transform .2s ease;
        }
        .logo:hover .i-paw { transform: translateX(-50%) rotate(4deg) scale(1.08); }
        .logo:hover .wordmark { color: #fff; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-soft); text-decoration: none; font-size: 13px; font-weight: 500;
            padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; cursor: pointer;
            transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .back-btn:hover { background: var(--surface-2); color: var(--text-strong); border-color: rgba(255,255,255,0.2); }

        /* ── Page layout ── */
        .container { padding: 24px 28px 40px; }
        .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
        h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-strong); line-height: 1.2; }
        h2 { font-size: 16px; font-weight: 600; color: var(--text-strong); letter-spacing: -0.01em; }
        h3 { font-size: 14px; font-weight: 600; color: var(--text-strong); }
        .muted { color: var(--text-dim); }
        .toolbar { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }

        /* ── Panels / cards ── */
        .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
        .panel + .panel { margin-top: 16px; }
        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -2px 0 14px; }
        .panel-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--text-strong); }
        .panel-title .ico { color: var(--primary); }

        /* ── Form controls ── */
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-label { color: var(--text-dim); font-size: 11.5px; font-weight: 500; }
        .control-input {
            height: 38px; background: var(--surface); border: 1px solid var(--line-2);
            color: var(--text-strong); padding: 0 12px; border-radius: 8px; font-size: 13.5px; width: 100%;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        textarea.control-input { height: auto; min-height: 84px; padding: 9px 11px; resize: vertical; }
        .control-input:hover { border-color: rgba(255,255,255,0.2); }
        .control-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.22); }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); cursor: pointer; }
        input[type="checkbox"], input[type="radio"] { accent-color: var(--primary); }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 7px;
            height: 38px; padding: 0 16px; border-radius: 8px; cursor: pointer;
            font-size: 13.5px; font-weight: 600; text-decoration: none; white-space: nowrap;
            border: 1px solid transparent; transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--surface-2); color: var(--text-strong); border-color: var(--line-2); }
        .btn-secondary:hover { background: var(--dark-lighter); border-color: rgba(255,255,255,0.25); }
        .btn-ghost { background: transparent; color: var(--text-soft); border-color: var(--line-2); }
        .btn-ghost:hover { background: var(--surface-2); color: var(--text-strong); }
        .btn-danger { background: rgba(255,107,107,0.12); color: #FF8A8A; border-color: rgba(255,107,107,0.4); }
        .btn-danger:hover { background: rgba(255,107,107,0.22); }
        .btn-success { background: rgba(78,204,163,0.14); color: var(--success); border-color: rgba(78,204,163,0.45); }
        .btn-success:hover { background: rgba(78,204,163,0.24); }
        .btn-sm { height: 32px; padding: 0 12px; font-size: 12.5px; }
        .btn:disabled, button:disabled { opacity: .45; cursor: not-allowed; }
        .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; height: 38px; }
        .seg button { background: var(--surface); color: var(--text-soft); border: 0; padding: 0 12px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .seg button + button { border-left: 1px solid var(--line-2); }
        .seg button:hover, .seg button.active { background: var(--surface-2); color: var(--text-strong); }

        /* ── KPI tiles ── */
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
        .stat-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; }
        .stat-label { display: flex; align-items: center; gap: 7px; color: var(--text-dim); font-size: 12px; font-weight: 500; white-space: nowrap; }
        .stat-label .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
        .stat-value { font-size: 22px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.02em; line-height: 1.25; margin-top: 2px; font-variant-numeric: tabular-nums; }

        /* ── Tables ── */
        .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
        thead th {
            position: sticky; top: 0; z-index: 2; background: var(--surface);
            text-align: left; padding: 10px 14px; font-size: 11.5px; font-weight: 600; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--line-2); white-space: nowrap;
        }
        tbody td { padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--text-soft); vertical-align: middle; }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover td { background: rgba(255,255,255,0.025); }
        td.strong, .cell-strong { color: var(--text-strong); font-weight: 600; }
        .mono { font-family: var(--mono); font-size: 12.5px; }

        /* ── Badges / status pills ── */
        .badge {
            --c: var(--text-dim);
            display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
            padding: 2px 9px; border-radius: 999px; color: var(--text-strong);
            background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
        }
        .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
        .badge.plain::before { display: none; }
        .tag { font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 4px; background: rgba(255,255,255,0.1); color: var(--text-soft); letter-spacing: .03em; }

        /* ── Notices ── */
        .notice { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 13px;
                  background: rgba(255,255,255,0.03); border: 1px solid var(--line-2); color: var(--text-soft); }
        .notice .ico { margin-top: 1px; }
        .notice.info    { border-color: rgba(0,217,255,0.35);  background: rgba(0,217,255,0.06); }
        .notice.success { border-color: rgba(78,204,163,0.4);  background: rgba(78,204,163,0.07); color: var(--success); }
        .notice.warning { border-color: rgba(255,200,87,0.4);  background: rgba(255,200,87,0.07); color: var(--warning); }
        .notice.error   { border-color: rgba(255,107,107,0.45); background: rgba(255,107,107,0.08); color: #FF8A8A; }

        /* ── Modals ── */
        .modal { display: none; position: fixed; inset: 0; background: rgba(10,10,22,0.72); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
        .modal.show, .modal.active, .modal.open { display: flex; }
        .modal-content { background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; width: 100%; max-width: 680px; max-height: 88vh; overflow-y: auto; box-shadow: 0 30px 80px -20px rgba(0,0,0,0.75); }
        .modal-header { position: sticky; top: 0; z-index: 2; background: var(--surface); display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
        .modal-title { font-size: 17px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.01em; }
        .modal-body { padding: 18px 20px 22px; }
        .close-btn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; border-radius: 8px; color: var(--text-dim); cursor: pointer; font-size: 20px; line-height: 1; }
        .close-btn:hover { background: var(--surface-2); color: var(--text-strong); }

        /* ── Feedback ── */
        .toast { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: none; max-width: 420px; padding: 12px 16px 12px 14px; border-radius: 10px;
                 background: #26263F; color: var(--text-strong); font-size: 13.5px; border: 1px solid var(--line-2); border-left: 3px solid var(--success);
                 box-shadow: 0 16px 40px -12px rgba(0,0,0,0.7); }
        .toast.show { display: block; }
        .toast.error { border-left-color: var(--error); }
        .empty-state, .loading { text-align: center; padding: 56px 16px; color: var(--text-dim); }
        .empty-state h3 { color: var(--text-strong); font-size: 16px; margin-bottom: 4px; }
        .empty-state .ico-lg { width: 32px; height: 32px; color: var(--text-dim); margin-bottom: 10px; }
        .spinner { width: 22px; height: 22px; border: 2px solid var(--line-2); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        *::-webkit-scrollbar { width: 10px; height: 10px; }
        *::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
        *::-webkit-scrollbar-track { background: transparent; }
        @media (max-width: 768px) {
            .appbar, .container { padding-left: 14px; padding-right: 14px; }
            .wordmark { font-size: 24px; }
        }
        /* ═══ end base ═══ */

        /* ═══ page ═══ */
        /* Dedup banner */
        .dedup-banner { display: none; padding: 10px 12px; border-radius: 8px; margin-bottom: 14px; font-size: 13px; border: 1px solid var(--line-2); }
        .dedup-banner.running { border-color: rgba(0,217,255,0.35); background: rgba(0,217,255,0.06); color: var(--accent); }
        .dedup-banner.done    { border-color: rgba(78,204,163,0.4); background: rgba(78,204,163,0.07); color: var(--success); }
        .dedup-banner.clean   { background: transparent; color: var(--text-dim); }

        .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: -2px 0 14px; flex-wrap: wrap; }
        .card-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--text-strong); }
        .card-title .ico { color: var(--primary); }

        /* Source toggle */
        .source-toggle { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
        .source-toggle-label { color: var(--text-dim); font-size: 12px; font-weight: 500; margin-right: 4px; }
        .source-chip {
            display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px;
            border-radius: 999px; cursor: pointer; border: 1px solid var(--line-2);
            font-size: 12.5px; font-weight: 500; background: var(--surface); color: var(--text-dim); user-select: none;
            transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .source-chip input[type="checkbox"] { display: none; }
        .source-chip.checked-solar-jobs { border-color: rgba(255,107,53,0.5); color: var(--text-strong); background: rgba(255,107,53,0.12); }
        .source-chip.checked-jobs       { border-color: rgba(0,217,255,0.45); color: var(--text-strong); background: rgba(0,217,255,0.1); }
        .source-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot-solar-jobs { background: var(--primary); }
        .dot-jobs       { background: var(--accent); }

        .filter-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }

        .field-selector { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 18px; background: var(--bg); }
        .field-selector-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
        .field-selector-title { font-size: 13.5px; font-weight: 600; color: var(--text-strong); }
        .field-selector-actions { display: flex; gap: 6px; }
        .field-checkboxes { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px 14px; max-height: 260px; overflow-y: auto; }
        .field-checkbox { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .field-checkbox input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; flex: 0 0 auto; }
        .field-checkbox label { cursor: pointer; color: var(--text-soft); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .action-buttons { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .po-btn-wrapper { position: relative; display: inline-block; }
        .po-btn-tooltip {
            position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
            background: #26263F; color: var(--text-soft); font-size: 12px; padding: 6px 10px; border-radius: 6px;
            border: 1px solid var(--line-2); white-space: nowrap; pointer-events: none; opacity: 0;
            transition: opacity .15s ease; z-index: 100; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.7);
        }
        .po-btn-wrapper:hover .po-btn-tooltip { opacity: 1; }
        .po-history-banner { display: none; margin-top: 14px; padding: 10px 12px; border-radius: 8px; font-size: 13px; color: var(--text-soft); border: 1px solid rgba(0,217,255,0.35); background: rgba(0,217,255,0.06); }
        .po-history-banner strong { color: var(--text-strong); font-weight: 600; }

        .stat-value.small { font-size: 16px; line-height: 1.7; }
        .stat-value.green { color: var(--success); }

        /* Preview */
        .preview-container { max-height: 620px; }
        .preview-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--text-strong); position: sticky; left: 0; }
        .preview-header + table thead th { top: 0; }
        .preview-more { text-align: center; padding: 12px; color: var(--text-dim); font-size: 12.5px; border-top: 1px solid var(--line); }
        table td { white-space: nowrap; max-width: 360px; overflow: hidden; text-overflow: ellipsis; }

        .source-badge, .status-badge {
            --c: var(--text-dim);
            display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
            padding: 2px 9px; border-radius: 999px; color: var(--text-strong);
            background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
        }
        .status-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
        .source-badge-solar-jobs { --c: var(--primary); }
        .source-badge-jobs       { --c: var(--accent); }
        .status-pending, .status-pending-review { --c: var(--scheduled); }
        .status-scheduled { --c: var(--scheduled); }
        .status-complete, .status-approved { --c: var(--complete); }
        .status-outstanding, .status-in-progress { --c: var(--in-progress); }
        .status-aborted, .status-failed { --c: var(--aborted); }
        .status-cancelled { --c: var(--cancelled); }
        .status-on-hold { --c: var(--on-hold); }

        .loading-detail { font-size: 12.5px; margin-top: 4px; opacity: .8; }

        @media (max-width: 1100px) { .filter-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (max-width: 768px) {
            .filter-grid { grid-template-columns: minmax(0, 1fr); }
            .stats-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .action-buttons { flex-direction: column; align-items: stretch; }
            .action-buttons .btn, .po-btn-wrapper, .po-btn-wrapper .btn { width: 100%; }
            .card { padding: 16px 14px; }
        }
    </style>
</head>
<body>
    <header class="appbar">
        <a href="index.html" class="logo" aria-label="Pingu home">
            <span class="wordmark">P<span class="i-stem">ı<svg class="i-paw" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="16.2" rx="5.6" ry="4.6"/><ellipse cx="4.6" cy="10.4" rx="2.2" ry="2.7" transform="rotate(-18 4.6 10.4)"/><ellipse cx="9.2" cy="5.6" rx="2.3" ry="2.9" transform="rotate(-6 9.2 5.6)"/><ellipse cx="14.8" cy="5.6" rx="2.3" ry="2.9" transform="rotate(6 14.8 5.6)"/><ellipse cx="19.4" cy="10.4" rx="2.2" ry="2.7" transform="rotate(18 19.4 10.4)"/></svg></span>ngu</span>
        </a>
        <div class="appbar-actions">
            <a href="admin.html" class="back-btn"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Back to Admin</a>
        </div>
    </header>

    <div class="container">
        <div class="page-head">
            <h1>Export data</h1>
        </div>

        <!-- Dedup status banner — shown during and after dedup -->
        <div class="dedup-banner" id="dedup-banner"></div>

        <div class="stats-row">
            <div class="stat-item">
                <div class="stat-label">Total jobs</div>
                <div class="stat-value" id="stat-total">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label"><span class="dot" style="background:var(--primary)"></span>Filtered</div>
                <div class="stat-value" id="stat-filtered">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Solar-jobs</div>
                <div class="stat-value" id="stat-solar-jobs">0</div>
            </div>
            <div class="stat-item" style="display:none">
                <div class="stat-label">jobs (upload)</div>
                <div class="stat-value" id="stat-jobs">0</div>
            </div>
            <div class="stat-item" style="display:none">
                <div class="stat-label">Dupes removed</div>
                <div class="stat-value green" id="stat-dedup">—</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Date range</div>
                <div class="stat-value small" id="stat-range">All</div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2 class="card-title"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 3H2l8 9.46V19l4 2v-8.54z"/></svg>Export filters</h2>
            </div>

            <div class="source-toggle">
                <span class="source-toggle-label">Sources</span>
                <label class="source-chip" id="chip-solar-jobs">
                    <input type="checkbox" id="src-solar-jobs" checked onchange="onSourceChange()">
                    <span class="source-dot dot-solar-jobs"></span>
                    Solar-jobs <span id="count-solar-jobs" style="opacity:0.6">(—)</span>
                </label>
                <label class="source-chip" id="chip-jobs" style="display:none">
                    <input type="checkbox" id="src-jobs" onchange="onSourceChange()">
                    <span class="source-dot dot-jobs"></span>
                    jobs (uploaddata) <span id="count-jobs" style="opacity:0.6">(—)</span>
                </label>
            </div>

            <div class="filter-grid">
                <div class="control-group filter-group">
                    <label class="control-label filter-label" for="status-filter">Status filter</label>
                    <select class="control-input filter-select" id="status-filter">
                        <option value="all">All statuses</option>
                        <option value="pending">Pending</option>
                        <option value="In-Progress">In-Progress</option>
                        <option value="complete">Complete</option>
                        <option value="outstanding">Outstanding</option>
                        <option value="Aborted">Aborted</option>
                        <option value="Cancelled">Cancelled</option>
                    </select>
                </div>
                <div class="control-group filter-group">
                    <label class="control-label filter-label" for="start-date">Start date</label>
                    <input type="date" class="control-input filter-input" id="start-date">
                </div>
                <div class="control-group filter-group">
                    <label class="control-label filter-label" for="end-date">End date</label>
                    <input type="date" class="control-input filter-input" id="end-date">
                </div>
                <div class="control-group filter-group">
                    <label class="control-label filter-label" for="date-field">Date field</label>
                    <select class="control-input filter-select" id="date-field">
                        <option value="Booked Date">Booked Date / Install Date</option>
                        <option value="Projected Completion Date">Completion Date</option>
                        <option value="uploadDate">Upload Date</option>
                    </select>
                </div>
            </div>

            <div class="field-selector">
                <div class="field-selector-head">
                    <div class="field-selector-title">Select fields to export</div>
                    <div class="field-selector-actions">
                        <button class="btn btn-ghost btn-sm preview-btn" onclick="selectAllFields()">Select all</button>
                        <button class="btn btn-ghost btn-sm preview-btn" onclick="deselectAllFields()">Deselect all</button>
                    </div>
                </div>
                <div class="field-checkboxes" id="field-checkboxes"></div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-primary" onclick="applyFilters()"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>Apply filters &amp; preview</button>
                <button class="btn btn-ghost" onclick="clearFilters()">Clear filters</button>
                <div class="po-btn-wrapper">
                    <button class="btn btn-secondary btn-new-po" id="new-po-btn" onclick="exportNewPOs()" disabled><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/></svg>New PO's only</button>
                    <div class="po-btn-tooltip" id="po-btn-tooltip">Loading last export time...</div>
                </div>
            </div>
            <div class="po-history-banner" id="po-history-banner"></div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2 class="card-title"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Export preview</h2>
                <button class="btn btn-primary" onclick="exportToCSV()" id="export-btn" disabled><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/></svg>Download CSV</button>
            </div>
            <div class="table-wrap preview-container" id="preview-container">
                <div class="empty-state">
                    <svg class="ico-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
                    <h3>No data to preview</h3>
                    <p>Apply filters above to preview your export</p>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import {
            getFirestore, collection, getDocs, query, orderBy,
            doc, getDoc, setDoc, deleteDoc
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAc_yJQ_rkzuOBh-Yxg0Q4eooXtB-tQjm0",
            authDomain: "pingu-solar.firebaseapp.com",
            projectId: "pingu-solar",
            storageBucket: "pingu-solar.firebasestorage.app",
            messagingSenderId: "232764952866",
            appId: "1:232764952866:web:5923b7f419de6355d6157b",
            measurementId: "G-PFH059DZ64"
        };

        try {
            const app = initializeApp(firebaseConfig);
            window.db = getFirestore(app);
            window.firebaseModules = { collection, getDocs, query, orderBy, doc, getDoc, setDoc, deleteDoc };
            console.log('✅ Firebase initialized');
            window.addEventListener('DOMContentLoaded', () => {
                window.loadJobs();
                window.loadPOCheckpoint();
            });
        } catch (error) {
            console.error('❌ Firebase error:', error);
            document.getElementById('preview-container').innerHTML =
                '<div class="empty-state"><svg class="ico-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg><h3>Firebase connection failed</h3></div>';
        }
    </script>

    <script>
        // ── Icons ─────────────────────────────────────────────────────────
        const ICONS = {
            alert:    '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
            search:   '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
            download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/>',
            check:    '<path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="m9 11 3 3L22 4"/>'
        };
        const ICON = (name, cls = 'ico') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;

        // ── State ─────────────────────────────────────────────────────────
        let jobsBySrc = { 'Solar-jobs': [], 'jobs': [] };
        let allJobs      = [];
        let filteredJobs = [];
        let availableFields    = [];
        let poExportCheckpoint = null;
        let dedupRemovedCount  = 0;

        // ── Field alias map ───────────────────────────────────────────────
        const FIELD_ALIASES = {
            'Address':     ['Address', 'address', '1st Line of Address', '1st line of address'],
            'Email':       ['Email', 'email', 'Email Address', 'email address'],
            'Booked Date': ['Booked Date', 'booked date', 'Install Date', 'install date', 'Installation Date'],
            'Days':        ['Days', 'days', 'Job Length', 'job length', 'Job length', 'Duration'],
            'Team Number': ['Team Number', 'Team', 'team'],
            'Lead':        ['Lead', 'Lead Engineer', 'lead engineer'],
        };

        function resolveField(job, canonicalName) {
            const aliases = FIELD_ALIASES[canonicalName];
            if (aliases) {
                for (const alias of aliases) {
                    const val = job[alias];
                    if (val !== undefined && val !== null && String(val).trim() !== '') return val;
                }
                return '';
            }
            const val = job[canonicalName];
            return (val !== undefined && val !== null) ? val : '';
        }

        function normaliseJobFields(job) {
            for (const [canonical, aliases] of Object.entries(FIELD_ALIASES)) {
                if (!job[canonical] || String(job[canonical]).trim() === '') {
                    for (const alias of aliases) {
                        if (alias === canonical) continue;
                        const val = job[alias];
                        if (val !== undefined && val !== null && String(val).trim() !== '') {
                            job[canonical] = val; break;
                        }
                    }
                }
            }
            return job;
        }

        // ── Dedup key ─────────────────────────────────────────────────────
        // Match on Job Number + Job Type, both normalised to lowercase & trimmed.
        // Tries every known field name variant so alias differences don't block a match.
        function dedupKey(job) {
            const num = String(
                job['Job Number'] || job['job number'] || job['jobNumber'] || ''
            ).trim().toLowerCase();

            const type = String(
                job['Job Type'] || job['job type'] || job['jobType'] || ''
            ).trim().toLowerCase();

            return `${num}|${type}`;
        }

        // ── Silent deduplication ──────────────────────────────────────────
        // Finds records in `jobs` whose key matches a record in `Solar-jobs`,
        // deletes them from Firestore in parallel chunks, removes from local array.
        async function deduplicateJobs() {
            // DISABLED: this used to permanently delete records from the legacy
            // 'jobs' collection every time the page was opened. Never delete here.
            return 0;
        }

        // ── Source toggle ─────────────────────────────────────────────────
        function onSourceChange() {
            const solarOn = document.getElementById('src-solar-jobs').checked;
            const jobsOn  = document.getElementById('src-jobs').checked;
            document.getElementById('chip-solar-jobs').className = 'source-chip' + (solarOn ? ' checked-solar-jobs' : '');
            document.getElementById('chip-jobs').className       = 'source-chip' + (jobsOn  ? ' checked-jobs'        : '');
            rebuildAllJobs();
            filteredJobs = [...allJobs];
            document.getElementById('stat-total').textContent    = allJobs.length;
            document.getElementById('stat-filtered').textContent = allJobs.length;
            document.getElementById('stat-range').textContent    = 'All';
            renderPreview();
        }
        window.onSourceChange = onSourceChange;

        function rebuildAllJobs() {
            const solarOn = document.getElementById('src-solar-jobs').checked;
            const jobsOn  = document.getElementById('src-jobs').checked;
            allJobs = [
                ...(solarOn ? jobsBySrc['Solar-jobs'] : []),
                ...(jobsOn  ? jobsBySrc['jobs']        : [])
            ];
        }

        // ── PO Checkpoint ─────────────────────────────────────────────────
        window.loadPOCheckpoint = async function() {
            try {
                const { doc, getDoc } = window.firebaseModules;
                const snap = await getDoc(doc(window.db, 'pingu-solar-settings', 'poExportCheckpoint'));
                poExportCheckpoint = (snap.exists() && snap.data().lastExportedAt)
                    ? snap.data().lastExportedAt : null;
                updatePOButtonUI();
            } catch (err) {
                console.error('PO checkpoint load error:', err);
                updatePOButtonUI();
            }
        };

        async function savePOCheckpoint(iso) {
            try {
                const { doc, setDoc } = window.firebaseModules;
                await setDoc(doc(window.db, 'pingu-solar-settings', 'poExportCheckpoint'),
                    { lastExportedAt: iso, updatedBy: 'export-page' });
            } catch (err) {
                showToast('Warning: Could not save checkpoint', 'error');
            }
        }

        function updatePOButtonUI() {
            const btn     = document.getElementById('new-po-btn');
            const tooltip = document.getElementById('po-btn-tooltip');
            if (allJobs.length > 0) btn.disabled = false;
            tooltip.textContent = poExportCheckpoint
                ? `Last run: ${formatTimestamp(poExportCheckpoint)} — exports POs added since then`
                : 'First run — will export ALL jobs that have PO numbers';
        }

        function formatTimestamp(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            return isNaN(d.getTime()) ? '' : d.toLocaleString('en-GB', {
                day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'
            });
        }

        // ── New POs Export ────────────────────────────────────────────────
        window.exportNewPOs = async function() {
            if (!allJobs.length) { showToast('Jobs not loaded yet', 'error'); return; }
            const btn = document.getElementById('new-po-btn');
            btn.disabled = true; btn.textContent = 'Exporting...';
            try {
                const now = new Date().toISOString();
                let jobsToExport = [], desc = '';
                if (!poExportCheckpoint) {
                    jobsToExport = allJobs.filter(j => j.poNumbers && String(j.poNumbers).trim());
                    desc = `All-time (first export) — ${jobsToExport.length} job(s)`;
                } else {
                    const cpDate = new Date(poExportCheckpoint);
                    jobsToExport = allJobs.filter(j =>
                        j.poNumbers && String(j.poNumbers).trim() &&
                        j.poNumbersUpdatedAt && new Date(j.poNumbersUpdatedAt) > cpDate
                    );
                    desc = `${formatTimestamp(poExportCheckpoint)} → ${formatTimestamp(now)} — ${jobsToExport.length} new/updated PO(s)`;
                }
                if (!jobsToExport.length) { showToast('No new POs since last export', 'error'); return; }

                let csv = ['Job Number','Postcode','Job Type','Booked Date','PO Numbers','PO Last Updated','Source']
                    .map(h => escapeCSV(h)).join(',') + '\n';
                jobsToExport.forEach(job => {
                    csv += [
                        resolveField(job, 'Job Number') || job.jobNumber || '',
                        resolveField(job, 'Postcode'),
                        resolveField(job, 'Job Type'),
                        resolveField(job, 'Booked Date'),
                        job.poNumbers || '',
                        job.poNumbersUpdatedAt ? formatTimestamp(job.poNumbersUpdatedAt) : '',
                        job._source || ''
                    ].map(v => escapeCSV(String(v))).join(',') + '\n';
                });

                downloadFile(csv, `pingu-solar-new-pos-${new Date().toISOString().split('T')[0]}.csv`, 'text/csv');
                await savePOCheckpoint(now);
                poExportCheckpoint = now;
                updatePOButtonUI();

                const banner = document.getElementById('po-history-banner');
                banner.style.display = 'block';
                banner.innerHTML = `<strong>New PO export complete</strong><br>
                    <span style="color:var(--text-dim);">Window: ${escapeHtml(desc)}</span><br>
                    <span style="color:var(--text-dim);font-size:12px;">Checkpoint updated — next press only includes POs after ${formatTimestamp(now)}</span>`;
                showToast(`Exported ${jobsToExport.length} job(s) with new PO numbers`, 'success');
            } catch (err) {
                showToast('Export failed: ' + err.message, 'error');
            } finally {
                btn.disabled = false; btn.innerHTML = ICON('download') + 'New PO\'s only';
            }
        };

        // ── Load Jobs (both collections + dedup) ──────────────────────────
        window.loadJobs = async function() {
            const banner = document.getElementById('dedup-banner');
            try {
                document.getElementById('preview-container').innerHTML = `
                    <div class="loading">Loading jobs from Firebase…
                        <div class="loading-detail">Querying Solar-jobs…</div>
                    </div>`;

                const { collection, getDocs, query, orderBy: ob } = window.firebaseModules;

                // Fetch both collections in parallel
                // Solar-jobs is the single source of truth — the legacy 'jobs'
                // collection is no longer read (and NEVER deleted from).
                const solarSnap = await getDocs(query(collection(window.db, 'Solar-jobs'), ob('uploadDate', 'desc')));
                const jobsSnap  = { forEach() {} };

                jobsBySrc['Solar-jobs'] = [];
                solarSnap.forEach(d => jobsBySrc['Solar-jobs'].push(
                    normaliseJobFields({ id: d.id, _source: 'Solar-jobs', ...d.data() })
                ));

                jobsBySrc['jobs'] = [];
                jobsSnap.forEach(d => jobsBySrc['jobs'].push(
                    normaliseJobFields({ id: d.id, _source: 'jobs', ...d.data() })
                ));

                const rawJobsCount = jobsBySrc['jobs'].length;
                console.log(`📦 Fetched: Solar-jobs=${jobsBySrc['Solar-jobs'].length}, jobs=${rawJobsCount}`);

                // ── Dedup ─────────────────────────────────────────────────
                if (rawJobsCount > 0 && jobsBySrc['Solar-jobs'].length > 0) {
                    banner.className      = 'dedup-banner running';
                    banner.style.display  = 'block';
                    banner.textContent    = 'Checking for duplicates across collections…';
                    dedupRemovedCount     = await deduplicateJobs();
                }

                // ── Banner result ─────────────────────────────────────────
                if (dedupRemovedCount > 0) {
                    banner.className   = 'dedup-banner done';
                    banner.textContent =
                        `Removed ${dedupRemovedCount} duplicate${dedupRemovedCount !== 1 ? 's' : ''} from the jobs collection` +
                        ` — matched by Job Number + Job Type. Solar-jobs versions kept.`;
                } else if (rawJobsCount > 0) {
                    banner.className   = 'dedup-banner clean';
                    banner.textContent = 'No duplicates found across collections';
                    banner.style.display = 'block';
                } else {
                    banner.style.display = 'none';
                }

                // ── Update UI ─────────────────────────────────────────────
                const finalJobsCount = jobsBySrc['jobs'].length;
                document.getElementById('count-solar-jobs').textContent = `(${jobsBySrc['Solar-jobs'].length})`;
                document.getElementById('count-jobs').textContent        = `(${finalJobsCount})`;
                document.getElementById('stat-solar-jobs').textContent   = jobsBySrc['Solar-jobs'].length;
                document.getElementById('stat-jobs').textContent         = finalJobsCount;
                document.getElementById('stat-dedup').textContent        = dedupRemovedCount > 0 ? `-${dedupRemovedCount}` : '0';
                document.getElementById('chip-solar-jobs').className     = 'source-chip checked-solar-jobs';

                rebuildAllJobs();
                extractAvailableFields();
                initializeFieldCheckboxes();
                document.getElementById('stat-total').textContent    = allJobs.length;
                document.getElementById('stat-filtered').textContent = allJobs.length;
                filteredJobs = [...allJobs];
                renderPreview();
                updatePOButtonUI();

            } catch (err) {
                console.error('Error loading jobs:', err);
                banner.style.display = 'none';
                document.getElementById('preview-container').innerHTML =
                    `<div class="empty-state">${ICON('alert', 'ico-lg')}
                    <h3>Error loading jobs</h3><p>${err.message}</p></div>`;
            }
        };

        // ── Field helpers ─────────────────────────────────────────────────
        const defaultFields = [
            'Job Type', 'Job Number', 'Address', 'Postcode',
            'Email', 'Booked Date', 'Projected Completion Date', 'Days', 'Panel No.',
            'Status Update', 'auditStatus', 'PO', 'Lead', 'Team Number',
            'notes', 'auditnotes', 'invoiceOctopus', 'invoiceLead',
            'materialsCost', 'materialNotes', '_source'
        ];

        function extractAvailableFields() {
            const s = new Set();
            allJobs.forEach(job => Object.keys(job).forEach(k => { if (k !== 'id') s.add(k); }));
            availableFields = Array.from(s).sort();
        }

        function initializeFieldCheckboxes() {
            document.getElementById('field-checkboxes').innerHTML = availableFields.map(field => {
                const checked = defaultFields.includes(field) ? 'checked' : '';
                return `<div class="field-checkbox">
                    <input type="checkbox" id="field-${escapeId(field)}" value="${escapeHtml(field)}" ${checked}>
                    <label for="field-${escapeId(field)}">${escapeHtml(field)}</label>
                </div>`;
            }).join('');
        }

        window.selectAllFields   = () => document.querySelectorAll('.field-checkbox input').forEach(cb => cb.checked = true);
        window.deselectAllFields = () => document.querySelectorAll('.field-checkbox input').forEach(cb => cb.checked = false);

        function getSelectedFields() {
            return Array.from(document.querySelectorAll('.field-checkbox input:checked')).map(cb => cb.value);
        }

        // ── Date helpers ──────────────────────────────────────────────────
        function parseDate(str) {
            if (!str) return null;
            if (String(str).includes('/')) {
                const [d,m,y] = String(str).split('/').map(Number);
                const p = new Date(y, m-1, d);
                if (!isNaN(p.getTime())) { p.setHours(0,0,0,0); return p; }
            }
            const p = new Date(str);
            return isNaN(p.getTime()) ? null : (p.setHours(0,0,0,0), p);
        }

        function resolveDateField(job, field) {
            let val = job[field];
            if (val && String(val).trim()) return val;
            const aliases = FIELD_ALIASES[field];
            if (aliases) for (const a of aliases) { val = job[a]; if (val && String(val).trim()) return val; }
            return null;
        }

        // ── Filters ───────────────────────────────────────────────────────
        window.applyFilters = function() {
            const statusFilter = document.getElementById('status-filter').value;
            const startDate    = document.getElementById('start-date').value;
            const endDate      = document.getElementById('end-date').value;
            const dateField    = document.getElementById('date-field').value;

            filteredJobs = allJobs.filter(job => {
                if (statusFilter !== 'all') {
                    const s = (job['Status Update'] || job['status'] || 'pending').toLowerCase();
                    if (s !== statusFilter.toLowerCase()) return false;
                }
                if (startDate || endDate) {
                    const d = parseDate(resolveDateField(job, dateField));
                    if (!d) return false;
                    if (startDate) { const s = new Date(startDate); s.setHours(0,0,0,0); if (d < s) return false; }
                    if (endDate)   { const e = new Date(endDate);   e.setHours(23,59,59,999); if (d > e) return false; }
                }
                return true;
            });

            document.getElementById('stat-filtered').textContent = filteredJobs.length;

            let rangeText = 'All';
            const fmt = ds => new Date(ds).toLocaleDateString('en-GB', { day:'numeric', month:'short' });
            if (startDate && endDate) rangeText = `${fmt(startDate)} - ${fmt(endDate)}`;
            else if (startDate)       rangeText = `From ${fmt(startDate)}`;
            else if (endDate)         rangeText = `Until ${fmt(endDate)}`;
            document.getElementById('stat-range').textContent = rangeText;

            renderPreview();
            showToast(`Filtered to ${filteredJobs.length} job${filteredJobs.length !== 1 ? 's' : ''}`, 'success');
        };

        window.clearFilters = function() {
            document.getElementById('status-filter').value = 'all';
            document.getElementById('start-date').value    = '';
            document.getElementById('end-date').value      = '';
            document.getElementById('date-field').value    = 'Booked Date';
            filteredJobs = [...allJobs];
            document.getElementById('stat-filtered').textContent = allJobs.length;
            document.getElementById('stat-range').textContent    = 'All';
            renderPreview();
            showToast('Filters cleared', 'success');
        };

        // ── Preview ───────────────────────────────────────────────────────
        function renderPreview() {
            const container = document.getElementById('preview-container');
            const exportBtn  = document.getElementById('export-btn');

            if (!filteredJobs.length) {
                container.innerHTML = `<div class="empty-state">${ICON('search', 'ico-lg')}
                    <h3>No jobs match filters</h3>
                    <p>Try adjusting your filter criteria</p></div>`;
                exportBtn.disabled = true; return;
            }

            const fields = getSelectedFields();
            if (!fields.length) {
                container.innerHTML = `<div class="empty-state">${ICON('alert', 'ico-lg')}
                    <h3>No fields selected</h3>
                    <p>Please select at least one field to export</p></div>`;
                exportBtn.disabled = true; return;
            }

            exportBtn.disabled = false;
            const limit    = Math.min(filteredJobs.length, 100);
            const showing  = filteredJobs.slice(0, limit);

            container.innerHTML = `
                <div class="preview-header">
                    <span>Preview (showing ${limit} of ${filteredJobs.length} jobs)</span>
                    <span style="color:var(--text-dim);font-size:12.5px;font-weight:500;">${fields.length} fields selected</span>
                </div>
                <table>
                    <thead><tr>${fields.map(f => `<th>${escapeHtml(f)}</th>`).join('')}</tr></thead>
                    <tbody>${showing.map(job => `<tr>${fields.map(field => {
                        const value = resolveField(job, field);
                        if (field === '_source') {
                            const src = String(value || '');
                            const cls = src === 'Solar-jobs' ? 'source-badge-solar-jobs' : 'source-badge-jobs';
                            return `<td><span class="source-badge ${cls}">${escapeHtml(src || 'unknown')}</span></td>`;
                        }
                        if (field === 'Status Update' || field === 'status') {
                            const s = (value || 'pending').toLowerCase();
                            return `<td><span class="status-badge status-${s}">${escapeHtml(value || 'pending')}</span></td>`;
                        }
                        if (field === 'auditStatus') {
                            const s = (value || 'pending-review').toLowerCase().replace(/\s+/g,'-');
                            return `<td><span class="status-badge status-${s}">${escapeHtml(value || 'Pending Review')}</span></td>`;
                        }
                        if (['invoiceOctopus','invoiceLead','materialsCost'].includes(field)) {
                            return value && !isNaN(value)
                                ? `<td>£${parseFloat(value).toFixed(2)}</td>` : `<td></td>`;
                        }
                        return `<td>${escapeHtml(String(value))}</td>`;
                    }).join('')}</tr>`).join('')}</tbody>
                </table>
                ${filteredJobs.length > limit
                    ? `<div class="preview-more">
                           + ${filteredJobs.length - limit} more jobs (included in export)
                       </div>` : ''}`;
        }

        // ── CSV Export ────────────────────────────────────────────────────
        window.exportToCSV = function() {
            if (!filteredJobs.length) { showToast('No jobs to export', 'error'); return; }
            const fields = getSelectedFields();
            if (!fields.length) { showToast('Please select at least one field', 'error'); return; }

            let csv = fields.map(f => escapeCSV(f)).join(',') + '\n';
            filteredJobs.forEach(job => {
                csv += fields.map(field => {
                    let v = resolveField(job, field);
                    if (['invoiceOctopus','invoiceLead','materialsCost'].includes(field) && v && !isNaN(v))
                        v = parseFloat(v).toFixed(2);
                    return escapeCSV(String(v));
                }).join(',') + '\n';
            });

            const ts     = new Date().toISOString().split('T')[0];
            const status = document.getElementById('status-filter').value;
            const suffix = status !== 'all' ? `-${status}` : '';
            downloadFile(csv, `pingu-solar-export-${ts}${suffix}.csv`, 'text/csv');
            showToast(`Exported ${filteredJobs.length} job${filteredJobs.length !== 1 ? 's' : ''}`, 'success');
        };

        // ── Utilities ─────────────────────────────────────────────────────
        function escapeCSV(v) {
            v = String(v);
            if (v.includes(',') || v.includes('"') || v.includes('\n') || v.includes('\r'))
                v = '"' + v.replace(/"/g, '""') + '"';
            return v;
        }

        function downloadFile(content, filename, mime) {
            const url  = URL.createObjectURL(new Blob([content], { type: mime }));
            const link = Object.assign(document.createElement('a'), { href: url, download: filename });
            document.body.appendChild(link); link.click();
            document.body.removeChild(link); URL.revokeObjectURL(url);
        }

        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className   = `toast show${type === 'error' ? ' error' : ''}`;
            setTimeout(() => t.classList.remove('show'), 4000);
        }

        function escapeHtml(text) {
            if (!text) return '';
            const d = document.createElement('div');
            d.textContent = String(text);
            return d.innerHTML;
        }

        function escapeId(text) {
            return String(text).replace(/[^a-zA-Z0-9-_]/g, '-');
        }
    </script>
</body>
</html>
