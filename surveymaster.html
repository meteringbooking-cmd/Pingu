<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Master | Pingu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* ═══ Pingu design system — base (copy verbatim into each page's <style>) ═══ */
        :root {
            /* Brand + status palette */
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --secondary: #FFC857;
            --accent: #00D9FF;
            --dark: #1A1A2E;
            --dark-light: #252541;
            --dark-lighter: #2F2F4A;
            --text: #EAEAEA;
            --text-dim: #9A9AB0;
            --success: #4ECCA3;
            --error: #FF6B6B;
            --warning: #FFC857;
            --in-progress: #00D9FF;
            --complete: #4ECCA3;
            --aborted: #FF6B6B;
            --cancelled: #9A9AB0;
            --short-notice: #90ee90;
            --on-hold: #FFDE00;
            --scheduled: #FF6B35;
            /* Surfaces & type */
            --bg: #161628;
            --surface: #1F1F35;
            --surface-2: #252541;
            --line: rgba(255,255,255,0.07);
            --line-2: rgba(255,255,255,0.12);
            --text-strong: #F4F4F8;
            --text-soft: #C8C8D6;
            --radius: 10px;
            --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: var(--font); font-size: 14px; line-height: 1.5;
            background: var(--bg); color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        button, input, select, textarea { font-family: inherit; }
        a { color: var(--accent); }
        .ico { width: 16px; height: 16px; flex: 0 0 auto; vertical-align: -3px; }
        .ico-lg { width: 20px; height: 20px; flex: 0 0 auto; }

        /* ── App bar + Pingu wordmark ── */
        .appbar {
            position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            height: 64px; padding: 0 28px;
            background: rgba(22, 22, 40, 0.92);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line);
        }
        .appbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .logo { display: inline-flex; align-items: center; text-decoration: none; }
        .wordmark {
            font-family: 'Inter', var(--font); font-weight: 800; font-size: 28px;
            letter-spacing: -0.045em; line-height: 1; color: var(--text-strong); padding-top: 6px;
        }
        .i-stem { position: relative; display: inline-block; }
        .i-paw {
            position: absolute; left: 50%; top: -0.17em; transform: translateX(-50%) rotate(-10deg);
            width: 0.5em; height: 0.5em; fill: var(--primary);
            filter: drop-shadow(0 1px 4px rgba(255,107,53,0.35));
            transition: transform .2s ease;
        }
        .logo:hover .i-paw { transform: translateX(-50%) rotate(4deg) scale(1.08); }
        .logo:hover .wordmark { color: #fff; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-soft); text-decoration: none; font-size: 13px; font-weight: 500;
            padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; cursor: pointer;
            transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .back-btn:hover { background: var(--surface-2); color: var(--text-strong); border-color: rgba(255,255,255,0.2); }

        /* ── Page layout ── */
        .container { padding: 24px 28px 40px; }
        .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
        h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-strong); line-height: 1.2; }
        h2 { font-size: 16px; font-weight: 600; color: var(--text-strong); letter-spacing: -0.01em; }
        h3 { font-size: 14px; font-weight: 600; color: var(--text-strong); }
        .muted { color: var(--text-dim); }
        .toolbar { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }

        /* ── Panels / cards ── */
        .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
        .panel + .panel { margin-top: 16px; }
        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -2px 0 14px; }
        .panel-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--text-strong); }
        .panel-title .ico { color: var(--primary); }

        /* ── Form controls ── */
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-label { color: var(--text-dim); font-size: 11.5px; font-weight: 500; }
        .control-input {
            height: 38px; background: var(--surface); border: 1px solid var(--line-2);
            color: var(--text-strong); padding: 0 12px; border-radius: 8px; font-size: 13.5px; width: 100%;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        textarea.control-input { height: auto; min-height: 84px; padding: 9px 11px; resize: vertical; }
        .control-input:hover { border-color: rgba(255,255,255,0.2); }
        .control-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.22); }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); cursor: pointer; }
        input[type="checkbox"], input[type="radio"] { accent-color: var(--primary); }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 7px;
            height: 38px; padding: 0 16px; border-radius: 8px; cursor: pointer;
            font-size: 13.5px; font-weight: 600; text-decoration: none; white-space: nowrap;
            border: 1px solid transparent; transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--surface-2); color: var(--text-strong); border-color: var(--line-2); }
        .btn-secondary:hover { background: var(--dark-lighter); border-color: rgba(255,255,255,0.25); }
        .btn-ghost { background: transparent; color: var(--text-soft); border-color: var(--line-2); }
        .btn-ghost:hover { background: var(--surface-2); color: var(--text-strong); }
        .btn-danger { background: rgba(255,107,107,0.12); color: #FF8A8A; border-color: rgba(255,107,107,0.4); }
        .btn-danger:hover { background: rgba(255,107,107,0.22); }
        .btn-success { background: rgba(78,204,163,0.14); color: var(--success); border-color: rgba(78,204,163,0.45); }
        .btn-success:hover { background: rgba(78,204,163,0.24); }
        .btn-sm { height: 32px; padding: 0 12px; font-size: 12.5px; }
        .btn:disabled, button:disabled { opacity: .45; cursor: not-allowed; }
        .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; height: 38px; }
        .seg button { background: var(--surface); color: var(--text-soft); border: 0; padding: 0 12px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .seg button + button { border-left: 1px solid var(--line-2); }
        .seg button:hover, .seg button.active { background: var(--surface-2); color: var(--text-strong); }

        /* ── KPI tiles ── */
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
        .stat-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; }
        .stat-label { display: flex; align-items: center; gap: 7px; color: var(--text-dim); font-size: 12px; font-weight: 500; white-space: nowrap; }
        .stat-label .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
        .stat-value { font-size: 22px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.02em; line-height: 1.25; margin-top: 2px; font-variant-numeric: tabular-nums; }

        /* ── Tables ── */
        .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
        thead th {
            position: sticky; top: 0; z-index: 2; background: var(--surface);
            text-align: left; padding: 10px 14px; font-size: 11.5px; font-weight: 600; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--line-2); white-space: nowrap;
        }
        tbody td { padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--text-soft); vertical-align: middle; }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover td { background: rgba(255,255,255,0.025); }
        td.strong, .cell-strong { color: var(--text-strong); font-weight: 600; }
        .mono { font-family: var(--mono); font-size: 12.5px; }

        /* ── Badges / status pills ── */
        .badge {
            --c: var(--text-dim);
            display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
            padding: 2px 9px; border-radius: 999px; color: var(--text-strong);
            background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
        }
        .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
        .badge.plain::before { display: none; }
        .tag { font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 4px; background: rgba(255,255,255,0.1); color: var(--text-soft); letter-spacing: .03em; }

        /* ── Notices ── */
        .notice { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 13px;
                  background: rgba(255,255,255,0.03); border: 1px solid var(--line-2); color: var(--text-soft); }
        .notice .ico { margin-top: 1px; }
        .notice.info    { border-color: rgba(0,217,255,0.35);  background: rgba(0,217,255,0.06); }
        .notice.success { border-color: rgba(78,204,163,0.4);  background: rgba(78,204,163,0.07); color: var(--success); }
        .notice.warning { border-color: rgba(255,200,87,0.4);  background: rgba(255,200,87,0.07); color: var(--warning); }
        .notice.error   { border-color: rgba(255,107,107,0.45); background: rgba(255,107,107,0.08); color: #FF8A8A; }

        /* ── Modals ── */
        .modal { display: none; position: fixed; inset: 0; background: rgba(10,10,22,0.72); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
        .modal.show, .modal.active, .modal.open { display: flex; }
        .modal-content { background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; width: 100%; max-width: 680px; max-height: 88vh; overflow-y: auto; box-shadow: 0 30px 80px -20px rgba(0,0,0,0.75); }
        .modal-header { position: sticky; top: 0; z-index: 2; background: var(--surface); display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
        .modal-title { font-size: 17px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.01em; }
        .modal-body { padding: 18px 20px 22px; }
        .close-btn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; border-radius: 8px; color: var(--text-dim); cursor: pointer; font-size: 20px; line-height: 1; }
        .close-btn:hover { background: var(--surface-2); color: var(--text-strong); }

        /* ── Feedback ── */
        .toast { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: none; max-width: 420px; padding: 12px 16px 12px 14px; border-radius: 10px;
                 background: #26263F; color: var(--text-strong); font-size: 13.5px; border: 1px solid var(--line-2); border-left: 3px solid var(--success);
                 box-shadow: 0 16px 40px -12px rgba(0,0,0,0.7); }
        .toast.show { display: block; }
        .toast.error { border-left-color: var(--error); }
        .empty-state, .loading { text-align: center; padding: 56px 16px; color: var(--text-dim); }
        .empty-state h3 { color: var(--text-strong); font-size: 16px; margin-bottom: 4px; }
        .empty-state .ico-lg { width: 32px; height: 32px; color: var(--text-dim); margin-bottom: 10px; }
        .spinner { width: 22px; height: 22px; border: 2px solid var(--line-2); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        *::-webkit-scrollbar { width: 10px; height: 10px; }
        *::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
        *::-webkit-scrollbar-track { background: transparent; }
        @media (max-width: 768px) {
            .appbar, .container { padding-left: 14px; padding-right: 14px; }
            .wordmark { font-size: 24px; }
        }
        /* ═══ end base ═══ */

        /* ═══ Survey Master — page styles ═══ */
        :root { --kf: #B57BFF; }

        /* KPI tiles */
        .stats-bar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
        .stat-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; }
        .stat-card.complete .stat-value { color: var(--complete); }
        .stat-card.pending  .stat-value { color: var(--warning); }
        .stat-card.picklist .stat-value { color: var(--kf); }

        /* Controls */
        .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
        .filter-group { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; height: 38px; }
        .filter-btn {
            display: inline-flex; align-items: center; gap: 7px;
            background: var(--surface); color: var(--text-soft); border: 0; padding: 0 14px;
            font-size: 13px; font-weight: 500; cursor: pointer; transition: background .15s ease, color .15s ease;
        }
        .filter-btn + .filter-btn { border-left: 1px solid var(--line-2); }
        .filter-btn:hover { background: var(--surface-2); color: var(--text-strong); }
        .filter-btn .dot { width: 7px; height: 7px; border-radius: 50%; }
        .filter-btn.active, .filter-btn.active-ok, .filter-btn.active-pend { background: var(--surface-2); color: var(--text-strong); font-weight: 600; box-shadow: inset 0 -2px 0 var(--primary); }
        .filter-btn.active-ok   { box-shadow: inset 0 -2px 0 var(--complete); }
        .filter-btn.active-pend { box-shadow: inset 0 -2px 0 var(--warning); }

        .search-wrap { position: relative; flex: 1; min-width: 220px; }
        .search-wrap .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-dim); pointer-events: none; }
        .search-box { padding-left: 36px; }
        .search-box::placeholder { color: var(--text-dim); }
        .sort-select { width: auto; min-width: 200px; cursor: pointer; }

        /* Table (div grid) */
        .table-wrap { overflow: hidden; }
        .table-header {
            display: grid; grid-template-columns: 130px 1fr 170px 130px 170px 120px;
            padding: 0 6px; background: var(--surface); border-bottom: 1px solid var(--line-2);
            position: sticky; top: 0; z-index: 2;
        }
        .th {
            padding: 10px 10px; font-size: 11.5px; font-weight: 600; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: .05em; white-space: nowrap;
            display: flex; align-items: center; gap: 4px; user-select: none;
        }
        .th[onclick] { cursor: pointer; }
        .th[onclick]:hover { color: var(--text-strong); }
        .th .sort-arrow { font-size: 11px; opacity: .5; }
        .th.sorted { color: var(--text-soft); }

        .survey-row {
            display: grid; grid-template-columns: 130px 1fr 170px 130px 170px 120px;
            padding: 0 6px; align-items: center; cursor: pointer;
            border-bottom: 1px solid var(--line); transition: background .15s ease;
        }
        .survey-row > * { padding: 10px 10px; min-width: 0; }
        .survey-row:last-child { border-bottom: 0; }
        .survey-row:hover { background: rgba(255,255,255,0.025); }
        .survey-row:hover .job-num { color: var(--primary); }

        .job-num { font-family: var(--mono); font-size: 12.5px; font-weight: 700; color: var(--text-strong); white-space: nowrap; }
        .customer-name { font-size: 13px; color: var(--text-strong); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .customer-address { font-size: 12px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .engineer-cell { font-size: 13px; color: var(--text-soft); }
        .date-cell { font-size: 13px; color: var(--text-soft); font-variant-numeric: tabular-nums; }

        /* Status badge */
        .status-badge {
            --c: var(--text-dim);
            display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
            padding: 2px 9px; border-radius: 999px; color: var(--text-strong);
            background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
        }
        .status-badge.complete { --c: var(--complete); }
        .status-badge.pending  { --c: var(--warning); }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; background: var(--c); }

        /* Picklist pill */
        .picklist-cell { display: flex; align-items: center; gap: 6px; }
        .picklist-pill {
            display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
            padding: 2px 9px; border-radius: 6px; font-size: 11.5px; font-weight: 600;
        }
        .picklist-pill .ico { width: 13px; height: 13px; }
        .picklist-pill.has-pl { background: color-mix(in srgb, var(--kf) 16%, transparent); color: #CFA8FF; border: 1px solid color-mix(in srgb, var(--kf) 40%, transparent); }
        .picklist-pill.no-pl  { color: var(--text-dim); background: transparent; border: 1px solid var(--line); }

        /* Empty / loading */
        .empty-state .ei { margin-bottom: 10px; color: var(--text-dim); }
        .empty-state .ei .ico { width: 32px; height: 32px; }
        .empty-state p { font-size: 13px; }
        .loading-row { padding: 48px 16px; text-align: center; color: var(--text-dim); }
        .big-spinner { width: 26px; height: 26px; border: 2px solid var(--line-2); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; margin-bottom: 10px; }
        .result-count { font-size: 12px; color: var(--text-dim); padding: 9px 16px; border-top: 1px solid var(--line); text-align: right; }

        /* Modal */
        #detail-modal .modal-content { max-width: 1000px; }
        .modal-hdr { align-items: flex-start; }
        .modal-hdr-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        .modal-job-num { font-family: var(--mono); font-size: 18px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.01em; }
        .modal-customer { color: var(--text-strong); font-size: 14px; font-weight: 500; }
        .modal-meta { color: var(--text-dim); font-size: 12.5px; }

        .modal-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: -6px 0 18px; flex-wrap: wrap; }
        .modal-tab {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 10px 14px; font-size: 13px; font-weight: 500; color: var(--text-dim);
            cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
            transition: color .15s ease, border-color .15s ease;
        }
        .modal-tab:hover { color: var(--text-strong); }
        .modal-tab.active { color: var(--text-strong); border-bottom-color: var(--primary); font-weight: 600; }
        .modal-tab.kf-tab.active { border-bottom-color: var(--kf); }
        .modal-tab .ico { width: 15px; height: 15px; }
        .modal-pane { display: none; }
        .modal-pane.active { display: block; }

        .job-info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
        .info-item { padding: 10px 12px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; }
        .info-label, .sub-label { font-size: 12px; color: var(--text-dim); margin-bottom: 2px; }
        .info-value { font-size: 13.5px; color: var(--text-strong); font-weight: 500; word-break: break-word; }

        .info-block { padding: 14px; background: var(--bg); border: 1px solid var(--line); border-left: 3px solid var(--c, var(--line-2)); border-radius: 10px; margin-top: 12px; }
        .info-block-title { font-size: 12px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
        .sub-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-top: 12px; }
        .sub-value { font-size: 13px; color: var(--text-strong); }
        .info-note { font-size: 12.5px; color: var(--text-dim); margin-top: 8px; }

        /* Specs */
        .specs-section-title {
            display: flex; align-items: center; gap: 8px;
            font-size: 12px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em;
            margin: 20px 0 8px;
        }
        .specs-section-title .ico { color: var(--primary); }
        .specs-section-title:first-child { margin-top: 0; }
        .specs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
        .spec-item { position: relative; background: var(--surface-2); border: 1px solid var(--line); border-left: 3px solid var(--line-2); border-radius: 8px; padding: 9px 12px; }
        .spec-item.has-value { border-left-color: var(--accent); }
        .spec-item.no-value  { opacity: .5; }
        .spec-ref { position: absolute; top: 8px; right: 10px; font-family: var(--mono); font-size: 10px; color: var(--text-dim); }
        .spec-label { font-size: 12px; color: var(--text-dim); margin-bottom: 2px; padding-right: 34px; }
        .spec-note { color: var(--text-dim); opacity: .8; }
        .spec-value { font-size: 13.5px; color: var(--text-strong); font-weight: 500; }
        .spec-value.empty-val { color: var(--text-dim); font-weight: 400; }
        .spec-unit { font-size: 11.5px; color: var(--text-dim); margin-left: 3px; }

        /* Roof map */
        .roof-map-wrap { margin-top: 20px; padding: 16px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
        .roof-map-hdr { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
        .roof-map-hdr h4 { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--text-strong); }
        .roof-map-hdr h4 .ico { color: var(--primary); }
        .legend { display: flex; gap: 14px; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); }
        .swatch { width: 14px; height: 18px; border-radius: 3px; display: inline-block; }
        .swatch.p { background: var(--primary); }
        .swatch.l { background: var(--accent); width: 20px; height: 13px; }
        .swatch.e { background: transparent; border: 1px dashed var(--line-2); width: 16px; height: 16px; }
        .roof-grid-wrap { overflow-x: auto; padding-bottom: 4px; }
        .roof-grid { display: inline-grid; gap: 3px; padding: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
        .cell { width: 28px; height: 28px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 700; }
        .cell.e { background: transparent; border: 1px dashed var(--line-2); }
        .cell.p { background: var(--primary); color: #fff; }
        .cell.l { background: var(--accent); color: #062433; }
        .roof-stats { display: flex; gap: 18px; margin-top: 12px; flex-wrap: wrap; }
        .roof-stat { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-dim); }
        .roof-stat strong { color: var(--text-strong); }
        .roof-stat .swatch { width: 10px; height: 10px; }

        /* KF table */
        .kf-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .kf-head-title { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; }
        .kf-head-title .ico { color: var(--kf); }
        .kf-table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
        .kf-table thead th { background: var(--surface); }
        .kf-part-code { font-family: var(--mono); font-size: 12.5px; color: var(--text-strong); }
        .kf-qty { display: inline-block; min-width: 28px; text-align: center; padding: 1px 8px; border-radius: 6px; font-weight: 600; font-size: 12.5px; color: var(--text-strong); background: color-mix(in srgb, var(--kf) 16%, transparent); border: 1px solid color-mix(in srgb, var(--kf) 38%, transparent); font-variant-numeric: tabular-nums; }
        .kf-total-row td { border-top: 1px solid var(--line-2); color: var(--text-dim); font-size: 12.5px; }

        /* No-survey / no-picklist notice */
        .no-picklist-notice { text-align: center; padding: 28px 16px; border: 1px dashed var(--line-2); border-radius: 10px; color: var(--text-dim); margin-top: 12px; }
        .no-picklist-notice .ni { margin-bottom: 8px; }
        .no-picklist-notice .ni .ico { width: 26px; height: 26px; }
        .no-picklist-notice p { font-size: 13px; }
        .no-picklist-notice a { color: var(--accent); text-decoration: none; }
        .no-picklist-notice a:hover { text-decoration: underline; }

        /* Status message (toast) */
        .status-msg {
            position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: none; max-width: 420px;
            padding: 12px 16px 12px 14px; border-radius: 10px; background: #26263F; color: var(--text-strong); font-size: 13.5px;
            border: 1px solid var(--line-2); border-left: 3px solid var(--success); box-shadow: 0 16px 40px -12px rgba(0,0,0,0.7);
        }
        .status-msg.show { display: block; }
        .status-msg.error   { border-left-color: var(--error); }
        .status-msg.warning { border-left-color: var(--warning); }

        @media (max-width: 900px) {
            .stats-bar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .table-inner { min-width: 0 !important; }
            .table-header, .survey-row { grid-template-columns: 120px 1fr 110px 150px; }
            .table-header .th:nth-child(3), .survey-row > *:nth-child(3),
            .table-header .th:nth-child(5), .survey-row > *:nth-child(5) { display: none; }
        }
        @media (max-width: 600px) {
            .table-header, .survey-row { grid-template-columns: 112px 1fr auto; }
            .table-header .th:nth-child(4), .survey-row > *:nth-child(4),
            .table-header .th:nth-child(6), .survey-row > *:nth-child(6) { display: none; }
            .table-header .th:nth-child(5), .survey-row > *:nth-child(5) { display: flex; }
            .search-wrap { flex-basis: 100%; }
            .sort-select { flex: 1; min-width: 0; }
            .modal-tab { padding: 9px 10px; }
        }
    </style>
</head>

<script>
// ── Global state ────────────────────────────────────────────────────
let allJobs      = [];   // raw job docs
let picklists    = {};   // keyed by jobNumber → picklist doc
let surveys      = {};   // keyed by jobNumber → site-survey doc (from conductsurvey.html)
let currentFilter= 'all';
let currentSort  = 'date-desc';

// Line icons (kit/icons.md)
const ICONS = {
    alert:  '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
    search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
    puzzle: '<path d="M19.4 14.6a2.5 2.5 0 1 0 0-5H18V7a2 2 0 0 0-2-2h-2.6v-.6a2.5 2.5 0 1 0-5 0V5H6a2 2 0 0 0-2 2v2.6h.6a2.5 2.5 0 1 1 0 5H4V17a2 2 0 0 0 2 2h2.4v-.6a2.5 2.5 0 1 1 5 0v.6H16a2 2 0 0 0 2-2v-2.4z"/>',
    zap:    '<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',
    wrench: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"/>',
    plug:   '<path d="M12 22v-5M9 8V2M15 8V2M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8z"/>',
    check:  '<path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="m9 11 3 3L22 4"/>',
    home:   '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>'
};
const ICON = name => `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;

const SPECS_DEF = {
    system: [
        {label:'Type of System',     col:'AO', row:2},
        {label:'Inverter Size',      col:'AO', row:4,  note:'Fox & Tesla'},
        {label:'No. of Batteries',   col:'AO', row:6},
        {label:'Battery',            col:'AO', row:7},
        {label:'Retrofit',           col:'AO', row:8,  note:'Fox only'},
        {label:'Enphase Pedestal',   col:'AO', row:17},
        {label:'Enphase Branches',   col:'AO', row:12},
        {label:'DC Expansion',       col:'AO', row:21, note:'Tesla'},
    ],
    mounting: [
        {label:'Mounting System',    col:'AS', row:2},
        {label:'Hook Type',          col:'AS', row:4},
        {label:'Ave Hook Spacing',   col:'AS', row:6,  unit:'mm'},
        {label:'Hook Spacing',       col:'AS', row:7,  unit:'mm'},
        {label:'Min. Roof Anchors',  col:'AS', row:12},
        {label:'Bird Mesh',          col:'AS', row:14},
        {label:'Roof Type',          col:'AS', row:16},
        {label:'Rafter Spacing',     col:'AS', row:17},
    ],
    electrical: [
        {label:'Supply Cables',      col:'AO', row:10},
        {label:'Submain Location',   col:'AO', row:15},
        {label:'Trenching',          col:'AO', row:19},
    ]
};

const MOUNT_CHECK = [
    {label:'# Portrait Panels',        col:'I', row:23},
    {label:'# Landscape Panels',       col:'I', row:24},
    {label:'Total Panels',             col:'I', row:25},
    {label:'Total Perimeter',          col:'I', row:26},
    {label:'End Clamps',               col:'S', row:23},
    {label:'Mid Clamps',               col:'S', row:24},
    {label:'Rail Length',              col:'S', row:25},
    {label:'# Roof Anchors',           col:'S', row:26},
    {label:'New Picklist Cost Saving', col:'R', row:28, highlight:true},
];

// ── Load data ───────────────────────────────────────────────────────
async function loadData() {
    if(!window.db) return;
    document.getElementById('survey-table-body').innerHTML =
        `<div class="loading-row"><div class="big-spinner"></div><p>Loading jobs…</p></div>`;
    document.getElementById('result-count').style.display='none';

    try {
        const {collection, getDocs, query, orderBy} = window.fb;

        // Load jobs
        const jobsSnap = await getDocs(collection(window.db,'Solar-jobs'));
        allJobs = jobsSnap.docs.map(d=>({id:d.id,...d.data()}));

        // Load picklists — build a map keyed by jobNumber
        picklists = {};
        const plSnap = await getDocs(collection(window.db,'picklists'));
        plSnap.docs.forEach(d=>{
            const data = d.data();
            if(data.jobNumber) picklists[data.jobNumber] = {id:d.id,...data};
        });

        // Load site surveys (submitted via conductsurvey.html) keyed by jobNumber
        // A job may have multiple survey docs; we keep the most recent per job
        surveys = {};
        const svSnap = await getDocs(collection(window.db,'site-surveys'));
        svSnap.docs.forEach(d=>{
            const data = d.data();
            const jn = data.jobNumber;
            if(!jn) return;
            if(!surveys[jn] || (data.submittedAt||'') > (surveys[jn].submittedAt||'')) {
                surveys[jn] = {id:d.id,...data};
            }
        });

        updateStats();
        applyFilters();
    } catch(e) {
        document.getElementById('survey-table-body').innerHTML =
            `<div class="empty-state"><div class="ei">${ICON('alert')}</div><h3>Failed to load</h3><p>${esc(e.message)}</p></div>`;
        showStatus('Load failed: '+e.message,'error');
    }
}

// ── Stats ───────────────────────────────────────────────────────────
function updateStats() {
    const total    = allJobs.length;
    const complete = allJobs.filter(j=>isSurveyComplete(j)).length;
    const pending  = total - complete;
    const withPl   = allJobs.filter(j=>picklists[j['Job Number']]).length;

    document.getElementById('stat-total').textContent    = total;
    document.getElementById('stat-complete').textContent = complete;
    document.getElementById('stat-pending').textContent  = pending;
    document.getElementById('stat-picklist').textContent = withPl;
}

// A survey is "complete" if a site-survey doc exists (submitted via conductsurvey.html)
function isSurveyComplete(job) {
    return !!surveys[job['Job Number']];
}

// ── Filter & sort ───────────────────────────────────────────────────
function setFilter(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b=>{
        b.className='filter-btn';
    });
    if(filter==='all')      btn.classList.add('active');
    else if(filter==='complete') btn.classList.add('active-ok');
    else                    btn.classList.add('active-pend');
    applyFilters();
}

function sortBy(s) { currentSort = s; document.getElementById('sort-select').value=s; applyFilters(); }

function applyFilters() {
    currentSort = document.getElementById('sort-select').value;
    const search = document.getElementById('search-box').value.toLowerCase().trim();

    let jobs = [...allJobs];

    // Filter by status
    if(currentFilter==='complete') jobs = jobs.filter(j=>isSurveyComplete(j));
    else if(currentFilter==='pending') jobs = jobs.filter(j=>!isSurveyComplete(j));

    // Search
    if(search) {
        jobs = jobs.filter(j=>{
            return (
                (j['Job Number']||'').toLowerCase().includes(search) ||
                (j['Name']||'').toLowerCase().includes(search) ||
                (j['Lead Engineer']||'').toLowerCase().includes(search) ||
                (j['1st line of address']||'').toLowerCase().includes(search) ||
                (j['Postcode']||'').toLowerCase().includes(search)
            );
        });
    }

    // Sort
    jobs.sort((a,b)=>{
        switch(currentSort){
            case 'date-asc':   return parseDate(a['Install Date']) - parseDate(b['Install Date']);
            case 'date-desc':  return parseDate(b['Install Date']) - parseDate(a['Install Date']);
            case 'job-asc':    return (a['Job Number']||'').localeCompare(b['Job Number']||'');
            case 'job-desc':   return (b['Job Number']||'').localeCompare(a['Job Number']||'');
            case 'engineer':   return (a['Lead Engineer']||'').localeCompare(b['Lead Engineer']||'');
            default: return 0;
        }
    });

    renderTable(jobs);
}

function parseDate(str) {
    if(!str) return 0;
    const parts = str.split('/');
    if(parts.length===3) return new Date(parts[2], parts[1]-1, parts[0]).getTime();
    return new Date(str).getTime()||0;
}

// ── Render table ────────────────────────────────────────────────────
function renderTable(jobs) {
    const body   = document.getElementById('survey-table-body');
    const count  = document.getElementById('result-count');

    if(!jobs.length) {
        body.innerHTML = `
            <div class="empty-state">
                <div class="ei">${ICON('search')}</div>
                <h3>No jobs found</h3>
                <p>Try adjusting your filters or search term.</p>
            </div>`;
        count.style.display='none';
        return;
    }

    body.innerHTML = jobs.map((job,i) => {
        const jn      = job['Job Number']||'—';
        const name    = job['Name']||'—';
        const addr    = [job['1st line of address'], job['Postcode']].filter(Boolean).join(', ');
        const eng     = job['Lead Engineer']||'—';
        const date    = job['Install Date']||'—';
        const done    = isSurveyComplete(job);
        const hasPl   = !!picklists[jn];
        const plData  = picklists[jn];
        const kfCount = (plData?.kfPicklist?.length)||0;

        return `
        <div class="survey-row" onclick="openJobDetail('${esc(jn)}')"
             style="animation-delay:${Math.min(i*0.04,0.6)}s">
            <div class="job-num">#${esc(jn)}</div>
            <div>
                <div class="customer-name">${esc(name)}</div>
                <div class="customer-address">${esc(addr)}</div>
            </div>
            <div class="engineer-cell">${esc(eng)}</div>
            <div class="date-cell">${esc(date)}</div>
            <div>
                <span class="status-badge ${done?'complete':'pending'}">
                    <span class="status-dot"></span>
                    ${done?(surveys[jn]?.surveyType==='battery-only'?'Complete · Bat':'Complete · B&S'):'Pending'}
                </span>
            </div>
            <div class="picklist-cell">
                ${hasPl
                    ? `<span class="picklist-pill has-pl">${ICON('puzzle')}${kfCount>0?kfCount+' KF':'Yes'}</span>`
                    : `<span class="picklist-pill no-pl">—</span>`
                }
            </div>
        </div>`;
    }).join('');

    count.style.display='block';
    count.textContent=`Showing ${jobs.length} of ${allJobs.length} job${allJobs.length!==1?'s':''}`;
}

// ── Modal ────────────────────────────────────────────────────────────
function openJobDetail(jobNumber) {
    const job = allJobs.find(j=>j['Job Number']===jobNumber);
    if(!job) return;

    const pl     = picklists[jobNumber];
    const hasPl  = !!pl;
    const hasKf  = hasPl && pl.kfPicklist && pl.kfPicklist.length > 0;

    document.getElementById('modal-job-num').textContent   = `#${jobNumber}`;
    document.getElementById('modal-customer').textContent  = job['Name']||'—';
    document.getElementById('modal-meta').textContent      =
        `Install: ${job['Install Date']||'—'}  ·  ${job['Lead Engineer']||'—'}  ·  ${job['Job Length']||'—'}`;

    // Show/hide tabs
    document.getElementById('tab-specs').style.display = hasPl ? '' : 'none';
    document.getElementById('tab-kf').style.display    = hasKf ? '' : 'none';

    // ── Info pane ──
    const sv      = surveys[jobNumber];
    const hasSv   = !!sv;
    const infoFields = ['Phone Number','Email Address','1st line of address','Postcode','Job Length','Lead Engineer'];
    document.getElementById('pane-info').innerHTML = `
        <div class="job-info-grid">
            ${infoFields.map(f=>`
                <div class="info-item">
                    <div class="info-label">${f}</div>
                    <div class="info-value">${esc(job[f]||'—')}</div>
                </div>`).join('')}
        </div>
        <div class="info-block" style="--c:${hasSv?'var(--complete)':'var(--warning)'}">
            <div class="info-block-title">Survey status</div>
            <span class="status-badge ${hasSv?'complete':'pending'}">
                <span class="status-dot"></span>
                ${hasSv?'Survey complete':'Awaiting survey'}
            </span>
            ${hasSv?`<div class="sub-grid">
                <div><div class="sub-label">Survey type</div>
                    <div class="sub-value">${esc(sv.surveyType==='battery-and-solar'?'Battery & Solar':sv.surveyType==='battery-only'?'Battery Only':(sv.surveyType||'—'))}</div></div>
                <div><div class="sub-label">Surveyor</div>
                    <div class="sub-value">${esc((sv.sections?.surveyDetails?.surveyor)||'—')}</div></div>
                <div><div class="sub-label">Conducted on</div>
                    <div class="sub-value">${esc(sv.sections?.surveyDetails?.conductedOn||'—')}</div></div>
                <div><div class="sub-label">Submitted</div>
                    <div class="sub-value">${sv.submittedAt?new Date(sv.submittedAt).toLocaleString('en-GB'):'—'}</div></div>
            </div>`:''}
        </div>
        ${!hasSv?`
        <div class="no-picklist-notice">
            <div class="ni">${ICON('search')}</div>
            <p>No site survey has been submitted for this job yet.<br>
            Visit <a href="conductsurvey.html">Conduct Site Survey</a> to submit one.</p>
        </div>`:''}
        <div class="info-block" style="--c:${hasPl?'var(--kf)':'var(--line-2)'}">
            <div class="info-block-title">Picklist</div>
            <span class="picklist-pill ${hasPl?'has-pl':'no-pl'}" style="display:inline-flex">
                ${hasPl?(ICON('puzzle')+'Picklist saved'+((pl?.kfPicklist?.length)?(' · '+pl.kfPicklist.length+' KF items'):'')):'No picklist yet'}
            </span>
            ${hasPl?`<div class="info-note">Saved: ${pl.savedAt?new Date(pl.savedAt).toLocaleString('en-GB'):'—'}</div>`:''}
            ${!hasPl?'<div class="info-note">Upload via <a href="picklist.html" style="color:var(--accent)">Picklist Generator</a></div>':''}
        </div>`;


    // ── Specs pane ──
    if(hasPl && pl.specs) {
        const grp = defs => defs.map(def=>{
            const v = pl.specs[def.label]||'';
            const noteH = def.note?`<span class="spec-note"> (${def.note})</span>`:'';
            const unitH = (v&&def.unit)?`<span class="spec-unit">${def.unit}</span>`:'';
            return `<div class="spec-item ${v?'has-value':'no-value'}">
                <div class="spec-ref">${def.col}${def.row}</div>
                <div class="spec-label">${def.label}${noteH}</div>
                <div class="spec-value ${v?'':'empty-val'}">${v?esc(v)+unitH:'—'}</div>
            </div>`;
        }).join('');

        let specsHtml = `
            <div class="specs-section-title">${ICON('zap')}System configuration</div>
            <div class="specs-grid">${grp(SPECS_DEF.system)}</div>
            <div class="specs-section-title">${ICON('wrench')}Mounting &amp; hardware</div>
            <div class="specs-grid">${grp(SPECS_DEF.mounting)}</div>
            <div class="specs-section-title">${ICON('plug')}Electrical &amp; supply</div>
            <div class="specs-grid">${grp(SPECS_DEF.electrical)}</div>`;

        if(pl.mountCheck) {
            const mc = MOUNT_CHECK.map(def=>{
                const v = pl.mountCheck[def.label]||'';
                return `<div class="spec-item ${v?'has-value':'no-value'}">
                    <div class="spec-ref">${def.col}${def.row}</div>
                    <div class="spec-label">${def.label}</div>
                    <div class="spec-value ${v?'':'empty-val'}">${v?esc(v):'—'}</div>
                </div>`;
            }).join('');
            specsHtml += `<div class="specs-section-title">${ICON('check')}Mount system sense check</div>
                          <div class="specs-grid">${mc}</div>`;
        }

        // Roof map
        const flatArr = pl.panelFlat || (pl.panelGrid?pl.panelGrid.flat():null);
        const cols    = pl.panelCols || (pl.panelGrid?.[0]?.length)||0;
        if(flatArr && cols) {
            let pC=0, lC=0, cells='';
            flatArr.forEach(v=>{
                if(v==='P')pC++; if(v==='L')lC++;
                const cls=v==='P'?'p':v==='L'?'l':'e';
                cells+=`<div class="cell ${cls}">${v==='P'?'P':v==='L'?'L':''}</div>`;
            });
            if(pC||lC) specsHtml+=`
            <div class="roof-map-wrap">
                <div class="roof-map-hdr">
                    <h4>${ICON('home')}Roof panel layout</h4>
                    <div class="legend">
                        <div class="legend-item"><div class="swatch p"></div>Portrait</div>
                        <div class="legend-item"><div class="swatch l"></div>Landscape</div>
                        <div class="legend-item"><div class="swatch e"></div>Empty</div>
                    </div>
                </div>
                <div class="roof-grid-wrap">
                    <div class="roof-grid" style="grid-template-columns:repeat(${cols},28px)">${cells}</div>
                </div>
                <div class="roof-stats">
                    <div class="roof-stat"><span class="swatch p"></span>Portrait: <strong>${pC}</strong></div>
                    <div class="roof-stat"><span class="swatch l"></span>Landscape: <strong>${lC}</strong></div>
                    <div class="roof-stat">Total: <strong>${pC+lC}</strong></div>
                </div>
            </div>`;
        }

        document.getElementById('pane-specs').innerHTML = specsHtml;
    }

    // ── KF pane ──
    if(hasKf) {
        let totalQty=0;
        pl.kfPicklist.forEach(it=>{const q=parseFloat(it.qty);if(!isNaN(q))totalQty+=q;});
        const rows = pl.kfPicklist.map((it,i)=>`
            <tr>
                <td style="color:var(--text-dim);font-size:12px">${i+1}</td>
                <td><span class="kf-part-code">${esc(it.partCode)}</span></td>
                <td><span class="kf-qty">${esc(it.qty||'—')}</span></td>
            </tr>`).join('') +
            `<tr class="kf-total-row">
                <td></td>
                <td style="color:var(--text-dim)">Total qty</td>
                <td><span class="kf-qty">${totalQty}</span></td>
            </tr>`;
        document.getElementById('pane-kf').innerHTML=`
            <div class="kf-head">
                <span class="kf-head-title">${ICON('puzzle')}KF picklist</span>
                <span class="badge plain" style="--c:var(--kf)">${pl.kfPicklist.length} items</span>
            </div>
            <div class="kf-table-wrap">
                <table class="kf-table">
                    <thead><tr><th>#</th><th>Part Code</th><th>Quantity</th></tr></thead>
                    <tbody>${rows}</tbody>
                </table>
            </div>`;
    }

    switchTab('info');
    document.getElementById('detail-modal').classList.add('show');
}

function switchTab(tab) {
    document.querySelectorAll('.modal-tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.modal-pane').forEach(p=>p.classList.remove('active'));

    const map = {info:'pane-info', specs:'pane-specs', kf:'pane-kf'};
    const tabMap = {
        info:  document.querySelectorAll('.modal-tab')[0],
        specs: document.getElementById('tab-specs'),
        kf:    document.getElementById('tab-kf')
    };
    document.getElementById(map[tab]).classList.add('active');
    if(tabMap[tab]) tabMap[tab].classList.add('active');
}

function closeModal() { document.getElementById('detail-modal').classList.remove('show'); }
document.getElementById('detail-modal').addEventListener('click', e=>{
    if(e.target===document.getElementById('detail-modal')) closeModal();
});

// ── Utils ────────────────────────────────────────────────────────────
function esc(t) { const d=document.createElement('div'); d.textContent=String(t||''); return d.innerHTML; }

function showStatus(msg, type) {
    const el = document.getElementById('status-msg');
    el.textContent=msg; el.className=`status-msg ${type} show`;
    clearTimeout(window._st); window._st=setTimeout(()=>el.classList.remove('show'),5000);
}

// Expose globals
window.loadData       = loadData;
window.setFilter      = setFilter;
window.sortBy         = sortBy;
window.applyFilters   = applyFilters;
window.openJobDetail  = openJobDetail;
window.closeModal     = closeModal;
window.switchTab      = switchTab;
window.showStatus     = showStatus;
</script>
</body>
</html>
