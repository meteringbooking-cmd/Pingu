<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Figures | Pingu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* ═══ Pingu design system — base (copy verbatim into each page's <style>) ═══ */
        :root {
            /* Brand + status palette */
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --secondary: #FFC857;
            --accent: #00D9FF;
            --dark: #1A1A2E;
            --dark-light: #252541;
            --dark-lighter: #2F2F4A;
            --text: #EAEAEA;
            --text-dim: #9A9AB0;
            --success: #4ECCA3;
            --error: #FF6B6B;
            --warning: #FFC857;
            --in-progress: #00D9FF;
            --complete: #4ECCA3;
            --aborted: #FF6B6B;
            --cancelled: #9A9AB0;
            --short-notice: #90ee90;
            --on-hold: #FFDE00;
            --scheduled: #FF6B35;
            /* Surfaces & type */
            --bg: #161628;
            --surface: #1F1F35;
            --surface-2: #252541;
            --line: rgba(255,255,255,0.07);
            --line-2: rgba(255,255,255,0.12);
            --text-strong: #F4F4F8;
            --text-soft: #C8C8D6;
            --radius: 10px;
            --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: var(--font); font-size: 14px; line-height: 1.5;
            background: var(--bg); color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        button, input, select, textarea { font-family: inherit; }
        a { color: var(--accent); }
        .ico { width: 16px; height: 16px; flex: 0 0 auto; vertical-align: -3px; }
        .ico-lg { width: 20px; height: 20px; flex: 0 0 auto; }

        /* ── App bar + Pingu wordmark ── */
        .appbar {
            position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            height: 64px; padding: 0 28px;
            background: rgba(22, 22, 40, 0.92);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line);
        }
        .appbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .logo { display: inline-flex; align-items: center; text-decoration: none; }
        .wordmark {
            font-family: 'Inter', var(--font); font-weight: 800; font-size: 28px;
            letter-spacing: -0.045em; line-height: 1; color: var(--text-strong); padding-top: 6px;
        }
        .i-stem { position: relative; display: inline-block; }
        .i-paw {
            position: absolute; left: 50%; top: -0.17em; transform: translateX(-50%) rotate(-10deg);
            width: 0.5em; height: 0.5em; fill: var(--primary);
            filter: drop-shadow(0 1px 4px rgba(255,107,53,0.35));
            transition: transform .2s ease;
        }
        .logo:hover .i-paw { transform: translateX(-50%) rotate(4deg) scale(1.08); }
        .logo:hover .wordmark { color: #fff; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-soft); text-decoration: none; font-size: 13px; font-weight: 500;
            padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; cursor: pointer;
            transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .back-btn:hover { background: var(--surface-2); color: var(--text-strong); border-color: rgba(255,255,255,0.2); }

        /* ── Page layout ── */
        .container { padding: 24px 28px 40px; }
        .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
        h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-strong); line-height: 1.2; }
        h2 { font-size: 16px; font-weight: 600; color: var(--text-strong); letter-spacing: -0.01em; }
        h3 { font-size: 14px; font-weight: 600; color: var(--text-strong); }
        .muted { color: var(--text-dim); }
        .toolbar { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }

        /* ── Panels / cards ── */
        .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
        .panel + .panel { margin-top: 16px; }
        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -2px 0 14px; }
        .panel-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--text-strong); }
        .panel-title .ico { color: var(--primary); }

        /* ── Form controls ── */
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-label { color: var(--text-dim); font-size: 11.5px; font-weight: 500; }
        .control-input {
            height: 38px; background: var(--surface); border: 1px solid var(--line-2);
            color: var(--text-strong); padding: 0 12px; border-radius: 8px; font-size: 13.5px; width: 100%;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        textarea.control-input { height: auto; min-height: 84px; padding: 9px 11px; resize: vertical; }
        .control-input:hover { border-color: rgba(255,255,255,0.2); }
        .control-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.22); }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); cursor: pointer; }
        input[type="checkbox"], input[type="radio"] { accent-color: var(--primary); }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 7px;
            height: 38px; padding: 0 16px; border-radius: 8px; cursor: pointer;
            font-size: 13.5px; font-weight: 600; text-decoration: none; white-space: nowrap;
            border: 1px solid transparent; transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--surface-2); color: var(--text-strong); border-color: var(--line-2); }
        .btn-secondary:hover { background: var(--dark-lighter); border-color: rgba(255,255,255,0.25); }
        .btn-ghost { background: transparent; color: var(--text-soft); border-color: var(--line-2); }
        .btn-ghost:hover { background: var(--surface-2); color: var(--text-strong); }
        .btn-danger { background: rgba(255,107,107,0.12); color: #FF8A8A; border-color: rgba(255,107,107,0.4); }
        .btn-danger:hover { background: rgba(255,107,107,0.22); }
        .btn-success { background: rgba(78,204,163,0.14); color: var(--success); border-color: rgba(78,204,163,0.45); }
        .btn-success:hover { background: rgba(78,204,163,0.24); }
        .btn-sm { height: 32px; padding: 0 12px; font-size: 12.5px; }
        .btn:disabled, button:disabled { opacity: .45; cursor: not-allowed; }
        .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; height: 38px; }
        .seg button { background: var(--surface); color: var(--text-soft); border: 0; padding: 0 12px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .seg button + button { border-left: 1px solid var(--line-2); }
        .seg button:hover, .seg button.active { background: var(--surface-2); color: var(--text-strong); }

        /* ── KPI tiles ── */
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
        .stat-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; }
        .stat-label { display: flex; align-items: center; gap: 7px; color: var(--text-dim); font-size: 12px; font-weight: 500; white-space: nowrap; }
        .stat-label .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
        .stat-value { font-size: 22px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.02em; line-height: 1.25; margin-top: 2px; font-variant-numeric: tabular-nums; }

        /* ── Tables ── */
        .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
        thead th {
            position: sticky; top: 0; z-index: 2; background: var(--surface);
            text-align: left; padding: 10px 14px; font-size: 11.5px; font-weight: 600; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--line-2); white-space: nowrap;
        }
        tbody td { padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--text-soft); vertical-align: middle; }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover td { background: rgba(255,255,255,0.025); }
        td.strong, .cell-strong { color: var(--text-strong); font-weight: 600; }
        .mono { font-family: var(--mono); font-size: 12.5px; }

        /* ── Badges / status pills ── */
        .badge {
            --c: var(--text-dim);
            display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
            padding: 2px 9px; border-radius: 999px; color: var(--text-strong);
            background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
        }
        .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
        .badge.plain::before { display: none; }
        .tag { font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 4px; background: rgba(255,255,255,0.1); color: var(--text-soft); letter-spacing: .03em; }

        /* ── Notices ── */
        .notice { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 13px;
                  background: rgba(255,255,255,0.03); border: 1px solid var(--line-2); color: var(--text-soft); }
        .notice .ico { margin-top: 1px; }
        .notice.info    { border-color: rgba(0,217,255,0.35);  background: rgba(0,217,255,0.06); }
        .notice.success { border-color: rgba(78,204,163,0.4);  background: rgba(78,204,163,0.07); color: var(--success); }
        .notice.warning { border-color: rgba(255,200,87,0.4);  background: rgba(255,200,87,0.07); color: var(--warning); }
        .notice.error   { border-color: rgba(255,107,107,0.45); background: rgba(255,107,107,0.08); color: #FF8A8A; }

        /* ── Modals ── */
        .modal { display: none; position: fixed; inset: 0; background: rgba(10,10,22,0.72); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
        .modal.show, .modal.active, .modal.open { display: flex; }
        .modal-content { background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; width: 100%; max-width: 680px; max-height: 88vh; overflow-y: auto; box-shadow: 0 30px 80px -20px rgba(0,0,0,0.75); }
        .modal-header { position: sticky; top: 0; z-index: 2; background: var(--surface); display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
        .modal-title { font-size: 17px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.01em; }
        .modal-body { padding: 18px 20px 22px; }
        .close-btn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; border-radius: 8px; color: var(--text-dim); cursor: pointer; font-size: 20px; line-height: 1; }
        .close-btn:hover { background: var(--surface-2); color: var(--text-strong); }

        /* ── Feedback ── */
        .toast { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: none; max-width: 420px; padding: 12px 16px 12px 14px; border-radius: 10px;
                 background: #26263F; color: var(--text-strong); font-size: 13.5px; border: 1px solid var(--line-2); border-left: 3px solid var(--success);
                 box-shadow: 0 16px 40px -12px rgba(0,0,0,0.7); }
        .toast.show { display: block; }
        .toast.error { border-left-color: var(--error); }
        .empty-state, .loading { text-align: center; padding: 56px 16px; color: var(--text-dim); }
        .empty-state h3 { color: var(--text-strong); font-size: 16px; margin-bottom: 4px; }
        .empty-state .ico-lg { width: 32px; height: 32px; color: var(--text-dim); margin-bottom: 10px; }
        .spinner { width: 22px; height: 22px; border: 2px solid var(--line-2); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        *::-webkit-scrollbar { width: 10px; height: 10px; }
        *::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
        *::-webkit-scrollbar-track { background: transparent; }
        @media (max-width: 768px) {
            .appbar, .container { padding-left: 14px; padding-right: 14px; }
            .wordmark { font-size: 24px; }
        }
        /* ═══ end base ═══ */

        /* ═══ page ═══ */
        .stats-card { margin-bottom: 16px; }
        .stats-card .stats-row { margin-bottom: 0; grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 720px; }

        .jobs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(560px, 1fr)); gap: 16px; align-items: start; }

        .job-card {
            --c: var(--complete);
            background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c);
            border-radius: 12px; padding: 16px 18px 18px;
            transition: border-color .15s ease;
        }
        .job-card:hover { border-color: var(--line-2); border-left-color: var(--c); }
        .job-card.short-notice { --c: var(--short-notice); }

        .job-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
        .job-number { font-family: var(--mono); font-size: 16px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.01em; }

        .job-header {
            display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
            border: 1px solid var(--line); border-bottom: 0; border-radius: 10px; overflow: hidden; margin-bottom: 14px;
        }
        .job-detail { display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-width: 0; }
        .job-detail:nth-child(3n) { border-right: 0; }
        .job-detail.hide { display: none; }
        .detail-label { color: var(--text-dim); font-size: 11.5px; }
        .detail-value { color: var(--text-strong); font-weight: 500; font-size: 13px; overflow-wrap: anywhere; }

        .status-badge {
            --c: var(--complete);
            display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
            padding: 2px 9px; border-radius: 999px; color: var(--text-strong);
            background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
        }
        .status-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
        .status-badge.complete { --c: var(--complete); }
        .status-badge.short-notice { --c: var(--short-notice); }

        .notes-section { background: var(--bg); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; }
        .notes-header { display: flex; align-items: center; gap: 6px; color: var(--text-dim); font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
        .notes-content { color: var(--text-soft); font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }

        .figures-section { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 4px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-label { color: var(--text-dim); font-size: 11.5px; font-weight: 500; }
        .input-field {
            height: 38px; background: var(--surface); border: 1px solid var(--line-2); color: var(--text-strong);
            padding: 0 12px; border-radius: 8px; font-size: 13.5px; width: 100%;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        .input-field:hover { border-color: rgba(255,255,255,0.2); }
        .input-field:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.22); }

        .additional-costs { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
        .additional-costs-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
        .additional-costs-title { color: var(--text-strong); font-size: 13.5px; font-weight: 600; }
        .add-cost-btn {
            display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; cursor: pointer;
            font-size: 12.5px; font-weight: 600; background: transparent; color: var(--text-soft); border: 1px solid var(--line-2);
            transition: background .15s ease, color .15s ease;
        }
        .add-cost-btn:hover { background: var(--surface-2); color: var(--text-strong); }
        .no-costs { color: var(--text-dim); font-size: 12.5px; }
        .cost-item { display: grid; grid-template-columns: 1fr 160px 38px; gap: 8px; margin-bottom: 8px; }
        .remove-cost-btn {
            height: 38px; width: 38px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
            background: rgba(255,107,107,0.12); color: #FF8A8A; border: 1px solid rgba(255,107,107,0.4); border-radius: 8px;
            transition: background .15s ease;
        }
        .remove-cost-btn:hover { background: rgba(255,107,107,0.22); }

        .submit-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 40px; margin-top: 14px;
            background: var(--primary); color: #fff; border: 0; border-radius: 8px; cursor: pointer;
            font-size: 13.5px; font-weight: 600; transition: background .15s ease;
        }
        .submit-btn:hover { background: var(--primary-dark); }
        .submit-btn:disabled { background: var(--surface-2); color: var(--text-dim); }
        .submit-btn .jn { font-family: var(--mono); font-weight: 700; }

        .empty-state .ico-lg.ok { color: var(--success); }

        @media (max-width: 768px) {
            .jobs-grid { grid-template-columns: minmax(0, 1fr); }
            .stats-card .stats-row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
            .stat-label { white-space: normal; }
            .job-header { grid-template-columns: 1fr 1fr; }
            .job-detail:nth-child(3n) { border-right: 1px solid var(--line); }
            .job-detail:nth-child(2n) { border-right: 0; }
            .figures-section { grid-template-columns: 1fr; }
            .cost-item { grid-template-columns: 1fr 110px 38px; }
        }
    </style>
</head>

        <div class="stats-card">

        </div>
    </div>

    <script type="module">

        try {
            const app = initializeApp(firebaseConfig);
            window.db = getFirestore(app);
            window.firebaseModules = { collection, getDocs, query, where, doc, updateDoc };
            console.log('✅ Firebase initialized');
            
            window.addEventListener('DOMContentLoaded', () => {
                loadPendingJobs();
            });
        } catch (error) {
            console.error('❌ Firebase error:', error);
            document.getElementById('jobs-container').innerHTML =
                '<div class="empty-state">Firebase connection failed</div>';
        }
    </script>

    <script>
        let pendingJobs = [];
        const additionalCosts = {}; // Store additional costs per job

        async function loadPendingJobs() {
            try {
                const { collection, getDocs } = window.firebaseModules;
                
                const jobsQuery = collection(window.db, 'Solar-jobs');
                const querySnapshot = await getDocs(jobsQuery);
                
                pendingJobs = [];
                let completeCount = 0;
                let shortNoticeCount = 0;
                
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const status = data['Status Update'] || data['status'] || '';
                    
                    // Count all complete and short notice jobs
                    if (status === 'Complete') completeCount++;
                    if (status === 'Short Notice Cancellation') shortNoticeCount++;
                    
                    // Only include jobs that:
                    // 1. Have status Complete or Short Notice Cancellation
                    // 2. Don't have both invoiceLead AND invoiceOctopus filled
                    if ((status === 'Complete' || status === 'Short Notice Cancellation')) {
                        const hasInvoiceLead = data.invoiceLead !== undefined && data.invoiceLead !== null && data.invoiceLead !== '';
                        const hasInvoiceOctopus = data.invoiceOctopus !== undefined && data.invoiceOctopus !== null && data.invoiceOctopus !== '';
                        
                        // If both are missing, definitely include
                        // If one is missing, include
                        if (!hasInvoiceLead || !hasInvoiceOctopus) {
                            pendingJobs.push({
                                id: docSnap.id,
                                ...data
                            });
                        }
                    }
                });
                
                console.log(`✅ Found ${pendingJobs.length} jobs pending invoice submission`);
                console.log(`📊 Total Complete: ${completeCount}, Short Notice: ${shortNoticeCount}`);
                
                // Update stats
                document.getElementById('pending-count').textContent = pendingJobs.length;
                document.getElementById('complete-count').textContent = completeCount;
                document.getElementById('short-notice-count').textContent = shortNoticeCount;
                
                renderJobs();
                
            } catch (error) {
                console.error('Error loading jobs:', error);
                document.getElementById('jobs-container').innerHTML =
                    `<div class="empty-state">Error loading jobs: ${error.message}</div>`;
            }
        }

        function parseDate(dateStr) {
            if (!dateStr) return null;
            
            if (dateStr.includes('/')) {
                const parts = dateStr.split('/');
                if (parts.length === 3) {
                    const day = parseInt(parts[0], 10);
                    const month = parseInt(parts[1], 10) - 1;
                    const year = parseInt(parts[2], 10);
                    const parsed = new Date(year, month, day);
                    if (!isNaN(parsed.getTime())) {
                        return parsed;
                    }
                }
            }
            
            const parsed = new Date(dateStr);
            if (!isNaN(parsed.getTime())) {
                return parsed;
            }
            
            return null;
        }

        function formatDate(date) {
            if (!date) return 'N/A';
            const d = parseDate(date);
            if (!d) return date;
            
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            return `${day}/${month}/${year}`;
        }

        function renderJobs() {
            if (pendingJobs.length === 0) {
                document.getElementById('jobs-container').innerHTML = `
                    <div class="empty-state">
                        <svg class="ico-lg ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="m9 11 3 3L22 4"/></svg>
                        <h3>All caught up!</h3>
                        <p>No jobs pending invoice submission</p>
                    </div>
                `;
                return;
            }

            // Sort by date (most recent first)
            pendingJobs.sort((a, b) => {
                const dateA = parseDate(a['Booked Date']) || new Date(0);
                const dateB = parseDate(b['Booked Date']) || new Date(0);
                return dateB - dateA;
            });

            const html = `
                <div class="jobs-grid">
                    ${pendingJobs.map(job => renderJobCard(job)).join('')}
                </div>
            `;

            document.getElementById('jobs-container').innerHTML = html;

            // Initialize additional costs storage
            pendingJobs.forEach(job => {
                if (!additionalCosts[job.id]) {
                    additionalCosts[job.id] = [];
                }
            });
        }

        function renderJobCard(job) {
            const status = job['Status Update'] || job['status'] || 'Complete';
            const isShortNotice = status === 'Short Notice Cancellation';
            
            const jobNumber = job['Job Number'] || 'N/A';
            const bookedDate = formatDate(job['Booked Date']);
            const days = job['Days'] || job['Job Length (days)'] || job['jobLength'] || '1';
            const jobType = job['Job Type'] || 'Standard';
            const lead = job['Lead'] || job['Lead Engineer'] || job['engineer'] || 'Unassigned';
            const postcode = job['Postcode'] || 'N/A';
            
            // Dynamic Label Check
            const jobTypeLower = jobType.toLowerCase().trim();
            const isRevisit = ['aftercare', 'revisit', 'revisit chargeable'].includes(jobTypeLower);
            
            const dynamicLabel = isRevisit ? 'Chargeable' : 'Slate Roof';
            const dynamicValue = isRevisit ? job.isChargeable : job.slateRoof;

            // Handle the boolean or string "True"/"False" formatting
            let displayValue = 'N/A';
            if (dynamicValue !== undefined && dynamicValue !== null && dynamicValue !== '') {
                const valStr = String(dynamicValue).toLowerCase();
                if (valStr === 'true' || dynamicValue === true) {
                    displayValue = 'Yes';
                } else if (valStr === 'false' || dynamicValue === false) {
                    displayValue = 'No';
                } else {
                    displayValue = String(dynamicValue);
                }
            }

            return `
                <div class="job-card ${isShortNotice ? 'short-notice' : ''}" data-job-id="${job.id}">
                    <div class="job-top">
                        <div class="job-number">#${escapeHtml(jobNumber)}</div>
                        <span class="status-badge ${isShortNotice ? 'short-notice' : 'complete'}">${isShortNotice ? 'Short notice' : 'Complete'}</span>
                    </div>
                    <div class="job-header">
                        <div class="job-detail">
                            <div class="detail-label">Booked date</div>
                            <div class="detail-value">${bookedDate}</div>
                        </div>
                        <div class="job-detail">
                            <div class="detail-label">Days</div>
                            <div class="detail-value">${days}</div>
                        </div>
                        <div class="job-detail">
                            <div class="detail-label">Job type</div>
                            <div class="detail-value">${escapeHtml(jobType)}</div>
                        </div>
                        <div class="job-detail">
                            <div class="detail-label">Lead engineer</div>
                            <div class="detail-value">${escapeHtml(lead)}</div>
                        </div>
                        <div class="job-detail">
                            <div class="detail-label">Postcode</div>
                            <div class="detail-value">${escapeHtml(postcode)}</div>
                        </div>
                        <div class="job-detail">
                            <div class="detail-label">${escapeHtml(dynamicLabel)}</div>
                            <div class="detail-value">${escapeHtml(displayValue)}</div>
                        </div>
                    </div>

                    ${job.notes ? `
                    <div class="notes-section">
                        <div class="notes-header">Job notes</div>
                        <div class="notes-content">${escapeHtml(job.notes)}</div>
                    </div>
                    ` : ''}

                    <div class="figures-section">
                        <div class="input-group">
                            <label class="input-label" for="lead-${job.id}">Owed to lead (£)</label>
                            <input type="number" 
                                   class="input-field" 
                                   id="lead-${job.id}" 
                                   placeholder="0.00" 
                                   step="0.01" 
                                   min="0"
                                   value="${job.invoiceLead || ''}">
                        </div>
                        <div class="input-group">
                            <label class="input-label" for="octopus-${job.id}">Invoice to Octopus (£)</label>
                            <input type="number" 
                                   class="input-field" 
                                   id="octopus-${job.id}" 
                                   placeholder="0.00" 
                                   step="0.01" 
                                   min="0"
                                   value="${job.invoiceOctopus || ''}">
                        </div>
                    </div>

                    <div class="additional-costs">
                        <div class="additional-costs-header">
                            <div class="additional-costs-title">Additional costs</div>
                            <button class="add-cost-btn" onclick="addCostRow('${job.id}')"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add cost</button>
                        </div>
                        <div id="costs-container-${job.id}">
                            </div>
                    </div>

                    <button class="submit-btn" onclick="submitJobFigures('${job.id}')">
                        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>Submit figures for job <span class="jn">#${escapeHtml(jobNumber)}</span>
                    </button>
                </div>
            `;
        }

        window.addCostRow = function(jobId) {
            if (!additionalCosts[jobId]) {
                additionalCosts[jobId] = [];
            }

            const costId = `cost-${jobId}-${Date.now()}`;
            additionalCosts[jobId].push({ id: costId, type: '', value: 0 });

            renderCostRows(jobId);
        }

        window.removeCostRow = function(jobId, costId) {
            if (!additionalCosts[jobId]) return;

            additionalCosts[jobId] = additionalCosts[jobId].filter(cost => cost.id !== costId);
            renderCostRows(jobId);
        }

        function renderCostRows(jobId) {
            const container = document.getElementById(`costs-container-${jobId}`);
            if (!container) return;

            const costs = additionalCosts[jobId] || [];

            if (costs.length === 0) {
                container.innerHTML = '<p class="no-costs">No additional costs added</p>';
                return;
            }

            container.innerHTML = costs.map(cost => `
                <div class="cost-item">
                    <input type="text" 
                           class="input-field" 
                           placeholder="Cost Type (e.g., Materials, Travel)" 
                           value="${cost.type}"
                           onchange="updateCostType('${jobId}', '${cost.id}', this.value)">
                    <input type="number" 
                           class="input-field" 
                           placeholder="0.00" 
                           step="0.01" 
                           min="0"
                           value="${cost.value || ''}"
                           onchange="updateCostValue('${jobId}', '${cost.id}', this.value)">
                    <button class="remove-cost-btn" onclick="removeCostRow('${jobId}', '${cost.id}')" aria-label="Remove cost">
                        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
                    </button>
                </div>
            `).join('');
        }

        window.updateCostType = function(jobId, costId, value) {
            const cost = additionalCosts[jobId]?.find(c => c.id === costId);
            if (cost) {
                cost.type = value;
            }
        }

        window.updateCostValue = function(jobId, costId, value) {
            const cost = additionalCosts[jobId]?.find(c => c.id === costId);
            if (cost) {
                cost.value = parseFloat(value) || 0;
            }
        }

        window.submitJobFigures = async function(jobId) {
            const job = pendingJobs.find(j => j.id === jobId);
            if (!job) return;

            const leadInput = document.getElementById(`lead-${jobId}`).value;
            const octopusInput = document.getElementById(`octopus-${jobId}`).value;
            
            const invoiceLead = leadInput !== '' ? parseFloat(leadInput) : null;
            const invoiceOctopus = octopusInput !== '' ? parseFloat(octopusInput) : null;
            const costs = additionalCosts[jobId] || [];

            // Validate that at least one figure is entered (can be 0 or any positive number)
            if (invoiceLead === null && invoiceOctopus === null) {
                showToast('Please enter at least one invoice figure', 'error');
                return;
            }

            // Validate additional costs have both type and value
            const invalidCosts = costs.filter(cost => !cost.type.trim() || (cost.value === 0 && cost.value === ''));
            if (invalidCosts.length > 0) {
                showToast('Please complete all additional cost entries or remove them', 'error');
                return;
            }

            try {
                const { doc, updateDoc } = window.firebaseModules;
                const jobRef = doc(window.db, 'Solar-jobs', jobId);

                const updateData = {
                    invoiceSubmittedAt: new Date().toISOString()
                };

                // Only add fields that were actually filled in
                if (invoiceLead !== null) {
                    updateData.invoiceLead = invoiceLead;
                }
                if (invoiceOctopus !== null) {
                    updateData.invoiceOctopus = invoiceOctopus;
                }

                // Add additional costs if any
                if (costs.length > 0) {
                    updateData.additionalCosts = costs.map(cost => ({
                        type: cost.type,
                        value: cost.value
                    }));
                }

                await updateDoc(jobRef, updateData);

                const jobNumber = job['Job Number'] || 'N/A';
                showToast(`Figures submitted for Job #${jobNumber}`, 'success');

                // Remove this job from the list
                pendingJobs = pendingJobs.filter(j => j.id !== jobId);
                delete additionalCosts[jobId];

                // Update stats
                document.getElementById('pending-count').textContent = pendingJobs.length;

                // Re-render
                renderJobs();

            } catch (error) {
                console.error('Error submitting figures:', error);
                showToast('Failed to submit figures: ' + error.message, 'error');
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast show ${type === 'error' ? 'error' : ''}`;
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
