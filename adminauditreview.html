<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Follow-ups | Pingu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* ═══ Pingu design system — base (copy verbatim into each page's <style>) ═══ */
        :root {
            /* Brand + status palette */
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --secondary: #FFC857;
            --accent: #00D9FF;
            --dark: #1A1A2E;
            --dark-light: #252541;
            --dark-lighter: #2F2F4A;
            --text: #EAEAEA;
            --text-dim: #9A9AB0;
            --success: #4ECCA3;
            --error: #FF6B6B;
            --warning: #FFC857;
            --in-progress: #00D9FF;
            --complete: #4ECCA3;
            --aborted: #FF6B6B;
            --cancelled: #9A9AB0;
            --short-notice: #90ee90;
            --on-hold: #FFDE00;
            --scheduled: #FF6B35;
            /* Surfaces & type */
            --bg: #161628;
            --surface: #1F1F35;
            --surface-2: #252541;
            --line: rgba(255,255,255,0.07);
            --line-2: rgba(255,255,255,0.12);
            --text-strong: #F4F4F8;
            --text-soft: #C8C8D6;
            --radius: 10px;
            --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: var(--font); font-size: 14px; line-height: 1.5;
            background: var(--bg); color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        button, input, select, textarea { font-family: inherit; }
        a { color: var(--accent); }
        .ico { width: 16px; height: 16px; flex: 0 0 auto; vertical-align: -3px; }
        .ico-lg { width: 20px; height: 20px; flex: 0 0 auto; }

        /* ── App bar + Pingu wordmark ── */
        .appbar {
            position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            height: 64px; padding: 0 28px;
            background: rgba(22, 22, 40, 0.92);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line);
        }
        .appbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .logo { display: inline-flex; align-items: center; text-decoration: none; }
        .wordmark {
            font-family: 'Inter', var(--font); font-weight: 800; font-size: 28px;
            letter-spacing: -0.045em; line-height: 1; color: var(--text-strong); padding-top: 6px;
        }
        .i-stem { position: relative; display: inline-block; }
        .i-paw {
            position: absolute; left: 50%; top: -0.17em; transform: translateX(-50%) rotate(-10deg);
            width: 0.5em; height: 0.5em; fill: var(--primary);
            filter: drop-shadow(0 1px 4px rgba(255,107,53,0.35));
            transition: transform .2s ease;
        }
        .logo:hover .i-paw { transform: translateX(-50%) rotate(4deg) scale(1.08); }
        .logo:hover .wordmark { color: #fff; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-soft); text-decoration: none; font-size: 13px; font-weight: 500;
            padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; cursor: pointer;
            transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .back-btn:hover { background: var(--surface-2); color: var(--text-strong); border-color: rgba(255,255,255,0.2); }

        /* ── Page layout ── */
        .container { padding: 24px 28px 40px; }
        .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
        h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-strong); line-height: 1.2; }
        h2 { font-size: 16px; font-weight: 600; color: var(--text-strong); letter-spacing: -0.01em; }
        h3 { font-size: 14px; font-weight: 600; color: var(--text-strong); }
        .muted { color: var(--text-dim); }
        .toolbar { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }

        /* ── Panels / cards ── */
        .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
        .panel + .panel { margin-top: 16px; }
        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -2px 0 14px; }
        .panel-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--text-strong); }
        .panel-title .ico { color: var(--primary); }

        /* ── Form controls ── */
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-label { color: var(--text-dim); font-size: 11.5px; font-weight: 500; }
        .control-input {
            height: 38px; background: var(--surface); border: 1px solid var(--line-2);
            color: var(--text-strong); padding: 0 12px; border-radius: 8px; font-size: 13.5px; width: 100%;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        textarea.control-input { height: auto; min-height: 84px; padding: 9px 11px; resize: vertical; }
        .control-input:hover { border-color: rgba(255,255,255,0.2); }
        .control-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.22); }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); cursor: pointer; }
        input[type="checkbox"], input[type="radio"] { accent-color: var(--primary); }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 7px;
            height: 38px; padding: 0 16px; border-radius: 8px; cursor: pointer;
            font-size: 13.5px; font-weight: 600; text-decoration: none; white-space: nowrap;
            border: 1px solid transparent; transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--surface-2); color: var(--text-strong); border-color: var(--line-2); }
        .btn-secondary:hover { background: var(--dark-lighter); border-color: rgba(255,255,255,0.25); }
        .btn-ghost { background: transparent; color: var(--text-soft); border-color: var(--line-2); }
        .btn-ghost:hover { background: var(--surface-2); color: var(--text-strong); }
        .btn-danger { background: rgba(255,107,107,0.12); color: #FF8A8A; border-color: rgba(255,107,107,0.4); }
        .btn-danger:hover { background: rgba(255,107,107,0.22); }
        .btn-success { background: rgba(78,204,163,0.14); color: var(--success); border-color: rgba(78,204,163,0.45); }
        .btn-success:hover { background: rgba(78,204,163,0.24); }
        .btn-sm { height: 32px; padding: 0 12px; font-size: 12.5px; }
        .btn:disabled, button:disabled { opacity: .45; cursor: not-allowed; }
        .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; height: 38px; }
        .seg button { background: var(--surface); color: var(--text-soft); border: 0; padding: 0 12px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .seg button + button { border-left: 1px solid var(--line-2); }
        .seg button:hover, .seg button.active { background: var(--surface-2); color: var(--text-strong); }

        /* ── KPI tiles ── */
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
        .stat-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; }
        .stat-label { display: flex; align-items: center; gap: 7px; color: var(--text-dim); font-size: 12px; font-weight: 500; white-space: nowrap; }
        .stat-label .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
        .stat-value { font-size: 22px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.02em; line-height: 1.25; margin-top: 2px; font-variant-numeric: tabular-nums; }

        /* ── Tables ── */
        .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
        thead th {
            position: sticky; top: 0; z-index: 2; background: var(--surface);
            text-align: left; padding: 10px 14px; font-size: 11.5px; font-weight: 600; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--line-2); white-space: nowrap;
        }
        tbody td { padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--text-soft); vertical-align: middle; }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover td { background: rgba(255,255,255,0.025); }
        td.strong, .cell-strong { color: var(--text-strong); font-weight: 600; }
        .mono { font-family: var(--mono); font-size: 12.5px; }

        /* ── Badges / status pills ── */
        .badge {
            --c: var(--text-dim);
            display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
            padding: 2px 9px; border-radius: 999px; color: var(--text-strong);
            background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
        }
        .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
        .badge.plain::before { display: none; }
        .tag { font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 4px; background: rgba(255,255,255,0.1); color: var(--text-soft); letter-spacing: .03em; }

        /* ── Notices ── */
        .notice { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 13px;
                  background: rgba(255,255,255,0.03); border: 1px solid var(--line-2); color: var(--text-soft); }
        .notice .ico { margin-top: 1px; }
        .notice.info    { border-color: rgba(0,217,255,0.35);  background: rgba(0,217,255,0.06); }
        .notice.success { border-color: rgba(78,204,163,0.4);  background: rgba(78,204,163,0.07); color: var(--success); }
        .notice.warning { border-color: rgba(255,200,87,0.4);  background: rgba(255,200,87,0.07); color: var(--warning); }
        .notice.error   { border-color: rgba(255,107,107,0.45); background: rgba(255,107,107,0.08); color: #FF8A8A; }

        /* ── Modals ── */
        .modal { display: none; position: fixed; inset: 0; background: rgba(10,10,22,0.72); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
        .modal.show, .modal.active, .modal.open { display: flex; }
        .modal-content { background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; width: 100%; max-width: 680px; max-height: 88vh; overflow-y: auto; box-shadow: 0 30px 80px -20px rgba(0,0,0,0.75); }
        .modal-header { position: sticky; top: 0; z-index: 2; background: var(--surface); display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
        .modal-title { font-size: 17px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.01em; }
        .modal-body { padding: 18px 20px 22px; }
        .close-btn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; border-radius: 8px; color: var(--text-dim); cursor: pointer; font-size: 20px; line-height: 1; }
        .close-btn:hover { background: var(--surface-2); color: var(--text-strong); }

        /* ── Feedback ── */
        .toast { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: none; max-width: 420px; padding: 12px 16px 12px 14px; border-radius: 10px;
                 background: #26263F; color: var(--text-strong); font-size: 13.5px; border: 1px solid var(--line-2); border-left: 3px solid var(--success);
                 box-shadow: 0 16px 40px -12px rgba(0,0,0,0.7); }
        .toast.show { display: block; }
        .toast.error { border-left-color: var(--error); }
        .empty-state, .loading { text-align: center; padding: 56px 16px; color: var(--text-dim); }
        .empty-state h3 { color: var(--text-strong); font-size: 16px; margin-bottom: 4px; }
        .empty-state .ico-lg { width: 32px; height: 32px; color: var(--text-dim); margin-bottom: 10px; }
        .spinner { width: 22px; height: 22px; border: 2px solid var(--line-2); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        *::-webkit-scrollbar { width: 10px; height: 10px; }
        *::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
        *::-webkit-scrollbar-track { background: transparent; }
        @media (max-width: 768px) {
            .appbar, .container { padding-left: 14px; padding-right: 14px; }
            .wordmark { font-size: 24px; }
        }
        /* ═══ end base ═══ */

        :root { --o-safety: #FF6B6B; --o-policy: #FFC857; --o-pnc: #00D9FF; }
        .stats-row { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .stat-item.clickable { cursor: pointer; transition: border-color .15s ease; }
        .stat-item.clickable:hover, .stat-item.active { border-color: rgba(255,107,53,0.55); }
        .filters { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 14px; }
        .filters .control-group { min-width: 220px; }
        .job-no { font-family: var(--mono); font-weight: 700; color: var(--text-strong); font-size: 12.5px; white-space: nowrap; }
        .sub { display: block; color: var(--text-dim); font-size: 12px; margin-top: 2px; }
        .photo-cell { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .new-pill { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; padding: 2px 7px; border-radius: 999px; background: rgba(78,204,163,0.18); color: var(--success); border: 1px solid rgba(78,204,163,0.45); }
        .row-actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
        tr.is-new td:first-child { box-shadow: inset 3px 0 0 var(--success); }
        tr.is-nfa td { opacity: .62; }
        tr.is-nfa:hover td { opacity: 1; }
        .age-warn { color: var(--warning); }
        .age-bad { color: #FF8A8A; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
        .gallery a { display: block; aspect-ratio: 4/3; border-radius: 8px; overflow: hidden; border: 1px solid var(--line-2); background: var(--bg); position: relative; }
        .gallery img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .gallery a.after::after { content: "New"; position: absolute; top: 6px; left: 6px; font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--success); color: #10241d; }
        .field { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
        .meta-grid { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; font-size: 13px; margin-bottom: 4px; }
        .meta-grid div:nth-child(odd) { color: var(--text-dim); }
        .meta-grid div:nth-child(even) { color: var(--text-strong); }
        @media (max-width: 900px) { .stats-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    </style>
</head>
<body>
    <header class="appbar">
        <a href="index.html" class="logo" aria-label="Pingu home">
            <span class="wordmark">P<span class="i-stem">ı<svg class="i-paw" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="16.2" rx="5.6" ry="4.6"/><ellipse cx="4.6" cy="10.4" rx="2.2" ry="2.7" transform="rotate(-18 4.6 10.4)"/><ellipse cx="9.2" cy="5.6" rx="2.3" ry="2.9" transform="rotate(-6 9.2 5.6)"/><ellipse cx="14.8" cy="5.6" rx="2.3" ry="2.9" transform="rotate(6 14.8 5.6)"/><ellipse cx="19.4" cy="10.4" rx="2.2" ry="2.7" transform="rotate(18 19.4 10.4)"/></svg></span>ngu</span>
        </a>
        <div class="appbar-actions">
            <button class="btn btn-secondary" onclick="loadJobs()">
                <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
                Refresh
            </button>
            <a href="adminaudit.html" class="back-btn"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Back to Audits</a>
        </div>
    </header>

    <div class="container">
        <div class="page-head"><h1>Audit follow-ups</h1></div>

        <div class="stats-row">
            <div class="stat-item clickable" data-filter="awaiting" onclick="setFilter('awaiting')"><div class="stat-label"><span class="dot" style="background:var(--warning)"></span>Awaiting photos</div><div class="stat-value" id="stat-awaiting">0</div></div>
            <div class="stat-item clickable" data-filter="received" onclick="setFilter('received')"><div class="stat-label"><span class="dot" style="background:var(--success)"></span>New photos to review</div><div class="stat-value" id="stat-received">0</div></div>
            <div class="stat-item clickable" data-filter="nfa" onclick="setFilter('nfa')"><div class="stat-label"><span class="dot" style="background:var(--cancelled)"></span>No further action</div><div class="stat-value" id="stat-nfa">0</div></div>
            <div class="stat-item clickable" data-filter="all" onclick="setFilter('all')"><div class="stat-label">All emailed (not a pass)</div><div class="stat-value" id="stat-all">0</div></div>
        </div>

        <div class="filters">
            <div class="control-group">
                <label class="control-label" for="search">Search</label>
                <input id="search" class="control-input" placeholder="Job number, postcode or engineer" oninput="render()">
            </div>
            <div class="control-group" style="min-width:180px">
                <label class="control-label" for="outcome-filter">Outcome</label>
                <select id="outcome-filter" class="control-input" onchange="render()">
                    <option value="">All outcomes</option>
                    <option value="safety">Safety Fail</option>
                    <option value="policy">Policy Fail</option>
                    <option value="pnc">Pass with non-conformances</option>
                </select>
            </div>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Job</th>
                        <th>Engineer</th>
                        <th>Outcome</th>
                        <th>Email sent</th>
                        <th>Photos since email</th>
                        <th>Status</th>
                        <th style="text-align:right">Actions</th>
                    </tr>
                </thead>
                <tbody id="rows"><tr><td colspan="7"><div class="loading">Loading audits&hellip;</div></td></tr></tbody>
            </table>
        </div>
    </div>

    <div class="modal" id="photos-modal">
        <div class="modal-content" style="max-width: 860px;">
            <div class="modal-header">
                <h2 class="modal-title" id="photos-title">Engineer photos</h2>
                <button class="close-btn" onclick="closeModal('photos-modal')" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="meta-grid" id="photos-meta"></div>
                <div class="gallery" id="gallery" style="margin-top:14px"></div>
            </div>
        </div>
    </div>

    <div class="modal" id="nfa-modal">
        <div class="modal-content" style="max-width: 480px;">
            <div class="modal-header">
                <h2 class="modal-title">No further action</h2>
                <button class="close-btn" onclick="closeModal('nfa-modal')" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
                <p class="muted" id="nfa-text"></p>
                <div class="field">
                    <label class="control-label" for="nfa-note">Note (optional)</label>
                    <textarea id="nfa-note" class="control-input" placeholder="e.g. Photos received and checked, issue resolved"></textarea>
                </div>
                <div class="modal-actions">
                    <button class="btn btn-ghost" onclick="closeModal('nfa-modal')">Cancel</button>
                    <button class="btn btn-primary" id="nfa-confirm" onclick="confirmNfa()">Mark no further action</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let jobs = [];
        let filter = 'open';
        let pendingNfaId = null;
        const NOT_SENT = 'Saved Only - Not Sent';

        const esc = t => { const d = document.createElement('div'); d.textContent = String(t ?? ''); return d.innerHTML; };
        const fmtDate = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }); };
        const fmtDateTime = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); };
        const daysSince = iso => Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
        const adminName = () => { try { return JSON.parse(localStorage.getItem('adminSession') || '{}').name || ''; } catch (e) { return ''; } };

        function outcomeKey(outcome, status) {
            const o = String(outcome || '').toLowerCase();
            if (o.includes('safety')) return 'safety';
            if (o.includes('policy')) return 'policy';
            if (o.includes('non-conformance') || o.includes('pnc')) return 'pnc';
            if (o.startsWith('pass')) return 'pass';
            const s = String(status || '').toLowerCase();
            if (s === 'safety-fail') return 'safety';
            if (s === 'policy-fail') return 'policy';
            if (s === 'pnc') return 'pnc';
            return o ? 'other' : '';
        }
        const OUTCOME_LABEL = { safety: ['Safety Fail', 'var(--o-safety)'], policy: ['Policy Fail', 'var(--o-policy)'], pnc: ['Pass with non-conformances', 'var(--o-pnc)'], other: ['Not a pass', 'var(--text-dim)'] };

        window.loadJobs = async function () {
            const { collection, getDocs } = window.fb;
            document.getElementById('rows').innerHTML = '<tr><td colspan="7"><div class="loading">Loading audits&hellip;</div></td></tr>';
            try {
                const snap = await getDocs(collection(window.db, 'Solar-jobs'));
                jobs = [];
                snap.forEach(d => {
                    const x = d.data();
                    const sentTo = x.auditEmailSentTo || x.checklistSentTo || '';
                    const sentAt = x.auditEmailSentAt || ((x.checklistSentTo && x.checklistSentTo !== NOT_SENT) ? x.checklistSentAt : null);
                    if (!sentAt) return;
                    const outcome = x.auditEmailOutcome || x.auditChecklistOutcome || '';
                    const key = outcomeKey(outcome, x.auditStatus);
                    if (!key || key === 'pass') return;
                    const photos = Array.isArray(x.engineerPhotos) ? x.engineerPhotos : [];
                    const baseline = typeof x.photosAtEmail === 'number' ? x.photosAtEmail : null;
                    const sinceEmail = baseline === null ? photos.length : Math.max(0, photos.length - baseline);
                    const lastUpload = x.engineerPhotosUpdatedAt || null;
                    const reviewed = x.auditReviewStatus === 'no-further-action';
                    // "New" = photos arrived after the email and after the last review (if any)
                    const uploadedAfterReview = lastUpload && x.auditReviewedAt ? new Date(lastUpload) > new Date(x.auditReviewedAt) : true;
                    const hasNew = sinceEmail > 0 && (!reviewed ? true : uploadedAfterReview && !!lastUpload);
                    jobs.push({
                        id: d.id, data: x, jobNumber: String(x['Job Number'] || 'N/A'),
                        address: x['Address'] || x['1st line of address'] || '', postcode: x['Postcode'] || '',
                        engineer: x['Lead Engineer'] || x['Lead'] || 'Unassigned', jobType: x['Job Type'] || '',
                        outcome, key, sentAt, sentTo, legacy: !x.auditEmailSentAt,
                        photos, baseline, sinceEmail, lastUpload, reviewed, hasNew,
                        reviewedAt: x.auditReviewedAt || '', reviewedBy: x.auditReviewedBy || '', reviewNote: x.auditReviewNote || ''
                    });
                });
                jobs.sort((a, b) => (b.hasNew - a.hasNew) || (new Date(a.sentAt) - new Date(b.sentAt)));
                render();
            } catch (e) {
                document.getElementById('rows').innerHTML = `<tr><td colspan="7"><div class="empty-state"><h3>Could not load audits</h3><p>${esc(e.message)}</p></div></td></tr>`;
            }
        };

        function bucket(j) { return j.reviewed && !j.hasNew ? 'nfa' : (j.hasNew ? 'received' : 'awaiting'); }

        window.setFilter = function (f) { filter = (filter === f && f !== 'all') ? 'open' : f; render(); };

        window.render = function () {
            const q = document.getElementById('search').value.trim().toLowerCase();
            const oc = document.getElementById('outcome-filter').value;
            const counts = { awaiting: 0, received: 0, nfa: 0 };
            jobs.forEach(j => counts[bucket(j)]++);
            document.getElementById('stat-awaiting').textContent = counts.awaiting;
            document.getElementById('stat-received').textContent = counts.received;
            document.getElementById('stat-nfa').textContent = counts.nfa;
            document.getElementById('stat-all').textContent = jobs.length;
            document.querySelectorAll('.stat-item[data-filter]').forEach(el => el.classList.toggle('active', el.dataset.filter === filter));

            const list = jobs.filter(j => {
                const b = bucket(j);
                if (filter === 'open' && b === 'nfa') return false;
                if (['awaiting', 'received', 'nfa'].includes(filter) && b !== filter) return false;
                if (oc && j.key !== oc) return false;
                if (q && !`${j.jobNumber} ${j.postcode} ${j.engineer} ${j.address}`.toLowerCase().includes(q)) return false;
                return true;
            });

            const tbody = document.getElementById('rows');
            if (!list.length) {
                tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><h3>Nothing to show</h3><p>${jobs.length ? 'No audits match this view.' : 'No emailed audits that need follow-up yet.'}</p></div></td></tr>`;
                return;
            }
            tbody.innerHTML = list.map(j => {
                const b = bucket(j);
                const [olabel, ocol] = OUTCOME_LABEL[j.key] || OUTCOME_LABEL.other;
                const age = daysSince(j.sentAt);
                const ageCls = b === 'awaiting' ? (age > 14 ? 'age-bad' : age > 7 ? 'age-warn' : '') : '';
                const status = b === 'nfa'
                    ? `<span class="badge" style="--c:var(--cancelled)">No further action</span><span class="sub">${esc(fmtDate(j.reviewedAt))}${j.reviewedBy ? ' &middot; ' + esc(j.reviewedBy) : ''}</span>`
                    : b === 'received'
                        ? `<span class="badge" style="--c:var(--success)">Photos received</span>${j.reviewed ? '<span class="sub">New photos since review</span>' : ''}`
                        : `<span class="badge" style="--c:var(--warning)">Awaiting photos</span>`;
                const photoTxt = j.sinceEmail > 0
                    ? `<span class="cell-strong">${j.sinceEmail}</span>${j.baseline === null ? '<span class="sub">total uploaded</span>' : ''}${j.hasNew ? ' <span class="new-pill">NEW</span>' : ''}`
                    : '<span class="muted">None yet</span>';
                return `<tr class="${j.hasNew ? 'is-new' : ''} ${b === 'nfa' ? 'is-nfa' : ''}">
                    <td><span class="job-no">${esc(j.jobNumber)}</span><span class="sub">${esc([j.address, j.postcode].filter(Boolean).join(', '))}</span></td>
                    <td><span class="cell-strong">${esc(j.engineer)}</span><span class="sub">${esc(j.jobType)}</span></td>
                    <td><span class="badge" style="--c:${ocol}">${esc(olabel)}</span></td>
                    <td><span class="cell-strong">${esc(fmtDate(j.sentAt))}</span><span class="sub ${ageCls}">${age === 0 ? 'Today' : age + ' day' + (age === 1 ? '' : 's') + ' ago'}${j.legacy ? ' &middot; approx.' : ''}</span></td>
                    <td><div class="photo-cell">${photoTxt}</div>${j.lastUpload ? `<span class="sub">Last upload ${esc(fmtDateTime(j.lastUpload))}</span>` : ''}</td>
                    <td>${status}</td>
                    <td><div class="row-actions">
                        <button class="btn btn-secondary btn-sm" onclick="showPhotos('${j.id}')" ${j.photos.length ? '' : 'disabled'}>View photos</button>
                        <button class="btn btn-ghost btn-sm" onclick="copyLink('${j.id}')" title="Copy the engineer's photo upload link">Copy upload link</button>
                        ${b === 'nfa'
                            ? `<button class="btn btn-ghost btn-sm" onclick="reopen('${j.id}')">Reopen</button>`
                            : `<button class="btn btn-primary btn-sm" onclick="openNfa('${j.id}')">No further action</button>`}
                    </div></td>
                </tr>`;
            }).join('');
        };

        window.showPhotos = function (id) {
            const j = jobs.find(x => x.id === id); if (!j) return;
            document.getElementById('photos-title').textContent = `Engineer photos - ${j.jobNumber}`;
            document.getElementById('photos-meta').innerHTML = `
                <div>Email sent</div><div>${esc(fmtDateTime(j.sentAt))}${j.legacy ? ' (approx.)' : ''}</div>
                <div>Sent to</div><div>${esc(j.sentTo)}</div>
                <div>Photos</div><div>${j.photos.length} total${j.baseline !== null ? `, ${j.sinceEmail} since the email` : ''}</div>
                ${j.reviewNote ? `<div>Review note</div><div>${esc(j.reviewNote)}</div>` : ''}`;
            document.getElementById('gallery').innerHTML = j.photos.map((url, i) => {
                const after = j.baseline !== null && i >= j.baseline;
                return `<a href="${esc(url)}" target="_blank" rel="noopener" class="${after ? 'after' : ''}"><img src="${esc(url)}" alt="Photo ${i + 1}" loading="lazy"></a>`;
            }).join('') || '<p class="muted">No photos uploaded.</p>';
            document.getElementById('photos-modal').classList.add('show');
        };

        window.copyLink = async function (id) {
            const j = jobs.find(x => x.id === id); if (!j) return;
            const base = window.location.origin + window.location.pathname.replace(/[^/]*$/, '');
            const link = `${base}engineer-photo-upload.html?job=${encodeURIComponent(j.jobNumber)}`;
            try { await navigator.clipboard.writeText(link); showToast('Upload link copied'); }
            catch (e) { window.prompt('Copy the upload link:', link); }
        };

        window.openNfa = function (id) {
            const j = jobs.find(x => x.id === id); if (!j) return;
            pendingNfaId = id;
            document.getElementById('nfa-text').textContent = `Close job ${j.jobNumber} as needing no further action. It moves to the "No further action" list and comes back automatically if the engineer uploads more photos.`;
            document.getElementById('nfa-note').value = '';
            document.getElementById('nfa-modal').classList.add('show');
        };

        window.confirmNfa = async function () {
            const j = jobs.find(x => x.id === pendingNfaId); if (!j) return;
            const btn = document.getElementById('nfa-confirm'); btn.disabled = true;
            const update = {
                auditReviewStatus: 'no-further-action',
                auditReviewedAt: new Date().toISOString(),
                auditReviewedBy: adminName(),
                auditReviewNote: document.getElementById('nfa-note').value.trim()
            };
            try {
                await window.fb.updateDoc(window.fb.doc(window.db, 'Solar-jobs', j.id), update);
                Object.assign(j, { reviewed: true, hasNew: false, reviewedAt: update.auditReviewedAt, reviewedBy: update.auditReviewedBy, reviewNote: update.auditReviewNote });
                closeModal('nfa-modal'); render(); showToast(`Job ${j.jobNumber} marked as no further action`);
            } catch (e) { showToast('Could not save: ' + e.message, 'error'); }
            btn.disabled = false;
        };

        window.reopen = async function (id) {
            const j = jobs.find(x => x.id === id); if (!j) return;
            try {
                await window.fb.updateDoc(window.fb.doc(window.db, 'Solar-jobs', j.id), { auditReviewStatus: 'open' });
                j.reviewed = false; j.hasNew = j.sinceEmail > 0;
                render(); showToast(`Job ${j.jobNumber} reopened`);
            } catch (e) { showToast('Could not save: ' + e.message, 'error'); }
        };

        window.closeModal = id => document.getElementById(id).classList.remove('show');
        document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); }));

        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg; t.className = `toast show ${type === 'error' ? 'error' : ''}`;
            setTimeout(() => t.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
