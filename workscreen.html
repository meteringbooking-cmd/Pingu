<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workscreen | Pingu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* ═══ Pingu design system — base (copy verbatim into each page's <style>) ═══ */
        :root {
            /* Brand + status palette */
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --secondary: #FFC857;
            --accent: #00D9FF;
            --dark: #1A1A2E;
            --dark-light: #252541;
            --dark-lighter: #2F2F4A;
            --text: #EAEAEA;
            --text-dim: #9A9AB0;
            --success: #4ECCA3;
            --error: #FF6B6B;
            --warning: #FFC857;
            --in-progress: #00D9FF;
            --complete: #4ECCA3;
            --aborted: #FF6B6B;
            --cancelled: #9A9AB0;
            --short-notice: #90ee90;
            --on-hold: #FFDE00;
            --scheduled: #FF6B35;
            /* Surfaces & type */
            --bg: #161628;
            --surface: #1F1F35;
            --surface-2: #252541;
            --line: rgba(255,255,255,0.07);
            --line-2: rgba(255,255,255,0.12);
            --text-strong: #F4F4F8;
            --text-soft: #C8C8D6;
            --radius: 10px;
            --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: var(--font); font-size: 14px; line-height: 1.5;
            background: var(--bg); color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        button, input, select, textarea { font-family: inherit; }
        a { color: var(--accent); }
        .ico { width: 16px; height: 16px; flex: 0 0 auto; vertical-align: -3px; }
        .ico-lg { width: 20px; height: 20px; flex: 0 0 auto; }

        /* ── App bar + Pingu wordmark ── */
        .appbar {
            position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            height: 64px; padding: 0 28px;
            background: rgba(22, 22, 40, 0.92);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line);
        }
        .appbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .logo { display: inline-flex; align-items: center; text-decoration: none; }
        .wordmark {
            font-family: 'Inter', var(--font); font-weight: 800; font-size: 28px;
            letter-spacing: -0.045em; line-height: 1; color: var(--text-strong); padding-top: 6px;
        }
        .i-stem { position: relative; display: inline-block; }
        .i-paw {
            position: absolute; left: 50%; top: -0.17em; transform: translateX(-50%) rotate(-10deg);
            width: 0.5em; height: 0.5em; fill: var(--primary);
            filter: drop-shadow(0 1px 4px rgba(255,107,53,0.35));
            transition: transform .2s ease;
        }
        .logo:hover .i-paw { transform: translateX(-50%) rotate(4deg) scale(1.08); }
        .logo:hover .wordmark { color: #fff; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-soft); text-decoration: none; font-size: 13px; font-weight: 500;
            padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; cursor: pointer;
            transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .back-btn:hover { background: var(--surface-2); color: var(--text-strong); border-color: rgba(255,255,255,0.2); }

        /* ── Page layout ── */
        .container { padding: 24px 28px 40px; }
        .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
        h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-strong); line-height: 1.2; }
        h2 { font-size: 16px; font-weight: 600; color: var(--text-strong); letter-spacing: -0.01em; }
        h3 { font-size: 14px; font-weight: 600; color: var(--text-strong); }
        .muted { color: var(--text-dim); }
        .toolbar { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }

        /* ── Panels / cards ── */
        .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
        .panel + .panel { margin-top: 16px; }
        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -2px 0 14px; }
        .panel-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--text-strong); }
        .panel-title .ico { color: var(--primary); }

        /* ── Form controls ── */
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-label { color: var(--text-dim); font-size: 11.5px; font-weight: 500; }
        .control-input {
            height: 38px; background: var(--surface); border: 1px solid var(--line-2);
            color: var(--text-strong); padding: 0 12px; border-radius: 8px; font-size: 13.5px; width: 100%;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        textarea.control-input { height: auto; min-height: 84px; padding: 9px 11px; resize: vertical; }
        .control-input:hover { border-color: rgba(255,255,255,0.2); }
        .control-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.22); }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); cursor: pointer; }
        input[type="checkbox"], input[type="radio"] { accent-color: var(--primary); }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 7px;
            height: 38px; padding: 0 16px; border-radius: 8px; cursor: pointer;
            font-size: 13.5px; font-weight: 600; text-decoration: none; white-space: nowrap;
            border: 1px solid transparent; transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--surface-2); color: var(--text-strong); border-color: var(--line-2); }
        .btn-secondary:hover { background: var(--dark-lighter); border-color: rgba(255,255,255,0.25); }
        .btn-ghost { background: transparent; color: var(--text-soft); border-color: var(--line-2); }
        .btn-ghost:hover { background: var(--surface-2); color: var(--text-strong); }
        .btn-danger { background: rgba(255,107,107,0.12); color: #FF8A8A; border-color: rgba(255,107,107,0.4); }
        .btn-danger:hover { background: rgba(255,107,107,0.22); }
        .btn-success { background: rgba(78,204,163,0.14); color: var(--success); border-color: rgba(78,204,163,0.45); }
        .btn-success:hover { background: rgba(78,204,163,0.24); }
        .btn-sm { height: 32px; padding: 0 12px; font-size: 12.5px; }
        .btn:disabled, button:disabled { opacity: .45; cursor: not-allowed; }
        .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; height: 38px; }
        .seg button { background: var(--surface); color: var(--text-soft); border: 0; padding: 0 12px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .seg button + button { border-left: 1px solid var(--line-2); }
        .seg button:hover, .seg button.active { background: var(--surface-2); color: var(--text-strong); }

        /* ── KPI tiles ── */
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
        .stat-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; }
        .stat-label { display: flex; align-items: center; gap: 7px; color: var(--text-dim); font-size: 12px; font-weight: 500; white-space: nowrap; }
        .stat-label .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
        .stat-value { font-size: 22px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.02em; line-height: 1.25; margin-top: 2px; font-variant-numeric: tabular-nums; }

        /* ── Tables ── */
        .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
        thead th {
            position: sticky; top: 0; z-index: 2; background: var(--surface);
            text-align: left; padding: 10px 14px; font-size: 11.5px; font-weight: 600; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--line-2); white-space: nowrap;
        }
        tbody td { padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--text-soft); vertical-align: middle; }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover td { background: rgba(255,255,255,0.025); }
        td.strong, .cell-strong { color: var(--text-strong); font-weight: 600; }
        .mono { font-family: var(--mono); font-size: 12.5px; }

        /* ── Badges / status pills ── */
        .badge {
            --c: var(--text-dim);
            display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
            padding: 2px 9px; border-radius: 999px; color: var(--text-strong);
            background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
        }
        .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
        .badge.plain::before { display: none; }
        .tag { font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 4px; background: rgba(255,255,255,0.1); color: var(--text-soft); letter-spacing: .03em; }

        /* ── Notices ── */
        .notice { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 13px;
                  background: rgba(255,255,255,0.03); border: 1px solid var(--line-2); color: var(--text-soft); }
        .notice .ico { margin-top: 1px; }
        .notice.info    { border-color: rgba(0,217,255,0.35);  background: rgba(0,217,255,0.06); }
        .notice.success { border-color: rgba(78,204,163,0.4);  background: rgba(78,204,163,0.07); color: var(--success); }
        .notice.warning { border-color: rgba(255,200,87,0.4);  background: rgba(255,200,87,0.07); color: var(--warning); }
        .notice.error   { border-color: rgba(255,107,107,0.45); background: rgba(255,107,107,0.08); color: #FF8A8A; }

        /* ── Modals ── */
        .modal { display: none; position: fixed; inset: 0; background: rgba(10,10,22,0.72); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
        .modal.show, .modal.active, .modal.open { display: flex; }
        .modal-content { background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; width: 100%; max-width: 680px; max-height: 88vh; overflow-y: auto; box-shadow: 0 30px 80px -20px rgba(0,0,0,0.75); }
        .modal-header { position: sticky; top: 0; z-index: 2; background: var(--surface); display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
        .modal-title { font-size: 17px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.01em; }
        .modal-body { padding: 18px 20px 22px; }
        .close-btn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; border-radius: 8px; color: var(--text-dim); cursor: pointer; font-size: 20px; line-height: 1; }
        .close-btn:hover { background: var(--surface-2); color: var(--text-strong); }

        /* ── Feedback ── */
        .toast { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: none; max-width: 420px; padding: 12px 16px 12px 14px; border-radius: 10px;
                 background: #26263F; color: var(--text-strong); font-size: 13.5px; border: 1px solid var(--line-2); border-left: 3px solid var(--success);
                 box-shadow: 0 16px 40px -12px rgba(0,0,0,0.7); }
        .toast.show { display: block; }
        .toast.error { border-left-color: var(--error); }
        .empty-state, .loading { text-align: center; padding: 56px 16px; color: var(--text-dim); }
        .empty-state h3 { color: var(--text-strong); font-size: 16px; margin-bottom: 4px; }
        .empty-state .ico-lg { width: 32px; height: 32px; color: var(--text-dim); margin-bottom: 10px; }
        .spinner { width: 22px; height: 22px; border: 2px solid var(--line-2); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        *::-webkit-scrollbar { width: 10px; height: 10px; }
        *::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
        *::-webkit-scrollbar-track { background: transparent; }
        @media (max-width: 768px) {
            .appbar, .container { padding-left: 14px; padding-right: 14px; }
            .wordmark { font-size: 24px; }
        }
        /* ═══ end base ═══ */
        /* ═══ Workscreen — page styles ═══ */
        body { min-height: 100vh; display: flex; flex-direction: column; }
        .appbar { height: 72px; }
        .clock { display: flex; align-items: baseline; gap: 14px; }
        .clock-time { font-family: var(--mono); font-size: 30px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.02em; }
        .clock-date { color: var(--text-soft); font-size: 15px; font-weight: 500; }
        .live { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--success); }
        .live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 0 rgba(78,204,163,0.6); animation: pulse 2s infinite; }
        .live.off { color: var(--error); }
        .live.off::before { animation: none; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(78,204,163,0.55); } 70% { box-shadow: 0 0 0 9px rgba(78,204,163,0); } 100% { box-shadow: 0 0 0 0 rgba(78,204,163,0); } }

        .board { flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; padding: 20px 24px 24px; }
        .week { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
        .week.current { border-color: rgba(255,107,53,0.55); box-shadow: 0 0 0 1px rgba(255,107,53,0.25), 0 20px 50px -30px rgba(255,107,53,0.5); }
        .week-head { padding: 18px 22px 14px; border-bottom: 1px solid var(--line); }
        .week-label { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim); }
        .week.current .week-label { color: var(--primary); }
        .week-range { font-size: 17px; font-weight: 600; color: var(--text-strong); margin-top: 3px; }
        .now-tag { font-size: 10.5px; padding: 3px 8px; border-radius: 999px; background: var(--primary); color: #fff; letter-spacing: .06em; }

        .week-body { padding: 18px 22px 22px; display: flex; flex-direction: column; gap: 18px; flex: 1; min-height: 0; }
        .total { display: flex; align-items: baseline; gap: 12px; }
        .total-num { font-size: 76px; line-height: .95; font-weight: 800; letter-spacing: -0.045em; color: var(--text-strong); font-variant-numeric: tabular-nums; }
        .total-lbl { font-size: 16px; color: var(--text-soft); font-weight: 500; }

        .bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: rgba(255,255,255,0.06); }
        .bar span { height: 100%; transition: width .4s ease; }

        .stats { display: grid; grid-template-columns: 1fr; gap: 8px; }
        .stat { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
        .stat-name { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; color: var(--text-soft); }
        .stat-name .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--c); flex: 0 0 auto; }
        .stat-num { font-size: 34px; font-weight: 800; color: var(--text-strong); font-variant-numeric: tabular-nums; letter-spacing: -0.03em; line-height: 1; }
        .stat-sub { font-size: 12px; color: var(--text-dim); font-weight: 500; margin-left: 4px; }
        .stat.muted-stat .stat-num { color: var(--text-dim); font-size: 26px; }

        .pvf { border-radius: 14px; padding: 16px 18px; border: 1px solid rgba(78,204,163,0.45); background: rgba(78,204,163,0.08); }
        .pvf.alert { border-color: rgba(255,107,107,0.6); background: rgba(255,107,107,0.10); }
        .pvf-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .pvf-title { font-size: 15px; font-weight: 700; color: var(--text-strong); line-height: 1.25; }
        .pvf-sub { font-size: 12.5px; color: var(--text-soft); margin-top: 2px; }
        .pvf-num { font-size: 64px; font-weight: 800; line-height: .9; letter-spacing: -0.045em; color: var(--success); font-variant-numeric: tabular-nums; }
        .pvf.alert .pvf-num { color: #FF7A7A; }
        .pvf-ok { font-size: 14px; color: var(--success); font-weight: 600; margin-top: 10px; }
        .pvf-list { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
        .pvf-item { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: baseline; padding: 7px 10px; border-radius: 8px; background: rgba(0,0,0,0.18); font-size: 13.5px; }
        .pvf-item .jn { font-family: var(--mono); font-weight: 700; color: var(--text-strong); }
        .pvf-item .who { color: var(--text-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pvf-item .day { color: var(--text-dim); font-size: 12.5px; white-space: nowrap; }
        .pvf-more { font-size: 12.5px; color: var(--text-dim); padding: 2px 10px; }

        .foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 0 24px 16px; color: var(--text-dim); font-size: 12px; }
        .loading-screen { flex: 1; display: flex; align-items: center; justify-content: center; gap: 12px; color: var(--text-dim); font-size: 16px; }
        .err { margin: 20px 24px; }

        @media (max-width: 1400px) {
            .total-num { font-size: 60px; } .pvf-num { font-size: 52px; } .stat-num { font-size: 28px; }
        }
        @media (max-width: 1100px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (max-width: 640px) {
            .board { grid-template-columns: 1fr; padding: 14px; gap: 12px; }
            .clock-date { display: none; }
            .clock-time { font-size: 22px; }
            .foot { padding: 0 14px 14px; }
        }
        @media (prefers-reduced-motion: reduce) { .live::before { animation: none; } }
    </style>
</head>

    import { getFirestore, collection, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const cfg = {

    const db = getFirestore(initializeApp(cfg));

    // ── Helpers ────────────────────────────────────────────────────────

    const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const normJob = v => String(v ?? '').trim().replace(/^#/, '').toUpperCase();
    const has = v => v != null && String(v).trim() !== '';
    function parseDate(v) {
        if (!v) return null;
        if (typeof v.toDate === 'function') v = v.toDate();
        if (typeof v === 'string' && v.includes('/')) {
            const p = v.split('/');
            if (p.length === 3) { const d = new Date(+p[2], +p[1] - 1, +p[0]); if (!isNaN(d)) { d.setHours(0, 0, 0, 0); return d; } }
        }
        const d = new Date(v); if (isNaN(d)) return null; d.setHours(0, 0, 0, 0); return d;
    }
    const mondayOf = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
    const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
    const fmtDay = d => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    const fmtWeekday = d => d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric' });

    // Job rules (same as the job timeline)
    function isSurvey(type) { return /survey/i.test(String(type || '').replace(/_/g, ' ')); }
    function isSolarInstall(type) {
        const t = String(type || '').toUpperCase().replace(/[^A-Z]+/g, '_');
        if (t.includes('BATTERY') || t.includes('AFTERCARE') || t.includes('SURVEY')) return false;
        return t.includes('INSTALL') && (t.includes('SOLAR') || t.includes('PV'));
    }
    function statusOf(j) {
        const s = String(j['Status Update'] || j.status || '').trim().toLowerCase();
        if (s === 'complete' || s === 'completed' || s === 'install-complete') return 'complete';
        if (s === 'aborted') return 'aborted';
        if (s === 'cancelled' || s === 'canceled') return 'cancelled';
        if (s === 'short notice cancellation') return 'shortNotice';
        return 'other';
    }

    // ── Live data ──────────────────────────────────────────────────────
    const data = { jobs: null, projects: null, sheet: null };
    let lastUpdate = null;
    function listen(name, key) {
        onSnapshot(collection(db, name), snap => {
            data[key] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            lastUpdate = new Date();
            $('live').className = 'live'; $('live').textContent = 'LIVE';
            render();
        }, err => {
            console.error(name, err);
            if (key === 'jobs') { $('live').className = 'live off'; $('live').textContent = 'OFFLINE'; showError(err); }
            else { data[key] = []; render(); }   // erect dates are optional extras
        });
    }

    function showError(err) {
        $('loading').innerHTML = `<div class="notice error err">Couldn't load jobs: ${esc(err.message)}</div>`;
    }

    function render() {
        if (!data.jobs) return;
        const erect = new Set();
        (data.projects || []).forEach(p => { if (has(p.scaffolding?.erectionDate)) erect.add(normJob(p.jobNumber || p.id)); });
        (data.sheet || []).forEach(r => { if (has(r.erectDateISO) || has(r.erectDate)) erect.add(normJob(r.jobNumber || r.id)); });

        const jobs = data.jobs.map(j => ({
            jobNumber: String(j['Job Number'] || '').trim(),
            type: j['Job Type'] || '',
            date: parseDate(j['Install Date'] || j['Booked Date']),
            engineer: String(j['Lead Engineer'] || j['Engineer'] || '').replace(/^["']|["']$/g, '').trim(),
            postcode: String(j['Postcode'] || '').trim(),
            status: statusOf(j)
        })).filter(j => j.date && !isSurvey(j.type));

        const thisMon = mondayOf(new Date());
        const weeks = [
            { key: 'last',  label: 'Last week',     start: addDays(thisMon, -7), kind: 'outcome' },
            { key: 'this',  label: 'This week',     start: thisMon,              kind: 'outcome', current: true },
            { key: 'next',  label: 'Next week',     start: addDays(thisMon, 7),  kind: 'pvf' },
            { key: 'after', label: 'Week after',    start: addDays(thisMon, 14), kind: 'pvf' }
        ];
        $('board').innerHTML = weeks.map(w => {
            const end = addDays(w.start, 6);
            const list = jobs.filter(j => j.date >= w.start && j.date <= end);
            return `<section class="week${w.current ? ' current' : ''}">
                <div class="week-head">
                    <div class="week-label">${w.label}${w.current ? '<span class="now-tag">NOW</span>' : ''}</div>
                    <div class="week-range">${fmtDay(w.start)} – ${fmtDay(end)}</div>
                </div>
                <div class="week-body">${w.kind === 'outcome' ? outcomeBody(list) : pvfBody(list, erect)}</div>
            </section>`;
        }).join('');

        $('loading').style.display = 'none';
        $('board').style.display = 'grid';
        $('foot').style.display = 'flex';
        $('updated').textContent = lastUpdate ? 'Updated ' + lastUpdate.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '';
    }

    function outcomeBody(list) {
        const n = k => list.filter(j => j.status === k).length;
        const c = { complete: n('complete'), aborted: n('aborted'), cancelled: n('cancelled') + n('shortNotice'), shortNotice: n('shortNotice') };
        const other = list.length - c.complete - c.aborted - c.cancelled;
        const pct = v => list.length ? (v / list.length * 100) + '%' : '0';
        const stat = (label, num, col, sub = '') => `<div class="stat" style="--c:${col}"><span class="stat-name"><span class="dot"></span>${label}</span><span><span class="stat-num">${num}</span>${sub}</span></div>`;
        return `
            <div class="total"><span class="total-num">${list.length}</span><span class="total-lbl">job${list.length === 1 ? '' : 's'}</span></div>
            <div class="bar" title="Completed / aborted / cancelled">
                <span style="width:${pct(c.complete)};background:var(--complete)"></span>
                <span style="width:${pct(c.aborted)};background:var(--aborted)"></span>
                <span style="width:${pct(c.cancelled)};background:var(--cancelled)"></span>
            </div>
            <div class="stats">
                ${stat('Completed', c.complete, 'var(--complete)')}
                ${stat('Aborted', c.aborted, 'var(--aborted)')}
                ${stat('Cancelled', c.cancelled, 'var(--cancelled)', c.shortNotice ? `<span class="stat-sub">incl. ${c.shortNotice} short notice</span>` : '')}
                <div class="stat muted-stat"><span class="stat-name">Scheduled / in progress</span><span class="stat-num">${other}</span></div>
            </div>`;
    }

    function pvfBody(list, erect) {
        const active = list.filter(j => j.status !== 'cancelled' && j.status !== 'shortNotice');
        const solar = active.filter(j => isSolarInstall(j.type));
        const missing = solar.filter(j => !erect.has(normJob(j.jobNumber))).sort((a, b) => a.date - b.date || a.jobNumber.localeCompare(b.jobNumber));
        const MAX = 8;
        return `
            <div class="total"><span class="total-num">${list.length}</span><span class="total-lbl">job${list.length === 1 ? '' : 's'}${solar.length ? ` · ${solar.length} solar install${solar.length === 1 ? '' : 's'}` : ''}</span></div>
            <div class="pvf${missing.length ? ' alert' : ''}">
                <div class="pvf-top">
                    <div><div class="pvf-title">Need PVF erection date</div><div class="pvf-sub">Solar installs with no scaffold erect date</div></div>
                    <div class="pvf-num">${missing.length}</div>
                </div>
                ${missing.length ? `<div class="pvf-list">
                    ${missing.slice(0, MAX).map(j => `<div class="pvf-item"><span class="jn">${esc(j.jobNumber)}</span><span class="who">${esc(j.engineer || j.postcode)}</span><span class="day">${fmtWeekday(j.date)}</span></div>`).join('')}
                    ${missing.length > MAX ? `<div class="pvf-more">+ ${missing.length - MAX} more</div>` : ''}
                </div>` : `<div class="pvf-ok">${solar.length ? 'All solar installs have an erect date.' : 'No solar installs this week.'}</div>`}
            </div>`;
    }

    // ── Clock; re-draw at midnight so the weeks roll over ───────────────
    let lastDay = new Date().toDateString();
    function tick() {
        const now = new Date();
        $('clock-time').textContent = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
        $('clock-date').textContent = now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        if (now.toDateString() !== lastDay) { lastDay = now.toDateString(); render(); }
    }
    tick(); setInterval(tick, 1000);

    window.toggleFullscreen = () => {
        if (document.fullscreenElement) document.exitFullscreen?.();
        else document.documentElement.requestFullscreen?.();
    };

    listen('Solar-jobs', 'jobs');
    listen('pingu-projects', 'projects');
    listen('Scafolding', 'sheet');
</script>
</body>
</html>
