<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add/Edit Teams | Pingu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* ═══ Pingu design system — base (copy verbatim into each page's <style>) ═══ */
        :root {
            /* Brand + status palette */
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --secondary: #FFC857;
            --accent: #00D9FF;
            --dark: #1A1A2E;
            --dark-light: #252541;
            --dark-lighter: #2F2F4A;
            --text: #EAEAEA;
            --text-dim: #9A9AB0;
            --success: #4ECCA3;
            --error: #FF6B6B;
            --warning: #FFC857;
            --in-progress: #00D9FF;
            --complete: #4ECCA3;
            --aborted: #FF6B6B;
            --cancelled: #9A9AB0;
            --short-notice: #90ee90;
            --on-hold: #FFDE00;
            --scheduled: #FF6B35;
            /* Surfaces & type */
            --bg: #161628;
            --surface: #1F1F35;
            --surface-2: #252541;
            --line: rgba(255,255,255,0.07);
            --line-2: rgba(255,255,255,0.12);
            --text-strong: #F4F4F8;
            --text-soft: #C8C8D6;
            --radius: 10px;
            --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: var(--font); font-size: 14px; line-height: 1.5;
            background: var(--bg); color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        button, input, select, textarea { font-family: inherit; }
        a { color: var(--accent); }
        .ico { width: 16px; height: 16px; flex: 0 0 auto; vertical-align: -3px; }
        .ico-lg { width: 20px; height: 20px; flex: 0 0 auto; }

        /* ── App bar + Pingu wordmark ── */
        .appbar {
            position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            height: 64px; padding: 0 28px;
            background: rgba(22, 22, 40, 0.92);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line);
        }
        .appbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .logo { display: inline-flex; align-items: center; text-decoration: none; }
        .wordmark {
            font-family: 'Inter', var(--font); font-weight: 800; font-size: 28px;
            letter-spacing: -0.045em; line-height: 1; color: var(--text-strong); padding-top: 6px;
        }
        .i-stem { position: relative; display: inline-block; }
        .i-paw {
            position: absolute; left: 50%; top: -0.17em; transform: translateX(-50%) rotate(-10deg);
            width: 0.5em; height: 0.5em; fill: var(--primary);
            filter: drop-shadow(0 1px 4px rgba(255,107,53,0.35));
            transition: transform .2s ease;
        }
        .logo:hover .i-paw { transform: translateX(-50%) rotate(4deg) scale(1.08); }
        .logo:hover .wordmark { color: #fff; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-soft); text-decoration: none; font-size: 13px; font-weight: 500;
            padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; cursor: pointer;
            transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .back-btn:hover { background: var(--surface-2); color: var(--text-strong); border-color: rgba(255,255,255,0.2); }

        /* ── Page layout ── */
        .container { padding: 24px 28px 40px; }
        .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
        h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-strong); line-height: 1.2; }
        h2 { font-size: 16px; font-weight: 600; color: var(--text-strong); letter-spacing: -0.01em; }
        h3 { font-size: 14px; font-weight: 600; color: var(--text-strong); }
        .muted { color: var(--text-dim); }
        .toolbar { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }

        /* ── Panels / cards ── */
        .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
        .panel + .panel { margin-top: 16px; }
        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -2px 0 14px; }
        .panel-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--text-strong); }
        .panel-title .ico { color: var(--primary); }

        /* ── Form controls ── */
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-label { color: var(--text-dim); font-size: 11.5px; font-weight: 500; }
        .control-input {
            height: 38px; background: var(--surface); border: 1px solid var(--line-2);
            color: var(--text-strong); padding: 0 12px; border-radius: 8px; font-size: 13.5px; width: 100%;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        textarea.control-input { height: auto; min-height: 84px; padding: 9px 11px; resize: vertical; }
        .control-input:hover { border-color: rgba(255,255,255,0.2); }
        .control-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.22); }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); cursor: pointer; }
        input[type="checkbox"], input[type="radio"] { accent-color: var(--primary); }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 7px;
            height: 38px; padding: 0 16px; border-radius: 8px; cursor: pointer;
            font-size: 13.5px; font-weight: 600; text-decoration: none; white-space: nowrap;
            border: 1px solid transparent; transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--surface-2); color: var(--text-strong); border-color: var(--line-2); }
        .btn-secondary:hover { background: var(--dark-lighter); border-color: rgba(255,255,255,0.25); }
        .btn-ghost { background: transparent; color: var(--text-soft); border-color: var(--line-2); }
        .btn-ghost:hover { background: var(--surface-2); color: var(--text-strong); }
        .btn-danger { background: rgba(255,107,107,0.12); color: #FF8A8A; border-color: rgba(255,107,107,0.4); }
        .btn-danger:hover { background: rgba(255,107,107,0.22); }
        .btn-success { background: rgba(78,204,163,0.14); color: var(--success); border-color: rgba(78,204,163,0.45); }
        .btn-success:hover { background: rgba(78,204,163,0.24); }
        .btn-sm { height: 32px; padding: 0 12px; font-size: 12.5px; }
        .btn:disabled, button:disabled { opacity: .45; cursor: not-allowed; }
        .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; height: 38px; }
        .seg button { background: var(--surface); color: var(--text-soft); border: 0; padding: 0 12px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .seg button + button { border-left: 1px solid var(--line-2); }
        .seg button:hover, .seg button.active { background: var(--surface-2); color: var(--text-strong); }

        /* ── KPI tiles ── */
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
        .stat-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; }
        .stat-label { display: flex; align-items: center; gap: 7px; color: var(--text-dim); font-size: 12px; font-weight: 500; white-space: nowrap; }
        .stat-label .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
        .stat-value { font-size: 22px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.02em; line-height: 1.25; margin-top: 2px; font-variant-numeric: tabular-nums; }

        /* ── Tables ── */
        .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
        thead th {
            position: sticky; top: 0; z-index: 2; background: var(--surface);
            text-align: left; padding: 10px 14px; font-size: 11.5px; font-weight: 600; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--line-2); white-space: nowrap;
        }
        tbody td { padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--text-soft); vertical-align: middle; }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover td { background: rgba(255,255,255,0.025); }
        td.strong, .cell-strong { color: var(--text-strong); font-weight: 600; }
        .mono { font-family: var(--mono); font-size: 12.5px; }

        /* ── Badges / status pills ── */
        .badge {
            --c: var(--text-dim);
            display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
            padding: 2px 9px; border-radius: 999px; color: var(--text-strong);
            background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
        }
        .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
        .badge.plain::before { display: none; }
        .tag { font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 4px; background: rgba(255,255,255,0.1); color: var(--text-soft); letter-spacing: .03em; }

        /* ── Notices ── */
        .notice { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 13px;
                  background: rgba(255,255,255,0.03); border: 1px solid var(--line-2); color: var(--text-soft); }
        .notice .ico { margin-top: 1px; }
        .notice.info    { border-color: rgba(0,217,255,0.35);  background: rgba(0,217,255,0.06); }
        .notice.success { border-color: rgba(78,204,163,0.4);  background: rgba(78,204,163,0.07); color: var(--success); }
        .notice.warning { border-color: rgba(255,200,87,0.4);  background: rgba(255,200,87,0.07); color: var(--warning); }
        .notice.error   { border-color: rgba(255,107,107,0.45); background: rgba(255,107,107,0.08); color: #FF8A8A; }

        /* ── Modals ── */
        .modal { display: none; position: fixed; inset: 0; background: rgba(10,10,22,0.72); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
        .modal.show, .modal.active, .modal.open { display: flex; }
        .modal-content { background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; width: 100%; max-width: 680px; max-height: 88vh; overflow-y: auto; box-shadow: 0 30px 80px -20px rgba(0,0,0,0.75); }
        .modal-header { position: sticky; top: 0; z-index: 2; background: var(--surface); display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
        .modal-title { font-size: 17px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.01em; }
        .modal-body { padding: 18px 20px 22px; }
        .close-btn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; border-radius: 8px; color: var(--text-dim); cursor: pointer; font-size: 20px; line-height: 1; }
        .close-btn:hover { background: var(--surface-2); color: var(--text-strong); }

        /* ── Feedback ── */
        .toast { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: none; max-width: 420px; padding: 12px 16px 12px 14px; border-radius: 10px;
                 background: #26263F; color: var(--text-strong); font-size: 13.5px; border: 1px solid var(--line-2); border-left: 3px solid var(--success);
                 box-shadow: 0 16px 40px -12px rgba(0,0,0,0.7); }
        .toast.show { display: block; }
        .toast.error { border-left-color: var(--error); }
        .empty-state, .loading { text-align: center; padding: 56px 16px; color: var(--text-dim); }
        .empty-state h3 { color: var(--text-strong); font-size: 16px; margin-bottom: 4px; }
        .empty-state .ico-lg { width: 32px; height: 32px; color: var(--text-dim); margin-bottom: 10px; }
        .spinner { width: 22px; height: 22px; border: 2px solid var(--line-2); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        *::-webkit-scrollbar { width: 10px; height: 10px; }
        *::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
        *::-webkit-scrollbar-track { background: transparent; }
        @media (max-width: 768px) {
            .appbar, .container { padding-left: 14px; padding-right: 14px; }
            .wordmark { font-size: 24px; }
        }
        /* ═══ end base ═══ */

        /* ── Layout ── */
        .content-grid { display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: 16px; align-items: start; }
        .content-grid > .panel + .panel { margin-top: 0; }
        .add-section { position: sticky; top: 80px; }
        .section-header { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
        .section-header .ico { color: var(--primary); }
        .section-header h2 { font-size: 15px; }
        .section-header .spacer { flex: 1; }

        /* ── Form ── */
        .form-group { margin-bottom: 12px; }
        .form-group > label:not(.checkbox-group) { display: block; color: var(--text-dim); font-size: 11.5px; font-weight: 500; margin-bottom: 5px; }
        .form-input, .form-select {
            width: 100%; height: 38px; background: var(--bg); border: 1px solid var(--line-2);
            color: var(--text-strong); padding: 0 12px; border-radius: 8px; font-size: 13.5px;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        .form-input:hover, .form-select:hover { border-color: rgba(255,255,255,0.2); }
        .form-input:focus, .form-select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.22); }
        .form-input::placeholder { color: var(--text-dim); opacity: .7; }
        .form-select option { background: var(--surface); color: var(--text-strong); }
        .field-hint { display: block; color: var(--text-dim); font-size: 12px; margin-top: 5px; }

        .checkbox-group {
            display: flex; align-items: center; gap: 10px; cursor: pointer;
            padding: 10px 12px; background: var(--bg); border: 1px solid var(--line-2); border-radius: 8px;
            transition: border-color .15s ease;
        }
        .checkbox-group:hover { border-color: rgba(255,255,255,0.2); }
        .checkbox-group input[type="checkbox"] { width: 16px; height: 16px; margin: 0; cursor: pointer; flex: 0 0 auto; }
        .checkbox-label { font-size: 13.5px; color: var(--text-strong); flex: 1; }

        .lead-engineer-badge {
            font-size: 10.5px; font-weight: 700; letter-spacing: .03em; padding: 1px 7px; border-radius: 4px;
            background: rgba(255,107,53,0.16); color: var(--primary); white-space: nowrap;
        }
        .checkbox-group .lead-engineer-badge { flex: 0 0 auto; }

        .submit-btn {
            width: 100%; height: 40px; margin-top: 6px;
            background: var(--primary); color: #fff; border: 0; border-radius: 8px;
            font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s ease;
        }
        .submit-btn:hover { background: var(--primary-dark); }
        .submit-btn:disabled { background: var(--surface-2); color: var(--text-dim); }

        /* ── Stats + list ── */
        .team-stats { grid-template-columns: repeat(2, minmax(140px, 200px)); }
        .team-stats .stat-item { background: var(--bg); }
        .team-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
        .team-list .empty-state { grid-column: 1 / -1; }
        .empty-icon { display: flex; justify-content: center; }
        .team-member {
            background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
            cursor: pointer; transition: border-color .15s ease, background .15s ease;
        }
        .team-member:hover { border-color: var(--line-2); background: var(--surface-2); }
        .team-member.lead-engineer { box-shadow: inset 3px 0 0 var(--primary); }
        .member-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .member-avatar {
            width: 36px; height: 36px; border-radius: 50%; flex: 0 0 auto;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.07); color: var(--text-soft); font-size: 12.5px; font-weight: 700;
        }
        .team-member.lead-engineer .member-avatar { background: rgba(255,107,53,0.16); color: var(--primary); }
        .member-info { min-width: 0; }
        .member-name { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--text-strong); }
        .member-role { font-size: 12px; color: var(--text-dim); }
        .member-details { display: flex; flex-direction: column; gap: 4px; padding-top: 10px; border-top: 1px solid var(--line); }
        .member-detail { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-soft); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .member-detail-icon { display: inline-flex; color: var(--text-dim); }

        /* ── Modal ── */
        .modal-content { max-width: 560px; }
        .assign-section { margin: 4px 0 12px; padding: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
        .assign-section h3 { margin-bottom: 8px; }
        .assign-section .form-group { margin-bottom: 0; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 18px; }
        .modal-buttons .btn-danger { margin-right: auto; }

        /* ── Status message (toast) ── */
        .status-message {
            position: fixed; top: 80px; right: 24px; z-index: 2000; display: none; max-width: 420px;
            padding: 12px 16px 12px 14px; border-radius: 10px; font-size: 13.5px;
            background: #26263F; color: var(--text-strong); border: 1px solid var(--line-2); border-left: 3px solid var(--success);
            box-shadow: 0 16px 40px -12px rgba(0,0,0,0.7);
        }
        .status-message.show { display: block; }
        .status-message.error { border-left-color: var(--error); }

        @media (max-width: 1024px) {
            .content-grid { grid-template-columns: 1fr; }
            .add-section { position: static; }
        }
        @media (max-width: 600px) {
            .modal-buttons { flex-direction: column-reverse; }
            .modal-buttons .btn-danger { margin-right: 0; }
            .status-message { left: 14px; right: 14px; top: 76px; }
            .team-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
    </style>
</head>
<body>
    <header class="appbar">
        <a href="index.html" class="logo" aria-label="Pingu home">
            <span class="wordmark">P<span class="i-stem">ı<svg class="i-paw" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="16.2" rx="5.6" ry="4.6"/><ellipse cx="4.6" cy="10.4" rx="2.2" ry="2.7" transform="rotate(-18 4.6 10.4)"/><ellipse cx="9.2" cy="5.6" rx="2.3" ry="2.9" transform="rotate(-6 9.2 5.6)"/><ellipse cx="14.8" cy="5.6" rx="2.3" ry="2.9" transform="rotate(6 14.8 5.6)"/><ellipse cx="19.4" cy="10.4" rx="2.2" ry="2.7" transform="rotate(18 19.4 10.4)"/></svg></span>ngu</span>
        </a>
        <div class="appbar-actions">
            <a href="index.html" class="back-btn"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Back to Home</a>
        </div>
    </header>

    <div class="container">
        <div class="page-head">
            <h1>Add/edit teams</h1>
        </div>

        <main>
            <div class="content-grid">
                <!-- Add Team Member Section -->
                <div class="panel add-section">
                    <div class="section-header">
                        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                        <h2>Add team member</h2>
                    </div>

                    <form id="add-member-form" onsubmit="addTeamMember(event)">
                        <div class="form-group">
                            <label for="member-name">Full name *</label>
                            <input
                                type="text"
                                id="member-name"
                                class="form-input"
                                placeholder="e.g. John Smith"
                                required
                            />
                        </div>

                        <div class="form-group">
                            <label for="member-phone">Contact number *</label>
                            <input
                                type="tel"
                                id="member-phone"
                                class="form-input"
                                placeholder="e.g. 07700 900123"
                                required
                            />
                        </div>

                        <div class="form-group">
                            <label for="member-email">Email address *</label>
                            <input
                                type="email"
                                id="member-email"
                                class="form-input"
                                placeholder="e.g. john.smith@example.com"
                                required
                            />
                        </div>

                        <div class="form-group">
                            <label for="member-password">Password *</label>
                            <input
                                type="password"
                                id="member-password"
                                class="form-input"
                                placeholder="Enter password for this engineer"
                                required
                            />
                        </div>

                        <div class="form-group">
                            <label class="checkbox-group">
                                <input
                                    type="checkbox"
                                    id="member-lead"
                                />
                                <span class="checkbox-label">This person is a lead engineer</span>
                                <span class="lead-engineer-badge" id="lead-badge" style="display: none;">Lead</span>
                            </label>
                        </div>

                        <button type="submit" class="submit-btn" id="submit-btn">
                            Add team member
                        </button>
                    </form>
                </div>

                <!-- Team List Section -->
                <div class="panel team-section">
                    <div class="section-header">
                        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>
                        <h2>Team members</h2>
                    </div>

                    <div class="stats-row team-stats">
                        <div class="stat-item">
                            <div class="stat-label">Total members</div>
                            <div class="stat-value" id="total-members">0</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label"><span class="dot" style="background:var(--primary)"></span>Lead engineers</div>
                            <div class="stat-value" id="lead-engineers">0</div>
                        </div>
                    </div>

                    <div class="team-list" id="team-list">
                        <div class="empty-state">
                            <div class="empty-icon"><svg class="ico-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg></div>
                            <h3>No team members yet</h3>
                            <p>Add your first team member to get started</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Edit Member Modal -->
    <div class="modal" id="edit-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Edit team member</h2>
                <button class="close-btn" onclick="closeEditModal()" aria-label="Close"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
            </div>

            <div class="modal-body">
            <form id="edit-form" onsubmit="updateTeamMember(event)">
                <input type="hidden" id="edit-member-id" />

                <div class="form-group">
                    <label for="edit-name">Full name *</label>
                    <input
                        type="text"
                        id="edit-name"
                        class="form-input"
                        required
                    />
                </div>

                <div class="form-group">
                    <label for="edit-phone">Contact number *</label>
                    <input
                        type="tel"
                        id="edit-phone"
                        class="form-input"
                        required
                    />
                </div>

                <div class="form-group">
                    <label for="edit-email">Email address *</label>
                    <input
                        type="email"
                        id="edit-email"
                        class="form-input"
                        required
                    />
                </div>

                <div class="form-group">
                    <label for="edit-password">Password</label>
                    <input
                        type="password"
                        id="edit-password"
                        class="form-input"
                        placeholder="Leave blank to keep current password"
                    />
                    <small class="field-hint">
                        Only enter a new password if you want to change it
                    </small>
                </div>

                <div class="form-group">
                    <label class="checkbox-group">
                        <input
                            type="checkbox"
                            id="edit-lead"
                        />
                        <span class="checkbox-label">This person is a lead engineer</span>
                    </label>
                </div>

                <div class="assign-section" id="assign-section" style="display: none;">
                    <h3>Assign lead engineer</h3>
                    <div class="form-group">
                        <label for="assigned-lead">Select lead engineer</label>
                        <select id="assigned-lead" class="form-select">
                            <option value="">-- No Lead Assigned --</option>
                        </select>
                    </div>
                </div>

                <div class="modal-buttons">
                    <button type="button" class="btn btn-danger" onclick="deleteTeamMember()">
                        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Delete member
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="closeEditModal()">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-primary">
                        Save changes
                    </button>
                </div>
            </form>
            </div>
        </div>
    </div>

    <!-- Status Message -->
    <div class="status-message" id="status-message"></div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAc_yJQ_rkzuOBh-Yxg0Q4eooXtB-tQjm0",
            authDomain: "pingu-solar.firebaseapp.com",
            projectId: "pingu-solar",
            storageBucket: "pingu-solar.appspot.com",
            messagingSenderId: "232764952866",
            appId: "1:232764952866:web:5923b7f419de6355d6157b",
            measurementId: "G-PFH059DZ64"
        };
        
        // Initialize Firebase
        console.log('Initializing Firebase...');
        
        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            
            // Make Firebase available globally
            window.db = db;
            window.firebaseModules = { collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy };
            
            console.log('✅ Firebase initialized successfully');
            
            // Load team members on page load
            window.addEventListener('DOMContentLoaded', () => {
                loadTeamMembers();
            });
            
        } catch (error) {
            console.error('❌ Firebase initialization error:', error);
            showStatus('Firebase initialization failed: ' + error.message, 'error');
        }
    </script>
    
    <script>
        // Line icons used in JS-generated markup
        const ICONS = {
            phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
            mail:  '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
            users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>'
        };
        const ICON = (name, cls = 'ico') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;

        // Global state
        let teamMembers = [];
        let currentEditingId = null;
        
        // Toggle lead engineer badge in add form
        document.getElementById('member-lead').addEventListener('change', (e) => {
            const badge = document.getElementById('lead-badge');
            badge.style.display = e.target.checked ? 'block' : 'none';
        });
        
        // Load all team members
        async function loadTeamMembers() {
            try {
                console.log('Loading team members...');
                const { collection, getDocs, query, orderBy: orderByFn } = window.firebaseModules;
                
                const membersQuery = query(
                    collection(window.db, 'team-members'),
                    orderByFn('name', 'asc')
                );
                
                const querySnapshot = await getDocs(membersQuery);
                
                teamMembers = [];
                querySnapshot.forEach((doc) => {
                    teamMembers.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });
                
                console.log(`Loaded ${teamMembers.length} team members`);
                displayTeamMembers();
                
            } catch (error) {
                console.error('Error loading team members:', error);
                showStatus('Error loading team members: ' + error.message, 'error');
            }
        }
        
        // Add team member
        async function addTeamMember(event) {
            event.preventDefault();
            
            const name = document.getElementById('member-name').value.trim();
            const phone = document.getElementById('member-phone').value.trim();
            const email = document.getElementById('member-email').value.trim();
            const password = document.getElementById('member-password').value.trim();
            const isLead = document.getElementById('member-lead').checked;
            
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Adding...';
            
            try {
                const { collection, addDoc } = window.firebaseModules;
                
                const memberData = {
                    name: name,
                    phone: phone,
                    email: email,
                    password: password,
                    isLeadEngineer: isLead,
                    assignedLead: null,
                    createdAt: new Date().toISOString()
                };
                
                await addDoc(collection(window.db, 'team-members'), memberData);
                
                showStatus('Team member added successfully!', 'success');
                
                // Reset form
                document.getElementById('add-member-form').reset();
                document.getElementById('lead-badge').style.display = 'none';
                
                // Reload team members
                await loadTeamMembers();
                
            } catch (error) {
                console.error('Error adding team member:', error);
                showStatus('Error adding team member: ' + error.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Add team member';
            }
        }
        
        // Display team members
        function displayTeamMembers() {
            const teamList = document.getElementById('team-list');
            const totalMembers = document.getElementById('total-members');
            const leadEngineers = document.getElementById('lead-engineers');
            
            // Update stats
            const leadCount = teamMembers.filter(m => m.isLeadEngineer).length;
            totalMembers.textContent = teamMembers.length;
            leadEngineers.textContent = leadCount;
            
            // Display members
            if (teamMembers.length === 0) {
                teamList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">${ICON('users', 'ico-lg')}</div>
                        <h3>No team members yet</h3>
                        <p>Add your first team member to get started</p>
                    </div>
                `;
                return;
            }
            
            const html = teamMembers.map(member => {
                const initials = getInitials(member.name);
                const assignedLeadName = member.assignedLead ? 
                    teamMembers.find(m => m.id === member.assignedLead)?.name : null;
                
                return `
                    <div class="team-member ${member.isLeadEngineer ? 'lead-engineer' : ''}" onclick="openEditModal('${member.id}')">
                        <div class="member-header">
                            <div class="member-avatar">${initials}</div>
                            <div class="member-info">
                                <div class="member-name">
                                    ${escapeHtml(member.name)}
                                    ${member.isLeadEngineer ? '<span class="lead-engineer-badge">Lead</span>' : ''}
                                </div>
                                <div class="member-role">
                                    ${member.isLeadEngineer ? 'Lead engineer' :
                                      assignedLeadName ? `Team member → ${escapeHtml(assignedLeadName)}` :
                                      'Team member'}
                                </div>
                            </div>
                        </div>
                        <div class="member-details">
                            <div class="member-detail">
                                <span class="member-detail-icon">${ICON('phone')}</span>
                                ${escapeHtml(member.phone)}
                            </div>
                            <div class="member-detail">
                                <span class="member-detail-icon">${ICON('mail')}</span>
                                ${escapeHtml(member.email)}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            teamList.innerHTML = html;
        }
        
        // Open edit modal
        function openEditModal(memberId) {
            const member = teamMembers.find(m => m.id === memberId);
            if (!member) return;
            
            currentEditingId = memberId;
            
            // Populate form
            document.getElementById('edit-member-id').value = member.id;
            document.getElementById('edit-name').value = member.name;
            document.getElementById('edit-phone').value = member.phone;
            document.getElementById('edit-email').value = member.email;
            document.getElementById('edit-password').value = ''; // Don't show current password
            document.getElementById('edit-lead').checked = member.isLeadEngineer;
            
            // Show/hide assign section
            const assignSection = document.getElementById('assign-section');
            const assignedLead = document.getElementById('assigned-lead');
            
            if (!member.isLeadEngineer) {
                assignSection.style.display = 'block';
                
                // Populate lead engineers dropdown
                const leadEngineers = teamMembers.filter(m => m.isLeadEngineer && m.id !== memberId);
                assignedLead.innerHTML = '<option value="">-- No Lead Assigned --</option>' +
                    leadEngineers.map(lead => 
                        `<option value="${lead.id}" ${member.assignedLead === lead.id ? 'selected' : ''}>
                            ${escapeHtml(lead.name)}
                        </option>`
                    ).join('');
            } else {
                assignSection.style.display = 'none';
            }
            
            // Toggle assign section when checkbox changes
            document.getElementById('edit-lead').onchange = (e) => {
                assignSection.style.display = e.target.checked ? 'none' : 'block';
            };
            
            // Show modal
            document.getElementById('edit-modal').classList.add('show');
        }
        
        // Close edit modal
        function closeEditModal() {
            document.getElementById('edit-modal').classList.remove('show');
            currentEditingId = null;
        }
        
        // Update team member
        async function updateTeamMember(event) {
            event.preventDefault();
            
            if (!currentEditingId) return;
            
            const name = document.getElementById('edit-name').value.trim();
            const phone = document.getElementById('edit-phone').value.trim();
            const email = document.getElementById('edit-email').value.trim();
            const newPassword = document.getElementById('edit-password').value.trim();
            const isLead = document.getElementById('edit-lead').checked;
            const assignedLead = document.getElementById('assigned-lead').value || null;
            
            try {
                const { doc, updateDoc } = window.firebaseModules;
                
                const memberData = {
                    name: name,
                    phone: phone,
                    email: email,
                    isLeadEngineer: isLead,
                    assignedLead: isLead ? null : assignedLead,
                    updatedAt: new Date().toISOString()
                };
                
                // Only update password if a new one was provided
                if (newPassword) {
                    memberData.password = newPassword;
                }
                
                await updateDoc(doc(window.db, 'team-members', currentEditingId), memberData);
                
                showStatus('Team member updated successfully!', 'success');
                closeEditModal();
                await loadTeamMembers();
                
            } catch (error) {
                console.error('Error updating team member:', error);
                showStatus('Error updating team member: ' + error.message, 'error');
            }
        }
        
        // Delete team member
        async function deleteTeamMember() {
            if (!currentEditingId) return;
            
            if (!confirm('Are you sure you want to delete this team member? This action cannot be undone.')) {
                return;
            }
            
            try {
                const { doc, deleteDoc } = window.firebaseModules;
                
                await deleteDoc(doc(window.db, 'team-members', currentEditingId));
                
                showStatus('Team member deleted successfully!', 'success');
                closeEditModal();
                await loadTeamMembers();
                
            } catch (error) {
                console.error('Error deleting team member:', error);
                showStatus('Error deleting team member: ' + error.message, 'error');
            }
        }
        
        // Utility functions
        function getInitials(name) {
            return name
                .split(' ')
                .map(word => word[0])
                .join('')
                .toUpperCase()
                .substring(0, 2);
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function showStatus(message, type) {
            const status = document.getElementById('status-message');
            status.textContent = message;
            status.className = `status-message ${type} show`;
            
            setTimeout(() => {
                status.classList.remove('show');
            }, 3000);
        }
        
        // Close modal when clicking outside
        document.getElementById('edit-modal').addEventListener('click', (e) => {
            if (e.target.id === 'edit-modal') {
                closeEditModal();
            }
        });
    </script>
</body>
</html>
