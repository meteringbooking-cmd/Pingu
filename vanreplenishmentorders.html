<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Van Replenishment Orders | Pingu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* ═══ Pingu design system — base (copy verbatim into each page's <style>) ═══ */
        :root {
            /* Brand + status palette */
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --secondary: #FFC857;
            --accent: #00D9FF;
            --dark: #1A1A2E;
            --dark-light: #252541;
            --dark-lighter: #2F2F4A;
            --text: #EAEAEA;
            --text-dim: #9A9AB0;
            --success: #4ECCA3;
            --error: #FF6B6B;
            --warning: #FFC857;
            --in-progress: #00D9FF;
            --complete: #4ECCA3;
            --aborted: #FF6B6B;
            --cancelled: #9A9AB0;
            --short-notice: #90ee90;
            --on-hold: #FFDE00;
            --scheduled: #FF6B35;
            /* Surfaces & type */
            --bg: #161628;
            --surface: #1F1F35;
            --surface-2: #252541;
            --line: rgba(255,255,255,0.07);
            --line-2: rgba(255,255,255,0.12);
            --text-strong: #F4F4F8;
            --text-soft: #C8C8D6;
            --radius: 10px;
            --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: var(--font); font-size: 14px; line-height: 1.5;
            background: var(--bg); color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        button, input, select, textarea { font-family: inherit; }
        a { color: var(--accent); }
        .ico { width: 16px; height: 16px; flex: 0 0 auto; vertical-align: -3px; }
        .ico-lg { width: 20px; height: 20px; flex: 0 0 auto; }

        /* ── App bar + Pingu wordmark ── */
        .appbar {
            position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            height: 64px; padding: 0 28px;
            background: rgba(22, 22, 40, 0.92);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line);
        }
        .appbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .logo { display: inline-flex; align-items: center; text-decoration: none; }
        .wordmark {
            font-family: 'Inter', var(--font); font-weight: 800; font-size: 28px;
            letter-spacing: -0.045em; line-height: 1; color: var(--text-strong); padding-top: 6px;
        }
        .i-stem { position: relative; display: inline-block; }
        .i-paw {
            position: absolute; left: 50%; top: -0.17em; transform: translateX(-50%) rotate(-10deg);
            width: 0.5em; height: 0.5em; fill: var(--primary);
            filter: drop-shadow(0 1px 4px rgba(255,107,53,0.35));
            transition: transform .2s ease;
        }
        .logo:hover .i-paw { transform: translateX(-50%) rotate(4deg) scale(1.08); }
        .logo:hover .wordmark { color: #fff; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-soft); text-decoration: none; font-size: 13px; font-weight: 500;
            padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; cursor: pointer;
            transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .back-btn:hover { background: var(--surface-2); color: var(--text-strong); border-color: rgba(255,255,255,0.2); }

        /* ── Page layout ── */
        .container { padding: 24px 28px 40px; }
        .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
        h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-strong); line-height: 1.2; }
        h2 { font-size: 16px; font-weight: 600; color: var(--text-strong); letter-spacing: -0.01em; }
        h3 { font-size: 14px; font-weight: 600; color: var(--text-strong); }
        .muted { color: var(--text-dim); }
        .toolbar { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }

        /* ── Panels / cards ── */
        .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
        .panel + .panel { margin-top: 16px; }
        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -2px 0 14px; }
        .panel-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--text-strong); }
        .panel-title .ico { color: var(--primary); }

        /* ── Form controls ── */
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-label { color: var(--text-dim); font-size: 11.5px; font-weight: 500; }
        .control-input {
            height: 38px; background: var(--surface); border: 1px solid var(--line-2);
            color: var(--text-strong); padding: 0 12px; border-radius: 8px; font-size: 13.5px; width: 100%;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        textarea.control-input { height: auto; min-height: 84px; padding: 9px 11px; resize: vertical; }
        .control-input:hover { border-color: rgba(255,255,255,0.2); }
        .control-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.22); }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); cursor: pointer; }
        input[type="checkbox"], input[type="radio"] { accent-color: var(--primary); }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 7px;
            height: 38px; padding: 0 16px; border-radius: 8px; cursor: pointer;
            font-size: 13.5px; font-weight: 600; text-decoration: none; white-space: nowrap;
            border: 1px solid transparent; transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--surface-2); color: var(--text-strong); border-color: var(--line-2); }
        .btn-secondary:hover { background: var(--dark-lighter); border-color: rgba(255,255,255,0.25); }
        .btn-ghost { background: transparent; color: var(--text-soft); border-color: var(--line-2); }
        .btn-ghost:hover { background: var(--surface-2); color: var(--text-strong); }
        .btn-danger { background: rgba(255,107,107,0.12); color: #FF8A8A; border-color: rgba(255,107,107,0.4); }
        .btn-danger:hover { background: rgba(255,107,107,0.22); }
        .btn-success { background: rgba(78,204,163,0.14); color: var(--success); border-color: rgba(78,204,163,0.45); }
        .btn-success:hover { background: rgba(78,204,163,0.24); }
        .btn-sm { height: 32px; padding: 0 12px; font-size: 12.5px; }
        .btn:disabled, button:disabled { opacity: .45; cursor: not-allowed; }
        .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; height: 38px; }
        .seg button { background: var(--surface); color: var(--text-soft); border: 0; padding: 0 12px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .seg button + button { border-left: 1px solid var(--line-2); }
        .seg button:hover, .seg button.active { background: var(--surface-2); color: var(--text-strong); }

        /* ── KPI tiles ── */
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
        .stat-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; }
        .stat-label { display: flex; align-items: center; gap: 7px; color: var(--text-dim); font-size: 12px; font-weight: 500; white-space: nowrap; }
        .stat-label .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
        .stat-value { font-size: 22px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.02em; line-height: 1.25; margin-top: 2px; font-variant-numeric: tabular-nums; }

        /* ── Tables ── */
        .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
        thead th {
            position: sticky; top: 0; z-index: 2; background: var(--surface);
            text-align: left; padding: 10px 14px; font-size: 11.5px; font-weight: 600; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--line-2); white-space: nowrap;
        }
        tbody td { padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--text-soft); vertical-align: middle; }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover td { background: rgba(255,255,255,0.025); }
        td.strong, .cell-strong { color: var(--text-strong); font-weight: 600; }
        .mono { font-family: var(--mono); font-size: 12.5px; }

        /* ── Badges / status pills ── */
        .badge {
            --c: var(--text-dim);
            display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
            padding: 2px 9px; border-radius: 999px; color: var(--text-strong);
            background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
        }
        .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
        .badge.plain::before { display: none; }
        .tag { font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 4px; background: rgba(255,255,255,0.1); color: var(--text-soft); letter-spacing: .03em; }

        /* ── Notices ── */
        .notice { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 13px;
                  background: rgba(255,255,255,0.03); border: 1px solid var(--line-2); color: var(--text-soft); }
        .notice .ico { margin-top: 1px; }
        .notice.info    { border-color: rgba(0,217,255,0.35);  background: rgba(0,217,255,0.06); }
        .notice.success { border-color: rgba(78,204,163,0.4);  background: rgba(78,204,163,0.07); color: var(--success); }
        .notice.warning { border-color: rgba(255,200,87,0.4);  background: rgba(255,200,87,0.07); color: var(--warning); }
        .notice.error   { border-color: rgba(255,107,107,0.45); background: rgba(255,107,107,0.08); color: #FF8A8A; }

        /* ── Modals ── */
        .modal { display: none; position: fixed; inset: 0; background: rgba(10,10,22,0.72); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
        .modal.show, .modal.active, .modal.open { display: flex; }
        .modal-content { background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; width: 100%; max-width: 680px; max-height: 88vh; overflow-y: auto; box-shadow: 0 30px 80px -20px rgba(0,0,0,0.75); }
        .modal-header { position: sticky; top: 0; z-index: 2; background: var(--surface); display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
        .modal-title { font-size: 17px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.01em; }
        .modal-body { padding: 18px 20px 22px; }
        .close-btn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; border-radius: 8px; color: var(--text-dim); cursor: pointer; font-size: 20px; line-height: 1; }
        .close-btn:hover { background: var(--surface-2); color: var(--text-strong); }

        /* ── Feedback ── */
        .toast { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: none; max-width: 420px; padding: 12px 16px 12px 14px; border-radius: 10px;
                 background: #26263F; color: var(--text-strong); font-size: 13.5px; border: 1px solid var(--line-2); border-left: 3px solid var(--success);
                 box-shadow: 0 16px 40px -12px rgba(0,0,0,0.7); }
        .toast.show { display: block; }
        .toast.error { border-left-color: var(--error); }
        .empty-state, .loading { text-align: center; padding: 56px 16px; color: var(--text-dim); }
        .empty-state h3 { color: var(--text-strong); font-size: 16px; margin-bottom: 4px; }
        .empty-state .ico-lg { width: 32px; height: 32px; color: var(--text-dim); margin-bottom: 10px; }
        .spinner { width: 22px; height: 22px; border: 2px solid var(--line-2); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        *::-webkit-scrollbar { width: 10px; height: 10px; }
        *::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
        *::-webkit-scrollbar-track { background: transparent; }
        @media (max-width: 768px) {
            .appbar, .container { padding-left: 14px; padding-right: 14px; }
            .wordmark { font-size: 24px; }
        }
        /* ═══ end base ═══ */

        /* ── Page: van replenishment orders ── */
        .stat-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; }

        /* Filters */
        .filters-card { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
        .filters-grid { flex: 1 1 760px; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
        .filter-actions { display: flex; gap: 8px; flex-wrap: wrap; }

        /* Orders grid */
        .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 14px; align-items: start; }
        .order-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
        .order-card:hover { border-color: var(--line-2); }
        .order-card-header { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
        .order-job { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.01em; }
        .order-submitter { color: var(--text-dim); font-size: 12.5px; margin-top: 1px; }
        .order-date { color: var(--text-dim); font-size: 12px; text-align: right; white-space: nowrap; display: flex; flex-direction: column; align-items: flex-end; }

        .order-card-body { padding: 12px 16px 14px; }
        .order-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; margin-bottom: 12px; }
        .order-info-item { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
        .order-info-label { color: var(--text-dim); font-size: 12px; }
        .order-info-value { color: var(--text-strong); font-size: 13px; font-weight: 500; word-break: break-word; }

        /* Status badge */
        .status-badge { --c: var(--text-dim); }
        .status-pending   { --c: var(--warning); }
        .status-fulfilled { --c: var(--complete); }
        .status-cancelled { --c: var(--aborted); }

        /* Items toggle */
        .items-toggle {
            width: 100%; height: 36px; padding: 0 12px; border-radius: 8px; cursor: pointer;
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            background: var(--bg); border: 1px solid var(--line); color: var(--text-soft); font-size: 13px; font-weight: 500;
            transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .items-toggle > span:first-child { display: inline-flex; align-items: center; gap: 8px; }
        .items-toggle > span:first-child .ico { color: var(--primary); }
        .items-toggle:hover { border-color: var(--line-2); color: var(--text-strong); }
        .items-toggle .arrow { display: inline-flex; color: var(--text-dim); transition: transform .2s ease; }
        .items-toggle.open { border-bottom-left-radius: 0; border-bottom-right-radius: 0; color: var(--text-strong); }
        .items-toggle.open .arrow { transform: rotate(180deg); }
        .items-list { display: none; }
        .items-list.open { display: block; max-height: 400px; overflow-y: auto; border: 1px solid var(--line); border-top: 0; border-radius: 0 0 8px 8px; padding: 2px 12px 8px; background: var(--bg); }

        .item-cat-header { font-size: 11px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; padding: 10px 0 4px; }
        .item-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); }
        .item-row:last-child { border-bottom: 0; }
        .item-name { font-size: 12.5px; color: var(--text-strong); flex: 1; }
        .item-qty { font-size: 12.5px; font-weight: 700; color: var(--text-strong); white-space: nowrap; font-variant-numeric: tabular-nums; }

        /* Card footer */
        .order-card-footer { margin-top: auto; padding: 10px 16px; border-top: 1px solid var(--line); background: rgba(255,255,255,0.015); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .total-items-badge { font-size: 12.5px; color: var(--text-dim); font-weight: 500; }
        .footer-controls { display: flex; gap: 6px; align-items: center; }
        .status-select { height: 32px; width: auto; min-width: 130px; font-size: 12.5px; padding: 0 10px; cursor: pointer; }

        .loading-state { text-align: center; padding: 56px 16px; color: var(--text-dim); grid-column: 1 / -1; }
        .empty-state { grid-column: 1 / -1; }

        @media (max-width: 768px) {
            .filters-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); flex-basis: 100%; }
            .order-info-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
<header class="appbar">
    <a href="teamview.html" class="logo" aria-label="Pingu home">
        <span class="wordmark">P<span class="i-stem">ı<svg class="i-paw" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="16.2" rx="5.6" ry="4.6"/><ellipse cx="4.6" cy="10.4" rx="2.2" ry="2.7" transform="rotate(-18 4.6 10.4)"/><ellipse cx="9.2" cy="5.6" rx="2.3" ry="2.9" transform="rotate(-6 9.2 5.6)"/><ellipse cx="14.8" cy="5.6" rx="2.3" ry="2.9" transform="rotate(6 14.8 5.6)"/><ellipse cx="19.4" cy="10.4" rx="2.2" ry="2.7" transform="rotate(18 19.4 10.4)"/></svg></span>ngu</span>
    </a>
    <div class="appbar-actions">
        <a href="admin.html" class="back-btn"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Back to Admin</a>
    </div>
</header>

<div class="container">
    <div class="page-head">
        <div>
            <h1>Van Replenishment Orders</h1>
        </div>
    </div>

    <!-- Stats -->
    <div class="stats-row" id="stats-row">
        <div class="stat-card"><div class="stat-label">Total orders</div><div class="stat-value" id="stat-total">—</div></div>
        <div class="stat-card"><div class="stat-label"><span class="dot" style="background:var(--warning)"></span>Pending</div><div class="stat-value" id="stat-pending">—</div></div>
        <div class="stat-card"><div class="stat-label"><span class="dot" style="background:var(--complete)"></span>Fulfilled</div><div class="stat-value" id="stat-fulfilled">—</div></div>
        <div class="stat-card"><div class="stat-label">This week</div><div class="stat-value" id="stat-week">—</div></div>
    </div>

    <!-- Filters -->
    <div class="filters-card">
        <div class="filters-grid">
            <div class="filter-group">
                <label class="control-label" for="f-job">Job number</label>
                <input type="text" id="f-job" class="filter-input control-input" placeholder="Search job #...">
            </div>
            <div class="filter-group">
                <label class="control-label" for="f-name">Submitted by</label>
                <input type="text" id="f-name" class="filter-input control-input" placeholder="Search name...">
            </div>
            <div class="filter-group">
                <label class="control-label" for="f-status">Status</label>
                <select id="f-status" class="filter-select control-input">
                    <option value="">All statuses</option>
                    <option value="pending">Pending</option>
                    <option value="fulfilled">Fulfilled</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>
            <div class="filter-group">
                <label class="control-label" for="f-date-from">From date</label>
                <input type="date" id="f-date-from" class="filter-input control-input">
            </div>
            <div class="filter-group">
                <label class="control-label" for="f-date-to">To date</label>
                <input type="date" id="f-date-to" class="filter-input control-input">
            </div>
        </div>
        <div class="filter-actions">
            <button class="btn btn-primary" onclick="applyFilters()">Apply filters</button>
            <button class="btn btn-ghost" onclick="clearFilters()">Clear</button>
            <button class="btn btn-secondary" onclick="loadOrders()"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/></svg>Refresh</button>
        </div>
    </div>

    <!-- Orders grid -->
    <div class="orders-grid" id="orders-grid">
        <div class="loading-state">Loading orders...</div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Firebase -->
<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, collection, getDocs, doc, updateDoc, query, orderBy }
        from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const firebaseConfig = {
        apiKey: "AIzaSyAc_yJQ_rkzuOBh-Yxg0Q4eooXtB-tQjm0",
        authDomain: "pingu-solar.firebaseapp.com",
        projectId: "pingu-solar",
        storageBucket: "pingu-solar.firebasestorage.app",
        messagingSenderId: "232764952866",
        appId: "1:232764952866:web:5923b7f419de6355d6157b",
        measurementId: "G-PFH059DZ64"
    };

    const app = initializeApp(firebaseConfig);
    window.db = getFirestore(app);
    window.firebaseModules = { collection, getDocs, doc, updateDoc, query, orderBy };
    console.log('✅ Firebase ready');
    window.addEventListener('DOMContentLoaded', () => window.loadOrders());
</script>

<script>
let allOrders = [];
let filteredOrders = [];

const ICONS = {
    package: '<path d="m7.5 4.3 9 5.1M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/>',
    inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1z"/>',
    alert: '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
    chevronDown: '<path d="m6 9 6 6 6-6"/>'
};
const ICON = (name, cls = 'ico') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;

/* ══════════════════════════════
   LOAD ORDERS
══════════════════════════════ */
window.loadOrders = async function() {
    document.getElementById('orders-grid').innerHTML = '<div class="loading-state">Loading orders...</div>';
    try {
        const { collection, getDocs, query, orderBy: ob } = window.firebaseModules;
        const snap = await getDocs(query(collection(window.db, 'Van Replenishment'), ob('submittedAt', 'desc')));
        allOrders = [];
        snap.forEach(doc => allOrders.push({ id: doc.id, ...doc.data() }));
        filteredOrders = [...allOrders];
        updateStats();
        renderOrders();
    } catch (err) {
        console.error(err);
        document.getElementById('orders-grid').innerHTML = `<div class="empty-state">${ICON('alert', 'ico-lg')}<h3>Error loading</h3><p>${escHtml(err.message)}</p></div>`;
    }
};

/* ══════════════════════════════
   STATS
══════════════════════════════ */
function updateStats() {
    const now = new Date();
    const weekAgo = new Date(now); weekAgo.setDate(now.getDate() - 7);

    const pending   = allOrders.filter(o => (o.status || 'pending') === 'pending').length;
    const fulfilled = allOrders.filter(o => o.status === 'fulfilled').length;
    const thisWeek  = allOrders.filter(o => o.submittedAt && new Date(o.submittedAt) >= weekAgo).length;

    document.getElementById('stat-total').textContent     = allOrders.length;
    document.getElementById('stat-pending').textContent   = pending;
    document.getElementById('stat-fulfilled').textContent = fulfilled;
    document.getElementById('stat-week').textContent      = thisWeek;
}

/* ══════════════════════════════
   FILTERS
══════════════════════════════ */
window.applyFilters = function() {
    const job      = document.getElementById('f-job').value.toLowerCase().trim();
    const name     = document.getElementById('f-name').value.toLowerCase().trim();
    const status   = document.getElementById('f-status').value;
    const dateFrom = document.getElementById('f-date-from').value;
    const dateTo   = document.getElementById('f-date-to').value;

    filteredOrders = allOrders.filter(o => {
        if (job    && !String(o.jobNumber || '').toLowerCase().includes(job))           return false;
        if (name   && !String(o.submittedBy || '').toLowerCase().includes(name))        return false;
        if (status && (o.status || 'pending') !== status)                               return false;
        if (dateFrom && o.submittedAt) {
            const s = new Date(dateFrom); s.setHours(0,0,0,0);
            if (new Date(o.submittedAt) < s) return false;
        }
        if (dateTo && o.submittedAt) {
            const e = new Date(dateTo); e.setHours(23,59,59,999);
            if (new Date(o.submittedAt) > e) return false;
        }
        return true;
    });
    renderOrders();
};

window.clearFilters = function() {
    ['f-job','f-name','f-status','f-date-from','f-date-to'].forEach(id => {
        document.getElementById(id).value = '';
    });
    filteredOrders = [...allOrders];
    renderOrders();
};

/* ══════════════════════════════
   RENDER
══════════════════════════════ */
function renderOrders() {
    const grid = document.getElementById('orders-grid');

    if (!filteredOrders.length) {
        grid.innerHTML = `
            <div class="empty-state">
                ${ICON('inbox', 'ico-lg')}
                <h3>No orders found</h3>
                <p>No van replenishment orders match the current filters</p>
            </div>`;
        return;
    }

    grid.innerHTML = filteredOrders.map(order => {
        const status    = order.status || 'pending';
        const statusLabel = status === 'fulfilled' ? 'Fulfilled' : status === 'cancelled' ? 'Cancelled' : 'Pending';
        const items     = order.items || [];
        const cats      = [...new Set(items.map(i => i.category))];

        const itemsHtml = cats.map(cat => {
            const catItems = items.filter(i => i.category === cat);
            return `
                <div class="item-cat-header">${escHtml(cat)}</div>
                ${catItems.map(item => `
                    <div class="item-row">
                        <div class="item-name">${escHtml(item.name)}</div>
                        <div class="item-qty">× ${item.quantity}</div>
                    </div>`).join('')}`;
        }).join('');

        return `
        <div class="order-card">
            <div class="order-card-header">
                <div>
                    <div class="order-job">#${escHtml(order.jobNumber || 'N/A')}</div>
                    <div class="order-submitter">by ${escHtml(order.submittedBy || 'Unknown')}</div>
                </div>
                <div class="order-date">
                    <div>${formatDate(order.submittedAt)}</div>
                    <div style="margin-top:6px;">
                        <span class="status-badge badge status-${escHtml(status)}">${statusLabel}</span>
                    </div>
                </div>
            </div>
            <div class="order-card-body">
                <div class="order-info-grid">
                    <div class="order-info-item">
                        <div class="order-info-label">Customer</div>
                        <div class="order-info-value">${escHtml(order.customerName || 'N/A')}</div>
                    </div>
                    <div class="order-info-item">
                        <div class="order-info-label">Postcode</div>
                        <div class="order-info-value">${escHtml(order.postcode || 'N/A')}</div>
                    </div>
                    <div class="order-info-item">
                        <div class="order-info-label">Delivery address</div>
                        <div class="order-info-value">${escHtml(order.address || 'N/A')}</div>
                    </div>
                    <div class="order-info-item">
                        <div class="order-info-label">Delivery date</div>
                        <div class="order-info-value">${escHtml(order.deliveryDate || 'N/A')}</div>
                    </div>
                    <div class="order-info-item">
                        <div class="order-info-label">Lead engineer</div>
                        <div class="order-info-value">${escHtml(order.leadEngineer || 'N/A')}</div>
                    </div>
                </div>

                <button class="items-toggle" id="toggle-${order.id}" onclick="toggleItems('${order.id}')">
                    <span>${ICON('package')}${items.length} item${items.length !== 1 ? 's' : ''} ordered</span>
                    <span class="arrow">${ICON('chevronDown')}</span>
                </button>
                <div class="items-list" id="items-${order.id}">
                    ${itemsHtml || '<div style="padding:8px 0;color:var(--text-dim);font-size:12.5px;">No items</div>'}
                </div>
            </div>
            <div class="order-card-footer">
                <span class="total-items-badge">${items.length} item${items.length !== 1 ? 's' : ''}</span>
                <div class="footer-controls">
                    <select class="status-select control-input" id="status-${order.id}">
                        <option value="pending"   ${status === 'pending'   ? 'selected' : ''}>Pending</option>
                        <option value="fulfilled" ${status === 'fulfilled' ? 'selected' : ''}>Fulfilled</option>
                        <option value="cancelled" ${status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
                    </select>
                    <button class="save-status-btn btn btn-primary btn-sm" onclick="saveStatus('${order.id}')">Save</button>
                </div>
            </div>
        </div>`;
    }).join('');
}

/* ══════════════════════════════
   TOGGLE ITEMS
══════════════════════════════ */
window.toggleItems = function(id) {
    const list = document.getElementById(`items-${id}`);
    const btn  = document.getElementById(`toggle-${id}`);
    const open = list.classList.toggle('open');
    btn.classList.toggle('open', open);
};

/* ══════════════════════════════
   SAVE STATUS
══════════════════════════════ */
window.saveStatus = async function(id) {
    const newStatus = document.getElementById(`status-${id}`).value;
    try {
        const { doc, updateDoc } = window.firebaseModules;
        await updateDoc(doc(window.db, 'Van Replenishment', id), {
            status: newStatus,
            statusUpdatedAt: new Date().toISOString()
        });
        const order = allOrders.find(o => o.id === id);
        if (order) order.status = newStatus;
        showToast(`Status updated to ${newStatus}`, 'success');
        updateStats();
        renderOrders();
    } catch (err) {
        console.error(err);
        showToast('Failed to update status: ' + err.message, 'error');
    }
};

/* ══════════════════════════════
   UTILS
══════════════════════════════ */
function formatDate(iso) {
    if (!iso) return 'N/A';
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function escHtml(t) {
    const d = document.createElement('div');
    d.textContent = String(t ?? '');
    return d.innerHTML;
}

function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast show${type === 'error' ? ' error' : ''}`;
    setTimeout(() => t.classList.remove('show'), 4000);
}

/* Live filter on input */
document.addEventListener('DOMContentLoaded', () => {
    ['f-job','f-name','f-status'].forEach(id => {
        document.getElementById(id)?.addEventListener('input', applyFilters);
        document.getElementById(id)?.addEventListener('change', applyFilters);
    });
});
</script>
</body>
</html>
