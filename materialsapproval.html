<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materials Approval | Pingu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        /* ═══ Pingu design system — base (copy verbatim into each page's <style>) ═══ */
        :root {
            /* Brand + status palette */
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --secondary: #FFC857;
            --accent: #00D9FF;
            --dark: #1A1A2E;
            --dark-light: #252541;
            --dark-lighter: #2F2F4A;
            --text: #EAEAEA;
            --text-dim: #9A9AB0;
            --success: #4ECCA3;
            --error: #FF6B6B;
            --warning: #FFC857;
            --in-progress: #00D9FF;
            --complete: #4ECCA3;
            --aborted: #FF6B6B;
            --cancelled: #9A9AB0;
            --short-notice: #90ee90;
            --on-hold: #FFDE00;
            --scheduled: #FF6B35;
            /* Surfaces & type */
            --bg: #161628;
            --surface: #1F1F35;
            --surface-2: #252541;
            --line: rgba(255,255,255,0.07);
            --line-2: rgba(255,255,255,0.12);
            --text-strong: #F4F4F8;
            --text-soft: #C8C8D6;
            --radius: 10px;
            --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: var(--font); font-size: 14px; line-height: 1.5;
            background: var(--bg); color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        button, input, select, textarea { font-family: inherit; }
        a { color: var(--accent); }
        .ico { width: 16px; height: 16px; flex: 0 0 auto; vertical-align: -3px; }
        .ico-lg { width: 20px; height: 20px; flex: 0 0 auto; }

        /* ── App bar + Pingu wordmark ── */
        .appbar {
            position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            height: 64px; padding: 0 28px;
            background: rgba(22, 22, 40, 0.92);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line);
        }
        .appbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .logo { display: inline-flex; align-items: center; text-decoration: none; }
        .wordmark {
            font-family: 'Inter', var(--font); font-weight: 800; font-size: 28px;
            letter-spacing: -0.045em; line-height: 1; color: var(--text-strong); padding-top: 6px;
        }
        .i-stem { position: relative; display: inline-block; }
        .i-paw {
            position: absolute; left: 50%; top: -0.17em; transform: translateX(-50%) rotate(-10deg);
            width: 0.5em; height: 0.5em; fill: var(--primary);
            filter: drop-shadow(0 1px 4px rgba(255,107,53,0.35));
            transition: transform .2s ease;
        }
        .logo:hover .i-paw { transform: translateX(-50%) rotate(4deg) scale(1.08); }
        .logo:hover .wordmark { color: #fff; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-soft); text-decoration: none; font-size: 13px; font-weight: 500;
            padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; cursor: pointer;
            transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .back-btn:hover { background: var(--surface-2); color: var(--text-strong); border-color: rgba(255,255,255,0.2); }

        /* ── Page layout ── */
        .container { padding: 24px 28px 40px; }
        .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
        h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-strong); line-height: 1.2; }
        h2 { font-size: 16px; font-weight: 600; color: var(--text-strong); letter-spacing: -0.01em; }
        h3 { font-size: 14px; font-weight: 600; color: var(--text-strong); }
        .muted { color: var(--text-dim); }
        .toolbar { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }

        /* ── Panels / cards ── */
        .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
        .panel + .panel { margin-top: 16px; }
        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -2px 0 14px; }
        .panel-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--text-strong); }
        .panel-title .ico { color: var(--primary); }

        /* ── Form controls ── */
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-label { color: var(--text-dim); font-size: 11.5px; font-weight: 500; }
        .control-input {
            height: 38px; background: var(--surface); border: 1px solid var(--line-2);
            color: var(--text-strong); padding: 0 12px; border-radius: 8px; font-size: 13.5px; width: 100%;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        textarea.control-input { height: auto; min-height: 84px; padding: 9px 11px; resize: vertical; }
        .control-input:hover { border-color: rgba(255,255,255,0.2); }
        .control-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.22); }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); cursor: pointer; }
        input[type="checkbox"], input[type="radio"] { accent-color: var(--primary); }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 7px;
            height: 38px; padding: 0 16px; border-radius: 8px; cursor: pointer;
            font-size: 13.5px; font-weight: 600; text-decoration: none; white-space: nowrap;
            border: 1px solid transparent; transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--surface-2); color: var(--text-strong); border-color: var(--line-2); }
        .btn-secondary:hover { background: var(--dark-lighter); border-color: rgba(255,255,255,0.25); }
        .btn-ghost { background: transparent; color: var(--text-soft); border-color: var(--line-2); }
        .btn-ghost:hover { background: var(--surface-2); color: var(--text-strong); }
        .btn-danger { background: rgba(255,107,107,0.12); color: #FF8A8A; border-color: rgba(255,107,107,0.4); }
        .btn-danger:hover { background: rgba(255,107,107,0.22); }
        .btn-success { background: rgba(78,204,163,0.14); color: var(--success); border-color: rgba(78,204,163,0.45); }
        .btn-success:hover { background: rgba(78,204,163,0.24); }
        .btn-sm { height: 32px; padding: 0 12px; font-size: 12.5px; }
        .btn:disabled, button:disabled { opacity: .45; cursor: not-allowed; }
        .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; height: 38px; }
        .seg button { background: var(--surface); color: var(--text-soft); border: 0; padding: 0 12px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .seg button + button { border-left: 1px solid var(--line-2); }
        .seg button:hover, .seg button.active { background: var(--surface-2); color: var(--text-strong); }

        /* ── KPI tiles ── */
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
        .stat-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; }
        .stat-label { display: flex; align-items: center; gap: 7px; color: var(--text-dim); font-size: 12px; font-weight: 500; white-space: nowrap; }
        .stat-label .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
        .stat-value { font-size: 22px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.02em; line-height: 1.25; margin-top: 2px; font-variant-numeric: tabular-nums; }

        /* ── Tables ── */
        .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
        thead th {
            position: sticky; top: 0; z-index: 2; background: var(--surface);
            text-align: left; padding: 10px 14px; font-size: 11.5px; font-weight: 600; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--line-2); white-space: nowrap;
        }
        tbody td { padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--text-soft); vertical-align: middle; }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover td { background: rgba(255,255,255,0.025); }
        td.strong, .cell-strong { color: var(--text-strong); font-weight: 600; }
        .mono { font-family: var(--mono); font-size: 12.5px; }

        /* ── Badges / status pills ── */
        .badge {
            --c: var(--text-dim);
            display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
            padding: 2px 9px; border-radius: 999px; color: var(--text-strong);
            background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
        }
        .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
        .badge.plain::before { display: none; }
        .tag { font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 4px; background: rgba(255,255,255,0.1); color: var(--text-soft); letter-spacing: .03em; }

        /* ── Notices ── */
        .notice { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 13px;
                  background: rgba(255,255,255,0.03); border: 1px solid var(--line-2); color: var(--text-soft); }
        .notice .ico { margin-top: 1px; }
        .notice.info    { border-color: rgba(0,217,255,0.35);  background: rgba(0,217,255,0.06); }
        .notice.success { border-color: rgba(78,204,163,0.4);  background: rgba(78,204,163,0.07); color: var(--success); }
        .notice.warning { border-color: rgba(255,200,87,0.4);  background: rgba(255,200,87,0.07); color: var(--warning); }
        .notice.error   { border-color: rgba(255,107,107,0.45); background: rgba(255,107,107,0.08); color: #FF8A8A; }

        /* ── Modals ── */
        .modal { display: none; position: fixed; inset: 0; background: rgba(10,10,22,0.72); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
        .modal.show, .modal.active, .modal.open { display: flex; }
        .modal-content { background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; width: 100%; max-width: 680px; max-height: 88vh; overflow-y: auto; box-shadow: 0 30px 80px -20px rgba(0,0,0,0.75); }
        .modal-header { position: sticky; top: 0; z-index: 2; background: var(--surface); display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
        .modal-title { font-size: 17px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.01em; }
        .modal-body { padding: 18px 20px 22px; }
        .close-btn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; border-radius: 8px; color: var(--text-dim); cursor: pointer; font-size: 20px; line-height: 1; }
        .close-btn:hover { background: var(--surface-2); color: var(--text-strong); }

        /* ── Feedback ── */
        .toast { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: none; max-width: 420px; padding: 12px 16px 12px 14px; border-radius: 10px;
                 background: #26263F; color: var(--text-strong); font-size: 13.5px; border: 1px solid var(--line-2); border-left: 3px solid var(--success);
                 box-shadow: 0 16px 40px -12px rgba(0,0,0,0.7); }
        .toast.show { display: block; }
        .toast.error { border-left-color: var(--error); }
        .empty-state, .loading { text-align: center; padding: 56px 16px; color: var(--text-dim); }
        .empty-state h3 { color: var(--text-strong); font-size: 16px; margin-bottom: 4px; }
        .empty-state .ico-lg { width: 32px; height: 32px; color: var(--text-dim); margin-bottom: 10px; }
        .spinner { width: 22px; height: 22px; border: 2px solid var(--line-2); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        *::-webkit-scrollbar { width: 10px; height: 10px; }
        *::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
        *::-webkit-scrollbar-track { background: transparent; }
        @media (max-width: 768px) {
            .appbar, .container { padding-left: 14px; padding-right: 14px; }
            .wordmark { font-size: 24px; }
        }
        /* ═══ end base ═══ */

        /* ═══ Materials Approval — page styles ═══ */
        :root { --kf: #B57BFF; }
        .page-sub { font-size: 13px; margin-top: 4px; }

        /* Controls */
        .controls-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
        .search-wrap { position: relative; flex: 1; min-width: 220px; max-width: 520px; }
        .search-wrap .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-dim); pointer-events: none; }
        .search-input { padding-left: 36px; }
        .search-input::placeholder { color: var(--text-dim); }
        .filter-tabs { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; height: 38px; }
        .ftab { display: inline-flex; align-items: center; gap: 7px; background: var(--surface); color: var(--text-soft); border: 0; padding: 0 14px; font-size: 13px; font-weight: 500; cursor: pointer; transition: background .15s ease, color .15s ease; }
        .ftab + .ftab { border-left: 1px solid var(--line-2); }
        .ftab:hover { background: var(--surface-2); color: var(--text-strong); }
        .ftab .dot { width: 7px; height: 7px; border-radius: 50%; }
        .ftab.active-all, .ftab.active-pending, .ftab.active-approved { background: var(--surface-2); color: var(--text-strong); font-weight: 600; box-shadow: inset 0 -2px 0 var(--primary); }
        .ftab.active-pending  { box-shadow: inset 0 -2px 0 var(--warning); }
        .ftab.active-approved { box-shadow: inset 0 -2px 0 var(--complete); }
        .ctrl-sep { display: none; }
        .refresh-btn { margin-left: auto; }
        #refresh-icon { display: inline-flex; }

        /* KPI tiles */
        .stats-bar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
        .stat-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; }
        .stat-lbl { display: flex; align-items: center; gap: 7px; color: var(--text-dim); font-size: 12px; font-weight: 500; white-space: nowrap; }
        .stat-lbl .dot { width: 8px; height: 8px; border-radius: 50%; }
        .stat-val { font-size: 22px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.02em; line-height: 1.25; margin-top: 2px; font-variant-numeric: tabular-nums; }
        .c-warning { color: var(--warning); }
        .c-green   { color: var(--complete); }

        .state-msg { display: none; text-align: center; padding: 56px 16px; color: var(--text-dim); font-size: 13.5px; }
        .state-msg.show { display: block; }
        .state-msg .icon { margin-bottom: 8px; }
        .state-msg .icon .ico { width: 28px; height: 28px; }

        /* Survey cards */
        .surveys-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 680px), 1fr)); gap: 14px; align-items: start; }
        .survey-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; transition: border-color .15s ease; }
        .survey-card:hover { border-color: var(--line-2); }
        .survey-card.is-approved { border-color: color-mix(in srgb, var(--complete) 30%, transparent); }
        .card-stripe { height: 3px; width: 100%; }
        .stripe-pending  { background: var(--warning); }
        .stripe-approved { background: var(--complete); }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; padding: 14px 18px 12px; border-bottom: 1px solid var(--line); }
        .card-header-left { flex: 1; min-width: 0; }
        .card-job-num { font-family: var(--mono); font-size: 15px; font-weight: 700; color: var(--text-strong); }
        .card-customer { font-size: 14px; color: var(--text-strong); font-weight: 500; margin-top: 2px; }
        .card-address, .card-install { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-dim); margin-top: 2px; }
        .card-address .ico, .card-install .ico { width: 13px; height: 13px; }
        .card-install { color: var(--text-soft); }
        .card-header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
        .b-pending  { --c: var(--warning); }
        .b-approved { --c: var(--complete); }
        .card-meta-pills { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
        .pill { font-size: 11.5px; font-weight: 500; color: var(--text-soft); background: var(--surface-2); border: 1px solid var(--line); padding: 1px 8px; border-radius: 6px; white-space: nowrap; }
        .pill.highlight { color: var(--text-strong); font-weight: 600; }

        .card-body { padding: 14px 18px; display: flex; flex-direction: column; gap: 16px; }
        .section-label { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
        .section-label .ico { color: var(--primary); }
        .section-label::after { content: ''; flex: 1; height: 1px; background: var(--line); }

        .picklist-table { border: 1px solid var(--line); border-radius: 10px; border-collapse: separate; overflow: hidden; }
        .picklist-table td.qty { color: var(--text-strong); font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; }
        .picklist-table td.cat { color: var(--text-dim); font-size: 12.5px; }
        .picklist-table td.part-id { font-family: var(--mono); font-size: 12px; color: var(--text-strong); }

        .materials-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
        .material-row { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); border-left: 3px solid transparent; transition: background .15s ease, border-color .15s ease; }
        .material-row:last-child { border-bottom: 0; }
        .material-row.approved { background: rgba(78,204,163,0.06); border-left-color: var(--complete); }
        .material-row.denied   { background: rgba(255,107,107,0.05); border-left-color: var(--error); }
        .material-row.denied .mat-name { color: var(--text-dim); text-decoration: line-through; }
        .mat-info { min-width: 0; }
        .mat-name { font-size: 13.5px; color: var(--text-strong); font-weight: 500; }
        .mat-cat { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
        .mat-part-id, .mat-pack-size { display: inline-block; margin-top: 4px; font-family: var(--mono); font-size: 11px; font-weight: 500; padding: 0 6px; border-radius: 5px; letter-spacing: .02em; }
        .mat-part-id { color: var(--text-strong); background: color-mix(in srgb, var(--kf) 14%, transparent); border: 1px solid color-mix(in srgb, var(--kf) 36%, transparent); }
        .mat-pack-size { margin-left: 4px; color: var(--text-soft); background: var(--surface-2); border: 1px solid var(--line-2); }
        .mat-qty-wrap { display: flex; align-items: center; gap: 6px; }
        .mat-qty-lbl { font-size: 12px; color: var(--text-dim); }
        .mat-qty-input { width: 64px; height: 32px; text-align: center; background: var(--bg); border: 1px solid var(--line-2); color: var(--text-strong); border-radius: 7px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
        .mat-qty-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.22); }
        .mat-qty-input:disabled { opacity: .45; cursor: not-allowed; }
        .mat-actions { display: flex; gap: 6px; }
        .btn-approve, .btn-deny { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 7px; font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background .15s ease, border-color .15s ease, color .15s ease; }
        .btn-approve .ico, .btn-deny .ico { width: 14px; height: 14px; }
        .btn-approve { background: transparent; color: var(--success); border: 1px solid rgba(78,204,163,0.45); }
        .btn-approve:hover:not(:disabled) { background: rgba(78,204,163,0.14); }
        .btn-approve.active { background: var(--success); color: #10241d; border-color: var(--success); }
        .btn-deny { background: transparent; color: #FF8A8A; border: 1px solid rgba(255,107,107,0.45); }
        .btn-deny:hover:not(:disabled) { background: rgba(255,107,107,0.12); }
        .btn-deny.active { background: var(--error); color: #fff; border-color: var(--error); }

        .submit-section { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--line); background: var(--bg); }
        .submit-progress { font-size: 13px; color: var(--text-dim); }
        .submit-progress span { color: var(--text-strong); font-weight: 600; font-variant-numeric: tabular-nums; }
        .btn-submit { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 16px; border: 0; border-radius: 8px; cursor: pointer; background: var(--primary); color: #fff; font-size: 13.5px; font-weight: 600; transition: background .15s ease; }
        .btn-submit:hover:not(:disabled) { background: var(--primary-dark); }
        .already-approved-banner { width: 100%; display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 8px; font-size: 13px; color: var(--success); background: rgba(78,204,163,0.07); border: 1px solid rgba(78,204,163,0.4); }

        .approved-materials-list { display: flex; flex-direction: column; }
        .approved-materials-list .section-label .ico { color: var(--complete); }
        .approved-material-row { display: flex; align-items: center; gap: 14px; padding: 10px 12px; border: 1px solid var(--line); border-left: 3px solid var(--complete); border-radius: 8px; background: rgba(78,204,163,0.04); }
        .approved-material-row + .approved-material-row { margin-top: 6px; }
        .approved-qty { min-width: 56px; text-align: center; font-weight: 600; font-size: 13px; color: var(--text-strong); background: color-mix(in srgb, var(--complete) 16%, transparent); border: 1px solid color-mix(in srgb, var(--complete) 40%, transparent); padding: 2px 8px; border-radius: 6px; font-variant-numeric: tabular-nums; }
        .no-mats { padding: 12px; border-radius: 8px; font-size: 13px; color: var(--text-dim); border: 1px dashed var(--line-2); text-align: center; }

        #back-top { position: fixed; bottom: 24px; right: 24px; z-index: 100; display: none; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 10px; cursor: pointer; background: var(--surface-2); color: var(--text-strong); border: 1px solid var(--line-2); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.7); }
        #back-top.show { display: flex; }
        #back-top:hover { background: var(--dark-lighter); }
        #back-top .ico { transform: rotate(-90deg); }
        .toast { left: 50%; right: auto; transform: translateX(-50%); }

        @media (max-width: 768px) {
            .stats-bar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .search-wrap { flex-basis: 100%; max-width: none; }
            .filter-tabs { flex: 1; }
            .ftab { flex: 1; justify-content: center; padding: 0 8px; }
            .refresh-btn { margin-left: 0; }
            .card-header { flex-direction: column; }
            .card-header-left { width: 100%; flex: 0 0 auto; }
            .card-body > div { min-width: 0; overflow-x: auto; }
            .card-header-right { align-items: flex-start; }
            .card-meta-pills { justify-content: flex-start; }
            .material-row { grid-template-columns: 1fr auto; }
            .mat-info { grid-column: 1 / -1; }
            .mat-actions { justify-content: flex-end; }
            .submit-section { flex-direction: column; align-items: stretch; }
            .approved-material-row { flex-direction: column; align-items: flex-start; gap: 6px; }
            .toast { left: 16px; right: 16px; transform: none; max-width: none; }
        }
    </style>

    'check-mark': '<path d="M20 6 9 17l-5-5"/>',
    close:     '<path d="M18 6 6 18M6 6l12 12"/>',
    clipboard: '<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12h6M9 16h6"/>',
    zap:       '<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',
    mail:      '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
    pin:       '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>',
    calendar:  '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>'
};
const ICON = name => `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;

function esc(t) {
    const d = document.createElement('div');
    d.textContent = String(t ?? '');
    return d.innerHTML;
}

function fmtDate(str) {
    if (!str) return '—';
    const ddmmyyyy = str.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if (ddmmyyyy) {
        const d = new Date(`${ddmmyyyy[3]}-${ddmmyyyy[2]}-${ddmmyyyy[1]}`);
        return isNaN(d) ? str : d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
    }
    const d = new Date(str);
    return isNaN(d) ? str : d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
}

function showToast(msg, error = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (error ? ' error' : '');
    setTimeout(() => t.classList.remove('show'), 3500);
}

function parseMaterials(rawArr) {
    if (!Array.isArray(rawArr)) return [];
    const re = /^[•·-]?\s*(Electrical|Roof|KF|Other)?:?\s*(.+?)\s*[×x]\s*(\d+)\s*$/i;
    return rawArr.map(line => {
        const m = String(line).match(re);
        if (m) return { category: m[1] || 'Other', name: m[2].trim(), qty: parseInt(m[3], 10), raw: line };
        return { category: 'Other', name: String(line).replace(/^[•·-]\s*/, '').trim(), qty: 1, raw: line };
    }).filter(m => m.name);
}

function parsePicklist(survey) {
    const items = [];
    const pl = survey.sections?.picklist || survey.sections?.materials || survey.picklist;
    if (Array.isArray(pl)) {
        pl.forEach(item => {
            if (item && (item.name || item.item)) {
                items.push({
                    name: item.name || item.item,
                    qty: item.qty || item.quantity || 1,
                    category: item.category || item.type || '—'
                });
            }
        });
    }
    return items;
}

function isApproved(survey) { return survey._approvedAt != null; }

function buildApprovedMaterialsList(approvedMats) {
    if (!Array.isArray(approvedMats) || approvedMats.length === 0) {
        return '<div class="no-mats">No materials were approved.</div>';
    }
    const rows = approvedMats.map(m => {
        const pid = m.partId || getPartId(m.name);
        const pack = m.packSize || getPackSize(m.name);
        const pidHtml = pid ? `<span class="mat-part-id">${esc(pid)}</span>` : '';
        const packHtml = pack ? `<span class="mat-pack-size">${esc(pack)}</span>` : '';
        return `
        <div class="approved-material-row">
            <div class="mat-info" style="flex:1">
                <div class="mat-name">${esc(m.name)}</div>
                ${pidHtml}${packHtml}
                <div class="mat-cat">${esc(m.category || 'Other')}</div>
            </div>
            <div class="approved-qty">× ${esc(m.qty)}</div>
        </div>`;
    }).join('');
    return `
    <div class="approved-materials-list">
        <div class="section-label">${ICON('check')}Approved items (with final quantities)</div>
        ${rows}
    </div>`;
}

window.loadData = async function () {
    const btn = document.getElementById('refresh-btn');
    const icon = document.getElementById('refresh-icon');
    document.getElementById('loading-state').classList.add('show');
    document.getElementById('empty-state').classList.remove('show');
    document.getElementById('surveys-list').innerHTML = '';
    btn.disabled = true;
    icon.style.animation = 'spin 0.8s linear infinite';

    try {
        const [surveysSnap, jobsSnap, approvedSnap] = await Promise.all([
            getDocs(collection(db, 'site-surveys')),
            getDocs(collection(db, 'Solar-jobs')),
            getDocs(collection(db, 'approved-additional-materials'))
        ]);

        const jobMap = {};
        jobsSnap.forEach(d => {
            const jd = d.data();
            const num = String(jd['Job Number'] || '').trim();
            if (num) jobMap[num] = jd;
        });

        const approvedMap = {};
        approvedSnap.forEach(d => { approvedMap[d.id] = d.data(); });

        const raw = surveysSnap.docs
            .map(d => ({ _docId: d.id, ...d.data() }))
            .filter(s => {
                const submittedAt = s.submittedAt || s.sections?.surveyDetails?.conductedOn;
                if (!submittedAt) return false;
                const date = new Date(submittedAt);
                if (date < CUTOFF) return false;
                const hasMats = Array.isArray(s.sections?.additionalMaterials) && s.sections.additionalMaterials.length > 0;
                const hasPicklist = parsePicklist(s).length > 0;
                return hasMats || hasPicklist;
            })
            .sort((a, b) => {
                const ta = a.submittedAt || a.sections?.surveyDetails?.conductedOn || '';
                const tb = b.submittedAt || b.sections?.surveyDetails?.conductedOn || '';
                return String(tb).localeCompare(String(ta));
            });

        window._surveys = raw.map(s => {
            const num = String(s.jobNumber || '').trim();
            const jd = jobMap[num] || {};
            const ap = approvedMap[s._docId];
            return {
                ...s,
                _address: jd['1st line of address'] || '',
                _postcode: jd['Postcode'] || '',
                _custName: jd['Name'] || s.sections?.customerSignOff?.name || '',
                _installDate: jd['Install Date'] || '',
                _approvedAt: ap?.approvedAt || null,
                _approvedMats: ap?.approvedMaterials || null,
            };
        });

        window._surveys.forEach(s => {
            if (!window._approvals[s._docId]) {
                const mats = parseMaterials(s.sections?.additionalMaterials);
                const state = {};
                mats.forEach((m, i) => { state[i] = { approved: null, qty: m.qty }; });
                window._approvals[s._docId] = state;
            }
        });

        renderAll();
    } catch (e) {
        console.error(e);
        document.getElementById('surveys-list').innerHTML =
            `<div class="state-msg show"><div class="icon">${ICON('alert')}</div>Firebase error: ${esc(e.message)}</div>`;
    } finally {
        btn.disabled = false;
        icon.style.animation = '';
        document.getElementById('loading-state').classList.remove('show');
    }
};

window.setFilter = function (f) {
    window._filter = f;
    document.querySelectorAll('.ftab').forEach(b => b.className = 'ftab');
    const cls = f === 'approved' ? 'active-approved' : f === 'pending' ? 'active-pending' : 'active-all';
    document.getElementById('ftab-' + f).classList.add(cls);
    renderAll();
};

window.renderAll = function () {
    const f = window._filter;
    const search = document.getElementById('search-input').value.trim().toLowerCase();
    const all = window._surveys;
    let shown = all.filter(s => {
        if (f === 'approved' && !isApproved(s)) return false;
        if (f === 'pending' && isApproved(s)) return false;
        if (search) {
            const hay = `${s.jobNumber} ${s._custName} ${s._address} ${s._postcode}`.toLowerCase();
            if (!hay.includes(search)) return false;
        }
        return true;
    });

    document.getElementById('stat-total').textContent = all.length;
    document.getElementById('stat-pending').textContent = all.filter(s => !isApproved(s)).length;
    document.getElementById('stat-approved').textContent = all.filter(s => isApproved(s)).length;
    document.getElementById('stat-picklist').textContent = all.filter(s => parsePicklist(s).length > 0).length;

    const listEl = document.getElementById('surveys-list');
    const emptyEl = document.getElementById('empty-state');
    if (!shown.length) { emptyEl.classList.add('show'); listEl.innerHTML = ''; return; }
    emptyEl.classList.remove('show');
    listEl.innerHTML = shown.map((s, i) => buildCard(s, i)).join('');
};

function buildCard(s, idx) {
    const id = s._docId;
    const approved = isApproved(s);
    const jobNum = esc(s.jobNumber || id);
    const customer = esc(s._custName || '—');
    const address = esc(s._address ? `${s._address}${s._postcode ? ', ' + s._postcode : ''}` : s._postcode || '—');
    const surveyor = esc(s.sections?.surveyDetails?.surveyor || '—');
    const survDate = fmtDate(s.sections?.surveyDetails?.conductedOn || s.submittedAt);
    const installDate = s._installDate ? fmtDate(s._installDate) : '—';
    const survType = s.surveyType === 'battery-and-solar' ? 'Battery & Solar' : 'Battery Only';
    const picklist = parsePicklist(s);
    const materials = parseMaterials(s.sections?.additionalMaterials);
    const apState = window._approvals[id] || {};
    const total = materials.length;
    const actioned = Object.values(apState).filter(v => v.approved !== null).length;

    const picklistHtml = picklist.length ? `
        <div>
            <div class="section-label">${ICON('clipboard')}Standard picklist</div>
            <table class="picklist-table">
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Category</th>
                        <th>Part Code</th>
                        <th>Pack Size</th>
                        <th style="text-align:center">Qty</th>
                    </tr>
                </thead>
                <tbody>
                    ${picklist.map(item => {
                        const pid = getPartId(item.name);
                        const pack = getPackSize(item.name);
                        return `
                        <tr>
                            <td>${esc(item.name)}</td>
                            <td class="cat">${esc(item.category)}</td>
                            <td class="part-id">${pid ? esc(pid) : '<span style="color:var(--text-dim);font-size:0.72rem">—</span>'}</td>
                            <td class="part-id">${pack ? esc(pack) : '<span style="color:var(--text-dim);font-size:0.72rem">—</span>'}</td>
                            <td class="qty">${esc(String(item.qty))}</td>
                        </tr>`;
                    }).join('')}
                </tbody>
            </table>
        </div>` : '';

    let matsHtml = '';
    if (approved) {
        matsHtml = buildApprovedMaterialsList(s._approvedMats);
    } else if (materials.length) {
        const rows = materials.map((mat, i) => {
            const st = apState[i] || { approved: null, qty: mat.qty };
            const rowCls = st.approved === true ? 'approved' : st.approved === false ? 'denied' : '';
            const appCls = st.approved === true ? 'active' : '';
            const denCls = st.approved === false ? 'active' : '';
            const disabled = approved ? 'disabled' : '';
            const pid = getPartId(mat.name);
            const pack = getPackSize(mat.name);
            const pidHtml = pid ? `<span class="mat-part-id">${esc(pid)}</span>` : '';
            const packHtml = pack ? `<span class="mat-pack-size">${esc(pack)}</span>` : '';

            return `
            <div class="material-row ${rowCls}" id="matrow-${id}-${i}">
                <div class="mat-info">
                    <div class="mat-name">${esc(mat.name)}</div>
                    ${pidHtml}${packHtml}
                    <div class="mat-cat">${esc(mat.category)}</div>
                </div>
                <div class="mat-qty-wrap">
                    <span class="mat-qty-lbl">Qty</span>
                    <input type="number" class="mat-qty-input" min="1"
                        id="qty-${id}-${i}" value="${st.qty}"
                        ${approved ? 'disabled' : ''}
                        onchange="updateQty('${id}', ${i}, this.value)" />
                </div>
                <div class="mat-actions">
                    <button class="btn-approve ${appCls}" id="app-${id}-${i}"
                        onclick="setApproval('${id}', ${i}, true)" ${disabled}>${ICON('check-mark')}Approve</button>
                    <button class="btn-deny ${denCls}" id="den-${id}-${i}"
                        onclick="setApproval('${id}', ${i}, false)" ${disabled}>${ICON('close')}Deny</button>
                </div>
            </div>`;
        }).join('');

        matsHtml = `
        <div>
            <div class="section-label">${ICON('zap')}Additional materials requested</div>
            <div class="materials-list">${rows}</div>
        </div>`;
    } else {
        matsHtml = `
        <div>
            <div class="section-label">${ICON('zap')}Additional materials requested</div>
            <div class="no-mats">No additional materials requested for this survey.</div>
        </div>`;
    }

    let submitHtml = '';
    if (approved) {
        submitHtml = `
        <div class="submit-section">
            <div class="already-approved-banner">
                ${ICON('check')}Materials approved on ${fmtDate(s._approvedAt)} — email sent to procurement.
            </div>
        </div>`;
    } else if (materials.length) {
        submitHtml = `
        <div class="submit-section">
            <div class="submit-progress">
                <span>${actioned}</span> / <span>${total}</span> materials reviewed
            </div>
            <button class="btn-submit" id="sub-${id}"
                onclick="submitApproval('${id}')"
                ${actioned < total ? 'disabled' : ''}>
                ${ICON('mail')}Submit approval &amp; send email
            </button>
        </div>`;
    }

    return `
    <div class="survey-card${approved ? ' is-approved' : ''}" id="card-${id}" style="animation-delay:${idx * 0.06}s">
        <div class="card-stripe ${approved ? 'stripe-approved' : 'stripe-pending'}"></div>
        <div class="card-header">
            <div class="card-header-left">
                <div class="card-job-num">#${jobNum}</div>
                <div class="card-customer">${customer}</div>
                <div class="card-address">${ICON('pin')}${address}</div>
                <div class="card-install">${ICON('calendar')}Install: ${installDate}</div>
            </div>
            <div class="card-header-right">
                <span class="badge ${approved ? 'b-approved' : 'b-pending'}">
                    ${approved ? 'Approved' : 'Pending review'}
                </span>
                <div class="card-meta-pills">
                    <span class="pill">${survType}</span>
                    <span class="pill">${survDate}</span>
                    <span class="pill highlight">${surveyor}</span>
                </div>
            </div>
        </div>
        <div class="card-body">
            ${picklistHtml}
            ${matsHtml}
        </div>
        ${submitHtml}
    </div>`;
}

window.updateQty = function (id, idx, val) {
    if (!window._approvals[id]) return;
    window._approvals[id][idx].qty = Math.max(1, parseInt(val, 10) || 1);
    updateSubmitBtn(id);
};

window.setApproval = function (id, idx, approved) {
    if (!window._approvals[id]) return;
    window._approvals[id][idx].approved = approved;
    const row = document.getElementById(`matrow-${id}-${idx}`);
    const appB = document.getElementById(`app-${id}-${idx}`);
    const denB = document.getElementById(`den-${id}-${idx}`);
    if (row) { row.className = `material-row ${approved ? 'approved' : 'denied'}`; }
    if (appB) { appB.className = `btn-approve ${approved ? 'active' : ''}`; }
    if (denB) { denB.className = `btn-deny ${!approved ? 'active' : ''}`; }
    const qtyEl = document.getElementById(`qty-${id}-${idx}`);
    if (qtyEl) qtyEl.disabled = !approved;
    updateSubmitBtn(id);
};

function updateSubmitBtn(id) {
    const survey = window._surveys.find(s => s._docId === id);
    if (!survey) return;
    const mats = parseMaterials(survey.sections?.additionalMaterials);
    const apState = window._approvals[id] || {};
    const total = mats.length;
    const actioned = Object.values(apState).filter(v => v.approved !== null).length;
    const progEl = document.querySelector(`#card-${id} .submit-progress`);
    const subBtn = document.getElementById(`sub-${id}`);
    if (progEl) progEl.innerHTML = `<span>${actioned}</span> / <span>${total}</span> materials reviewed`;
    if (subBtn) subBtn.disabled = actioned < total;
}

window.submitApproval = async function (id) {
    const survey = window._surveys.find(s => s._docId === id);
    if (!survey) return;
    const mats = parseMaterials(survey.sections?.additionalMaterials);
    const apState = window._approvals[id] || {};
    const resolved = mats.map((m, i) => {
        const st = apState[i] || { approved: true, qty: m.qty };
        return { ...m, qty: st.qty, approved: st.approved, partId: getPartId(m.name), packSize: getPackSize(m.name) };
    });
    const approvedMats = resolved.filter(m => m.approved === true);
    const deniedMats = resolved.filter(m => m.approved === false);
    const btn = document.getElementById(`sub-${id}`);
    if (btn) { btn.disabled = true; btn.textContent = 'Submitting…'; }
    const nowISO = new Date().toISOString();
    const jobNum = survey.jobNumber || id;
    const custName = survey._custName || survey.sections?.customerSignOff?.name || '—';
    const address = [survey._address, survey._postcode].filter(Boolean).join(', ') || '—';
    const install = survey._installDate ? fmtDate(survey._installDate) : '—';

    try {
        await setDoc(doc(db, 'approved-additional-materials', id), {
            surveyDocId: id,
            jobNumber: jobNum,
            customerName: custName,
            address: address,
            installDate: survey._installDate || '',
            surveyType: survey.surveyType || '',
            surveyor: survey.sections?.surveyDetails?.surveyor || '',
            approvedAt: nowISO,
            approvedMaterials: approvedMats.map(m => ({ name: m.name, category: m.category, qty: m.qty, partId: m.partId || '', packSize: m.packSize || '' })),
            deniedMaterials: deniedMats.map(m => ({ name: m.name, category: m.category, qty: m.qty, partId: m.partId || '', packSize: m.packSize || '' })),
        });
    } catch (e) {
        showToast('Firestore save failed: ' + e.message, true);
        if (btn) { btn.disabled = false; btn.innerHTML = ICON('mail') + 'Submit approval &amp; send email'; }
        return;
    }

    if (approvedMats.length === 0) {
        showToast('All items denied — saved to Firestore, no email sent.');
    } else {
        const approvedListText = approvedMats
            .map(m => {
                const pidStr = m.partId ? ` [${m.partId}]` : '';
                const packStr = m.packSize ? ` (${m.packSize})` : '';
                return `• ${m.category}: ${m.name}${pidStr}${packStr} × ${m.qty}`;
            })
            .join('\n');
        const deniedListText = deniedMats.length
            ? deniedMats.map(m => {
                const pidStr = m.partId ? ` [${m.partId}]` : '';
                const packStr = m.packSize ? ` (${m.packSize})` : '';
                return `• ${m.name}${pidStr}${packStr}`;
              }).join('\n')
            : 'None denied.';

        try {
            await emailjs.send('service_jovorbh', 'template_0uhapew', {
                job_number: jobNum,
                customer_name: custName,
                address: address,
                install_date: install,
                approved_materials: approvedListText,
                denied_materials: deniedListText,
                surveyor: survey.sections?.surveyDetails?.surveyor || '—',
                survey_type: survey.surveyType === 'battery-and-solar' ? 'Battery & Solar' : 'Battery Only',
            });
            showToast('Approval submitted & email sent!');
        } catch (e) {
            showToast('Saved to Firestore, but email failed: ' + e.message, true);
        }
    }

    survey._approvedAt = nowISO;
    survey._approvedMats = approvedMats;
    renderAll();
};

document.addEventListener('DOMContentLoaded', () => {
    loadData();
    window.addEventListener('scroll', () =>
        document.getElementById('back-top').classList.toggle('show', scrollY > 400));
    document.getElementById('back-top').addEventListener('click', () =>
        window.scrollTo({ top:0, behavior:'smooth' }));
});
</script>
</body>
</html>
