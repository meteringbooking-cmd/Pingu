<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submitted Requests | Pingu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* ═══ Pingu design system — base (copy verbatim into each page's <style>) ═══ */
        :root {
            /* Brand + status palette */
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --secondary: #FFC857;
            --accent: #00D9FF;
            --dark: #1A1A2E;
            --dark-light: #252541;
            --dark-lighter: #2F2F4A;
            --text: #EAEAEA;
            --text-dim: #9A9AB0;
            --success: #4ECCA3;
            --error: #FF6B6B;
            --warning: #FFC857;
            --in-progress: #00D9FF;
            --complete: #4ECCA3;
            --aborted: #FF6B6B;
            --cancelled: #9A9AB0;
            --short-notice: #90ee90;
            --on-hold: #FFDE00;
            --scheduled: #FF6B35;
            /* Surfaces & type */
            --bg: #161628;
            --surface: #1F1F35;
            --surface-2: #252541;
            --line: rgba(255,255,255,0.07);
            --line-2: rgba(255,255,255,0.12);
            --text-strong: #F4F4F8;
            --text-soft: #C8C8D6;
            --radius: 10px;
            --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: var(--font); font-size: 14px; line-height: 1.5;
            background: var(--bg); color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        button, input, select, textarea { font-family: inherit; }
        a { color: var(--accent); }
        .ico { width: 16px; height: 16px; flex: 0 0 auto; vertical-align: -3px; }
        .ico-lg { width: 20px; height: 20px; flex: 0 0 auto; }

        /* ── App bar + Pingu wordmark ── */
        .appbar {
            position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            height: 64px; padding: 0 28px;
            background: rgba(22, 22, 40, 0.92);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line);
        }
        .appbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .logo { display: inline-flex; align-items: center; text-decoration: none; }
        .wordmark {
            font-family: 'Inter', var(--font); font-weight: 800; font-size: 28px;
            letter-spacing: -0.045em; line-height: 1; color: var(--text-strong); padding-top: 6px;
        }
        .i-stem { position: relative; display: inline-block; }
        .i-paw {
            position: absolute; left: 50%; top: -0.17em; transform: translateX(-50%) rotate(-10deg);
            width: 0.5em; height: 0.5em; fill: var(--primary);
            filter: drop-shadow(0 1px 4px rgba(255,107,53,0.35));
            transition: transform .2s ease;
        }
        .logo:hover .i-paw { transform: translateX(-50%) rotate(4deg) scale(1.08); }
        .logo:hover .wordmark { color: #fff; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-soft); text-decoration: none; font-size: 13px; font-weight: 500;
            padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; cursor: pointer;
            transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .back-btn:hover { background: var(--surface-2); color: var(--text-strong); border-color: rgba(255,255,255,0.2); }

        /* ── Page layout ── */
        .container { padding: 24px 28px 40px; }
        .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
        h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-strong); line-height: 1.2; }
        h2 { font-size: 16px; font-weight: 600; color: var(--text-strong); letter-spacing: -0.01em; }
        h3 { font-size: 14px; font-weight: 600; color: var(--text-strong); }
        .muted { color: var(--text-dim); }
        .toolbar { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }

        /* ── Panels / cards ── */
        .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
        .panel + .panel { margin-top: 16px; }
        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -2px 0 14px; }
        .panel-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--text-strong); }
        .panel-title .ico { color: var(--primary); }

        /* ── Form controls ── */
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-label { color: var(--text-dim); font-size: 11.5px; font-weight: 500; }
        .control-input {
            height: 38px; background: var(--surface); border: 1px solid var(--line-2);
            color: var(--text-strong); padding: 0 12px; border-radius: 8px; font-size: 13.5px; width: 100%;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        textarea.control-input { height: auto; min-height: 84px; padding: 9px 11px; resize: vertical; }
        .control-input:hover { border-color: rgba(255,255,255,0.2); }
        .control-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.22); }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); cursor: pointer; }
        input[type="checkbox"], input[type="radio"] { accent-color: var(--primary); }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 7px;
            height: 38px; padding: 0 16px; border-radius: 8px; cursor: pointer;
            font-size: 13.5px; font-weight: 600; text-decoration: none; white-space: nowrap;
            border: 1px solid transparent; transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--surface-2); color: var(--text-strong); border-color: var(--line-2); }
        .btn-secondary:hover { background: var(--dark-lighter); border-color: rgba(255,255,255,0.25); }
        .btn-ghost { background: transparent; color: var(--text-soft); border-color: var(--line-2); }
        .btn-ghost:hover { background: var(--surface-2); color: var(--text-strong); }
        .btn-danger { background: rgba(255,107,107,0.12); color: #FF8A8A; border-color: rgba(255,107,107,0.4); }
        .btn-danger:hover { background: rgba(255,107,107,0.22); }
        .btn-success { background: rgba(78,204,163,0.14); color: var(--success); border-color: rgba(78,204,163,0.45); }
        .btn-success:hover { background: rgba(78,204,163,0.24); }
        .btn-sm { height: 32px; padding: 0 12px; font-size: 12.5px; }
        .btn:disabled, button:disabled { opacity: .45; cursor: not-allowed; }
        .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; height: 38px; }
        .seg button { background: var(--surface); color: var(--text-soft); border: 0; padding: 0 12px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .seg button + button { border-left: 1px solid var(--line-2); }
        .seg button:hover, .seg button.active { background: var(--surface-2); color: var(--text-strong); }

        /* ── KPI tiles ── */
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
        .stat-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; }
        .stat-label { display: flex; align-items: center; gap: 7px; color: var(--text-dim); font-size: 12px; font-weight: 500; white-space: nowrap; }
        .stat-label .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
        .stat-value { font-size: 22px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.02em; line-height: 1.25; margin-top: 2px; font-variant-numeric: tabular-nums; }

        /* ── Tables ── */
        .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
        thead th {
            position: sticky; top: 0; z-index: 2; background: var(--surface);
            text-align: left; padding: 10px 14px; font-size: 11.5px; font-weight: 600; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--line-2); white-space: nowrap;
        }
        tbody td { padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--text-soft); vertical-align: middle; }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover td { background: rgba(255,255,255,0.025); }
        td.strong, .cell-strong { color: var(--text-strong); font-weight: 600; }
        .mono { font-family: var(--mono); font-size: 12.5px; }

        /* ── Badges / status pills ── */
        .badge {
            --c: var(--text-dim);
            display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
            padding: 2px 9px; border-radius: 999px; color: var(--text-strong);
            background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
        }
        .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
        .badge.plain::before { display: none; }
        .tag { font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 4px; background: rgba(255,255,255,0.1); color: var(--text-soft); letter-spacing: .03em; }

        /* ── Notices ── */
        .notice { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 13px;
                  background: rgba(255,255,255,0.03); border: 1px solid var(--line-2); color: var(--text-soft); }
        .notice .ico { margin-top: 1px; }
        .notice.info    { border-color: rgba(0,217,255,0.35);  background: rgba(0,217,255,0.06); }
        .notice.success { border-color: rgba(78,204,163,0.4);  background: rgba(78,204,163,0.07); color: var(--success); }
        .notice.warning { border-color: rgba(255,200,87,0.4);  background: rgba(255,200,87,0.07); color: var(--warning); }
        .notice.error   { border-color: rgba(255,107,107,0.45); background: rgba(255,107,107,0.08); color: #FF8A8A; }

        /* ── Modals ── */
        .modal { display: none; position: fixed; inset: 0; background: rgba(10,10,22,0.72); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
        .modal.show, .modal.active, .modal.open { display: flex; }
        .modal-content { background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; width: 100%; max-width: 680px; max-height: 88vh; overflow-y: auto; box-shadow: 0 30px 80px -20px rgba(0,0,0,0.75); }
        .modal-header { position: sticky; top: 0; z-index: 2; background: var(--surface); display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
        .modal-title { font-size: 17px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.01em; }
        .modal-body { padding: 18px 20px 22px; }
        .close-btn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; border-radius: 8px; color: var(--text-dim); cursor: pointer; font-size: 20px; line-height: 1; }
        .close-btn:hover { background: var(--surface-2); color: var(--text-strong); }

        /* ── Feedback ── */
        .toast { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: none; max-width: 420px; padding: 12px 16px 12px 14px; border-radius: 10px;
                 background: #26263F; color: var(--text-strong); font-size: 13.5px; border: 1px solid var(--line-2); border-left: 3px solid var(--success);
                 box-shadow: 0 16px 40px -12px rgba(0,0,0,0.7); }
        .toast.show { display: block; }
        .toast.error { border-left-color: var(--error); }
        .empty-state, .loading { text-align: center; padding: 56px 16px; color: var(--text-dim); }
        .empty-state h3 { color: var(--text-strong); font-size: 16px; margin-bottom: 4px; }
        .empty-state .ico-lg { width: 32px; height: 32px; color: var(--text-dim); margin-bottom: 10px; }
        .spinner { width: 22px; height: 22px; border: 2px solid var(--line-2); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        *::-webkit-scrollbar { width: 10px; height: 10px; }
        *::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
        *::-webkit-scrollbar-track { background: transparent; }
        @media (max-width: 768px) {
            .appbar, .container { padding-left: 14px; padding-right: 14px; }
            .wordmark { font-size: 24px; }
        }
        /* ═══ end base ═══ */

        /* ── Page: submitted requests ── */
        .controls-section { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
        .filter-toggle { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; height: 38px; }
        .filter-btn {
            background: var(--surface); color: var(--text-soft); border: 0; padding: 0 14px;
            font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap;
            transition: background .15s ease, color .15s ease;
        }
        .filter-btn + .filter-btn { border-left: 1px solid var(--line-2); }
        .filter-btn:hover { background: var(--surface-2); color: var(--text-strong); }
        .filter-btn.active { background: rgba(255,107,53,0.16); color: var(--text-strong); font-weight: 600; box-shadow: inset 0 -2px 0 var(--primary); }
        .search-controls { display: flex; gap: 8px; align-items: center; }
        .search-field { position: relative; }
        .search-field .ico { position: absolute; left: 11px; top: 11px; color: var(--text-dim); pointer-events: none; }
        .search-input { width: 320px; padding-left: 34px; }

        .results-count { color: var(--text-dim); font-size: 13px; font-weight: 500; margin-bottom: 12px; }

        .requests-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); gap: 14px; align-items: start; }
        .request-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
        .request-card:hover { border-color: var(--line-2); }
        .request-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
        .request-info { min-width: 0; }
        .request-job { font-size: 15px; font-weight: 600; color: var(--text-strong); line-height: 1.3; word-break: break-word; }
        .request-date { color: var(--text-dim); font-size: 12.5px; margin-top: 2px; }
        .request-status { --c: var(--text-dim); }
        .request-status.pending  { --c: var(--warning); }
        .request-status.approved { --c: var(--complete); }
        .request-status.declined { --c: var(--aborted); }

        .request-body { display: grid; gap: 10px; }
        .request-section { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
        .section-title { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
        .section-title .ico { color: var(--primary); width: 15px; height: 15px; }
        .additional-day-info { display: flex; flex-direction: column; gap: 4px; }
        .additional-day-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .additional-day-label { color: var(--text-dim); font-size: 12.5px; }
        .additional-day-value { color: var(--text-strong); }
        .additional-day-value.yes { --c: var(--warning); }
        .additional-day-value.no  { --c: var(--cancelled); }
        .reason-text { color: var(--text-soft); font-size: 13px; line-height: 1.55; padding: 9px 11px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; white-space: pre-wrap; }

        .materials-list { display: flex; flex-direction: column; }
        .material-row { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--line); }
        .material-row:first-child { padding-top: 0; }
        .material-row:last-child { border-bottom: 0; padding-bottom: 0; }
        .material-name { color: var(--text-strong); font-size: 13px; }
        .material-quantity { color: var(--text-strong); font-weight: 700; font-size: 13.5px; font-variant-numeric: tabular-nums; text-align: right; }
        .material-unit { color: var(--text-dim); font-size: 12px; white-space: nowrap; }
        .no-materials { color: var(--text-dim); font-size: 13px; }

        .action-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .action-btn { width: 100%; }

        .status-message { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: none; max-width: 420px; padding: 12px 16px 12px 14px; border-radius: 10px;
                          background: #26263F; color: var(--text-strong); font-size: 13.5px; border: 1px solid var(--line-2); border-left: 3px solid var(--success);
                          box-shadow: 0 16px 40px -12px rgba(0,0,0,0.7); }
        .status-message.show { display: block; }
        .status-message.error { border-left-color: var(--error); }

        @media (max-width: 768px) {
            .controls-section, .search-controls { width: 100%; }
            .filter-toggle { width: 100%; }
            .filter-btn { flex: 1; }
            .search-field { flex: 1; min-width: 0; }
            .search-input { width: 100%; }
            .request-header { flex-wrap: wrap; }
            .status-message { left: 14px; right: 14px; bottom: 14px; max-width: none; }
        }
    </style>
</head>
<body>
    <header class="appbar">

    <div class="container">
        <div class="page-head">

                <div class="search-controls">

                        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                        <input
                            type="text"
                            id="search-input"
                            class="search-input control-input"
                            placeholder="Search by job number or customer name..."
                            onkeypress="handleSearchKeypress(event)"
                        />
                    </div>
                    <button class="search-btn btn btn-primary" onclick="performSearch()">Search</button>
                </div>
            </div>
        </div>

        <main>
            <div class="results-count" id="results-count">Loading requests...</div>

            <div id="requests-container">
                <div class="loading">Loading requests&hellip;</div>
            </div>
        </main>
    </div>

    <div class="status-message" id="status-message"></div>

    <script>
        let allRequests = [];
        let filteredRequests = [];
        let currentFilter = 'new';

        const ICONS = {
            calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
            package: '<path d="m7.5 4.3 9 5.1M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/>',
            clipboard: '<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12h6M9 16h6"/>',
            alert: '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
            checkMark: '<path d="M20 6 9 17l-5-5"/>',
            close: '<path d="M18 6 6 18M6 6l12 12"/>'
        };
        const ICON = (name, cls = 'ico') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;

        // Load all requests
        async function loadRequests() {
            try {
                const { collection, getDocs, query, orderBy: orderByFn } = window.firebaseModules;

                const requestsQuery = query(
                    collection(window.db, 'material-requests'),
                    orderByFn('requestDate', 'desc')
                );

                const querySnapshot = await getDocs(requestsQuery);

                allRequests = [];
                querySnapshot.forEach((doc) => {
                    allRequests.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });

                console.log(`Loaded ${allRequests.length} requests`);

                applyFilter();

            } catch (error) {
                console.error('Error loading requests:', error);
                showStatus('Error loading requests: ' + error.message, 'error');

                document.getElementById('requests-container').innerHTML = `
                    <div class="empty-state">
                        ${ICON('alert', 'ico-lg')}
                        <h3>Error loading requests</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        // Set filter
        function setFilter(filter) {
            currentFilter = filter;

            // Update UI
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            applyFilter();
        }

        // Apply filter
        function applyFilter() {
            const searchTerm = document.getElementById('search-input').value.trim().toLowerCase();

            // Start with all requests or search results
            let requests = searchTerm ?
                allRequests.filter(req => {
                    const jobNumber = (req.jobNumber || '').toLowerCase();
                    const jobName = (req.jobName || '').toLowerCase();

                    return jobNumber.includes(searchTerm) || jobName.includes(searchTerm);
                }) :
                [...allRequests];

            // Apply status filter
            if (currentFilter === 'new') {
                requests = requests.filter(req => req.status === 'pending');
            }

            filteredRequests = requests;
            displayRequests();
        }

        // Perform search
        function performSearch() {
            applyFilter();
        }

        // Handle Enter key in search
        function handleSearchKeypress(event) {
            if (event.key === 'Enter') {
                performSearch();
            }
        }

        // Display requests
        function displayRequests() {
            const container = document.getElementById('requests-container');
            const countEl = document.getElementById('results-count');

            countEl.textContent = `${filteredRequests.length} request${filteredRequests.length !== 1 ? 's' : ''} found`;

            if (filteredRequests.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        ${ICON('clipboard', 'ico-lg')}
                        <h3>No requests found</h3>
                        <p>Try adjusting your filters or search criteria</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="requests-grid">
                    ${filteredRequests.map(request => renderRequestCard(request)).join('')}
                </div>
            `;
        }

        // Render request card
        function renderRequestCard(request) {
            const statusClass = request.status || 'pending';
            const statusText = statusClass === 'pending' ? 'Pending' :
                              statusClass === 'approved' ? 'Approved' : 'Declined';

            const materialsHtml = request.materials && request.materials.length > 0 ?
                request.materials.map(material => `
                    <div class="material-row">
                        <div class="material-name">${escapeHtml(material.name)}</div>
                        <div class="material-quantity">${material.quantity}</div>
                        <div class="material-unit">per ${escapeHtml(material.unit)}</div>
                    </div>
                `).join('') :
                '<div class="no-materials">No materials requested</div>';

            const actionButtons = request.status === 'pending' ? `
                <div class="action-buttons">
                    <button class="action-btn approve btn btn-success" onclick="updateRequestStatus('${request.id}', 'approved')">
                        ${ICON('checkMark')}Approve
                    </button>
                    <button class="action-btn decline btn btn-danger" onclick="updateRequestStatus('${request.id}', 'declined')">
                        ${ICON('close')}Decline
                    </button>
                </div>
            ` : '';

            return `
                <div class="request-card">
                    <div class="request-header">
                        <div class="request-info">
                            <div class="request-job">${escapeHtml(request.jobName || 'Unknown Job')}</div>
                            <div class="request-date">${formatDate(request.requestDate)}</div>
                        </div>
                        <div class="request-status badge ${statusClass}">${statusText}</div>
                    </div>

                    <div class="request-body">
                        <div class="request-section">
                            <div class="section-title">${ICON('calendar')}Additional day request</div>
                            <div class="additional-day-info">
                                <div class="additional-day-row">
                                    <div class="additional-day-label">Requires additional day</div>
                                    <div class="additional-day-value badge ${request.additionalDay ? 'yes' : 'no'}">${request.additionalDay ? 'Yes' : 'No'}</div>
                                </div>
                                ${request.additionalDay && request.reason ? `
                                    <div class="additional-day-label" style="margin-top: 8px;">Reason</div>
                                    <div class="reason-text">${escapeHtml(request.reason)}</div>
                                ` : ''}
                            </div>
                        </div>

                        <div class="request-section">
                            <div class="section-title">${ICON('package')}Materials requested</div>
                            <div class="materials-list">
                                ${materialsHtml}
                            </div>
                        </div>
                    </div>

                    ${actionButtons}
                </div>
            `;
        }

        // Update request status
        async function updateRequestStatus(requestId, newStatus) {
            try {
                const { doc, updateDoc } = window.firebaseModules;

                await updateDoc(doc(window.db, 'material-requests', requestId), {
                    status: newStatus,
                    statusUpdatedDate: new Date().toISOString()
                });

                // Update local data
                const request = allRequests.find(r => r.id === requestId);
                if (request) {
                    request.status = newStatus;
                }

                showStatus(`Request ${newStatus} successfully!`, 'success');

                // Refresh display
                applyFilter();

            } catch (error) {
                console.error('Error updating request:', error);
                showStatus('Error updating request: ' + error.message, 'error');
            }
        }

        // Utility functions
        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleDateString('en-GB', {
                day: '2-digit',
                month: 'short',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showStatus(message, type) {
            const status = document.getElementById('status-message');
            status.textContent = message;
            status.className = `status-message ${type} show`;

            setTimeout(() => {
                status.classList.remove('show');
            }, 5000);
        }
    </script>
</body>
</html>
