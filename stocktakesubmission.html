<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stocktake | Pingu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* ═══ Pingu design system — base (copy verbatim into each page's <style>) ═══ */
        :root {
            /* Brand + status palette */
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --secondary: #FFC857;
            --accent: #00D9FF;
            --dark: #1A1A2E;
            --dark-light: #252541;
            --dark-lighter: #2F2F4A;
            --text: #EAEAEA;
            --text-dim: #9A9AB0;
            --success: #4ECCA3;
            --error: #FF6B6B;
            --warning: #FFC857;
            --in-progress: #00D9FF;
            --complete: #4ECCA3;
            --aborted: #FF6B6B;
            --cancelled: #9A9AB0;
            --short-notice: #90ee90;
            --on-hold: #FFDE00;
            --scheduled: #FF6B35;
            /* Surfaces & type */
            --bg: #161628;
            --surface: #1F1F35;
            --surface-2: #252541;
            --line: rgba(255,255,255,0.07);
            --line-2: rgba(255,255,255,0.12);
            --text-strong: #F4F4F8;
            --text-soft: #C8C8D6;
            --radius: 10px;
            --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: var(--font); font-size: 14px; line-height: 1.5;
            background: var(--bg); color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        button, input, select, textarea { font-family: inherit; }
        a { color: var(--accent); }
        .ico { width: 16px; height: 16px; flex: 0 0 auto; vertical-align: -3px; }
        .ico-lg { width: 20px; height: 20px; flex: 0 0 auto; }

        /* ── App bar + Pingu wordmark ── */
        .appbar {
            position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            height: 64px; padding: 0 28px;
            background: rgba(22, 22, 40, 0.92);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line);
        }
        .appbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .logo { display: inline-flex; align-items: center; text-decoration: none; }
        .wordmark {
            font-family: 'Inter', var(--font); font-weight: 800; font-size: 28px;
            letter-spacing: -0.045em; line-height: 1; color: var(--text-strong); padding-top: 6px;
        }
        .i-stem { position: relative; display: inline-block; }
        .i-paw {
            position: absolute; left: 50%; top: -0.17em; transform: translateX(-50%) rotate(-10deg);
            width: 0.5em; height: 0.5em; fill: var(--primary);
            filter: drop-shadow(0 1px 4px rgba(255,107,53,0.35));
            transition: transform .2s ease;
        }
        .logo:hover .i-paw { transform: translateX(-50%) rotate(4deg) scale(1.08); }
        .logo:hover .wordmark { color: #fff; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-soft); text-decoration: none; font-size: 13px; font-weight: 500;
            padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; cursor: pointer;
            transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .back-btn:hover { background: var(--surface-2); color: var(--text-strong); border-color: rgba(255,255,255,0.2); }

        /* ── Page layout ── */
        .container { padding: 24px 28px 40px; }
        .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
        h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-strong); line-height: 1.2; }
        h2 { font-size: 16px; font-weight: 600; color: var(--text-strong); letter-spacing: -0.01em; }
        h3 { font-size: 14px; font-weight: 600; color: var(--text-strong); }
        .muted { color: var(--text-dim); }
        .toolbar { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }

        /* ── Panels / cards ── */
        .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
        .panel + .panel { margin-top: 16px; }
        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -2px 0 14px; }
        .panel-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--text-strong); }
        .panel-title .ico { color: var(--primary); }

        /* ── Form controls ── */
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-label { color: var(--text-dim); font-size: 11.5px; font-weight: 500; }
        .control-input {
            height: 38px; background: var(--surface); border: 1px solid var(--line-2);
            color: var(--text-strong); padding: 0 12px; border-radius: 8px; font-size: 13.5px; width: 100%;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        textarea.control-input { height: auto; min-height: 84px; padding: 9px 11px; resize: vertical; }
        .control-input:hover { border-color: rgba(255,255,255,0.2); }
        .control-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.22); }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); cursor: pointer; }
        input[type="checkbox"], input[type="radio"] { accent-color: var(--primary); }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 7px;
            height: 38px; padding: 0 16px; border-radius: 8px; cursor: pointer;
            font-size: 13.5px; font-weight: 600; text-decoration: none; white-space: nowrap;
            border: 1px solid transparent; transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--surface-2); color: var(--text-strong); border-color: var(--line-2); }
        .btn-secondary:hover { background: var(--dark-lighter); border-color: rgba(255,255,255,0.25); }
        .btn-ghost { background: transparent; color: var(--text-soft); border-color: var(--line-2); }
        .btn-ghost:hover { background: var(--surface-2); color: var(--text-strong); }
        .btn-danger { background: rgba(255,107,107,0.12); color: #FF8A8A; border-color: rgba(255,107,107,0.4); }
        .btn-danger:hover { background: rgba(255,107,107,0.22); }
        .btn-success { background: rgba(78,204,163,0.14); color: var(--success); border-color: rgba(78,204,163,0.45); }
        .btn-success:hover { background: rgba(78,204,163,0.24); }
        .btn-sm { height: 32px; padding: 0 12px; font-size: 12.5px; }
        .btn:disabled, button:disabled { opacity: .45; cursor: not-allowed; }
        .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; height: 38px; }
        .seg button { background: var(--surface); color: var(--text-soft); border: 0; padding: 0 12px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .seg button + button { border-left: 1px solid var(--line-2); }
        .seg button:hover, .seg button.active { background: var(--surface-2); color: var(--text-strong); }

        /* ── KPI tiles ── */
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
        .stat-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; }
        .stat-label { display: flex; align-items: center; gap: 7px; color: var(--text-dim); font-size: 12px; font-weight: 500; white-space: nowrap; }
        .stat-label .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
        .stat-value { font-size: 22px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.02em; line-height: 1.25; margin-top: 2px; font-variant-numeric: tabular-nums; }

        /* ── Tables ── */
        .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
        thead th {
            position: sticky; top: 0; z-index: 2; background: var(--surface);
            text-align: left; padding: 10px 14px; font-size: 11.5px; font-weight: 600; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--line-2); white-space: nowrap;
        }
        tbody td { padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--text-soft); vertical-align: middle; }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover td { background: rgba(255,255,255,0.025); }
        td.strong, .cell-strong { color: var(--text-strong); font-weight: 600; }
        .mono { font-family: var(--mono); font-size: 12.5px; }

        /* ── Badges / status pills ── */
        .badge {
            --c: var(--text-dim);
            display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
            padding: 2px 9px; border-radius: 999px; color: var(--text-strong);
            background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
        }
        .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
        .badge.plain::before { display: none; }
        .tag { font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 4px; background: rgba(255,255,255,0.1); color: var(--text-soft); letter-spacing: .03em; }

        /* ── Notices ── */
        .notice { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 13px;
                  background: rgba(255,255,255,0.03); border: 1px solid var(--line-2); color: var(--text-soft); }
        .notice .ico { margin-top: 1px; }
        .notice.info    { border-color: rgba(0,217,255,0.35);  background: rgba(0,217,255,0.06); }
        .notice.success { border-color: rgba(78,204,163,0.4);  background: rgba(78,204,163,0.07); color: var(--success); }
        .notice.warning { border-color: rgba(255,200,87,0.4);  background: rgba(255,200,87,0.07); color: var(--warning); }
        .notice.error   { border-color: rgba(255,107,107,0.45); background: rgba(255,107,107,0.08); color: #FF8A8A; }

        /* ── Modals ── */
        .modal { display: none; position: fixed; inset: 0; background: rgba(10,10,22,0.72); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
        .modal.show, .modal.active, .modal.open { display: flex; }
        .modal-content { background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; width: 100%; max-width: 680px; max-height: 88vh; overflow-y: auto; box-shadow: 0 30px 80px -20px rgba(0,0,0,0.75); }
        .modal-header { position: sticky; top: 0; z-index: 2; background: var(--surface); display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
        .modal-title { font-size: 17px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.01em; }
        .modal-body { padding: 18px 20px 22px; }
        .close-btn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; border-radius: 8px; color: var(--text-dim); cursor: pointer; font-size: 20px; line-height: 1; }
        .close-btn:hover { background: var(--surface-2); color: var(--text-strong); }

        /* ── Feedback ── */
        .toast { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: none; max-width: 420px; padding: 12px 16px 12px 14px; border-radius: 10px;
                 background: #26263F; color: var(--text-strong); font-size: 13.5px; border: 1px solid var(--line-2); border-left: 3px solid var(--success);
                 box-shadow: 0 16px 40px -12px rgba(0,0,0,0.7); }
        .toast.show { display: block; }
        .toast.error { border-left-color: var(--error); }
        .empty-state, .loading { text-align: center; padding: 56px 16px; color: var(--text-dim); }
        .empty-state h3 { color: var(--text-strong); font-size: 16px; margin-bottom: 4px; }
        .empty-state .ico-lg { width: 32px; height: 32px; color: var(--text-dim); margin-bottom: 10px; }
        .spinner { width: 22px; height: 22px; border: 2px solid var(--line-2); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        *::-webkit-scrollbar { width: 10px; height: 10px; }
        *::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
        *::-webkit-scrollbar-track { background: transparent; }
        @media (max-width: 768px) {
            .appbar, .container { padding-left: 14px; padding-right: 14px; }
            .wordmark { font-size: 24px; }
        }
        /* ═══ end base ═══ */

        /* ── Page: stocktake submission ── */
        .st-layout { display: grid; grid-template-columns: minmax(300px, 360px) minmax(0, 1fr); gap: 16px; align-items: start; }
        .st-side { position: sticky; top: 80px; display: flex; flex-direction: column; gap: 12px; }
        .st-main { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
        .st-side .panel + .panel { margin-top: 0; }

        .meta-card h2, .items-header h2 { display: flex; align-items: center; gap: 8px; font-size: 15px; }
        .meta-card h2 .ico, .items-header h2 .ico { color: var(--primary); }
        .meta-card h2 { margin-bottom: 14px; }
        .meta-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .meta-group { display: flex; flex-direction: column; gap: 5px; }

        /* Search */
        .search-bar { position: relative; }
        .search-bar .ico { position: absolute; left: 12px; top: 11px; color: var(--text-dim); pointer-events: none; }
        .search-bar input { padding-left: 36px; }

        /* Progress */
        .progress-wrap { display: flex; flex-direction: column; gap: 8px; }
        .progress-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
        .progress-label { font-size: 13px; color: var(--text-dim); }
        .progress-label span { color: var(--text-strong); font-weight: 700; font-variant-numeric: tabular-nums; }
        .progress-track { height: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; border-radius: 999px; background: var(--primary); transition: width .25s ease; }
        .progress-pct { font-size: 13px; font-weight: 700; color: var(--text-strong); font-variant-numeric: tabular-nums; }

        /* Items */
        .items-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
        .items-header { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .items-count { font-size: 12.5px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
        #items-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); }

        .item-row {
            display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center;
            padding: 9px 18px; border-bottom: 1px solid var(--line);
            transition: background .15s ease;
        }
        .item-row:hover { background: rgba(255,255,255,0.02); }
        .item-row.counted { background: rgba(78,204,163,0.05); box-shadow: inset 3px 0 0 var(--complete); }
        .item-row.hidden { display: none; }
        .item-desc { font-size: 13px; color: var(--text-strong); line-height: 1.4; }
        .item-row.counted .item-desc { color: var(--text-soft); }

        .qty-wrap { display: flex; align-items: center; gap: 4px; }
        .qty-btn {
            width: 34px; height: 34px; border-radius: 7px; cursor: pointer; flex: 0 0 auto;
            display: inline-flex; align-items: center; justify-content: center;
            background: var(--surface-2); border: 1px solid var(--line-2); color: var(--text-soft);
            transition: background .15s ease, color .15s ease, border-color .15s ease;
        }
        .qty-btn:hover { background: var(--dark-lighter); color: var(--text-strong); border-color: rgba(255,255,255,0.25); }
        .qty-input {
            width: 64px; height: 34px; background: var(--bg); border: 1px solid var(--line-2); border-radius: 7px;
            color: var(--text-strong); font-size: 14px; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums;
            -moz-appearance: textfield;
        }
        .qty-input::-webkit-outer-spin-button, .qty-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .qty-input::placeholder { color: var(--text-dim); font-weight: 400; }
        .qty-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.22); }
        .qty-input.has-value { border-color: color-mix(in srgb, var(--complete) 55%, transparent); }

        .no-results { display: none; padding: 32px 16px; text-align: center; color: var(--text-dim); font-size: 13px; }
        .no-results.show { display: block; }

        /* Submit */
        .submit-section { display: flex; flex-direction: column; gap: 10px; }
        .submit-info { font-size: 12.5px; color: var(--text-dim); }
        .submit-info span { color: var(--text-strong); font-weight: 600; }
        .btn-submit { width: 100%; height: 42px; }

        @media (max-width: 900px) {
            .st-layout { display: flex; flex-direction: column; align-items: stretch; gap: 12px; }
            .st-side { display: contents; }
            .meta-card { order: 1; }
            .progress-wrap { order: 2; }
            .st-main { order: 3; width: 100%; }
            .submit-section { order: 4; }
            .meta-grid { grid-template-columns: 1fr 1fr; }
            .panel + .panel { margin-top: 0; }
        }
        @media (max-width: 768px) {
            .meta-grid { grid-template-columns: 1fr; }
            .items-header, .item-row { padding-left: 14px; padding-right: 12px; }
            .item-row { gap: 10px; }
            .qty-btn { width: 36px; height: 36px; }
            .qty-input { width: 58px; height: 36px; }
            .toast { left: 14px; right: 14px; bottom: 14px; max-width: none; }
        }
    </style>
</head>
<body>
<header class="appbar">
    <a href="admin.html" class="logo" aria-label="Pingu home">
        <span class="wordmark">P<span class="i-stem">ı<svg class="i-paw" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="16.2" rx="5.6" ry="4.6"/><ellipse cx="4.6" cy="10.4" rx="2.2" ry="2.7" transform="rotate(-18 4.6 10.4)"/><ellipse cx="9.2" cy="5.6" rx="2.3" ry="2.9" transform="rotate(-6 9.2 5.6)"/><ellipse cx="14.8" cy="5.6" rx="2.3" ry="2.9" transform="rotate(6 14.8 5.6)"/><ellipse cx="19.4" cy="10.4" rx="2.2" ry="2.7" transform="rotate(18 19.4 10.4)"/></svg></span>ngu</span>
    </a>
    <div class="appbar-actions">
        <a href="admin.html" class="back-btn"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Back to Admin</a>
    </div>
</header>

<div class="container">

    <div class="page-head">
        <div>
            <h1>Stocktake</h1>
        </div>
    </div>

    <div class="st-layout">
        <aside class="st-side">
            <!-- Meta -->
            <div class="meta-card panel">
                <h2><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12h6M9 16h6"/></svg>Stocktake details</h2>
                <div class="meta-grid">
                    <div class="meta-group">
                        <label class="control-label" for="stocktake-date">Date</label>
                        <input type="date" class="meta-input control-input" id="stocktake-date">
                    </div>
                    <div class="meta-group">
                        <label class="control-label" for="stocktake-name">Counted by</label>
                        <input type="text" class="meta-input control-input" id="stocktake-name" placeholder="Enter your name…">
                    </div>
                </div>
            </div>

            <!-- Progress -->
            <div class="progress-wrap panel">
                <div class="progress-top">
                    <div class="progress-label"><span id="prog-counted">0</span> / <span id="prog-total">0</span> items counted</div>
                    <div class="progress-pct" id="prog-pct">0%</div>
                </div>
                <div class="progress-track"><div class="progress-fill" id="prog-fill"></div></div>
            </div>

            <!-- Submit -->
            <div class="submit-section panel">
                <div class="submit-info">All <span id="sub-total">0</span> items must be counted before submitting.</div>
                <button class="btn-submit btn btn-primary" id="btn-submit" onclick="submitStocktake()" disabled>
                    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>Save stocktake
                </button>
            </div>
        </aside>

        <section class="st-main">
            <!-- Search -->
            <div class="search-bar">
                <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input type="text" id="search-input" class="control-input" placeholder="Search items…" oninput="filterItems()">
            </div>

            <!-- Items -->
            <div class="items-card">
                <div class="items-header">
                    <h2><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7.5 4.3 9 5.1M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/></svg>Items to count</h2>
                    <span class="items-count" id="items-showing"></span>
                </div>
                <div id="items-list"></div>
                <div class="no-results" id="no-results">No items match your search.</div>
            </div>
        </section>
    </div>

</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getFirestore, collection, addDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const app = initializeApp({
    apiKey:            'AIzaSyAc_yJQ_rkzuOBh-Yxg0Q4eooXtB-tQjm0',
    authDomain:        'pingu-solar.firebaseapp.com',
    projectId:         'pingu-solar',
    storageBucket:     'pingu-solar.firebasestorage.app',
    messagingSenderId: '232764952866',
    appId:             '1:232764952866:web:5923b7f419de6355d6157b'
});
const db = getFirestore(app);
window._db = db;
window._col = collection;
window._addDoc = addDoc;
</script>

<script>
const stockItems = [
    "1 inch screws (approx)",
    "16mm Earth",
    "2 inch screws (approx)",
    "25mm Double Insulated Stranded Blue (per meter)",
    "25mm Double Insulated Stranded Brown (per meter)",
    "32MM COPEX PACK",
    "32mm gland (pack of 10)",
    "32mm p clips metal",
    "BioHazard Label - Roof",
    "Biohazard Label Set",
    "bootlace ferruls 6mm (pack)",
    "brown plugs (approx)",
    "DC Cable Labels",
    "Engex 300mm x 4.8mm Cable Ties Black (approx)",
    "penny washers 6mm",
    "Proteus Blank Module",
    "Proteus IP65 rated consumer unit 6 way with SPD and isolator",
    "RCD testing label",
    "seals and ferruls",
    "Solar Array Sticker Set",
    "Terminal Block 100A 5 Way Blue",
    "Terminal Block 100A 5 Way Brown",
    "Terminal Block 100A 5 Way Green",
    "Wago compact 3 way connection max 6mm",
    "Adhesive & Sealant - Clear"
];

const quantities = {};
stockItems.forEach(item => { quantities[item] = null; });

const ICON_MINUS = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg>';
const ICON_PLUS  = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
const ICON_SAVE  = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>';

// Default to today
document.getElementById('stocktake-date').valueAsDate = new Date();

function escHtml(t) {
    const d = document.createElement('div');
    d.textContent = String(t ?? '');
    return d.innerHTML;
}

function renderItems() {
    const list = document.getElementById('items-list');
    list.innerHTML = stockItems.map((item, i) => `
        <div class="item-row" id="row-${i}" data-desc="${escHtml(item)}">
            <div class="item-desc">${escHtml(item)}</div>
            <div class="qty-wrap">
                <button class="qty-btn" onclick="adjustQty(${i}, -1)" aria-label="Decrease">${ICON_MINUS}</button>
                <input type="number" min="0"
                    class="qty-input" id="qty-${i}"
                    placeholder="Qty"
                    oninput="onQtyInput(${i}, this.value)"
                />
                <button class="qty-btn" onclick="adjustQty(${i}, 1)" aria-label="Increase">${ICON_PLUS}</button>
            </div>
        </div>
    `).join('');

    document.getElementById('prog-total').textContent  = stockItems.length;
    document.getElementById('sub-total').textContent   = stockItems.length;
    document.getElementById('items-showing').textContent = stockItems.length + ' items';
    updateProgress();
}

window.onQtyInput = function(idx, val) {
    const item   = stockItems[idx];
    const parsed = val === '' ? null : Math.max(0, parseInt(val, 10) || 0);
    quantities[item] = parsed;

    const input = document.getElementById(`qty-${idx}`);
    const row   = document.getElementById(`row-${idx}`);
    input.classList.toggle('has-value', parsed !== null);
    row.classList.toggle('counted', parsed !== null);
    updateProgress();
};

window.adjustQty = function(idx, delta) {
    const item   = stockItems[idx];
    const cur    = quantities[item] ?? 0;
    const newVal = Math.max(0, cur + delta);
    quantities[item] = newVal;

    const input = document.getElementById(`qty-${idx}`);
    input.value = newVal;
    input.classList.add('has-value');
    document.getElementById(`row-${idx}`).classList.add('counted');
    updateProgress();
};

function updateProgress() {
    const total   = stockItems.length;
    const counted = stockItems.filter(i => quantities[i] !== null).length;
    const pct     = total ? Math.round((counted / total) * 100) : 0;

    document.getElementById('prog-counted').textContent = counted;
    document.getElementById('prog-fill').style.width    = pct + '%';
    document.getElementById('prog-pct').textContent     = pct + '%';
    document.getElementById('btn-submit').disabled      = counted < total;
}

window.filterItems = function() {
    const q = document.getElementById('search-input').value.toLowerCase().trim();
    let visible = 0;
    document.querySelectorAll('.item-row').forEach(row => {
        const match = !q || row.dataset.desc.toLowerCase().includes(q);
        row.classList.toggle('hidden', !match);
        if (match) visible++;
    });
    document.getElementById('items-showing').textContent = visible + ' items';
    document.getElementById('no-results').classList.toggle('show', visible === 0);
};

window.submitStocktake = async function() {
    const date = document.getElementById('stocktake-date').value;
    const name = document.getElementById('stocktake-name').value.trim();

    if (!date) { showToast('Please enter a date.', true); return; }
    if (!name) { showToast('Please enter your name.', true); return; }

    const btn = document.getElementById('btn-submit');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    const items = stockItems.map(desc => ({
        description: desc,
        quantity: quantities[desc] ?? 0
    }));

    try {
        await window._addDoc(window._col(window._db, 'stocktake'), {
            date,
            countedBy: name,
            submittedAt: new Date().toISOString(),
            items
        });
        showToast('Stocktake saved successfully!');
        // Reset after short delay
        setTimeout(() => {
            stockItems.forEach(item => { quantities[item] = null; });
            document.getElementById('stocktake-name').value = '';
            document.getElementById('search-input').value   = '';
            document.getElementById('stocktake-date').valueAsDate = new Date();
            renderItems();
        }, 1600);
    } catch (e) {
        console.error(e);
        showToast('Firebase error: ' + e.message, true);
        btn.disabled = false;
        btn.innerHTML = ICON_SAVE + 'Save stocktake';
    }
};

function showToast(msg, error = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (error ? ' error' : '');
    setTimeout(() => t.classList.remove('show'), 3500);
}

renderItems();
</script>
</body>
</html>
