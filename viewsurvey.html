<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Viewer | Pingu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* ═══ Pingu design system — base (copy verbatim into each page's <style>) ═══ */
        :root {
            /* Brand + status palette */
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --secondary: #FFC857;
            --accent: #00D9FF;
            --dark: #1A1A2E;
            --dark-light: #252541;
            --dark-lighter: #2F2F4A;
            --text: #EAEAEA;
            --text-dim: #9A9AB0;
            --success: #4ECCA3;
            --error: #FF6B6B;
            --warning: #FFC857;
            --in-progress: #00D9FF;
            --complete: #4ECCA3;
            --aborted: #FF6B6B;
            --cancelled: #9A9AB0;
            --short-notice: #90ee90;
            --on-hold: #FFDE00;
            --scheduled: #FF6B35;
            /* Surfaces & type */
            --bg: #161628;
            --surface: #1F1F35;
            --surface-2: #252541;
            --line: rgba(255,255,255,0.07);
            --line-2: rgba(255,255,255,0.12);
            --text-strong: #F4F4F8;
            --text-soft: #C8C8D6;
            --radius: 10px;
            --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: var(--font); font-size: 14px; line-height: 1.5;
            background: var(--bg); color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        button, input, select, textarea { font-family: inherit; }
        a { color: var(--accent); }
        .ico { width: 16px; height: 16px; flex: 0 0 auto; vertical-align: -3px; }
        .ico-lg { width: 20px; height: 20px; flex: 0 0 auto; }

        /* ── App bar + Pingu wordmark ── */
        .appbar {
            position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            height: 64px; padding: 0 28px;
            background: rgba(22, 22, 40, 0.92);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line);
        }
        .appbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .logo { display: inline-flex; align-items: center; text-decoration: none; }
        .wordmark {
            font-family: 'Inter', var(--font); font-weight: 800; font-size: 28px;
            letter-spacing: -0.045em; line-height: 1; color: var(--text-strong); padding-top: 6px;
        }
        .i-stem { position: relative; display: inline-block; }
        .i-paw {
            position: absolute; left: 50%; top: -0.17em; transform: translateX(-50%) rotate(-10deg);
            width: 0.5em; height: 0.5em; fill: var(--primary);
            filter: drop-shadow(0 1px 4px rgba(255,107,53,0.35));
            transition: transform .2s ease;
        }
        .logo:hover .i-paw { transform: translateX(-50%) rotate(4deg) scale(1.08); }
        .logo:hover .wordmark { color: #fff; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-soft); text-decoration: none; font-size: 13px; font-weight: 500;
            padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; cursor: pointer;
            transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .back-btn:hover { background: var(--surface-2); color: var(--text-strong); border-color: rgba(255,255,255,0.2); }

        /* ── Page layout ── */
        .container { padding: 24px 28px 40px; }
        .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
        h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-strong); line-height: 1.2; }
        h2 { font-size: 16px; font-weight: 600; color: var(--text-strong); letter-spacing: -0.01em; }
        h3 { font-size: 14px; font-weight: 600; color: var(--text-strong); }
        .muted { color: var(--text-dim); }
        .toolbar { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }

        /* ── Panels / cards ── */
        .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
        .panel + .panel { margin-top: 16px; }
        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -2px 0 14px; }
        .panel-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--text-strong); }
        .panel-title .ico { color: var(--primary); }

        /* ── Form controls ── */
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-label { color: var(--text-dim); font-size: 11.5px; font-weight: 500; }
        .control-input {
            height: 38px; background: var(--surface); border: 1px solid var(--line-2);
            color: var(--text-strong); padding: 0 12px; border-radius: 8px; font-size: 13.5px; width: 100%;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        textarea.control-input { height: auto; min-height: 84px; padding: 9px 11px; resize: vertical; }
        .control-input:hover { border-color: rgba(255,255,255,0.2); }
        .control-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.22); }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); cursor: pointer; }
        input[type="checkbox"], input[type="radio"] { accent-color: var(--primary); }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 7px;
            height: 38px; padding: 0 16px; border-radius: 8px; cursor: pointer;
            font-size: 13.5px; font-weight: 600; text-decoration: none; white-space: nowrap;
            border: 1px solid transparent; transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--surface-2); color: var(--text-strong); border-color: var(--line-2); }
        .btn-secondary:hover { background: var(--dark-lighter); border-color: rgba(255,255,255,0.25); }
        .btn-ghost { background: transparent; color: var(--text-soft); border-color: var(--line-2); }
        .btn-ghost:hover { background: var(--surface-2); color: var(--text-strong); }
        .btn-danger { background: rgba(255,107,107,0.12); color: #FF8A8A; border-color: rgba(255,107,107,0.4); }
        .btn-danger:hover { background: rgba(255,107,107,0.22); }
        .btn-success { background: rgba(78,204,163,0.14); color: var(--success); border-color: rgba(78,204,163,0.45); }
        .btn-success:hover { background: rgba(78,204,163,0.24); }
        .btn-sm { height: 32px; padding: 0 12px; font-size: 12.5px; }
        .btn:disabled, button:disabled { opacity: .45; cursor: not-allowed; }
        .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; height: 38px; }
        .seg button { background: var(--surface); color: var(--text-soft); border: 0; padding: 0 12px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .seg button + button { border-left: 1px solid var(--line-2); }
        .seg button:hover, .seg button.active { background: var(--surface-2); color: var(--text-strong); }

        /* ── KPI tiles ── */
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
        .stat-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; }
        .stat-label { display: flex; align-items: center; gap: 7px; color: var(--text-dim); font-size: 12px; font-weight: 500; white-space: nowrap; }
        .stat-label .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
        .stat-value { font-size: 22px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.02em; line-height: 1.25; margin-top: 2px; font-variant-numeric: tabular-nums; }

        /* ── Tables ── */
        .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
        thead th {
            position: sticky; top: 0; z-index: 2; background: var(--surface);
            text-align: left; padding: 10px 14px; font-size: 11.5px; font-weight: 600; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--line-2); white-space: nowrap;
        }
        tbody td { padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--text-soft); vertical-align: middle; }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover td { background: rgba(255,255,255,0.025); }
        td.strong, .cell-strong { color: var(--text-strong); font-weight: 600; }
        .mono { font-family: var(--mono); font-size: 12.5px; }

        /* ── Badges / status pills ── */
        .badge {
            --c: var(--text-dim);
            display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
            padding: 2px 9px; border-radius: 999px; color: var(--text-strong);
            background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
        }
        .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
        .badge.plain::before { display: none; }
        .tag { font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 4px; background: rgba(255,255,255,0.1); color: var(--text-soft); letter-spacing: .03em; }

        /* ── Notices ── */
        .notice { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 13px;
                  background: rgba(255,255,255,0.03); border: 1px solid var(--line-2); color: var(--text-soft); }
        .notice .ico { margin-top: 1px; }
        .notice.info    { border-color: rgba(0,217,255,0.35);  background: rgba(0,217,255,0.06); }
        .notice.success { border-color: rgba(78,204,163,0.4);  background: rgba(78,204,163,0.07); color: var(--success); }
        .notice.warning { border-color: rgba(255,200,87,0.4);  background: rgba(255,200,87,0.07); color: var(--warning); }
        .notice.error   { border-color: rgba(255,107,107,0.45); background: rgba(255,107,107,0.08); color: #FF8A8A; }

        /* ── Modals ── */
        .modal { display: none; position: fixed; inset: 0; background: rgba(10,10,22,0.72); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
        .modal.show, .modal.active, .modal.open { display: flex; }
        .modal-content { background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; width: 100%; max-width: 680px; max-height: 88vh; overflow-y: auto; box-shadow: 0 30px 80px -20px rgba(0,0,0,0.75); }
        .modal-header { position: sticky; top: 0; z-index: 2; background: var(--surface); display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
        .modal-title { font-size: 17px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.01em; }
        .modal-body { padding: 18px 20px 22px; }
        .close-btn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; border-radius: 8px; color: var(--text-dim); cursor: pointer; font-size: 20px; line-height: 1; }
        .close-btn:hover { background: var(--surface-2); color: var(--text-strong); }

        /* ── Feedback ── */
        .toast { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: none; max-width: 420px; padding: 12px 16px 12px 14px; border-radius: 10px;
                 background: #26263F; color: var(--text-strong); font-size: 13.5px; border: 1px solid var(--line-2); border-left: 3px solid var(--success);
                 box-shadow: 0 16px 40px -12px rgba(0,0,0,0.7); }
        .toast.show { display: block; }
        .toast.error { border-left-color: var(--error); }
        .empty-state, .loading { text-align: center; padding: 56px 16px; color: var(--text-dim); }
        .empty-state h3 { color: var(--text-strong); font-size: 16px; margin-bottom: 4px; }
        .empty-state .ico-lg { width: 32px; height: 32px; color: var(--text-dim); margin-bottom: 10px; }
        .spinner { width: 22px; height: 22px; border: 2px solid var(--line-2); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        *::-webkit-scrollbar { width: 10px; height: 10px; }
        *::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
        *::-webkit-scrollbar-track { background: transparent; }
        @media (max-width: 768px) {
            .appbar, .container { padding-left: 14px; padding-right: 14px; }
            .wordmark { font-size: 24px; }
        }
        /* ═══ end base ═══ */

        /* ═══ Survey Viewer — page styles ═══ */
        :root { --kf: #B57BFF; }

        /* Buttons used by this page */
        .btn-scaffold { background: var(--surface-2); color: var(--text-strong); border-color: var(--line-2); }
        .btn-scaffold:hover { background: var(--dark-lighter); border-color: rgba(255,255,255,0.25); }
        .form-input { flex: 1; }

        /* Alerts */
        #alert-container:empty { display: none; }
        .alert { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 13px; border: 1px solid var(--line-2); background: rgba(255,255,255,0.03); color: var(--text-soft); }
        .alert.error   { border-color: rgba(255,107,107,0.45); background: rgba(255,107,107,0.08); color: #FF8A8A; }
        .alert.success { border-color: rgba(78,204,163,0.4);  background: rgba(78,204,163,0.07); color: var(--success); }

        /* Dashboard (list of completed surveys) */
        .dashboard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
        .dashboard-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 14px 16px; border-bottom: 1px solid var(--line); }
        .dashboard-title { display: flex; align-items: center; gap: 10px; }
        .dashboard-title .ico { color: var(--primary); }
        .badge-count { font-size: 12px; font-weight: 600; color: var(--text-soft); background: var(--surface-2); border: 1px solid var(--line-2); padding: 1px 9px; border-radius: 999px; font-variant-numeric: tabular-nums; }
        .filter-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); }
        .filter-row .search-wrap { position: relative; flex: 1; min-width: 200px; }
        .filter-row .search-wrap .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-dim); pointer-events: none; }
        .search-filter { padding-left: 36px; }
        .search-filter::placeholder, .form-input::placeholder { color: var(--text-dim); }
        .filter-select { width: auto; min-width: 160px; cursor: pointer; }
        .dashboard .table-wrap { border: 0; border-radius: 0; background: transparent; }
        #surveys-table tbody tr { cursor: pointer; }
        .td-job { font-family: var(--mono); font-size: 12.5px; font-weight: 700; color: var(--text-strong) !important; white-space: nowrap; }
        .td-surveyor { white-space: nowrap; }
        .td-date { white-space: nowrap; font-variant-numeric: tabular-nums; }
        .td-action { text-align: right; white-space: nowrap; }

        .type-badge { --c: var(--text-dim); display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap; color: var(--text-strong); background: color-mix(in srgb, var(--c) 16%, transparent); border: 1px solid color-mix(in srgb, var(--c) 40%, transparent); }
        .type-site-surveys    { --c: var(--primary); }
        .type-battery-surveys { --c: var(--accent); }
        .type-solar-surveys   { --c: var(--secondary); }
        .type-inspections     { --c: var(--success); }
        .type-jobs            { --c: var(--kf); }
        .type-default         { --c: var(--text-dim); }
        .status-completed { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; color: var(--text-strong); background: color-mix(in srgb, var(--complete) 18%, transparent); border: 1px solid color-mix(in srgb, var(--complete) 45%, transparent); }
        .status-completed::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--complete); }

        td.empty-state, td.loading-state { text-align: center; padding: 48px 16px; color: var(--text-dim); }
        .empty-state .icon { margin-bottom: 8px; }
        .empty-state .icon .ico { width: 28px; height: 28px; }
        .loading-state .spinner { width: 18px; height: 18px; margin-right: 10px; vertical-align: middle; }

        .pagination { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 10px 16px; border-top: 1px solid var(--line); }
        .page-info { font-size: 12.5px; color: var(--text-dim); }
        .page-btns { display: flex; gap: 4px; align-items: center; }
        .page-btn { min-width: 32px; height: 32px; padding: 0 9px; display: inline-flex; align-items: center; justify-content: center; background: var(--surface); border: 1px solid var(--line-2); color: var(--text-soft); border-radius: 7px; font-size: 12.5px; font-weight: 500; cursor: pointer; transition: background .15s ease, color .15s ease; font-variant-numeric: tabular-nums; }
        .page-btn:hover:not(:disabled) { background: var(--surface-2); color: var(--text-strong); }
        .page-btn.active { background: rgba(255,107,53,0.16); border-color: var(--primary); color: var(--text-strong); font-weight: 600; }

        /* Manual lookup */
        .manual-lookup { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; }
        .manual-lookup summary { cursor: pointer; color: var(--text-soft); font-size: 13px; font-weight: 500; user-select: none; list-style: none; display: flex; align-items: center; gap: 8px; }
        .manual-lookup summary::-webkit-details-marker { display: none; }
        .manual-lookup summary .ico { color: var(--text-dim); transition: transform .15s ease; }
        .manual-lookup[open] summary .ico { transform: rotate(90deg); }
        .manual-lookup summary:hover { color: var(--text-strong); }
        .manual-lookup .inner { padding-top: 12px; display: flex; gap: 10px; }

        /* Survey viewer */
        .survey-viewer { display: none; }
        .survey-viewer.active { display: block; }
        .action-buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
        .action-buttons .spacer { flex: 1; }

        .report-header { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
        .report-header h1 { font-size: 20px; letter-spacing: -0.01em; }
        .metadata { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin-top: 14px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
        .metadata-item { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-right: 1px solid var(--line); margin-right: -1px; }
        .metadata-label { color: var(--text-dim); font-size: 12px; }
        .metadata-value { color: var(--text-strong); font-size: 13.5px; font-weight: 500; word-break: break-word; }

        .section { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
        .section-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--text-strong); padding: 14px 20px; border-bottom: 1px solid var(--line); }
        .section-title .ico { color: var(--primary); }
        .field-row { display: grid; grid-template-columns: minmax(200px, 38%) 1fr; gap: 6px 20px; padding: 11px 20px; border-bottom: 1px solid var(--line); page-break-inside: avoid; }
        .field-row:last-child { border-bottom: 0; }
        .field-question { font-size: 13px; color: var(--text-dim); font-weight: 500; }
        .field-answer { font-size: 13.5px; color: var(--text-strong); word-wrap: break-word; overflow-wrap: break-word; }
        .field-photos { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; margin-top: 4px; }
        .photo-container { background: var(--bg); padding: 4px; border-radius: 8px; border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; }
        .survey-photo { width: 100%; max-width: 100%; height: auto; border-radius: 6px; display: block; }

        /* Additional materials */
        .am-section { padding: 14px 20px; border-bottom: 1px solid var(--line); }
        .am-section:last-child { border-bottom: 0; }
        .am-section-title { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
        .am-section-title .ico { color: var(--kf); }
        .am-item { display: flex; align-items: baseline; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
        .am-item:last-child { border-bottom: 0; }
        .am-bullet { width: 5px; height: 5px; border-radius: 50%; background: var(--kf); flex-shrink: 0; align-self: center; font-size: 0; }
        .am-desc { flex: 1; color: var(--text-strong); }
        .am-qty { color: var(--text-strong); font-weight: 600; background: color-mix(in srgb, var(--kf) 16%, transparent); border: 1px solid color-mix(in srgb, var(--kf) 38%, transparent); padding: 1px 8px; border-radius: 6px; font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .am-empty { color: var(--text-dim); font-size: 13px; }

        /* Picklist panel */
        .picklist-panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
        .picklist-panel-header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
        .picklist-panel-header h3 { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--text-strong); }
        .picklist-panel-header h3 .ico { color: var(--primary); }
        .picklist-badge { font-family: var(--mono); font-size: 11.5px; font-weight: 700; color: var(--text-soft); background: var(--surface-2); border: 1px solid var(--line-2); padding: 1px 8px; border-radius: 6px; }
        .picklist-meta-line { color: var(--text-dim); font-size: 12.5px; margin-left: auto; }
        .specs-section-title { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; margin: 18px 0 8px; }
        .specs-section-title .ico { color: var(--primary); }
        .picklist-panel-header + .specs-section-title { margin-top: 0; }
        .specs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
        .spec-item { position: relative; background: var(--surface-2); border: 1px solid var(--line); border-left: 3px solid var(--line-2); border-radius: 8px; padding: 9px 12px; }
        .spec-item.has-value { border-left-color: var(--accent); }
        .spec-item.no-value  { opacity: .5; }
        .spec-item.highlight { border-left-color: var(--success) !important; }
        .spec-ref { position: absolute; top: 8px; right: 10px; font-family: var(--mono); font-size: 10px; color: var(--text-dim); }
        .spec-label { font-size: 12px; color: var(--text-dim); margin-bottom: 2px; padding-right: 34px; }
        .spec-note { color: var(--text-dim); opacity: .8; }
        .spec-value { font-size: 13.5px; color: var(--text-strong); font-weight: 500; }
        .spec-value.empty-val { color: var(--text-dim); font-weight: 400; }
        .spec-unit { font-size: 11.5px; color: var(--text-dim); margin-left: 3px; }

        /* Roof layout */
        .roof-map-wrap { margin-top: 18px; padding: 16px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
        .roof-map-hdr { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
        .roof-map-hdr h4 { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--text-strong); }
        .roof-map-hdr h4 .ico { color: var(--primary); }
        .legend { display: flex; gap: 14px; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); }
        .swatch { width: 14px; height: 18px; border-radius: 3px; display: inline-block; }
        .swatch.p { background: var(--primary); }
        .swatch.l { background: var(--accent); width: 20px; height: 13px; }
        .swatch.e { background: transparent; border: 1px dashed var(--line-2); width: 16px; height: 16px; }
        .roof-grid-wrap { overflow-x: auto; padding-bottom: 4px; }
        .roof-grid { display: inline-grid; gap: 3px; padding: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
        .cell { width: 24px; height: 24px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; }
        .cell.e { background: transparent; border: 1px dashed var(--line-2); }
        .cell.p { background: var(--primary); color: #fff; }
        .cell.l { background: var(--accent); color: #062433; }
        .roof-stats { display: flex; gap: 18px; margin-top: 12px; flex-wrap: wrap; }
        .roof-stat { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-dim); }
        .roof-stat strong { color: var(--text-strong); }
        .roof-stat .swatch { width: 10px; height: 10px; }

        /* KF picklist */
        .pl-kf-wrap { margin-top: 18px; }
        .pl-kf-hdr { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
        .pl-kf-hdr h4 { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; }
        .pl-kf-hdr h4 .ico { color: var(--kf); }
        .pl-kf-count { font-size: 11.5px; font-weight: 600; color: var(--text-soft); background: color-mix(in srgb, var(--kf) 14%, transparent); border: 1px solid color-mix(in srgb, var(--kf) 38%, transparent); padding: 1px 8px; border-radius: 999px; }
        .pl-kf-table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
        .pl-kf-table thead th { background: var(--surface); }
        .pl-kf-part { font-family: var(--mono); font-size: 12.5px; color: var(--text-strong); }
        .pl-kf-qty { display: inline-block; min-width: 28px; text-align: center; padding: 1px 8px; border-radius: 6px; font-weight: 600; font-size: 12.5px; color: var(--text-strong); background: color-mix(in srgb, var(--kf) 16%, transparent); border: 1px solid color-mix(in srgb, var(--kf) 38%, transparent); font-variant-numeric: tabular-nums; }
        .pl-kf-total td { border-top: 1px solid var(--line-2); color: var(--text-dim); font-size: 12.5px; }
        .no-picklist { margin-bottom: 16px; }

        /* PDF ripper panel */
        .pdf-ripper-panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-top: 16px; }
        .pdf-ripper-header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
        .pdf-ripper-header h3 { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--text-strong); }
        .pdf-ripper-header h3 .ico { color: var(--primary); }
        .pdf-ripper-badge { font-size: 11.5px; font-weight: 600; color: var(--text-strong); padding: 1px 9px; border-radius: 999px; background: color-mix(in srgb, var(--secondary) 16%, transparent); border: 1px solid color-mix(in srgb, var(--secondary) 42%, transparent); }
        .pdf-ripper-meta { margin-left: auto; color: var(--text-dim); font-size: 12.5px; }
        .pdf-ripper-address { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; }
        .pdf-ripper-address-label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); margin-bottom: 2px; }
        .pdf-ripper-address-value { font-size: 13.5px; color: var(--text-strong); font-weight: 500; }
        .pdf-ripper-images { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
        .pdf-ripper-img-card { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; transition: border-color .15s ease; }
        .pdf-ripper-img-card:hover { border-color: var(--line-2); }
        .pdf-ripper-img-label, .pdf-ripper-text-label { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--text-strong); }
        .pdf-ripper-img-label .ico, .pdf-ripper-text-label .ico { color: var(--text-dim); }
        .pdf-ripper-img-wrap { padding: 10px; }
        .pdf-ripper-img { width: 100%; height: auto; border-radius: 6px; display: block; cursor: zoom-in; }
        .pdf-ripper-img-actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 12px; border-top: 1px solid var(--line); }
        .pdf-ripper-action-btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 7px; font-size: 12.5px; font-weight: 500; cursor: pointer; text-decoration: none; background: var(--surface-2); color: var(--text-soft); border: 1px solid var(--line-2); transition: background .15s ease, color .15s ease; }
        .pdf-ripper-action-btn:hover { background: var(--dark-lighter); color: var(--text-strong); }
        .pdf-ripper-action-btn .ico { width: 14px; height: 14px; }
        .pdf-ripper-text-card { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; margin-top: 14px; }
        .pdf-ripper-text-body { padding: 12px; font-size: 13px; color: var(--text-soft); line-height: 1.65; max-height: 240px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
        .pdf-ripper-loading { display: flex; align-items: center; gap: 8px; color: var(--text-dim); font-size: 13px; padding: 12px 0; }

        /* Lightbox */
        .lightbox-overlay { display: none; position: fixed; inset: 0; background: rgba(10,10,22,0.92); z-index: 9999; align-items: center; justify-content: center; padding: 24px; cursor: zoom-out; }
        .lightbox-overlay.open { display: flex; }
        .lightbox-inner { position: relative; max-width: 96vw; max-height: 94vh; cursor: default; }
        .lightbox-inner img { max-width: 94vw; max-height: 88vh; border-radius: 10px; display: block; object-fit: contain; border: 1px solid var(--line-2); }
        .lightbox-close { position: absolute; top: -14px; right: -14px; width: 32px; height: 32px; border-radius: 8px; background: var(--surface); color: var(--text-strong); border: 1px solid var(--line-2); cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .lightbox-close:hover { background: var(--surface-2); }
        .lightbox-caption { position: absolute; bottom: -28px; left: 0; right: 0; text-align: center; font-size: 12.5px; color: var(--text-dim); }

        @media (max-width: 768px) {
            .field-row { grid-template-columns: 1fr; gap: 2px; padding: 10px 16px; }
            .section-title { padding: 12px 16px; }
            .am-section { padding: 12px 16px; }
            .picklist-panel, .pdf-ripper-panel, .report-header { padding: 14px 16px; }
            .picklist-meta-line, .pdf-ripper-meta { margin-left: 0; width: 100%; }
            .pdf-ripper-images { grid-template-columns: 1fr; }
            .specs-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .metadata { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .action-buttons .spacer { display: none; }
            .action-buttons .btn { flex: 1 1 auto; }
            .manual-lookup .inner { flex-wrap: wrap; }
            .filter-select { flex: 1; min-width: 0; }
            .filter-row .search-wrap { flex-basis: 100%; }
        }
        @media print {
            body { background: white; color: black; }
            .appbar, .page-head, .dashboard, .manual-lookup, .action-buttons, .btn, .lightbox-overlay { display: none !important; }
            .container { padding: 0; }
            .survey-viewer { background: white; display: block !important; }
            .report-header, .section, .picklist-panel, .pdf-ripper-panel { background: white; border-color: #ccc; }
            .report-header h1, .section-title { color: #222; border-color: #ccc; }
            .field-row { border-color: #ddd; }
            .field-question { color: #555; } .field-answer { color: #000; }
            .metadata, .metadata-item { border-color: #ccc; }
            .metadata-label { color: #666; } .metadata-value { color: #000; }
            .survey-photo { max-width: 100%; }
            .am-section { background: white; border-color: #ccc; } .am-desc { color: #000; }
            .spec-item { background: #f7f7f7; } .spec-value { color: #000; }
            .pdf-ripper-panel { page-break-inside: avoid; }
            .pdf-ripper-img { max-width: 100%; cursor: default; }
            .pdf-ripper-text-body { max-height: none; color: #222; }
        }
    </style>
</head>

function showAlert(msg, type='error') {
    const c = document.getElementById('alert-container');
    c.innerHTML = `<div class="alert ${type}">${msg}</div>`;
    if (type==='success') setTimeout(() => c.innerHTML='', 5000);
}
function esc(t) { const d=document.createElement('div'); d.textContent=String(t||''); return d.innerHTML; }
function fmtVal(v) {
    if (v==null||v==='') return 'N/A';
    if (typeof v==='boolean') return v?'Yes':'No';
    if (Array.isArray(v)) return v.filter(i=>typeof i==='string'&&!i.startsWith('http')&&!i.startsWith('data:')).join(', ')||'N/A';
    if (typeof v==='object') return JSON.stringify(v);
    return String(v);
}
function stripEmoji(str) {
    return str.replace(/[\u{1F000}-\u{1FFFF}]/gu,'').replace(/[\u2600-\u27BF]/g,'').replace(/\s{2,}/g,' ').trim();
}
function extractSurveyor(data) {
    const s=data.sections;
    if(s?.surveyDetails?.surveyor) return s.surveyDetails.surveyor;
    if(s?.batteryDetails?.name)    return s.batteryDetails.name;
    return data.surveyor||data.conductedBy||data.createdBy||data.submittedBy||'—';
}
function extractDate(data) {
    const s=data.sections;
    const raw=s?.surveyDetails?.conductedOn||s?.batteryDetails?.date||data.submittedAt||data.createdAt||data.timestamp||null;
    if(!raw) return {display:'—',ts:0};
    const dt=new Date(raw);
    if(isNaN(dt)) return {display:String(raw),ts:0};
    return {
        display:dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+' '+dt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),
        ts:dt.getTime()
    };
}
function typeBadgeClass(source) {
    const map={'site-surveys':'type-site-surveys','battery-surveys':'type-battery-surveys','solar-surveys':'type-solar-surveys','inspections':'type-inspections','jobs':'type-jobs'};
    return map[source]||'type-default';
}
function typeLabel(source) { return source.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase()); }

//  PDF RIPPER — fetch from Solar-jobs (primary) / jobs (fallback) & render
// ══════════════════════════════════════════════════════
async function loadAndRenderPdfRipper(jobNumber) {
    const container = document.getElementById('pdf-ripper-display');
    container.innerHTML = '';
    if (!jobNumber || jobNumber === '—') return;

    container.innerHTML = '<div class="pdf-ripper-loading"><span class="spinner" style="width:14px;height:14px"></span>Checking for PDF survey data…</div>';

    try {
        const { collection, getDocs, query, where } = window.firebaseModules;

        let pdfRipperData = null;

        // PDF Ripper always writes to Solar-jobs (creating/seeding the record if the
        // job only lived in 'jobs'), so Solar-jobs is checked first. 'jobs' is kept
        // as a fallback for any older records saved before that change. Each
        // collection is tried with both the spaced 'Job Number' field and the
        // lowercase 'jobNumber' field, since different pages have written either.
        const lookups = [
            ['Solar-jobs', 'Job Number'],
            ['Solar-jobs', 'jobNumber'],
        ];

        for (const [col, field] of lookups) {
            if (pdfRipperData) break;
            try {
                const q    = query(collection(window.db, col), where(field, '==', jobNumber));
                const snap = await getDocs(q);
                if (!snap.empty) pdfRipperData = snap.docs[0].data().pdfRipper || null;
            } catch(e) { console.warn(`${col} "${field}" query failed:`, e.message); }
        }

        if (!pdfRipperData) {
            container.innerHTML = '';   // nothing to show — silently hide
            return;
        }

        container.innerHTML = buildPdfRipperHTML(pdfRipperData);

    } catch(e) {
        console.warn('PDF Ripper lookup error:', e.message);
        container.innerHTML = '';
    }
}

function buildPdfRipperHTML(pr) {
    if (!pr) return '';

    const savedDate = pr.savedAt

    // Address block
    const addressHTML = pr.address
        ? `<div class="pdf-ripper-address">
               <div class="pdf-ripper-address-label">${ICON('pin')}Extracted address</div>
               <div class="pdf-ripper-address-value">${esc(pr.address)}</div>
           </div>`
        : '';

    // Image cards
    const cards = [];

    if (pr.proposedLayoutUrl) {
        const url = esc(pr.proposedLayoutUrl);
        cards.push(`
            <div class="pdf-ripper-img-card">
                <div class="pdf-ripper-img-label">${ICON('map')}Proposed layout <span style="font-weight:400;color:var(--text-dim);font-size:12px;">(Page 3)</span></div>
                <div class="pdf-ripper-img-wrap">
                    <img class="pdf-ripper-img"
                         src="${url}"
                         alt="Proposed Layout"
                         onclick="openLightbox('${url}','Proposed Layout — Page 3')"

                </div>
                <div class="pdf-ripper-img-actions">
                    <a class="pdf-ripper-action-btn" href="${url}" target="_blank" download>${ICON('download')}Download</a>
                    <button class="pdf-ripper-action-btn" onclick="openLightbox('${url}','Proposed Layout — Page 3')">${ICON('search')}Full size</button>
                </div>
            </div>`);
    }

    if (pr.siteAssessmentUrl) {
        const url = esc(pr.siteAssessmentUrl);
        cards.push(`
            <div class="pdf-ripper-img-card">
                <div class="pdf-ripper-img-label">${ICON('package')}Site assessment <span style="font-weight:400;color:var(--text-dim);font-size:12px;">(Page 4)</span></div>
                <div class="pdf-ripper-img-wrap">
                    <img class="pdf-ripper-img"
                         src="${url}"
                         alt="Site Assessment"
                         onclick="openLightbox('${url}','Site Assessment — Page 4')"
                         loading="lazy" />
                </div>
                <div class="pdf-ripper-img-actions">
                    <a class="pdf-ripper-action-btn" href="${url}" target="_blank" download>${ICON('download')}Download</a>
                    <button class="pdf-ripper-action-btn" onclick="openLightbox('${url}','Site Assessment — Page 4')">${ICON('search')}Full size</button>
                </div>
            </div>`);
    }

    const imagesHTML = cards.length
        ? `<div class="pdf-ripper-images">${cards.join('')}</div>`
        : '';

    // Extracted text (scrollable)
    const textHTML = pr.siteAssessmentText
        ? `<div class="pdf-ripper-text-card">
               <div class="pdf-ripper-text-label">${ICON('file')}Extracted assessment text</div>
               <div class="pdf-ripper-text-body">${esc(pr.siteAssessmentText)}</div>
           </div>`
        : '';

    // If there's truly nothing to show, return empty
    if (!addressHTML && !imagesHTML && !textHTML) return '';

    return `
        <div class="pdf-ripper-panel">
            <div class="pdf-ripper-header">
                <h3>${ICON('file')}PDF survey data</h3>
                <span class="pdf-ripper-badge">PDF Ripper</span>
                ${savedDate ? `<span class="pdf-ripper-meta">Extracted ${savedDate}</span>` : ''}
            </div>
            ${addressHTML}
            ${imagesHTML}
            ${textHTML}
        </div>`;
}

// ══════════════════════════════════════════════════════
function renderAdditionalMaterials(items) {
    if (!items || (Array.isArray(items) && items.length === 0)) {
        return `<div class="section">
            <h2 class="section-title">${ICON('wrench')}Additional materials</h2>
            <div class="am-section"><p class="am-empty">No additional materials were requested for this survey.</p></div>
        </div>`;
    }
    const electrical=[], roof=[], other=[];
    items.forEach(item => {
        const str = typeof item==='string' ? item : JSON.stringify(item);
        const match = str.match(/^[•·-]?\s*(Electrical|Roof):\s*(.+?)\s*[×x]\s*(\d+)$/i);
        if(match){
            const cat=match[1].toLowerCase(), desc=match[2].trim(), qty=match[3];
            if(cat==='electrical') electrical.push({desc,qty});
            else roof.push({desc,qty});
        } else { other.push(str.replace(/^[•·-]\s*/,'').trim()); }
    });
    let html=`<div class="section"><h2 class="section-title">${ICON('wrench')}Additional materials</h2>`;
    if(electrical.length){ html+=`<div class="am-section"><div class="am-section-title">${ICON('zap')}Electrical (${electrical.length} item${electrical.length!==1?'s':''})</div>`; electrical.forEach(({desc,qty})=>{ html+=`<div class="am-item"><span class="am-bullet"></span><span class="am-desc">${esc(desc)}</span><span class="am-qty">× ${esc(qty)}</span></div>`; }); html+=`</div>`; }
    if(roof.length){ html+=`<div class="am-section"><div class="am-section-title">${ICON('home')}Roof (${roof.length} item${roof.length!==1?'s':''})</div>`; roof.forEach(({desc,qty})=>{ html+=`<div class="am-item"><span class="am-bullet"></span><span class="am-desc">${esc(desc)}</span><span class="am-qty">× ${esc(qty)}</span></div>`; }); html+=`</div>`; }
    if(other.length){ html+=`<div class="am-section"><div class="am-section-title">${ICON('package')}Other items</div>`; other.forEach(line=>{ html+=`<div class="am-item"><span class="am-bullet"></span><span class="am-desc">${esc(line)}</span></div>`; }); html+=`</div>`; }
    if(!electrical.length&&!roof.length&&!other.length) html+=`<div class="am-section"><p class="am-empty">No additional materials were requested for this survey.</p></div>`;
    return html+`</div>`;
}

async function reloadAllSurveys() {
    document.getElementById('surveys-tbody').innerHTML =
        '<tr><td colspan="6" class="loading-state"><span class="spinner"></span>Loading completed surveys…</td></tr>';
    document.getElementById('pagination-bar').style.display='none';
    try {
        const { collection, getDocs, query, where } = window.firebaseModules;
        allSurveys = [];
        for (const col of SURVEY_COLS) {
            try {
                const snap = await getDocs(query(collection(window.db, col), where('status','==','completed')));
                snap.forEach(d => {
                    const data = d.data();
                    allSurveys.push({ id:d.id, source:col, data, jobNumber:data.jobNumber||'—', surveyor:extractSurveyor(data), dateInfo:extractDate(data) });
                });
            } catch(e) { console.warn('Could not load', col, e.message); }
        }
        const types = [...new Set(allSurveys.map(s=>s.source))].sort();
        const sel = document.getElementById('filter-type');
        sel.innerHTML = '<option value="">All Types</option>' + types.map(t=>`<option value="${t}">${typeLabel(t)}</option>`).join('');
        document.getElementById('total-badge').textContent = allSurveys.length;
        applyFilters();
    } catch(e) {
        console.error(e);
        document.getElementById('surveys-tbody').innerHTML =
            `<tr><td colspan="6" class="empty-state" style="color:var(--error)">Error: ${esc(e.message)}</td></tr>`;
    }
}
window.reloadAllSurveys = reloadAllSurveys;

function applyFilters() {
    const search = document.getElementById('filter-search').value.toLowerCase().trim();
    const type   = document.getElementById('filter-type').value;
    const sort   = document.getElementById('filter-sort').value;
    filteredSurveys = allSurveys.filter(s => {
        const matchType   = !type   || s.source===type;
        const matchSearch = !search || s.jobNumber.toLowerCase().includes(search) || s.surveyor.toLowerCase().includes(search);
        return matchType && matchSearch;
    });
    filteredSurveys.sort((a,b) => {
        if(sort==='date-desc') return b.dateInfo.ts-a.dateInfo.ts;
        if(sort==='date-asc')  return a.dateInfo.ts-b.dateInfo.ts;
        if(sort==='job-asc')   return a.jobNumber.localeCompare(b.jobNumber);
        if(sort==='job-desc')  return b.jobNumber.localeCompare(a.jobNumber);
        return 0;
    });
    currentPage = 1;
    renderTable();
}
window.applyFilters = applyFilters;

function renderTable() {
    const tbody    = document.getElementById('surveys-tbody');
    const total    = filteredSurveys.length;
    const start    = (currentPage-1)*PAGE_SIZE;
    const end      = Math.min(start+PAGE_SIZE, total);
    const pageRows = filteredSurveys.slice(start, end);
    if (!total) {
        tbody.innerHTML = `<tr><td colspan="6" class="empty-state"><div class="icon">${ICON('clipboard')}</div><div>No completed surveys found.</div></td></tr>`;
        document.getElementById('pagination-bar').style.display='none';
        return;
    }
    tbody.innerHTML = pageRows.map(s => {
        const gi = allSurveys.findIndex(a=>a.id===s.id&&a.source===s.source);
        return `<tr onclick="openSurveyFromDashboard(${gi})">
            <td class="td-job">${esc(s.jobNumber)}</td>
            <td class="td-surveyor">${esc(s.surveyor)}</td>
            <td><span class="type-badge ${typeBadgeClass(s.source)}">${esc(typeLabel(s.source))}</span></td>
            <td class="td-date">${esc(s.dateInfo.display)}</td>
            <td><span class="status-completed">Completed</span></td>
            <td class="td-action"><button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();openSurveyFromDashboard(${gi})">View${ICON('chevron-right')}</button></td>
        </tr>`;
    }).join('');
    const totalPages = Math.ceil(total/PAGE_SIZE);
    document.getElementById('page-info').textContent = `Showing ${start+1}–${end} of ${total}`;
    const pBtns = document.getElementById('page-btns');
    let btns = `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''} aria-label="Previous page">${ICON('chevron-left')}</button>`;
    for(let p=1;p<=totalPages;p++){
        if(totalPages<=7||p===1||p===totalPages||Math.abs(p-currentPage)<=1)
            btns+=`<button class="page-btn ${p===currentPage?'active':''}" onclick="goPage(${p})">${p}</button>`;
        else if(Math.abs(p-currentPage)===2)
            btns+=`<span style="color:var(--text-dim);padding:0 4px;">…</span>`;
    }
    btns+=`<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''} aria-label="Next page">${ICON('chevron-right')}</button>`;
    pBtns.innerHTML = btns;
    document.getElementById('pagination-bar').style.display='flex';
}
function goPage(p) {
    const total=Math.ceil(filteredSurveys.length/PAGE_SIZE);
    if(p<1||p>total) return;
    currentPage=p; renderTable();
    document.getElementById('dashboard-panel').scrollIntoView({behavior:'smooth'});
}
window.goPage=goPage;

}

async function loadSurveysForJob() {
    const jobNumber=document.getElementById('job-number-input').value.trim();
    if(!jobNumber) return showAlert('Please enter a job number');
    document.getElementById('survey-viewer').classList.remove('active');
    showAlert('Loading…','success');
    try {
        const{collection,query,where,getDocs,orderBy}=window.firebaseModules;
        const cols=['site-surveys','installations','customers','surveys','battery-surveys','solar-surveys','inspections','tasks','notes'];
        allDocuments=[];
        for(const col of cols){
            try{
                const snap=await getDocs(query(collection(window.db,col),where('jobNumber','==',jobNumber),where('status','==','completed')));
                snap.forEach(d=>allDocuments.push({id:d.id,source:col,data:d.data()}));
            }catch(e){}
        }
        currentPicklist=null;
        try{
            const plSnap=await getDocs(query(collection(window.db,'picklists'),where('jobNumber','==',jobNumber),orderBy('savedAt','desc')));
            if(!plSnap.empty) currentPicklist=plSnap.docs[0].data();
        }catch(e){}
        if(!allDocuments.length) return showAlert('No completed surveys found for this job number');
        allDocuments.sort((a,b)=>{
            const da=a.data.submittedAt||a.data.createdAt||a.data.timestamp||0;
            const db2=b.data.submittedAt||b.data.createdAt||b.data.timestamp||0;
            return new Date(db2)-new Date(da);
        });
        if(allDocuments.length===1){
            document.getElementById('dashboard-panel').style.display='none';
            document.getElementById('manual-lookup').style.display='none';
            viewDocument(0);
        } else { showDocumentList(allDocuments); }
    }catch(e){ showAlert('Error: '+e.message); }
}
window.loadSurveysForJob=loadSurveysForJob;
document.getElementById('job-number-input').addEventListener('keydown',e=>{if(e.key==='Enter')loadSurveysForJob();});

function showDocumentList(docs) {
    document.getElementById('dashboard-panel').style.display='block';
    document.getElementById('survey-viewer').classList.remove('active');
    const tbody=document.getElementById('surveys-tbody');
    tbody.innerHTML=docs.map((doc,i)=>{
        const d=doc.data.submittedAt||doc.data.createdAt||doc.data.timestamp;
        const dt=d?new Date(d):null;
        const display=dt?dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+' '+dt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):'—';
        return `<tr onclick="viewManualDoc(${i})">
            <td class="td-job">${esc(doc.data.jobNumber||'—')}</td>
            <td class="td-surveyor">${esc(extractSurveyor(doc.data))}</td>
            <td><span class="type-badge ${typeBadgeClass(doc.source)}">${esc(typeLabel(doc.source))}</span></td>
            <td class="td-date">${esc(display)}</td>
            <td><span class="status-completed">Completed</span></td>

}

}

// ══════════════════════════════════════════════════════
//  VIEW DOCUMENT
// ══════════════════════════════════════════════════════
function viewDocument(index) {
    currentDocument=allDocuments[index];
    const d=currentDocument.data.submittedAt||currentDocument.data.createdAt||currentDocument.data.timestamp;
    const date=d?new Date(d).toLocaleDateString('en-GB'):'N/A';
    const time=d?new Date(d).toLocaleTimeString('en-GB'):'N/A';

    document.getElementById('picklist-display').innerHTML=currentPicklist
        ?buildPicklistHTML(currentPicklist)
        :`<div class="notice info no-picklist">${ICON('info')}<span>No saved picklist found for this job.</span></div>`;

    let html=`<div class="report-header">
        <h1>${esc(typeLabel(currentDocument.source))}</h1>
        <div class="metadata">
            <div class="metadata-item"><div class="metadata-label">Collection</div><div class="metadata-value">${currentDocument.source}</div></div>
            <div class="metadata-item"><div class="metadata-label">Job number</div><div class="metadata-value mono">${currentDocument.data.jobNumber||'N/A'}</div></div>
            <div class="metadata-item"><div class="metadata-label">Status</div><div class="metadata-value"><span class="status-completed">Completed</span></div></div>
            <div class="metadata-item"><div class="metadata-label">Date</div><div class="metadata-value">${date}</div></div>
            <div class="metadata-item"><div class="metadata-label">Time</div><div class="metadata-value">${time}</div></div>
        </div>
    </div>`;

    if(currentDocument.data.sections){
        SECTION_ORDER.forEach(secKey=>{
            const secData=currentDocument.data.sections[secKey];
            if(!secData) return;
            if(secKey==='additionalMaterials') html+=renderAdditionalMaterials(secData);
            else html+=renderSection(secKey,secData);
        });
    } else {
        html+='<div class="section"><h2 class="section-title">All Fields</h2>';
        Object.keys(currentDocument.data).forEach(k=>{
            if(k==='sections') return;
            const q=QT[k]||k.replace(/([A-Z])/g,' $1').replace(/^./,s=>s.toUpperCase());
            html+=`<div class="field-row"><div class="field-question">${q}</div><div class="field-answer">${smartFmt(currentDocument.data[k])}</div></div>`;
        });
        html+='</div>';
    }

    document.getElementById('survey-content').innerHTML=html;
    document.getElementById('survey-viewer').classList.add('active');
    window.scrollTo(0,0);

    // Async: load PDF ripper data from Solar-jobs (primary) / jobs (fallback)
    // The survey data may store jobNumber as 'jobNumber' (lowercase)
    const jobNum = currentDocument.data.jobNumber || currentDocument.data['Job Number'] || '';
    loadAndRenderPdfRipper(jobNum);
}
window.viewDocument=viewDocument;

function renderSection(secKey,data){
    const title=secKey.replace(/([A-Z])/g,' $1').replace(/^./,s=>s.toUpperCase()).trim();
    const order=FIELD_ORDER[secKey]||Object.keys(data).sort();
    let html=`<div class="section"><h2 class="section-title">${title}</h2>`;
    order.forEach(key=>{
        if(key.endsWith('Photos')) return;
        const val=data[key]; const photos=data[key+'Photos']||[];
        if((val==null||val==='')&&!photos.length) return;
        const q=QT[key]||key.replace(/([A-Z])/g,' $1').replace(/^./,s=>s.toUpperCase()).trim();
        html+=`<div class="field-row"><div class="field-question">${q}</div><div class="field-answer">${smartFmt(val)}</div>`;
        if(photos.length){
            html+='<div class="field-photos">';
            photos.forEach((p,i)=>{ const src=typeof p==='string'?p:''; html+=`<div class="photo-container"><img src="${src}" class="survey-photo" alt="Photo ${i+1}" loading="lazy"/></div>`; });
            html+='</div>';
        }
        html+='</div>';
    });
    return html+'</div>';
}

function smartFmt(v){
    if(v==null||v==='') return 'N/A';
    if(typeof v==='boolean') return v?'Yes':'No';
    if(typeof v==='number') return v.toString();
    if(Array.isArray(v)){
        if(v.length&&typeof v[0]==='string'&&(v[0].startsWith('data:image')||v[0].startsWith('http')))
            return `<span style="color:var(--accent)">${v.length} photo(s) attached</span>`;
        return v.join(', ')||'N/A';
    }
    if(typeof v==='object'){
        const ks=Object.keys(v);
        if(ks.length>3) return `<span style="color:var(--text-dim)">Object (${ks.length} properties)</span>`;
        return `<pre style="font-family:var(--mono);font-size:12px;padding:8px 10px;background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow-x:auto;white-space:pre-wrap">${JSON.stringify(v,null,2)}</pre>`;
    }
    if(typeof v==='string'){
        if(v.startsWith('data:image')) return `<img src="${v}" class="survey-photo" style="max-width:300px;border-radius:8px;margin-top:0.5rem" loading="lazy"/>`;
        if((v.startsWith('http://')||v.startsWith('https://'))&&(v.includes('firebasestorage')||/\.(jpg|jpeg|png|gif|webp)$/i.test(v)))
            return `<img src="${v}" class="survey-photo" style="max-width:300px;border-radius:8px;margin-top:0.5rem" loading="lazy"/>`;
    }
    return esc(v);
}

function buildPicklistHTML(pl){
    const dt=pl.savedAt?new Date(pl.savedAt).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'';
    const specCard=d=>{const v=pl.specs?.[d.label]||'';const noteH=d.note?`<span class="spec-note"> (${esc(d.note)})</span>`:'';const unitH=(v&&d.unit)?`<span class="spec-unit">${esc(d.unit)}</span>`:'';const hl=d.highlight?' highlight':'';return`<div class="spec-item ${v?'has-value':'no-value'}${hl}"><div class="spec-ref">${d.col}${d.row}</div><div class="spec-label">${esc(d.label)}${noteH}</div><div class="spec-value ${v?'':'empty-val'}">${v?esc(v)+unitH:'—'}</div></div>`;};
    const mcCard=d=>{const v=pl.mountCheck?.[d.label]||'';const hl=d.highlight?' highlight':'';return`<div class="spec-item ${v?'has-value':'no-value'}${hl}"><div class="spec-ref">${d.col}${d.row}</div><div class="spec-label">${esc(d.label)}</div><div class="spec-value ${v?'':'empty-val'}">${v?esc(v):'—'}</div></div>`;};
    const flatArr=pl.panelFlat||(pl.panelGrid?pl.panelGrid.flat():null);

    let roofHTML='';
    if(flatArr&&cols){
        let pC=0,lC=0,cells='';
        flatArr.forEach(v=>{if(v==='P')pC++;if(v==='L')lC++;const cls=v==='P'?'p':v==='L'?'l':'e';cells+=`<div class="cell ${cls}">${v==='P'?'P':v==='L'?'L':''}</div>`;});
        if(pC||lC) roofHTML=`<div class="roof-map-wrap"><div class="roof-map-hdr"><h4>${ICON('home')}Roof panel layout</h4><div class="legend"><div class="legend-item"><div class="swatch p"></div>Portrait (P)</div><div class="legend-item"><div class="swatch l"></div>Landscape (L)</div><div class="legend-item"><div class="swatch e"></div>Empty</div></div></div><div class="roof-grid-wrap"><div class="roof-grid" style="grid-template-columns:repeat(${cols},24px)">${cells}</div></div><div class="roof-stats"><div class="roof-stat"><span class="swatch p"></span>Portrait: <strong>${pC}</strong></div><div class="roof-stat"><span class="swatch l"></span>Landscape: <strong>${lC}</strong></div><div class="roof-stat">Total: <strong>${pC+lC}</strong></div></div></div>`;
    }
    let kfHTML='';
    if(pl.kfPicklist&&pl.kfPicklist.length){
        let totalQty=0;

        const rows=pl.kfPicklist.map((it,i)=>`<tr><td style="color:var(--text-dim);font-size:12px">${i+1}</td><td><span class="pl-kf-part">${esc(it.partCode)}</span></td><td><span class="pl-kf-qty">${esc(it.qty||'—')}</span></td></tr>`).join('')+
            `<tr class="pl-kf-total"><td></td><td style="color:var(--text-dim)">Total qty</td><td><span class="pl-kf-qty">${totalQty}</span></td></tr>`;
        kfHTML=`<div class="pl-kf-wrap"><div class="pl-kf-hdr"><h4>${ICON('puzzle')}KF picklist</h4><span class="pl-kf-count">${pl.kfPicklist.length} item${pl.kfPicklist.length!==1?'s':''}</span></div><div class="pl-kf-table-wrap"><table class="pl-kf-table"><thead><tr><th>#</th><th>Part Code</th><th>Qty</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
    }
    return `<div class="picklist-panel">
        <div class="picklist-panel-header">
            <h3>${ICON('clipboard')}Picklist</h3>
            <div class="picklist-badge">Job #${esc(pl.jobNumber||'')}</div>
            <div class="picklist-meta-line">${esc(pl.customerName||'')}${pl.installDate?' · Install: '+esc(pl.installDate):''} · Saved ${dt}</div>
        </div>
        <div class="specs-section-title">${ICON('zap')}System configuration</div>
        <div class="specs-grid">${SPECS.system.map(specCard).join('')}</div>
        <div class="specs-section-title">${ICON('wrench')}Mounting &amp; hardware</div>
        <div class="specs-grid">${SPECS.mounting.map(specCard).join('')}</div>
        <div class="specs-section-title">${ICON('plug')}Electrical &amp; supply</div>
        <div class="specs-grid">${SPECS.electrical.map(specCard).join('')}</div>
        <div class="specs-section-title">${ICON('check')}Mount system sense check</div>
        <div class="specs-grid">${MOUNT_CHECK_CELLS.map(mcCard).join('')}</div>
        ${roofHTML}${kfHTML}
    </div>`;
}

async function downloadPhotoPack(){
    if(!currentDocument) return showAlert('No document loaded');
    showAlert('Preparing photo pack…','success');
    try{
        const res=await fetch('https://us-central1-pingu-solar.cloudfunctions.net/downloadPhotosPack',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({collection:currentDocument.source,documentId:currentDocument.id})});
        if(!res.ok) throw new Error(await res.text()||'Failed');
        const blob=await res.blob(); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${currentDocument.data.jobNumber||'unknown'}_photos.zip`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(a.href);
        showAlert('Photo pack downloaded!','success');

// ══════════════════════════════════════════════════════
//  SCAFFOLD PACK
// ══════════════════════════════════════════════════════
function collectScaffoldPhotos(data){
    const urls=[]; const scData=data.sections?.scaffolding||{};
    FIELD_ORDER.scaffolding.filter(k=>k.endsWith('Photos')).forEach(pk=>{ (scData[pk]||[]).forEach(url=>{ if(typeof url==='string'&&(url.startsWith('http')||url.startsWith('data:image'))) urls.push({url,key:pk}); }); });
    return urls;
}
async function downloadScaffoldPack(){
    if(!currentDocument) return showAlert('No document loaded');
    const data=currentDocument.data; const jobNumber=data.jobNumber||'unknown';
    const scData=data.sections?.scaffolding||{}; const scFields=FIELD_ORDER.scaffolding.filter(k=>!k.endsWith('Photos'));
    const hasScaffold=scFields.some(k=>scData[k]!=null&&scData[k]!==''); const photoUrls=collectScaffoldPhotos(data);
    if(!hasScaffold&&!photoUrls.length&&!currentPicklist) return showAlert('No scaffolding data found');
    showAlert('Building scaffold pack…','success');
    try{
        const{jsPDF}=window.jspdf; const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
        const PW=210,PH=297,M=14,CW=PW-M*2; let y=M;
        const ORANGE=[255,107,53],GREY=[140,140,160],BLACK=[30,30,30],CYAN=[0,180,210],DARK=[26,26,46],WHITE=[255,255,255];
        function drawTopStripe(){doc.setFillColor(...ORANGE);doc.rect(0,0,PW,7,'F');}
        function checkY(need=10){if(y+need>PH-10){doc.addPage();y=M;drawTopStripe();}}
        function sectionBar(label,colour=ORANGE){checkY(11);doc.setFillColor(...colour);doc.roundedRect(M,y,CW,8,1,1,'F');doc.setTextColor(...WHITE);doc.setFontSize(9);doc.setFont('helvetica','bold');doc.text(stripEmoji(label).toUpperCase(),M+4,y+5.5);y+=11;}
        function specRow(label,value,idx){const safeLabel=stripEmoji(label);const lines=doc.splitTextToSize(String(value||'—'),CW-76);const rowH=Math.max(10,5+lines.length*4.5);checkY(rowH+1);const bg=idx%2===0?[247,247,252]:[255,255,255];doc.setFillColor(...bg);doc.rect(M,y,CW,rowH,'F');doc.setFillColor(...CYAN);doc.rect(M,y,2,rowH,'F');doc.setTextColor(...GREY);doc.setFontSize(6.8);doc.setFont('helvetica','normal');doc.text(doc.splitTextToSize(safeLabel.toUpperCase(),68)[0],M+4,y+4);doc.setTextColor(...BLACK);doc.setFontSize(8.5);doc.setFont('helvetica','bold');lines.forEach((ln,li)=>doc.text(ln,M+4,y+8.5+li*4.5));y+=rowH+1;}
        drawTopStripe();y=15;doc.setFillColor(...DARK);doc.roundedRect(M,y,CW,26,3,3,'F');doc.setTextColor(...WHITE);doc.setFontSize(17);doc.setFont('helvetica','bold');doc.text('SCAFFOLD INFORMATION PACK',M+6,y+12);doc.setFontSize(8.5);doc.setFont('helvetica','normal');doc.setTextColor(...GREY);doc.text(`Job: ${jobNumber}   ·   Generated: ${new Date().toLocaleDateString('en-GB')} ${new Date().toLocaleTimeString('en-GB')}`,M+6,y+21);y+=32;
        if(hasScaffold){sectionBar('Scaffolding Survey',ORANGE);scFields.forEach((key,i)=>{const val=scData[key];if(val==null||val==='')return;const q=QT[key]||key.replace(/([A-Z])/g,' $1').replace(/^./,s=>s.toUpperCase()).trim();specRow(q,fmtVal(val),i);});y+=3;}
        let scaffoldImageEntries=[];
        if(photoUrls.length>0){showAlert('Fetching photos…','success');try{const cfRes=await fetch('https://us-central1-pingu-solar.cloudfunctions.net/downloadPhotosPack',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({collection:currentDocument.source,documentId:currentDocument.id})});if(!cfRes.ok)throw new Error('Photo fetch failed');const fullZipBlob=await cfRes.blob();const fullZip=await JSZip.loadAsync(fullZipBlob);const scaffoldFilenames=new Set(photoUrls.map(item=>{try{const match=item.url.match(/\/o\/([^?]+)/);if(match)return decodeURIComponent(match[1]).split('/').pop();}catch(e){}return null;}).filter(Boolean));const filenameToCaptionKey={};photoUrls.forEach(item=>{try{const match=item.url.match(/\/o\/([^?]+)/);if(match)filenameToCaptionKey[decodeURIComponent(match[1]).split('/').pop()]=item.key;}catch(e){}});const allEntries=Object.values(fullZip.files).filter(f=>!f.dir&&/\.(jpg|jpeg|png|gif|webp)$/i.test(f.name));let filtered=allEntries.filter(f=>scaffoldFilenames.has(f.name.split('/').pop()));if(filtered.length===0&&allEntries.length>=photoUrls.length){filtered=allEntries.sort((a,b)=>a.name.localeCompare(b.name)).slice(-photoUrls.length);}for(let idx=0;idx<filtered.length;idx++){const entry=filtered[idx];const zipFilename=entry.name.split('/').pop();const blob=await entry.async('blob');const b64=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(blob);});const{w,h}=await new Promise(res=>{const img=new Image();img.onload=()=>res({w:img.naturalWidth||800,h:img.naturalHeight||600});img.onerror=()=>res({w:800,h:600});img.src=b64;});const captionKey=filenameToCaptionKey[zipFilename]||entry.name;const caption=captionKey.replace(/Photos$/,'').replace(/\.[^.]+$/,'').replace(/([A-Z])/g,' $1').replace(/_/g,' ').trim();scaffoldImageEntries.push({name:entry.name,blob,b64,w,h,caption});}}catch(fetchErr){showAlert('Warning: could not load photos — '+fetchErr.message);}}
        if(scaffoldImageEntries.length>0){sectionBar(`Scaffolding Photos (${scaffoldImageEntries.length})`,ORANGE);const IW=(CW-5)/2,MAX_H=74;for(let i=0;i<scaffoldImageEntries.length;i+=2){const imgL=scaffoldImageEntries[i],imgR=scaffoldImageEntries[i+1]||null;const placeImg=(entry,xOff)=>{if(!entry)return 0;const aspect=entry.w/entry.h;let iw=IW,ih=iw/aspect;if(ih>MAX_H){ih=MAX_H;iw=ih*aspect;}const xPos=M+xOff+(IW-iw)/2;doc.addImage(entry.b64,entry.b64.includes('image/png')?'PNG':'JPEG',xPos,y,iw,ih);doc.setFontSize(6.5);doc.setFont('helvetica','normal');doc.setTextColor(...GREY);doc.text(`Photo ${i+(xOff===0?1:2)}: ${stripEmoji(entry.caption)}`,M+xOff,y+ih+4);return ih+6;};checkY(MAX_H+14);const hL=placeImg(imgL,0),hR=placeImg(imgR,IW+5);if(Math.max(hL,hR)>0)y+=Math.max(hL,hR)+3;}}
        const total=doc.getNumberOfPages();for(let p=1;p<=total;p++){doc.setPage(p);doc.setFillColor(...ORANGE);doc.rect(0,PH-7,PW,7,'F');doc.setTextColor(...WHITE);doc.setFontSize(7);doc.setFont('helvetica','normal');doc.text(`Pingu Solar  ·  Job: ${jobNumber}  ·  Scaffold Pack`,M,PH-2.5);doc.text(`Page ${p} of ${total}`,PW-M,PH-2.5,{align:'right'});}
        doc.save(`${jobNumber}_scaffold_pack.pdf`);
        if(scaffoldImageEntries.length>0){showAlert('PDF saved! Zipping scaffold photos…','success');const zip=new JSZip(),folder=zip.folder('scaffold_photos');scaffoldImageEntries.forEach((entry,idx)=>{const ext=entry.blob.type.includes('png')?'png':'jpg';const cap=entry.caption.replace(/\s+/g,'_').toLowerCase().replace(/[^a-z0-9_]/g,'');folder.file(`scaffold_${String(idx+1).padStart(2,'0')}_${cap}.${ext}`,entry.blob);});const zipBlob=await zip.generateAsync({type:'blob'});const a=document.createElement('a');a.href=URL.createObjectURL(zipBlob);a.download=`${jobNumber}_scaffold_photos.zip`;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(a.href);}
        showAlert('Scaffold pack complete!','success');
    }catch(err){ console.error(err); showAlert('Error generating scaffold pack: '+err.message); }
}
