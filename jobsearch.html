<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Search | Pingu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* ═══ Pingu design system — base (copy verbatim into each page's <style>) ═══ */
        :root {
            /* Brand + status palette */
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --secondary: #FFC857;
            --accent: #00D9FF;
            --dark: #1A1A2E;
            --dark-light: #252541;
            --dark-lighter: #2F2F4A;
            --text: #EAEAEA;
            --text-dim: #9A9AB0;
            --success: #4ECCA3;
            --error: #FF6B6B;
            --warning: #FFC857;
            --in-progress: #00D9FF;
            --complete: #4ECCA3;
            --aborted: #FF6B6B;
            --cancelled: #9A9AB0;
            --short-notice: #90ee90;
            --on-hold: #FFDE00;
            --scheduled: #FF6B35;
            /* Surfaces & type */
            --bg: #161628;
            --surface: #1F1F35;
            --surface-2: #252541;
            --line: rgba(255,255,255,0.07);
            --line-2: rgba(255,255,255,0.12);
            --text-strong: #F4F4F8;
            --text-soft: #C8C8D6;
            --radius: 10px;
            --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: var(--font); font-size: 14px; line-height: 1.5;
            background: var(--bg); color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        button, input, select, textarea { font-family: inherit; }
        a { color: var(--accent); }
        .ico { width: 16px; height: 16px; flex: 0 0 auto; vertical-align: -3px; }
        .ico-lg { width: 20px; height: 20px; flex: 0 0 auto; }

        /* ── App bar + Pingu wordmark ── */
        .appbar {
            position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            height: 64px; padding: 0 28px;
            background: rgba(22, 22, 40, 0.92);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line);
        }
        .appbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .logo { display: inline-flex; align-items: center; text-decoration: none; }
        .wordmark {
            font-family: 'Inter', var(--font); font-weight: 800; font-size: 28px;
            letter-spacing: -0.045em; line-height: 1; color: var(--text-strong); padding-top: 6px;
        }
        .i-stem { position: relative; display: inline-block; }
        .i-paw {
            position: absolute; left: 50%; top: -0.17em; transform: translateX(-50%) rotate(-10deg);
            width: 0.5em; height: 0.5em; fill: var(--primary);
            filter: drop-shadow(0 1px 4px rgba(255,107,53,0.35));
            transition: transform .2s ease;
        }
        .logo:hover .i-paw { transform: translateX(-50%) rotate(4deg) scale(1.08); }
        .logo:hover .wordmark { color: #fff; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-soft); text-decoration: none; font-size: 13px; font-weight: 500;
            padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; cursor: pointer;
            transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .back-btn:hover { background: var(--surface-2); color: var(--text-strong); border-color: rgba(255,255,255,0.2); }

        /* ── Page layout ── */
        .container { padding: 24px 28px 40px; }
        .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
        h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-strong); line-height: 1.2; }
        h2 { font-size: 16px; font-weight: 600; color: var(--text-strong); letter-spacing: -0.01em; }
        h3 { font-size: 14px; font-weight: 600; color: var(--text-strong); }
        .muted { color: var(--text-dim); }
        .toolbar { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }

        /* ── Panels / cards ── */
        .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
        .panel + .panel { margin-top: 16px; }
        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -2px 0 14px; }
        .panel-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--text-strong); }
        .panel-title .ico { color: var(--primary); }

        /* ── Form controls ── */
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-label { color: var(--text-dim); font-size: 11.5px; font-weight: 500; }
        .control-input {
            height: 38px; background: var(--surface); border: 1px solid var(--line-2);
            color: var(--text-strong); padding: 0 12px; border-radius: 8px; font-size: 13.5px; width: 100%;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        textarea.control-input { height: auto; min-height: 84px; padding: 9px 11px; resize: vertical; }
        .control-input:hover { border-color: rgba(255,255,255,0.2); }
        .control-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.22); }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); cursor: pointer; }
        input[type="checkbox"], input[type="radio"] { accent-color: var(--primary); }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 7px;
            height: 38px; padding: 0 16px; border-radius: 8px; cursor: pointer;
            font-size: 13.5px; font-weight: 600; text-decoration: none; white-space: nowrap;
            border: 1px solid transparent; transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--surface-2); color: var(--text-strong); border-color: var(--line-2); }
        .btn-secondary:hover { background: var(--dark-lighter); border-color: rgba(255,255,255,0.25); }
        .btn-ghost { background: transparent; color: var(--text-soft); border-color: var(--line-2); }
        .btn-ghost:hover { background: var(--surface-2); color: var(--text-strong); }
        .btn-danger { background: rgba(255,107,107,0.12); color: #FF8A8A; border-color: rgba(255,107,107,0.4); }
        .btn-danger:hover { background: rgba(255,107,107,0.22); }
        .btn-success { background: rgba(78,204,163,0.14); color: var(--success); border-color: rgba(78,204,163,0.45); }
        .btn-success:hover { background: rgba(78,204,163,0.24); }
        .btn-sm { height: 32px; padding: 0 12px; font-size: 12.5px; }
        .btn:disabled, button:disabled { opacity: .45; cursor: not-allowed; }
        .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; height: 38px; }
        .seg button { background: var(--surface); color: var(--text-soft); border: 0; padding: 0 12px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .seg button + button { border-left: 1px solid var(--line-2); }
        .seg button:hover, .seg button.active { background: var(--surface-2); color: var(--text-strong); }

        /* ── KPI tiles ── */
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
        .stat-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; }
        .stat-label { display: flex; align-items: center; gap: 7px; color: var(--text-dim); font-size: 12px; font-weight: 500; white-space: nowrap; }
        .stat-label .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
        .stat-value { font-size: 22px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.02em; line-height: 1.25; margin-top: 2px; font-variant-numeric: tabular-nums; }

        /* ── Tables ── */
        .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
        thead th {
            position: sticky; top: 0; z-index: 2; background: var(--surface);
            text-align: left; padding: 10px 14px; font-size: 11.5px; font-weight: 600; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--line-2); white-space: nowrap;
        }
        tbody td { padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--text-soft); vertical-align: middle; }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover td { background: rgba(255,255,255,0.025); }
        td.strong, .cell-strong { color: var(--text-strong); font-weight: 600; }
        .mono { font-family: var(--mono); font-size: 12.5px; }

        /* ── Badges / status pills ── */
        .badge {
            --c: var(--text-dim);
            display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
            padding: 2px 9px; border-radius: 999px; color: var(--text-strong);
            background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
        }
        .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
        .badge.plain::before { display: none; }
        .tag { font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 4px; background: rgba(255,255,255,0.1); color: var(--text-soft); letter-spacing: .03em; }

        /* ── Notices ── */
        .notice { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 13px;
                  background: rgba(255,255,255,0.03); border: 1px solid var(--line-2); color: var(--text-soft); }
        .notice .ico { margin-top: 1px; }
        .notice.info    { border-color: rgba(0,217,255,0.35);  background: rgba(0,217,255,0.06); }
        .notice.success { border-color: rgba(78,204,163,0.4);  background: rgba(78,204,163,0.07); color: var(--success); }
        .notice.warning { border-color: rgba(255,200,87,0.4);  background: rgba(255,200,87,0.07); color: var(--warning); }
        .notice.error   { border-color: rgba(255,107,107,0.45); background: rgba(255,107,107,0.08); color: #FF8A8A; }

        /* ── Modals ── */
        .modal { display: none; position: fixed; inset: 0; background: rgba(10,10,22,0.72); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
        .modal.show, .modal.active, .modal.open { display: flex; }
        .modal-content { background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; width: 100%; max-width: 680px; max-height: 88vh; overflow-y: auto; box-shadow: 0 30px 80px -20px rgba(0,0,0,0.75); }
        .modal-header { position: sticky; top: 0; z-index: 2; background: var(--surface); display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
        .modal-title { font-size: 17px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.01em; }
        .modal-body { padding: 18px 20px 22px; }
        .close-btn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; border-radius: 8px; color: var(--text-dim); cursor: pointer; font-size: 20px; line-height: 1; }
        .close-btn:hover { background: var(--surface-2); color: var(--text-strong); }

        /* ── Feedback ── */
        .toast { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: none; max-width: 420px; padding: 12px 16px 12px 14px; border-radius: 10px;
                 background: #26263F; color: var(--text-strong); font-size: 13.5px; border: 1px solid var(--line-2); border-left: 3px solid var(--success);
                 box-shadow: 0 16px 40px -12px rgba(0,0,0,0.7); }
        .toast.show { display: block; }
        .toast.error { border-left-color: var(--error); }
        .empty-state, .loading { text-align: center; padding: 56px 16px; color: var(--text-dim); }
        .empty-state h3 { color: var(--text-strong); font-size: 16px; margin-bottom: 4px; }
        .empty-state .ico-lg { width: 32px; height: 32px; color: var(--text-dim); margin-bottom: 10px; }
        .spinner { width: 22px; height: 22px; border: 2px solid var(--line-2); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        *::-webkit-scrollbar { width: 10px; height: 10px; }
        *::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
        *::-webkit-scrollbar-track { background: transparent; }
        @media (max-width: 768px) {
            .appbar, .container { padding-left: 14px; padding-right: 14px; }
            .wordmark { font-size: 24px; }
        }
        /* ═══ end base ═══ */

        /* ═══ page ═══ */
        /* ── Search panel ── */
        .search-section { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
        .search-header { display: none; }
        .search-controls { display: flex; gap: 10px; align-items: flex-end; }
        .search-input-group { flex: 1; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
        .search-input-group label { color: var(--text-dim); font-size: 11.5px; font-weight: 500; }
        .search-field { position: relative; }
        .search-field .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-dim); pointer-events: none; }
        .search-input {
            width: 100%; height: 40px; background: var(--bg); border: 1px solid var(--line-2); color: var(--text-strong);
            padding: 0 12px 0 36px; border-radius: 8px; font-size: 14px;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        .search-input::placeholder { color: var(--text-dim); }
        .search-input:hover { border-color: rgba(255,255,255,0.2); }
        .search-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.22); }
        .search-btn {
            height: 40px; padding: 0 20px; border-radius: 8px; border: 0; cursor: pointer;
            background: var(--primary); color: #fff; font-size: 13.5px; font-weight: 600; transition: background .15s ease;
        }
        .search-btn:hover { background: var(--primary-dark); }

        .filter-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
        .filter-tag {
            display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border-radius: 999px; cursor: pointer; user-select: none;
            font-size: 12.5px; font-weight: 500; color: var(--text-soft); background: transparent; border: 1px solid var(--line-2);
            transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .filter-tag:hover { background: var(--surface-2); color: var(--text-strong); }
        .filter-tag.active { background: rgba(255,107,53,0.14); border-color: rgba(255,107,53,0.55); color: var(--text-strong); font-weight: 600; }

        /* ── Results ── */
        .results-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
        .results-count { font-size: 14px; font-weight: 600; color: var(--text-strong); font-variant-numeric: tabular-nums; }
        .view-toggle { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; height: 34px; }
        .view-btn {
            display: inline-flex; align-items: center; gap: 6px; background: var(--surface); color: var(--text-soft); border: 0;
            padding: 0 12px; font-size: 13px; font-weight: 500; cursor: pointer;
        }
        .view-btn + .view-btn { border-left: 1px solid var(--line-2); }
        .view-btn svg { pointer-events: none; }
        .view-btn:hover, .view-btn.active { background: var(--surface-2); color: var(--text-strong); }
        .view-btn.active { box-shadow: inset 0 -2px 0 var(--primary); }

        .loading::after { content: '...'; animation: dots 1.5s infinite; }
        @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60%, 100% { content: '...'; } }

        .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
        .job-card {
            --c: var(--scheduled);
            background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 10px;
            padding: 12px 14px; cursor: pointer; transition: background .15s ease, border-color .15s ease;
        }
        .job-card:hover { background: var(--surface-2); border-color: var(--line-2); border-left-color: var(--c); }
        .job-card:has(.job-status.survey-complete) { --c: var(--secondary); }
        .job-card:has(.job-status.install-started) { --c: var(--in-progress); }
        .job-card:has(.job-status.install-complete), .job-card:has(.job-status.completed) { --c: var(--complete); }
        .job-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
        .job-number { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--text-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .job-customer { color: var(--text-soft); font-size: 13.5px; font-weight: 500; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .job-details { display: flex; flex-wrap: wrap; gap: 4px 14px; padding-top: 8px; border-top: 1px solid var(--line); }
        .job-detail { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-dim); min-width: 0; }
        .job-detail-icon { display: inline-flex; color: var(--text-dim); }
        .job-detail-icon .ico { width: 14px; height: 14px; vertical-align: 0; }
        .job-detail-value { color: var(--text-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .job-status {
            --c: var(--scheduled);
            display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
            padding: 2px 9px; border-radius: 999px; color: var(--text-strong);
            background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
        }
        .job-status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
        .job-status.upcoming { --c: var(--scheduled); }
        .job-status.survey-complete { --c: var(--secondary); }
        .job-status.install-started { --c: var(--in-progress); }
        .job-status.install-complete, .job-status.completed { --c: var(--complete); }

        .results-table { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; max-height: calc(100vh - 140px); }
        .results-table table { min-width: 860px; }
        .results-table tbody tr { cursor: pointer; }
        .results-table tbody td:first-child { font-family: var(--mono); font-size: 12.5px; font-weight: 700; color: var(--text-strong); }
        .results-table tbody td:nth-child(2) { color: var(--text-strong); font-weight: 500; }
        .results-table tbody tr:hover td { background: rgba(255,255,255,0.035); }

        .empty-state .empty-icon { color: var(--text-dim); margin-bottom: 10px; }
        .empty-state .empty-icon .ico-lg { width: 32px; height: 32px; margin: 0; }

        /* ── Job modal ── */
        .modal-content { max-width: 760px; }
        .modal-title { font-family: var(--mono); letter-spacing: -0.01em; }
        .modal-body { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
        .detail-group { display: grid; grid-template-columns: 120px 1fr; gap: 10px; align-items: center; padding: 9px 12px; border: 1px solid var(--line); margin: 0 0 -1px -1px; min-height: 40px; }
        .detail-group:nth-of-type(1) { border-top-left-radius: 10px; }
        .detail-group:nth-of-type(2) { border-top-right-radius: 10px; }
        .detail-group:nth-of-type(7) { border-bottom-left-radius: 10px; }
        .detail-group:nth-of-type(8) { border-bottom-right-radius: 10px; }
        .detail-label { color: var(--text-dim); font-size: 12.5px; }
        .detail-value { color: var(--text-strong); font-weight: 500; font-size: 13px; word-break: break-word; }
        .detail-value.editable { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
        .edit-btn, .save-btn, .cancel-btn {
            height: 28px; padding: 0 10px; border-radius: 7px; cursor: pointer; font-size: 12px; font-weight: 600;
            border: 1px solid var(--line-2); background: transparent; color: var(--text-soft); white-space: nowrap;
            transition: background .15s ease, color .15s ease;
        }
        .edit-btn:hover, .cancel-btn:hover { background: var(--surface-2); color: var(--text-strong); }
        .save-btn { background: var(--primary); border-color: var(--primary); color: #fff; }
        .save-btn:hover { background: var(--primary-dark); }
        .engineer-select {
            height: 32px; flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line-2); color: var(--text-strong);
            padding: 0 8px; border-radius: 7px; font-size: 13px;
        }
        .engineer-select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.22); }
        .save-cancel-btns { display: flex; gap: 6px; }

        .status-update-section, .attachments-section { grid-column: 1 / -1; margin-top: 20px; }
        .status-update-header, .attachments-header { font-size: 12px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
        .status-buttons { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
        .status-update-btn {
            --c: var(--scheduled);
            display: inline-flex; align-items: center; gap: 8px; padding: 9px 11px; border-radius: 8px; cursor: pointer;
            font-size: 12.5px; font-weight: 600; color: var(--text-strong); text-align: left;
            background: color-mix(in srgb, var(--c) 10%, transparent); border: 1px solid color-mix(in srgb, var(--c) 40%, transparent);
            transition: background .15s ease, border-color .15s ease;
        }
        .status-update-btn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: 0 0 auto; }
        .status-update-btn:hover { background: color-mix(in srgb, var(--c) 22%, transparent); border-color: var(--c); }
        .status-update-btn.upcoming { --c: var(--scheduled); }
        .status-update-btn.survey { --c: var(--secondary); }
        .status-update-btn.install-start { --c: var(--in-progress); }
        .status-update-btn.install-complete { --c: var(--complete); }
        .status-update-btn.current { background: color-mix(in srgb, var(--c) 26%, transparent); border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }
        .status-update-message { margin-top: 8px; padding: 8px 12px; border-radius: 8px; font-size: 13px; }
        .status-update-message.success { background: rgba(78,204,163,0.07); border: 1px solid rgba(78,204,163,0.4); color: var(--success); }
        .status-update-message.error { background: rgba(255,107,107,0.08); border: 1px solid rgba(255,107,107,0.45); color: #FF8A8A; }

        .attachments-grid { display: grid; gap: 8px; }
        .attachment-item, .missing-file-item {
            display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px;
            background: var(--bg); border: 1px solid var(--line);
        }
        .missing-file-item { border-style: dashed; border-color: var(--line-2); background: transparent; }
        .attachment-icon { width: 34px; height: 34px; flex: 0 0 auto; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; background: rgba(255,107,53,0.12); color: var(--primary); }
        .missing-file-item .attachment-icon { background: var(--surface-2); color: var(--text-dim); }
        .attachment-info { flex: 1; min-width: 0; }
        .attachment-name { font-size: 13.5px; font-weight: 600; color: var(--text-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .attachment-type { font-size: 12px; color: var(--text-dim); }
        .attachment-download, .upload-file-btn {
            display: inline-flex; align-items: center; justify-content: center; height: 32px; padding: 0 12px; border-radius: 8px; cursor: pointer;
            font-size: 12.5px; font-weight: 600; text-decoration: none; white-space: nowrap; transition: background .15s ease, border-color .15s ease;
        }
        .attachment-download { background: var(--primary); color: #fff; border: 1px solid var(--primary); }
        .attachment-download:hover { background: var(--primary-dark); }
        .upload-file-btn { background: transparent; color: var(--text-soft); border: 1px solid var(--line-2); }
        .upload-file-btn:hover { background: var(--surface-2); color: var(--text-strong); }
        .upload-file-input { display: none; }
        .no-attachments { text-align: center; padding: 20px; color: var(--text-dim); font-size: 13px; }
        .loading-attachments { text-align: center; padding: 12px; color: var(--text-dim); font-size: 13px; }
        .uploading-indicator { display: flex; align-items: center; gap: 6px; color: var(--accent); font-size: 12.5px; }
        .uploading-indicator::after { content: '...'; animation: dots 1.5s infinite; }

        /* Status toast */
        .status-message {
            position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: none; max-width: 420px;
            padding: 12px 16px 12px 14px; border-radius: 10px; background: #26263F; color: var(--text-strong); font-size: 13.5px;
            border: 1px solid var(--line-2); border-left: 3px solid var(--success); box-shadow: 0 16px 40px -12px rgba(0,0,0,0.7);
        }
        .status-message.show { display: block; }
        .status-message.error { border-left-color: var(--error); }

        @media (max-width: 768px) {
            .search-controls { flex-direction: column; align-items: stretch; }
            .results-grid { grid-template-columns: minmax(0, 1fr); }
            .modal-body { grid-template-columns: 1fr; }
            .detail-group { grid-template-columns: 110px 1fr; margin-left: 0; border-radius: 0 !important; }
            .detail-group:first-child { border-radius: 10px 10px 0 0 !important; }
            .detail-group:nth-of-type(8) { border-radius: 0 0 10px 10px !important; }
            .status-buttons { grid-template-columns: 1fr 1fr; }
            .status-message { left: 14px; right: 14px; bottom: 14px; max-width: none; }
        }
    </style>
</head>

    <!-- Firebase SDK -->
    <script type="module">

        const firebaseConfig = {

        try {

            const db = getFirestore(app);

    <script>
        // Global state
        let allJobs = [];
        let filteredJobs = [];
        let currentView = 'grid';
        let currentFilter = 'all';
        let currentJobId = null;
        let currentJobNumber = null;
        let leadEngineers = [];
        let isEditingEngineer = false;
        let currentSurveyData = null;

        const ICONS = {
            x:        '<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/>',
            search:   '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
            pin:      '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>',
            calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
            user:     '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
            building: '<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M16 6h.01M12 6h.01M12 10h.01M12 14h.01M16 10h.01M16 14h.01M8 10h.01M8 14h.01"/>',
            file:     '<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>',
            layout:   '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>',
            clipboard:'<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12h6M9 16h6"/>'
        };
        const ICON = (name, cls = 'ico') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;

        async function loadAllJobs() {
            try {
                const { collection, getDocs, orderBy: orderByFn, query, where } = window.firebaseModules;
                const jobsQuery = query(collection(window.db, 'Solar-jobs'), orderByFn('uploadDate', 'desc'));
                const querySnapshot = await getDocs(jobsQuery);
                allJobs = [];
                querySnapshot.forEach(doc => allJobs.push({ id: doc.id, ...doc.data() }));
                const engineersQuery = query(collection(window.db, 'team-members'), where('isLeadEngineer', '==', true));
                const engineersSnapshot = await getDocs(engineersQuery);
                leadEngineers = [];
                engineersSnapshot.forEach(doc => leadEngineers.push({ id: doc.id, ...doc.data() }));
                filteredJobs = [...allJobs];
                displayResults();
            } catch (error) {
                console.error('Error loading jobs:', error);
                showStatus('Error loading jobs: ' + error.message, 'error');
                document.getElementById('results-container').innerHTML = `<div class="empty-state"><div class="empty-icon">${ICON('x', 'ico-lg')}</div><h3>Error loading jobs</h3><p>${error.message}</p></div>`;
            }
        }

        async function performSearch() {
            const searchTerm = document.getElementById('search-input').value.trim().toLowerCase();
            if (!searchTerm) { applyFilter(); return; }
            filteredJobs = allJobs.filter(job => {
                return (job['Job Number'] || '').toLowerCase().includes(searchTerm) ||
                       (job['Postcode'] || '').toLowerCase().includes(searchTerm) ||
                       (job['Name'] || '').toLowerCase().includes(searchTerm);
            });
            displayResults();
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tag').forEach(tag => tag.classList.remove('active'));
            event.target.classList.add('active');
            applyFilter();
        }

        function applyFilter() {
            const now = new Date();
            const searchTerm = document.getElementById('search-input').value.trim().toLowerCase();
            let jobs = searchTerm ? allJobs.filter(job => {
                return (job['Job Number'] || '').toLowerCase().includes(searchTerm) ||
                       (job['Postcode'] || '').toLowerCase().includes(searchTerm) ||
                       (job['Name'] || '').toLowerCase().includes(searchTerm);
            }) : [...allJobs];

            if (currentFilter !== 'all') {
                jobs = jobs.filter(job => {
                    const uploadDate = new Date(job.uploadDate);
                    const daysDiff = Math.floor((now - uploadDate) / (1000 * 60 * 60 * 24));
                    switch(currentFilter) {
                        case 'this-week': return daysDiff <= 7;
                        case 'this-month': return daysDiff <= 30;
                        case 'recent': return daysDiff <= 3;
                        default: return true;
                    }
                });
            }
            filteredJobs = jobs;
            displayResults();
        }

        function setView(view) {
            currentView = view;
            document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            displayResults();
        }

        function displayResults() {
            const container = document.getElementById('results-container');
            const countEl = document.getElementById('results-count');
            countEl.textContent = `${filteredJobs.length} job${filteredJobs.length !== 1 ? 's' : ''} found`;

            if (filteredJobs.length === 0) {
                container.innerHTML = `<div class="empty-state"><div class="empty-icon">${ICON('search', 'ico-lg')}</div><h3>No jobs found</h3><p>Try adjusting your search or filters</p></div>`;
                return;
            }

            currentView === 'grid' ? displayGridView(container) : displayTableView(container);
        }

        function displayGridView(container) {
            container.innerHTML = `<div class="results-grid">${filteredJobs.map(job => {
                const installDate = job['Install Date'] ? new Date(job['Install Date']) : null;
                const isPast = installDate && installDate <= new Date();
                const jobStatus = job.status || (isPast ? 'completed' : 'upcoming');
                let statusText = 'Upcoming', statusClass = 'upcoming';
                if (jobStatus === 'survey-complete') { statusText = 'Survey complete'; statusClass = 'survey-complete'; }
                else if (jobStatus === 'install-started') { statusText = 'Install started'; statusClass = 'install-started'; }
                else if (jobStatus === 'install-complete') { statusText = 'Install complete'; statusClass = 'install-complete'; }
                else if (isPast || jobStatus === 'completed') { statusText = 'Completed'; statusClass = 'completed'; }
                return `<div class="job-card" onclick="showJobDetails('${job.id}')">
                    <div class="job-header"><div class="job-number">#${escapeHtml(job['Job Number'] || 'N/A')}</div><div class="job-status ${statusClass}">${statusText}</div></div>
                    <div class="job-customer">${escapeHtml(job['Name'] || 'Unknown Customer')}</div>
                    <div class="job-details">
                        <div class="job-detail"><span class="job-detail-icon">${ICON('pin')}</span><span class="job-detail-value">${escapeHtml(job['Postcode'] || 'N/A')}</span></div>
                        <div class="job-detail"><span class="job-detail-icon">${ICON('calendar')}</span><span class="job-detail-value">${escapeHtml(job['Install Date'] || 'Not scheduled')}</span></div>
                        <div class="job-detail"><span class="job-detail-icon">${ICON('user')}</span><span class="job-detail-value">${escapeHtml(job['Lead Engineer'] || 'Unassigned')}</span></div>
                    </div>
                </div>`;
            }).join('')}</div>`;
        }

        function displayTableView(container) {
            container.innerHTML = `<div class="results-table"><table><thead><tr><th>Job number</th><th>Customer name</th><th>Postcode</th><th>Install date</th><th>Lead engineer</th><th>Status</th></tr></thead><tbody>${filteredJobs.map(job => {
                const installDate = job['Install Date'] ? new Date(job['Install Date']) : null;
                const isPast = installDate && installDate <= new Date();
                const jobStatus = job.status || (isPast ? 'completed' : 'upcoming');
                let statusText = 'Upcoming', statusClass = 'upcoming';
                if (jobStatus === 'survey-complete') { statusText = 'Survey complete'; statusClass = 'survey-complete'; }
                else if (jobStatus === 'install-started') { statusText = 'Install started'; statusClass = 'install-started'; }
                else if (jobStatus === 'install-complete') { statusText = 'Install complete'; statusClass = 'install-complete'; }
                else if (isPast || jobStatus === 'completed') { statusText = 'Completed'; statusClass = 'completed'; }
                return `<tr onclick="showJobDetails('${job.id}')">
                    <td>#${escapeHtml(job['Job Number'] || 'N/A')}</td>
                    <td>${escapeHtml(job['Name'] || 'Unknown')}</td>
                    <td>${escapeHtml(job['Postcode'] || 'N/A')}</td>
                    <td>${escapeHtml(job['Install Date'] || 'Not scheduled')}</td>
                    <td>${escapeHtml(job['Lead Engineer'] || 'Unassigned')}</td>
                    <td><span class="job-status ${statusClass}">${statusText}</span></td>
                </tr>`;
            }).join('')}</tbody></table></div>`;
        }

        async function showJobDetails(jobId) {
            const job = allJobs.find(j => j.id === jobId);
            if (!job) return;
            currentJobId = jobId;
            currentJobNumber = job['Job Number'];
            isEditingEngineer = false;

            document.getElementById('modal-job-number').textContent = `Job #${job['Job Number'] || 'N/A'}`;
            const jobStatus = job.status || 'upcoming';

            document.getElementById('modal-body').innerHTML = `
                <div class="detail-group"><div class="detail-label">Customer name</div><div class="detail-value">${escapeHtml(job['Name'] || 'N/A')}</div></div>
                <div class="detail-group"><div class="detail-label">Phone number</div><div class="detail-value">${escapeHtml(job['Phone Number'] || 'N/A')}</div></div>
                <div class="detail-group"><div class="detail-label">Email address</div><div class="detail-value">${escapeHtml(job['Email Address'] || 'N/A')}</div></div>
                <div class="detail-group"><div class="detail-label">Address</div><div class="detail-value">${escapeHtml(job['1st line of address'] || 'N/A')}</div></div>
                <div class="detail-group"><div class="detail-label">Postcode</div><div class="detail-value">${escapeHtml(job['Postcode'] || 'N/A')}</div></div>
                <div class="detail-group"><div class="detail-label">Install date</div><div class="detail-value">${escapeHtml(job['Install Date'] || 'Not scheduled')}</div></div>
                <div class="detail-group"><div class="detail-label">Lead engineer</div><div class="detail-value editable" id="lead-engineer-container"><span id="lead-engineer-display">${escapeHtml(job['Lead Engineer'] || 'Unassigned')}</span><button class="edit-btn" onclick="editLeadEngineer()">Change</button></div></div>
                <div class="detail-group"><div class="detail-label">Uploaded</div><div class="detail-value">${formatDate(job.uploadDate)}</div></div>
                <div class="status-update-section">
                    <div class="status-update-header">Update job status</div>
                    <div class="status-buttons">
                        <button class="status-update-btn upcoming ${jobStatus === 'upcoming' ? 'current' : ''}" onclick="updateJobStatus('${jobId}', 'upcoming', this)">Upcoming</button>
                        <button class="status-update-btn survey ${jobStatus === 'survey-complete' ? 'current' : ''}" onclick="updateJobStatus('${jobId}', 'survey-complete', this)">Survey complete</button>
                        <button class="status-update-btn install-start ${jobStatus === 'install-started' ? 'current' : ''}" onclick="updateJobStatus('${jobId}', 'install-started', this)">Install started</button>
                        <button class="status-update-btn install-complete ${jobStatus === 'install-complete' ? 'current' : ''}" onclick="updateJobStatus('${jobId}', 'install-complete', this)">Install complete</button>
                    </div>
                    <div id="status-update-message"></div>
                </div>
                <div class="attachments-section">
                    <div class="attachments-header">Associated files</div>
                    <div class="attachments-grid" id="attachments-list"><div class="loading-attachments">Loading files...</div></div>
                </div>
            `;

            document.getElementById('job-modal').classList.add('show');
            await loadJobFiles(job['Job Number']);
        }

        async function loadJobFiles(jobNumber) {
            const attachmentsList = document.getElementById('attachments-list');
            try {
                const { collection, getDocs, query, where, orderBy, limit } = window.firebaseModules;
                const fileCollections = [
                    { name: 'scaffolding-csv', icon: ICON('building'), type: 'Scaffolding CSV', accept: '.csv' },
                    { name: 'schletter-pdf', icon: ICON('file'), type: 'Schletter Report', accept: '.pdf' },
                    { name: 'design-pdf', icon: ICON('layout'), type: 'Design PDF', accept: '.pdf' }
                ];

                let allFiles = [];
                let missingFiles = [];

                const surveyQuery = query(collection(window.db, 'site-surveys'), where('jobNumber', '==', jobNumber), orderBy('submittedAt', 'desc'), limit(1));
                const surveySnapshot = await getDocs(surveyQuery);
                if (!surveySnapshot.empty) {
                    const surveyDoc = surveySnapshot.docs[0];
                    currentSurveyData = { id: surveyDoc.id, ...surveyDoc.data() };
                    allFiles.push({ id: surveyDoc.id, fileName: 'Site Survey Report', collectionType: 'Site Survey', icon: ICON('clipboard'), isSurvey: true });
                } else {
                    missingFiles.push({ name: 'site-survey', icon: ICON('clipboard'), type: 'Site Survey', accept: '.pdf', isSurvey: true });
                }

                for (const fc of fileCollections) {
                    const q = query(collection(window.db, fc.name), where('jobNumber', '==', jobNumber));
                    const snap = await getDocs(q);
                    if (snap.empty) missingFiles.push(fc);
                    else snap.forEach(d => allFiles.push({ id: d.id, ...d.data(), collectionType: fc.type, icon: fc.icon }));
                }

                let html = '';
                html += allFiles.map(file => file.isSurvey ? `
                    <div class="attachment-item">
                        <div class="attachment-icon">${file.icon}</div>
                        <div class="attachment-info">
                            <div class="attachment-name">${escapeHtml(file.fileName)}</div>
                            <div class="attachment-type">${file.collectionType}</div>
                        </div>
                        <button class="attachment-download" onclick="generateAndDownloadSurveyPDF(event)">Download PDF</button>
                    </div>` : `
                    <div class="attachment-item">
                        <div class="attachment-icon">${file.icon}</div>
                        <div class="attachment-info">
                            <div class="attachment-name">${escapeHtml(file.fileName)}</div>
                            <div class="attachment-type">${file.collectionType} • ${formatFileSize(file.fileSize)}</div>
                        </div>
                        <a href="${file.downloadURL}" target="_blank" class="attachment-download">Download</a>
                    </div>`).join('');

                html += missingFiles.map((fc, i) => `
                    <div class="missing-file-item">
                        <div class="attachment-icon">${fc.icon}</div>
                        <div class="attachment-info">
                            <div class="attachment-name">${fc.type}</div>
                            <div class="attachment-type">Not uploaded yet</div>
                        </div>
                        <input type="file" id="file-input-${i}" class="upload-file-input" accept="${fc.accept}" onchange="handleFileUpload(event, '${fc.name}', '${jobNumber}')"/>
                        <button class="upload-file-btn" onclick="document.getElementById('file-input-${i}').click()">Upload</button>
                    </div>`).join('');

                attachmentsList.innerHTML = html || '<div class="no-attachments">No files attached to this job</div>';
            } catch (error) {
                console.error('Error loading files:', error);
                attachmentsList.innerHTML = '<div class="no-attachments">Error loading files</div>';
            }
        }

        // === CLOUD FUNCTION VERSION - Generates PDF server-side ===
        // === DIRECT JSPDF VERSION WITH WORKING HYPERLINKS ===
        async function generateAndDownloadSurveyPDF(event) {
            event.preventDefault();
            if (!currentSurveyData || !currentSurveyData.sections) {
                alert("No survey data available.");
                return;
            }

            const btn = event.target;
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Generating PDF...';

            try {
                console.log('Creating PDF directly with jsPDF...');
                
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                
                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();
                const margin = 20;
                const maxWidth = pageWidth - (margin * 2);
                let yPosition = margin;
                
                // Helper function to check if we need a new page
                const checkPageBreak = (requiredSpace) => {
                    if (yPosition + requiredSpace > pageHeight - margin) {
                        pdf.addPage();
                        yPosition = margin;
                        return true;
                    }
                    return false;
                };
                
                // Helper function to add wrapped text
                const addText = (text, fontSize, style = 'normal', color = [0, 0, 0]) => {
                    pdf.setFontSize(fontSize);
                    pdf.setFont('helvetica', style);
                    pdf.setTextColor(...color);
                    
                    const lines = pdf.splitTextToSize(text, maxWidth);
                    const lineHeight = fontSize * 0.5;
                    
                    checkPageBreak(lines.length * lineHeight);
                    
                    lines.forEach(line => {
                        pdf.text(line, margin, yPosition);
                        yPosition += lineHeight;
                    });
                    
                    return yPosition;
                };
                
                // Title
                pdf.setFontSize(24);
                pdf.setFont('helvetica', 'bold');
                pdf.setTextColor(0, 0, 0);
                pdf.text('Site Survey Report', pageWidth / 2, yPosition, { align: 'center' });
                yPosition += 12;
                
                // Job Number
                pdf.setFontSize(18);
                pdf.setFont('helvetica', 'normal');
                pdf.setTextColor(51, 51, 51);
                pdf.text(`Job #${currentSurveyData.jobNumber || 'N/A'}`, pageWidth / 2, yPosition, { align: 'center' });
                yPosition += 15;
                
                // Customer info
                addText(`Customer: ${currentSurveyData.customerName || 'N/A'}`, 12, 'normal');
                yPosition += 2;
                addText(`Submitted: ${new Date(currentSurveyData.submittedAt).toLocaleString('en-GB')}`, 12, 'normal');
                yPosition += 10;
                
                // Horizontal line
                pdf.setDrawColor(200, 200, 200);
                pdf.line(margin, yPosition, pageWidth - margin, yPosition);
                yPosition += 10;
                
                // Sections
                let imageCounter = 1;
                
                for (const section of currentSurveyData.sections) {
                    checkPageBreak(20);
                    
                    // Section title
                    pdf.setFontSize(16);
                    pdf.setFont('helvetica', 'bold');
                    pdf.setTextColor(44, 62, 80);
                    pdf.text(section.title, margin, yPosition);
                    yPosition += 8;
                    
                    // Underline
                    pdf.setDrawColor(238, 238, 238);
                    pdf.line(margin, yPosition, pageWidth - margin, yPosition);
                    yPosition += 8;
                    
                    for (const field of section.fields) {
                        // Answer text
                        if (field.answer && field.answer.toString().trim() !== '' && field.answer.toString().trim() !== 'N/A') {
                            checkPageBreak(15);
                            
                            pdf.setFontSize(11);
                            pdf.setFont('helvetica', 'bold');
                            pdf.setTextColor(0, 0, 0);
                            const questionLines = pdf.splitTextToSize(`${field.question}:`, maxWidth);
                            questionLines.forEach(line => {
                                pdf.text(line, margin, yPosition);
                                yPosition += 5;
                            });
                            
                            pdf.setFont('helvetica', 'normal');
                            pdf.setTextColor(51, 51, 51);
                            const answerLines = pdf.splitTextToSize(field.answer.toString(), maxWidth - 5);
                            answerLines.forEach(line => {
                                pdf.text(line, margin + 5, yPosition);
                                yPosition += 5;
                            });
                            
                            yPosition += 3;
                        }
                        
                        // Photos section with clickable links
                        if (field.photos && field.photos.length > 0) {
                            checkPageBreak(10 + (field.photos.length * 8));
                            
                            // Photos header with background
                            pdf.setFillColor(245, 245, 245);
                            pdf.rect(margin, yPosition - 5, maxWidth, 8 + (field.photos.length * 8), 'F');
                            
                            pdf.setFontSize(11);
                            pdf.setFont('helvetica', 'bold');
                            pdf.setTextColor(51, 51, 51);
                            pdf.text(`${field.question} - Photos (${field.photos.length}):`, margin + 3, yPosition);
                            yPosition += 8;
                            
                            // Add each photo link
                            for (const url of field.photos) {
                                const linkText = `Image ${imageCounter} - Click to view`;
                                
                                pdf.setFontSize(10);
                                pdf.setFont('helvetica', 'normal');
                                pdf.setTextColor(0, 102, 204); // Blue color for links
                                
                                // Add the text
                                pdf.text(linkText, margin + 8, yPosition);
                                
                                // Add the clickable link over the text
                                // textWidth calculation for the link area
                                const textWidth = pdf.getTextWidth(linkText);
                                pdf.link(margin + 8, yPosition - 4, textWidth, 6, { url: url });
                                
                                // Add underline to show it's a link
                                pdf.setDrawColor(0, 102, 204);
                                pdf.line(margin + 8, yPosition + 0.5, margin + 8 + textWidth, yPosition + 0.5);
                                
                                yPosition += 8;
                                imageCounter++;
                            }
                            
                            yPosition += 5;
                        }
                    }
                    
                    yPosition += 5;
                }
                
                console.log('Saving PDF...');
                pdf.save(`Site_Survey_${currentSurveyData.jobNumber || 'Unknown'}.pdf`);
                console.log('PDF generated successfully with working hyperlinks!');
                
                showStatus('PDF generated! Click image links to view photos.', 'success');

            } catch (error) {
                console.error('PDF generation failed:', error);
                alert('Failed to generate PDF. Error: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = originalText;
            }
        }
        window.generateAndDownloadSurveyPDF = generateAndDownloadSurveyPDF;

        // All other functions (unchanged)
        async function updateJobStatus(jobId, newStatus, buttonElement) {
            const messageDiv = document.getElementById('status-update-message');
            try {
                const { doc, updateDoc } = window.firebaseModules;
                await updateDoc(doc(window.db, 'Solar-jobs', jobId), { status: newStatus, lastStatusUpdate: new Date().toISOString() });
                const job = allJobs.find(j => j.id === jobId);
                if (job) job.status = newStatus;
                messageDiv.innerHTML = '<div class="status-update-message success">Status updated successfully!</div>';
                setTimeout(() => messageDiv.innerHTML = '', 3000);
                document.querySelectorAll('.status-update-btn').forEach(b => b.classList.remove('current'));
                if (buttonElement) buttonElement.classList.add('current');
                displayResults();
            } catch (error) {
                console.error('Status update error:', error);
                messageDiv.innerHTML = `<div class="status-update-message error">Failed: ${error.message}</div>`;
                setTimeout(() => messageDiv.innerHTML = '', 5000);
            }
        }
        window.updateJobStatus = updateJobStatus;

        function editLeadEngineer() {
            if (isEditingEngineer) return;
            isEditingEngineer = true;
            const job = allJobs.find(j => j.id === currentJobId);
            const container = document.getElementById('lead-engineer-container');
            const options = leadEngineers.map(e => `<option value="${escapeHtml(e.name)}" ${e.name === job['Lead Engineer'] ? 'selected' : ''}>${escapeHtml(e.name)}</option>`).join('');
            container.innerHTML = `
                <select class="engineer-select" id="engineer-select"><option value="">-- Unassigned --</option>${options}</select>
                <div class="save-cancel-btns">
                    <button class="save-btn" onclick="saveLeadEngineer()">Save</button>
                    <button class="cancel-btn" onclick="cancelEditEngineer()">Cancel</button>
                </div>
            `;
        }

        function cancelEditEngineer() {
            isEditingEngineer = false;
            const job = allJobs.find(j => j.id === currentJobId);
            document.getElementById('lead-engineer-container').innerHTML = `
                <span id="lead-engineer-display">${escapeHtml(job['Lead Engineer'] || 'Unassigned')}</span>
                <button class="edit-btn" onclick="editLeadEngineer()">Change</button>
            `;
        }

        async function saveLeadEngineer() {
            const newEngineer = document.getElementById('engineer-select').value;
            try {
                const { doc, updateDoc } = window.firebaseModules;
                await updateDoc(doc(window.db, 'Solar-jobs', currentJobId), { 'Lead Engineer': newEngineer || 'Unassigned', 'Lead': newEngineer || 'Unassigned' });
                const job = allJobs.find(j => j.id === currentJobId);
                job['Lead Engineer'] = newEngineer || 'Unassigned';
                isEditingEngineer = false;
                document.getElementById('lead-engineer-container').innerHTML = `
                    <span id="lead-engineer-display">${escapeHtml(job['Lead Engineer'])}</span>
                    <button class="edit-btn" onclick="editLeadEngineer()">Change</button>
                `;
                showStatus('Lead engineer updated successfully!', 'success');
                displayResults();
            } catch (error) {
                console.error('Engineer update error:', error);
                showStatus('Error: ' + error.message, 'error');
            }
        }

        async function handleFileUpload(event, collectionName, jobNumber) {
            const file = event.target.files[0];
            if (!file) return;
            const uploadButton = event.target.nextElementSibling;
            const originalText = uploadButton.textContent;
            uploadButton.innerHTML = '<div class="uploading-indicator">Uploading</div>';
            uploadButton.disabled = true;
            try {
                const { ref, uploadBytes, getDownloadURL, addDoc, collection } = window.firebaseModules;
                const storageRef = ref(window.storage, `${collectionName}/${jobNumber}_${file.name}`);
                const snapshot = await uploadBytes(storageRef, file);
                const downloadURL = await getDownloadURL(snapshot.ref);
                await addDoc(collection(window.db, collectionName), {
                    jobNumber, fileName: file.name, fileSize: file.size, downloadURL, uploadDate: new Date().toISOString()
                });
                showStatus('File uploaded successfully!', 'success');
                await loadJobFiles(jobNumber);
            } catch (error) {
                console.error('Upload error:', error);
                showStatus('Upload failed: ' + error.message, 'error');
                uploadButton.textContent = originalText;
                uploadButton.disabled = false;
            }
        }
        window.handleFileUpload = handleFileUpload;

        function formatFileSize(bytes) {
            if (!bytes) return 'Unknown size';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function closeJobModal() {
            document.getElementById('job-modal').classList.remove('show');
        }

        function escapeHtml(text) {
            if (typeof text !== 'string') return text;
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function showStatus(message, type) {
            const status = document.getElementById('status-message');
            status.textContent = message;
            status.className = `status-message ${type} show`;
            setTimeout(() => status.classList.remove('show'), 3000);
        }

        document.getElementById('job-modal').addEventListener('click', (e) => {
            if (e.target.id === 'job-modal') closeJobModal();
        });
    </script>
