<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fail Code Analysis Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* ═══ Pingu design system — base (copy verbatim into each page's <style>) ═══ */
        :root {
            /* Brand + status palette */
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --secondary: #FFC857;
            --accent: #00D9FF;
            --dark: #1A1A2E;
            --dark-light: #252541;
            --dark-lighter: #2F2F4A;
            --text: #EAEAEA;
            --text-dim: #9A9AB0;
            --success: #4ECCA3;
            --error: #FF6B6B;
            --warning: #FFC857;
            --in-progress: #00D9FF;
            --complete: #4ECCA3;
            --aborted: #FF6B6B;
            --cancelled: #9A9AB0;
            --short-notice: #90ee90;
            --on-hold: #FFDE00;
            --scheduled: #FF6B35;
            /* Surfaces & type */
            --bg: #161628;
            --surface: #1F1F35;
            --surface-2: #252541;
            --line: rgba(255,255,255,0.07);
            --line-2: rgba(255,255,255,0.12);
            --text-strong: #F4F4F8;
            --text-soft: #C8C8D6;
            --radius: 10px;
            --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: var(--font); font-size: 14px; line-height: 1.5;
            background: var(--bg); color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        button, input, select, textarea { font-family: inherit; }
        a { color: var(--accent); }
        .ico { width: 16px; height: 16px; flex: 0 0 auto; vertical-align: -3px; }
        .ico-lg { width: 20px; height: 20px; flex: 0 0 auto; }

        /* ── App bar + Pingu wordmark ── */
        .appbar {
            position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            height: 64px; padding: 0 28px;
            background: rgba(22, 22, 40, 0.92);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line);
        }
        .appbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .logo { display: inline-flex; align-items: center; text-decoration: none; }
        .wordmark {
            font-family: 'Inter', var(--font); font-weight: 800; font-size: 28px;
            letter-spacing: -0.045em; line-height: 1; color: var(--text-strong); padding-top: 6px;
        }
        .i-stem { position: relative; display: inline-block; }
        .i-paw {
            position: absolute; left: 50%; top: -0.17em; transform: translateX(-50%) rotate(-10deg);
            width: 0.5em; height: 0.5em; fill: var(--primary);
            filter: drop-shadow(0 1px 4px rgba(255,107,53,0.35));
            transition: transform .2s ease;
        }
        .logo:hover .i-paw { transform: translateX(-50%) rotate(4deg) scale(1.08); }
        .logo:hover .wordmark { color: #fff; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-soft); text-decoration: none; font-size: 13px; font-weight: 500;
            padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; cursor: pointer;
            transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .back-btn:hover { background: var(--surface-2); color: var(--text-strong); border-color: rgba(255,255,255,0.2); }

        /* ── Page layout ── */
        .container { padding: 24px 28px 40px; }
        .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
        h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-strong); line-height: 1.2; }
        h2 { font-size: 16px; font-weight: 600; color: var(--text-strong); letter-spacing: -0.01em; }
        h3 { font-size: 14px; font-weight: 600; color: var(--text-strong); }
        .muted { color: var(--text-dim); }
        .toolbar { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }

        /* ── Panels / cards ── */
        .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
        .panel + .panel { margin-top: 16px; }
        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -2px 0 14px; }
        .panel-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--text-strong); }
        .panel-title .ico { color: var(--primary); }

        /* ── Form controls ── */
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-label { color: var(--text-dim); font-size: 11.5px; font-weight: 500; }
        .control-input {
            height: 38px; background: var(--surface); border: 1px solid var(--line-2);
            color: var(--text-strong); padding: 0 12px; border-radius: 8px; font-size: 13.5px; width: 100%;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        textarea.control-input { height: auto; min-height: 84px; padding: 9px 11px; resize: vertical; }
        .control-input:hover { border-color: rgba(255,255,255,0.2); }
        .control-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.22); }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); cursor: pointer; }
        input[type="checkbox"], input[type="radio"] { accent-color: var(--primary); }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 7px;
            height: 38px; padding: 0 16px; border-radius: 8px; cursor: pointer;
            font-size: 13.5px; font-weight: 600; text-decoration: none; white-space: nowrap;
            border: 1px solid transparent; transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--surface-2); color: var(--text-strong); border-color: var(--line-2); }
        .btn-secondary:hover { background: var(--dark-lighter); border-color: rgba(255,255,255,0.25); }
        .btn-ghost { background: transparent; color: var(--text-soft); border-color: var(--line-2); }
        .btn-ghost:hover { background: var(--surface-2); color: var(--text-strong); }
        .btn-danger { background: rgba(255,107,107,0.12); color: #FF8A8A; border-color: rgba(255,107,107,0.4); }
        .btn-danger:hover { background: rgba(255,107,107,0.22); }
        .btn-success { background: rgba(78,204,163,0.14); color: var(--success); border-color: rgba(78,204,163,0.45); }
        .btn-success:hover { background: rgba(78,204,163,0.24); }
        .btn-sm { height: 32px; padding: 0 12px; font-size: 12.5px; }
        .btn:disabled, button:disabled { opacity: .45; cursor: not-allowed; }
        .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; height: 38px; }
        .seg button { background: var(--surface); color: var(--text-soft); border: 0; padding: 0 12px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .seg button + button { border-left: 1px solid var(--line-2); }
        .seg button:hover, .seg button.active { background: var(--surface-2); color: var(--text-strong); }

        /* ── KPI tiles ── */
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
        .stat-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; }
        .stat-label { display: flex; align-items: center; gap: 7px; color: var(--text-dim); font-size: 12px; font-weight: 500; white-space: nowrap; }
        .stat-label .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
        .stat-value { font-size: 22px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.02em; line-height: 1.25; margin-top: 2px; font-variant-numeric: tabular-nums; }

        /* ── Tables ── */
        .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
        thead th {
            position: sticky; top: 0; z-index: 2; background: var(--surface);
            text-align: left; padding: 10px 14px; font-size: 11.5px; font-weight: 600; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--line-2); white-space: nowrap;
        }
        tbody td { padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--text-soft); vertical-align: middle; }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover td { background: rgba(255,255,255,0.025); }
        td.strong, .cell-strong { color: var(--text-strong); font-weight: 600; }
        .mono { font-family: var(--mono); font-size: 12.5px; }

        /* ── Badges / status pills ── */
        .badge {
            --c: var(--text-dim);
            display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
            padding: 2px 9px; border-radius: 999px; color: var(--text-strong);
            background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
        }
        .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
        .badge.plain::before { display: none; }
        .tag { font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 4px; background: rgba(255,255,255,0.1); color: var(--text-soft); letter-spacing: .03em; }

        /* ── Notices ── */
        .notice { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 13px;
                  background: rgba(255,255,255,0.03); border: 1px solid var(--line-2); color: var(--text-soft); }
        .notice .ico { margin-top: 1px; }
        .notice.info    { border-color: rgba(0,217,255,0.35);  background: rgba(0,217,255,0.06); }
        .notice.success { border-color: rgba(78,204,163,0.4);  background: rgba(78,204,163,0.07); color: var(--success); }
        .notice.warning { border-color: rgba(255,200,87,0.4);  background: rgba(255,200,87,0.07); color: var(--warning); }
        .notice.error   { border-color: rgba(255,107,107,0.45); background: rgba(255,107,107,0.08); color: #FF8A8A; }

        /* ── Modals ── */
        .modal { display: none; position: fixed; inset: 0; background: rgba(10,10,22,0.72); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
        .modal.show, .modal.active, .modal.open { display: flex; }
        .modal-content { background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; width: 100%; max-width: 680px; max-height: 88vh; overflow-y: auto; box-shadow: 0 30px 80px -20px rgba(0,0,0,0.75); }
        .modal-header { position: sticky; top: 0; z-index: 2; background: var(--surface); display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
        .modal-title { font-size: 17px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.01em; }
        .modal-body { padding: 18px 20px 22px; }
        .close-btn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; border-radius: 8px; color: var(--text-dim); cursor: pointer; font-size: 20px; line-height: 1; }
        .close-btn:hover { background: var(--surface-2); color: var(--text-strong); }

        /* ── Feedback ── */
        .toast { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: none; max-width: 420px; padding: 12px 16px 12px 14px; border-radius: 10px;
                 background: #26263F; color: var(--text-strong); font-size: 13.5px; border: 1px solid var(--line-2); border-left: 3px solid var(--success);
                 box-shadow: 0 16px 40px -12px rgba(0,0,0,0.7); }
        .toast.show { display: block; }
        .toast.error { border-left-color: var(--error); }
        .empty-state, .loading { text-align: center; padding: 56px 16px; color: var(--text-dim); }
        .empty-state h3 { color: var(--text-strong); font-size: 16px; margin-bottom: 4px; }
        .empty-state .ico-lg { width: 32px; height: 32px; color: var(--text-dim); margin-bottom: 10px; }
        .spinner { width: 22px; height: 22px; border: 2px solid var(--line-2); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        *::-webkit-scrollbar { width: 10px; height: 10px; }
        *::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
        *::-webkit-scrollbar-track { background: transparent; }
        @media (max-width: 768px) {
            .appbar, .container { padding-left: 14px; padding-right: 14px; }
            .wordmark { font-size: 24px; }
        }
        /* ═══ end base ═══ */

        /* ── Page: fail code analysis ── */
        .controls { align-items: flex-end; }
        .controls .control-input { width: 170px; }
        .controls select.control-input { width: 200px; }
        select.control-input option { background: var(--surface); }
        .file-input-wrapper { position: relative; }
        .file-input-wrapper input[type=file] { position: absolute; left: -9999px; }
        .file-input-label { cursor: pointer; }

        .filters-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 16px; margin-bottom: 16px; }
        .filters-grid:has(> .fail-code-filter[style*="none"]) { display: block; }
        .filters-grid > .fail-code-filter[style*="block"] + .fail-code-filter { margin-top: 0; }
        .fail-code-filter .panel-head { flex-wrap: wrap; }
        .filter-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .filter-actions .btn { gap: 6px; }
        .checkbox-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px;
            max-height: 200px; overflow-y: auto; padding: 10px;
            background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
        }
        .checkbox-item {
            display: flex; align-items: center; gap: 7px; padding: 6px 8px; cursor: pointer;
            background: var(--surface); border: 1px solid var(--line); border-radius: 7px; transition: border-color .15s ease;
        }
        .checkbox-item:hover { border-color: var(--line-2); }
        .checkbox-item input[type="checkbox"] { width: 15px; height: 15px; margin: 0; cursor: pointer; }
        .checkbox-item label { cursor: pointer; font-size: 12.5px; color: var(--text-soft); display: flex; align-items: center; gap: 6px; font-family: var(--mono); }

        .stats-row { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .stats-row:empty { display: none; }
        .stat-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; }
        .stat-card .stat-label { color: var(--text-dim); font-size: 12px; font-weight: 500; }
        .stat-card .stat-value { font-size: 22px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
        .stat-sub { font-size: 11.5px; color: var(--text-dim); }

        .main-content { grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; margin-bottom: 16px; }
        .main-content .panel + .panel { margin-top: 0; }
        .chart-box { position: relative; height: 480px; }
        .occurrence-table-container { max-height: 520px; overflow-y: auto; padding-top: 16px; }
        .occurrence-table-container .panel-head { position: sticky; top: -16px; background: var(--surface); padding: 2px 0 10px; margin: -2px 0 6px; z-index: 1; border-bottom: 1px solid var(--line); }
        .occurrence-row {
            display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center;
            padding: 8px 10px; border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 6px;
            transition: background .15s ease;
        }
        .occurrence-row:hover { background: rgba(255,255,255,0.03); }
        .occurrence-code { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12.5px; font-weight: 700; color: var(--text-strong); }
        .occurrence-count { font-size: 14px; font-weight: 700; color: var(--text-strong); text-align: right; font-variant-numeric: tabular-nums; }

        .no-data .no-data-icon { margin-bottom: 4px; }

        .top-performers { margin-top: 8px; }
        .section-head { margin: 4px 0 12px; }
        .performer-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; }
        .performer-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
        .performer-name-section { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .performer-name { font-size: 15px; font-weight: 700; color: var(--text-strong); }
        .toggle-jobs-btn {
            display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px;
            background: transparent; color: var(--text-soft); border: 1px solid var(--line-2); border-radius: 7px;
            font-size: 12.5px; font-weight: 500; cursor: pointer; transition: background .15s ease, color .15s ease;
        }
        .toggle-jobs-btn:hover { background: var(--surface-2); color: var(--text-strong); }
        .toggle-jobs-btn .arrow { transition: transform .2s ease; }
        .toggle-jobs-btn.expanded .arrow { transform: rotate(180deg); }
        .performer-total {
            display: inline-flex; align-items: center; padding: 3px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
            color: var(--text-strong); background: rgba(255,107,107,0.14); border: 1px solid rgba(255,107,107,0.4);
        }
        .job-numbers-section { display: none; margin-bottom: 14px; padding: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
        .job-numbers-section.show { display: block; }
        .job-numbers-title { font-size: 12px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px; }
        .job-numbers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; max-height: 300px; overflow-y: auto; }
        .job-number-item {
            padding: 6px 8px; border-radius: 6px; text-align: center; cursor: default;
            font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--text-soft);
            background: var(--surface); border: 1px solid var(--line-2); transition: background .15s ease, border-color .15s ease;
        }
        .job-number-item.highlighted { background: rgba(255,200,87,0.18); border-color: var(--warning); color: var(--text-strong); }
        .fail-codes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
        .fail-code-item {
            padding: 8px 10px; border-radius: 8px; text-align: left; cursor: pointer;
            background: var(--bg); border: 1px solid var(--line); transition: border-color .15s ease, background .15s ease;
        }
        .fail-code-item:hover { border-color: var(--line-2); background: var(--surface-2); }
        .fail-code-name { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--text-soft); margin-bottom: 2px; }
        .fail-code-count { font-size: 17px; font-weight: 700; color: var(--text-strong); font-variant-numeric: tabular-nums; }

        .color-badge { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .color-badge.red    { background: #FF6B6B; }
        .color-badge.amber  { background: #FFC857; }
        .color-badge.purple { background: #A29BFE; }
        .color-badge.green  { background: #4ECCA3; }

        .tooltip {
            position: absolute; z-index: 1000; pointer-events: none; opacity: 0; transition: opacity .15s ease;
            max-width: 340px; padding: 10px 12px; border-radius: 10px; font-size: 13px;
            background: #26263F; color: var(--text-strong); border: 1px solid var(--line-2);
            box-shadow: 0 16px 40px -12px rgba(0,0,0,0.7);
        }
        .tooltip.show { opacity: 1; }
        .tooltip-code { font-family: var(--mono); font-weight: 700; font-size: 13px; color: var(--text-strong); margin-bottom: 4px; }
        .tooltip-description { line-height: 1.5; color: var(--text-soft); }
        .tooltip-description:not(:empty) { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--line-2); }
        .tooltip-teams-title { font-size: 11px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
        .team-list-item { display: flex; justify-content: space-between; padding: 2px 0; font-size: 12.5px; }
        .team-list-item .team-name { color: var(--text-soft); }
        .team-list-item .team-count { color: var(--text-strong); font-weight: 600; margin-left: 10px; font-variant-numeric: tabular-nums; }

        @media (max-width: 1200px) {
            .main-content { grid-template-columns: minmax(0, 1fr); }
            .occurrence-table-container { max-height: 400px; }
            .filters-grid { grid-template-columns: minmax(0, 1fr); }
        }
        @media (max-width: 768px) {
            .controls, .controls .control-group { width: 100%; }
            .controls .control-input, .controls select.control-input, .controls .btn { width: 100%; }
            .stats-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .chart-box { height: 340px; }
            .fail-codes-grid { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); }
        }

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            Papa.parse(file, {
                complete: function(results) {
                    console.log('Raw data:', results.data);
                    
                    const headers = results.data[1];
                    console.log('Headers:', headers);
                    
                    const dataRows = results.data.slice(2).filter(row => row.length > 1 && row[0]);

                    allData = dataRows.map(row => {
                        const obj = {};
                        headers.forEach((header, i) => {
                            const cleanHeader = header ? header.trim() : '';
                            obj[cleanHeader] = row[i] || '';
                        });
                        return obj;
                    });

                    console.log('Parsed data sample:', allData[0]);
                    console.log('Team values:', allData.map(r => r['Team']).slice(0, 10));

                    initializeCheckboxes();
                    initializeTeamNumberCheckboxes();
                    populateTeamFilter();
                    setDefaultDateRange();
                    document.getElementById('teamNumberFilter').style.display = 'block';
                    document.getElementById('failCodeFilter').style.display = 'block';
                    updateDashboard();
                },
                skipEmptyLines: true
            });
        }

        function populateTeamFilter() {
            const teams = [...new Set(allData.map(r => r['Team']).filter(Boolean))].sort();
            const select = document.getElementById('teamFilter');
            select.innerHTML = '<option value="all">All Teams</option>';
            teams.forEach(team => {
                const option = document.createElement('option');
                option.value = team;
                option.textContent = team;
                select.appendChild(option);
            });
        }

        function setDefaultDateRange() {
            const dates = allData
                .map(r => parseDate(r['Date received']))
                .filter(d => d)
                .sort((a, b) => a - b);

            if (dates.length > 0) {
                document.getElementById('startDate').valueAsDate = dates[0];
                document.getElementById('endDate').valueAsDate = dates[dates.length - 1];
            }
        }

        function parseDate(dateStr) {
            if (!dateStr) return null;
            const parts = dateStr.split('/');
            if (parts.length === 3) {
                return new Date(parts[2], parts[1] - 1, parts[0]);
            }
            return new Date(dateStr);
        }

        function getTeamsByFailCode(data, failCode) {
            const teamCounts = {};
            
            data.forEach(row => {
                const team = row['Team'] || 'Unknown';
                for (let i = 1; i <= 12; i++) {
                    const code = row[`Fail Code ${i}`];
                    if (code === failCode) {
                        teamCounts[team] = (teamCounts[team] || 0) + 1;
                    }
                }
            });

            return Object.entries(teamCounts)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5);
        }

                document.getElementById('noData').style.display = 'block';

                document.getElementById('stats').style.display = 'none';
                document.getElementById('topPerformers').style.display = 'none';
                document.getElementById('exportBtnContainer').style.display = 'none';
                return;
            }

            document.getElementById('noData').style.display = 'none';
            document.getElementById('mainContent').style.display = 'grid';
            document.getElementById('stats').style.display = 'grid';

            const startDate = document.getElementById('startDate').valueAsDate;
            const endDate = document.getElementById('endDate').valueAsDate;
            const selectedTeam = document.getElementById('teamFilter').value;

            filteredData = allData.filter(row => {
                const rowDate = parseDate(row['Date received']);
                const dateMatch = (!startDate || !endDate || !rowDate) || 
                                 (rowDate >= startDate && rowDate <= endDate);
                const teamMatch = selectedTeam === 'all' || row['Team'] === selectedTeam;
                const teamNumberMatch = selectedTeamNumbers.size === 0 || selectedTeamNumbers.has(row['Team Number']);
                return dateMatch && teamMatch && teamNumberMatch;
            });

            updateStats(filteredData, startDate, endDate);
            updateChart(filteredData);
            updateOccurrenceTable(filteredData);
            updateTopPerformers(filteredData);
            
            document.getElementById('exportBtnContainer').style.display = 'block';
        }

        function updateStats(data, startDate, endDate) {
            let totalIncidents = 0;
            if (startDate && endDate) {
                totalIncidents = allData.filter(row => {
                    const rowDate = parseDate(row['Date received']);
                    return rowDate && rowDate >= startDate && rowDate <= endDate;
                }).length;
            } else {
                totalIncidents = data.length;
            }
            
            const uniqueTeams = new Set(data.map(r => r['Team']).filter(Boolean)).size;
            
            let totalFailCodes = 0;
            data.forEach(row => {
                for (let i = 1; i <= 12; i++) {
                    const code = row[`Fail Code ${i}`];
                    if (code && selectedCodes.has(code)) totalFailCodes++;
                }
            });

            const revisitsRequired = data.filter(r => 
                r['Revisit required?'] && r['Revisit required?'].toLowerCase() === 'yes'
            ).length;

            const revisitsCompleted = data.filter(r => 
                r['Revisit completed'] && r['Revisit completed'].toLowerCase() === 'yes'
            ).length;

            const statsHTML = `
                <div class="stat-card">
                    <div class="stat-label">Total Incidents</div>
                    <div class="stat-value">${totalIncidents}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Fail Codes</div>
                    <div class="stat-value">${totalFailCodes}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Teams</div>
                    <div class="stat-value">${uniqueTeams}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Revisits</div>
                    <div class="stat-value">${revisitsCompleted} / ${revisitsRequired}</div>
                    <div class="stat-sub">Completed / Required</div>
                </div>
            `;
            document.getElementById('stats').innerHTML = statsHTML;
        }

        function updateChart(data) {
            const failCodeCounts = {};
            FAIL_CODES.forEach(code => failCodeCounts[code] = 0);

            data.forEach(row => {
                for (let i = 1; i <= 12; i++) {
                    const code = row[`Fail Code ${i}`];
                    if (code && selectedCodes.has(code)) {
                        failCodeCounts[code]++;
                    }
                }
            });

            const chartData = FAIL_CODES
                .filter(code => selectedCodes.has(code))
                .map(code => ({ code, count: failCodeCounts[code] }))
                .filter(item => item.count > 0)
                .sort((a, b) => b.count - a.count)
                .slice(0, 20);

            if (chart) chart.destroy();
            Chart.defaults.font.family = "'Inter', system-ui, sans-serif";

            const ctx = document.getElementById('failCodeChart').getContext('2d');
            
            const backgroundColors = chartData.map(item => {
                const color = FAIL_CODE_COLORS[item.code];
                if (color === 'red') return '#FF6B6B';
                if (color === 'amber') return '#FFC857';
                if (color === 'green') return '#4ECCA3';
                return '#A29BFE';
            });
            
            const borderColors = chartData.map(item => {
                const color = FAIL_CODE_COLORS[item.code];
                if (color === 'red') return '#FF6B6B';
                if (color === 'amber') return '#FFC857';
                if (color === 'green') return '#4ECCA3';
                return '#A29BFE';
            });

            chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: chartData.map(item => item.code),
                    datasets: [{
                        label: 'Fail Code Count',
                        data: chartData.map(item => item.count),
                        backgroundColor: backgroundColors,
                        borderColor: borderColors,
                        borderWidth: 0,
                        borderRadius: 4,
                        maxBarThickness: 48
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        title: {
                            display: true,
                            text: 'Top 20 fail codes',
                            color: '#F4F4F8',
                            align: 'start',
                            padding: { bottom: 16 },
                            font: {
                                family: 'Inter',
                                size: 15,
                                weight: '600'
                            }
                        },
                        tooltip: {
                            backgroundColor: '#26263F',
                            titleColor: '#F4F4F8',
                            bodyColor: '#C8C8D6',
                            borderColor: 'rgba(255, 255, 255, 0.12)',
                            borderWidth: 1,
                            padding: 12,
                            displayColors: false,
                            callbacks: {
                                title: function(context) {
                                    return context[0].label;
                                },
                                label: function(context) {
                                    return 'Count: ' + context.parsed.y;
                                },
                                afterLabel: function(context) {
                                    const code = context.label;
                                    const description = FAIL_CODE_DESCRIPTIONS[code];
                                    return description ? '\n' + description : '';
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                precision: 0,
                                color: '#9A9AB0'
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.06)'
                            }
                        },
                        x: {
                            ticks: {
                                color: '#9A9AB0'
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.06)'
                            }
                        }
                    }
                }
            });
        }

        function updateOccurrenceTable(data) {
            const failCodeCounts = {};
            FAIL_CODES.forEach(code => failCodeCounts[code] = 0);

            data.forEach(row => {
                for (let i = 1; i <= 12; i++) {
                    const code = row[`Fail Code ${i}`];
                    if (code && selectedCodes.has(code)) {
                        failCodeCounts[code]++;
                    }
                }
            });

            const sortedCodes = FAIL_CODES
                .filter(code => selectedCodes.has(code))
                .map(code => ({ code, count: failCodeCounts[code] }))
                .filter(item => item.count > 0)
                .sort((a, b) => b.count - a.count);

            const tableHTML = sortedCodes.map(item => `
                <div class="occurrence-row" data-code="${item.code}">
                    <div class="occurrence-code">${getColorBadge(item.code)} ${item.code}</div>
                    <div class="occurrence-count">${item.count}</div>
                </div>
            `).join('');

            document.getElementById('occurrenceTable').innerHTML = tableHTML;

            document.querySelectorAll('.occurrence-row').forEach(row => {
                row.addEventListener('mouseenter', showTooltip);
                row.addEventListener('mousemove', moveTooltip);
                row.addEventListener('mouseleave', hideTooltip);
            });
        }

        function updateTopPerformers(data) {
            const performerData = {};

            data.forEach(row => {
                const name = row['Team'] || 'Unknown';
                const jRef = row['J Ref'] || 'N/A';
                
                if (!performerData[name]) {
                    performerData[name] = {
                        total: 0,
                        codes: {},
                        jobNumbers: [],
                        jobNumberCodes: {}
                    };
                }

                let hasFailCode = false;
                const codesInThisRow = [];
                for (let i = 1; i <= 12; i++) {
                    const code = row[`Fail Code ${i}`];
                    if (code && selectedCodes.has(code)) {
                        hasFailCode = true;
                        codesInThisRow.push(code);
                        performerData[name].total++;
                        performerData[name].codes[code] = (performerData[name].codes[code] || 0) + 1;
                    }
                }

                if (hasFailCode) {
                    performerData[name].jobNumbers.push(jRef);
                    if (!performerData[name].jobNumberCodes[jRef]) {
                        performerData[name].jobNumberCodes[jRef] = [];
                    }
                    performerData[name].jobNumberCodes[jRef].push(...codesInThisRow);
                }
            });

            const sortedPerformers = Object.entries(performerData)
                .filter(([name, data]) => data.total > 0)
                .sort((a, b) => b[1].total - a[1].total);

            if (sortedPerformers.length === 0) {
                document.getElementById('topPerformers').style.display = 'none';
                return;
            }

            document.getElementById('topPerformers').style.display = 'block';

            const performersHTML = sortedPerformers.map(([name, data], index) => {
                const sortedCodes = Object.entries(data.codes)
                    .sort((a, b) => b[1] - a[1]);

                const codesHTML = sortedCodes.map(([code, count]) => `
                    <div class="fail-code-item" data-code="${code}" data-performer-index="${index}">
                        <div class="fail-code-name">${getColorBadge(code)} ${code}</div>
                        <div class="fail-code-count">${count}</div>
                    </div>
                `).join('');

                const jobNumbersArray = data.jobNumbers.sort();
                const uniqueCount = new Set(jobNumbersArray).size;
                const jobNumbersHTML = jobNumbersArray.map((jobNum) => {
                    const codes = data.jobNumberCodes[jobNum] || [];
                    return `<div class="job-number-item" data-jref="${jobNum}" data-codes="${codes.join(',')}">${jobNum}</div>`;
                }).join('');

                return `
                    <div class="performer-card" data-performer-index="${index}">
                        <div class="performer-header">
                            <div class="performer-name-section">
                                <div class="performer-name">${name}</div>
                                <button class="toggle-jobs-btn" onclick="toggleJobNumbers(${index})">
                                    <span>${jobNumbersArray.length} Instance${jobNumbersArray.length !== 1 ? 's' : ''} (${uniqueCount} unique)</span>
                                    <svg class="ico arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                                </button>
                            </div>
                            <div class="performer-total">${data.total} Total Fail Codes</div>
                        </div>
                        <div class="job-numbers-section" id="job-numbers-${index}">
                            <div class="job-numbers-title">
                                J Ref Numbers (${jobNumbersArray.length} instances, ${uniqueCount} unique)
                            </div>
                            <div class="job-numbers-grid">
                                ${jobNumbersHTML}
                            </div>
                        </div>
                        <div class="fail-codes-grid">
                            ${codesHTML}
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('performersList').innerHTML = performersHTML;

            document.querySelectorAll('.fail-code-item').forEach(item => {
                item.addEventListener('mouseenter', showTooltip);
                item.addEventListener('mousemove', moveTooltip);
                item.addEventListener('mouseleave', hideTooltip);
            });
        }

        function toggleJobNumbers(index) {
            const section = document.getElementById(`job-numbers-${index}`);
            const button = document.querySelectorAll('.toggle-jobs-btn')[index];
            
            section.classList.toggle('show');
            button.classList.toggle('expanded');
        }

        function showTooltip(e) {
            const code = e.currentTarget.dataset.code;
            const performerIndex = e.currentTarget.dataset.performerIndex;
            const description = FAIL_CODE_DESCRIPTIONS[code];
            
            if (performerIndex !== undefined) {
                highlightJobNumbers(performerIndex, code);
            }
            
            if (!description && code) {
                if (performerIndex === undefined) {
                    const startDate = document.getElementById('startDate').valueAsDate;
                    const endDate = document.getElementById('endDate').valueAsDate;
                    const selectedTeam = document.getElementById('teamFilter').value;

                    const filtered = allData.filter(row => {
                        const rowDate = parseDate(row['Date received']);
                        const dateMatch = (!startDate || !endDate || !rowDate) || 
                                         (rowDate >= startDate && rowDate <= endDate);
                        const teamMatch = selectedTeam === 'all' || row['Team'] === selectedTeam;
                        const teamNumberMatch = selectedTeamNumbers.size === 0 || selectedTeamNumbers.has(row['Team Number']);
                        return dateMatch && teamMatch && teamNumberMatch;
                    });

                    const teamRankings = getTeamsByFailCode(filtered, code);
                    
                    if (teamRankings.length === 0) return;

                    tooltip.querySelector('.tooltip-code').textContent = code;
                    tooltip.querySelector('.tooltip-description').textContent = '';
                    
                    const teamsHTML = `
                        <div class="tooltip-teams-title">Top Teams:</div>
                        ${teamRankings.map(([team, count]) => `
                            <div class="team-list-item">
                                <span class="team-name">${team}</span>
                                <span class="team-count">${count}</span>
                            </div>
                        `).join('')}
                    `;
                    tooltip.querySelector('.tooltip-teams').innerHTML = teamsHTML;
                    tooltip.classList.add('show');
                    moveTooltip(e);
                }
                return;
            }

            if (!description) return;

            tooltip.querySelector('.tooltip-code').textContent = code;
            tooltip.querySelector('.tooltip-description').textContent = description;
            
            if (performerIndex === undefined) {
                const startDate = document.getElementById('startDate').valueAsDate;
                const endDate = document.getElementById('endDate').valueAsDate;
                const selectedTeam = document.getElementById('teamFilter').value;

                const filtered = allData.filter(row => {
                    const rowDate = parseDate(row['Date received']);
                    const dateMatch = (!startDate || !endDate || !rowDate) || 
                                     (rowDate >= startDate && rowDate <= endDate);
                    const teamMatch = selectedTeam === 'all' || row['Team'] === selectedTeam;
                    const teamNumberMatch = selectedTeamNumbers.size === 0 || selectedTeamNumbers.has(row['Team Number']);
                    return dateMatch && teamMatch && teamNumberMatch;
                });

                const teamRankings = getTeamsByFailCode(filtered, code);

                const teamsHTML = teamRankings.length > 0 ? `
                    <div class="tooltip-teams-title">Top Teams:</div>
                    ${teamRankings.map(([team, count]) => `
                        <div class="team-list-item">
                            <span class="team-name">${team}</span>
                            <span class="team-count">${count}</span>
                        </div>
                    `).join('')}
                ` : '';
                tooltip.querySelector('.tooltip-teams').innerHTML = teamsHTML;
            } else {
                tooltip.querySelector('.tooltip-teams').innerHTML = '';
            }
            
            tooltip.classList.add('show');
            moveTooltip(e);
        }

        function highlightJobNumbers(performerIndex, code) {
            document.querySelectorAll('.job-number-item.highlighted').forEach(item => {
                item.classList.remove('highlighted');
            });

            const performerCard = document.querySelector(`.performer-card[data-performer-index="${performerIndex}"]`);
            if (!performerCard) return;

            const jobNumberItems = performerCard.querySelectorAll('.job-number-item');
            jobNumberItems.forEach(item => {
                const codes = item.dataset.codes.split(',');
                if (codes.includes(code)) {
                    item.classList.add('highlighted');
                }
            });
        }

        function moveTooltip(e) {
            const tooltipRect = tooltip.getBoundingClientRect();
            let left = e.pageX + 15;
            let top = e.pageY + 15;

            if (left + tooltipRect.width > window.innerWidth) {
                left = e.pageX - tooltipRect.width - 15;
            }
            if (top + tooltipRect.height > window.innerHeight + window.scrollY) {
                top = e.pageY - tooltipRect.height - 15;
            }

            tooltip.style.left = left + 'px';
            tooltip.style.top = top + 'px';
        }

        function hideTooltip() {
            tooltip.classList.remove('show');
            document.querySelectorAll('.job-number-item.highlighted').forEach(item => {
                item.classList.remove('highlighted');
            });
        }

                    slide.addText('Incidents with Fails', { x: 2.9, y: 1.9, w: 2.2, h: 0.3, align: 'center', color: 'AAAAAA', fontSize: 11, fontFace: 'Inter' });
                    slide.addText(String(tData.totalIncidents), { x: 2.9, y: 2.2, w: 2.2, h: 0.4, align: 'center', color: accentLight, fontSize: 24, bold: true, fontFace: 'Inter' });
                    
                    slide.addShape(pres.ShapeType.roundRect, { x: 5.3, y: 1.8, w: 2.2, h: 0.9, fill: { color: cardBg }, line: { color: '333355', width: 1 }, rectRadius: 0.1 });
                    slide.addText('Revisits Required', { x: 5.3, y: 1.9, w: 2.2, h: 0.3, align: 'center', color: 'AAAAAA', fontSize: 11, fontFace: 'Inter' });
                    slide.addText(String(tData.revisitsReq), { x: 5.3, y: 2.2, w: 2.2, h: 0.4, align: 'center', color: accentLight, fontSize: 24, bold: true, fontFace: 'Inter' });

                    // Severity breakdown chart (donut)
                    const donutLabels = [];
                    const donutValues = [];
                    const donutColors = [];
                    if (tData.red > 0) { donutLabels.push('Red'); donutValues.push(tData.red); donutColors.push('FF4757'); }
                    if (tData.amber > 0) { donutLabels.push('Amber'); donutValues.push(tData.amber); donutColors.push('FFA502'); }
                    if (tData.purple > 0) { donutLabels.push('Purple'); donutValues.push(tData.purple); donutColors.push('A29BFE'); }
                    if (tData.green > 0) { donutLabels.push('Green'); donutValues.push(tData.green); donutColors.push('2ECC71'); }
                    
                    if (donutValues.length > 0) {
                        slide.addChart(pres.ChartType.doughnut, [{
                            name: 'Severity',
                            labels: donutLabels,
                            values: donutValues
                        }], {
                            x: 0.5, y: 2.9, w: 3, h: 2.5,
                            showLegend: true, legendPos: 'b', legendColor: textWhite, legendFontSize: 10,
                            chartColors: donutColors,
                            dataLabelColor: textWhite,
                            showValue: true,
                            holeSize: 50
                        });
                    }

                    // Table for top fail codes
                    const tCodes = Object.entries(tData.codeCounts)
                        .sort((a, b) => b[1] - a[1])
                        .slice(0, 5);
                        
                    if (tCodes.length > 0) {
                        const tableRows = [
                            [
                                { text: 'Code', options: { color: accentLight, bold: true, border: { pt: 1, color: '333355' }, fill: { color: '202040' } } },
                                { text: 'Count', options: { color: accentLight, bold: true, border: { pt: 1, color: '333355' }, fill: { color: '202040' } } },
                                { text: 'Description', options: { color: accentLight, bold: true, border: { pt: 1, color: '333355' }, fill: { color: '202040' } } }
                            ]
                        ];
                        
                        tCodes.forEach(([code, count]) => {
                            tableRows.push([
                                { text: code, options: { color: textWhite, border: { pt: 1, color: '333355' } } },
                                { text: String(count), options: { color: textWhite, border: { pt: 1, color: '333355' } } },
                                { text: FAIL_CODE_DESCRIPTIONS[code] || 'No description available', options: { color: 'AAAAAA', border: { pt: 1, color: '333355' } } }
                            ]);
                        });
                        
                        slide.addTable(tableRows, {
                            x: 3.8, y: 2.9, w: 5.7, colW: [0.8, 0.7, 4.2],
                            fill: { color: cardBg },
                            fontSize: 10,
                            fontFace: 'Inter',
                            border: { pt: 1, color: '333355' }
                        });
                    }
                });

                // Overall Top 10 Slide
                let slideOverall = pres.addSlide({ masterName: 'MASTER_SLIDE' });
                slideOverall.addText('Overall Top Performers by Severity', { x: 0.5, y: 1, w: 9, h: 0.6, fontSize: 32, color: textWhite, bold: true, fontFace: 'Inter' });
                
                if (sortedPerformers.length > 0) {
                    const pLabels = sortedPerformers.map(p => p[0]);
                    const redData = sortedPerformers.map(p => p[1].red);
                    const amberData = sortedPerformers.map(p => p[1].amber);
                    const purpleData = sortedPerformers.map(p => p[1].purple);
                    const greenData = sortedPerformers.map(p => p[1].green);

                    slideOverall.addChart(pres.ChartType.bar, [
                        { name: 'Red Codes', labels: pLabels, values: redData },
                        { name: 'Amber Codes', labels: pLabels, values: amberData },
                        { name: 'Purple Codes', labels: pLabels, values: purpleData },
                        { name: 'Green Codes', labels: pLabels, values: greenData }
                    ], {
                        x: 0.5, y: 1.8, w: 9, h: 3.5,
                        barDir: 'col',
                        barGrouping: 'stacked',
                        chartColors: ['FF4757', 'FFA502', 'A29BFE', '2ECC71'],
                        valAxisLabelColor: textWhite,
                        valAxisLabelFontSize: 12,
                        catAxisLabelColor: accentLight,
                        catAxisLabelFontSize: 12,
                        showValue: true,
                        dataLabelColor: textWhite,
                        showLegend: true,
                        legendPos: 'b',
                        legendColor: textWhite,
                        valGridLine: { color: '333355', style: 'dash' }
                    });
                } else {
                    slideOverall.addText('No data for teams.', { x: 0.5, y: 2, w: 9, h: 1, color: 'AAAAAA', align: 'center', fontSize: 16 });
                }

                await pres.writeFile({ fileName: 'FailCodeAnalysis_Report.pptx' });
            } catch (err) {
                console.error(err);
                alert('Error generating PowerPoint. Check console.');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        // Initialize with no data message
        document.getElementById('noData').style.display = 'block';
        document.getElementById('mainContent').style.display = 'none';
        document.getElementById('stats').style.display = 'none';
    </script>
</body>
</html>
