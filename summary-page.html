    <script>
/* ═══════════════════════════════════════════════════════════════
   Daily login guard — loaded first on every page (except the login page).
   A login is valid until midnight (local time) on the day it was made.
   Opening or refreshing any page on a new day sends you to the login page,
   then back to the page you were on.
   ═══════════════════════════════════════════════════════════════ */
(function () {
    var LOGIN_PAGE   = 'adminlogin!&!.html';
    var SESSION_KEY  = 'adminSession';
    var REDIRECT_KEY = 'loginRedirect';

    function expiry(loginTime) {           // midnight at the end of the login day
        var d = new Date(loginTime); d.setHours(24, 0, 0, 0); return d.getTime();
    }
    function isValid() {
        try {
            var s = JSON.parse(localStorage.getItem(SESSION_KEY));
            return !!(s && s.loginTime && Date.now() < expiry(s.loginTime));
        } catch (e) { return false; }
    }
    function currentPage() {
        var p = location.pathname.split('/').pop() || 'index.html';
        return p + location.search + location.hash;
    }
    var leaving = false;
    function sendToLogin() {
        if (leaving) return; leaving = true;
        try {
            localStorage.removeItem(SESSION_KEY);
            sessionStorage.setItem(REDIRECT_KEY, currentPage());
        } catch (e) {}
        document.documentElement.style.visibility = 'hidden';
        location.replace(LOGIN_PAGE);
    }

    if (!isValid()) { document.documentElement.style.visibility = 'hidden'; sendToLogin(); return; }

    window.SolarSessionExpiry = expiry;

    // Re-check: at midnight while the page is open, when the tab comes back into view,
    // when the page is restored with the Back button, and when another tab signs out.
    setInterval(function () { if (!isValid()) sendToLogin(); }, 30000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden && !isValid()) sendToLogin(); });
    window.addEventListener('pageshow', function () { if (!isValid()) sendToLogin(); });
    window.addEventListener('storage', function (e) { if (e.key === SESSION_KEY && !isValid()) sendToLogin(); });
})();

    </script>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';

    const cfg = {
        apiKey:"AIzaSyAc_yJQ_rkzuOBh-Yxg0Q4eooXtB-tQjm0",
        authDomain:"pingu-solar.firebaseapp.com",
        projectId:"pingu-solar",

        appId:"1:232764952866:web:5923b7f419de6355d6157b",

    };
    const PROJECTS = 'pingu-projects', DATABRICKS = 'Databricks', SCAFFOLD_SHEET = 'Scafolding', JOBS = 'Solar-jobs';
    const PAGE_PIN = '9615', PIN_KEY = 'pinguSummaryUnlocked';
    let db;
    try { db = getFirestore(initializeApp(cfg)); } catch (e) { console.error(e); }

    // ── Job types & rates: kept in step with Pingu-Project.html ─────────
    const JOB_TYPES = {
        SOLAR_PV_INSTALL_V2:      { label: 'Solar Install', kind: 'solar' },
        PARTNER_SOLAR_PV_INSTALL: { label: 'Solar Install', kind: 'solar' },
        SOLAR_PV_BATTERY_INSTALL: { label: 'Battery Only',  kind: 'battery' },
        SOLAR_PV_AFTERCARE:       { label: 'Aftercare',     kind: 'aftercare' }
    };
    function jobTypeInfo(raw) {
        const code = String(raw || '').trim().toUpperCase();
        if (JOB_TYPES[code]) return { code, ...JOB_TYPES[code] };
        if (code.includes('AFTERCARE')) return { code, label: 'Aftercare', kind: 'aftercare' };
        if (code.includes('BATTERY'))   return { code, label: 'Battery Only', kind: 'battery' };
        if (code.includes('SOLAR') || code.includes('INSTALL')) return { code, label: 'Solar Install', kind: 'solar' };
        return { code, label: raw || 'Unknown', kind: 'unknown' };
    }
    const RATES = {
        pay: {
            solar:     [{ max: 16, amt: 1400 }, { max: 24, amt: 2200 }],
            battery:   600,
            aftercarePerHour: 100,
            pvfBySides: { 1: 595, 2: 795, 3: 1350 }
        },
        receive: {
            solar:     [{ max: 10, amt: 2150 }, { max: 16, amt: 2350 }, { max: 24, amt: 2500 }],
            battery:   1000,
            aftercare: 600,
            consumables: { solar: 1000, battery: 400 },
            scaffold:  { 1: 700, 2: 1000, 3: 1350 }
        }
    };
    const band = (bands, n) => bands.find(b => n <= b.max) || null;
    const gbp = n => '£' + Number(n).toLocaleString('en-GB', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });
    const numOrNull = v => { const t = String(v ?? '').trim(); if (t === '') return null; const n = Number(t); return isNaN(n) ? null : n; };

    // Same sums as the Costs tab on Pingu-Project.html
    function calcFinancials(kind, panels, hours, sides, edmundson, pvf, octopus = false) {
        const receive = [], pay = [];
        if (kind === 'solar') {
            const ok = panels != null && panels <= 24;
            receive.push({ amt: ok ? band(RATES.receive.solar, panels).amt : null });
            pay.push({ amt: ok ? band(RATES.pay.solar, panels).amt : null });
            receive.push({ amt: RATES.receive.consumables.solar });
            receive.push({ amt: octopus ? 0 : sides ? RATES.receive.scaffold[sides] : null });
            pay.push({ amt: edmundson, supplier: true });
            pay.push({ amt: octopus ? 0 : pvf, supplier: true });
        } else if (kind === 'battery') {
            receive.push({ amt: RATES.receive.battery }, { amt: RATES.receive.consumables.battery });
            pay.push({ amt: RATES.pay.battery }, { amt: edmundson, supplier: true });
        } else if (kind === 'aftercare') {
            receive.push({ amt: RATES.receive.aftercare });
            pay.push({ amt: hours == null ? null : hours * RATES.pay.aftercarePerHour });
        }
        const sum = arr => arr.reduce((t, l) => t + (l.amt || 0), 0);
        const totalReceive = sum(receive), totalPay = sum(pay), margin = totalReceive - totalPay, all = receive.concat(pay);
        const calculable = kind !== 'unknown' && !all.some(l => l.amt == null && !l.supplier);
        const complete = calculable && !all.some(l => l.amt == null);
        return { totalReceive, totalPay, margin: calculable ? margin : null,
                 marginPct: calculable && totalReceive ? margin / totalReceive * 100 : null,
                 complete, provisional: calculable && !complete };
    }

    // ── Helpers ─────────────────────────────────────────────────────────
    const $ = id => document.getElementById(id);
    const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const pick = (obj, keys) => { for (const k of keys) { const v = obj?.[k]; if (v !== undefined && v !== null && String(v).trim() !== '') return v; } return ''; };
    const blank = v => v === null || v === undefined || String(v).trim() === '';
    const projectId = jn => String(jn).trim().replace(/\//g, '-');
    function parseDate(v) {
        if (!v) return null;
        if (typeof v.toDate === 'function') v = v.toDate();
        if (typeof v === 'string' && v.includes('/')) {
            const p = v.split('/');
            if (p.length === 3) { const d = new Date(+p[2], +p[1] - 1, +p[0]); if (!isNaN(d)) return d; }
        }
        const d = new Date(v);
        return isNaN(d) ? null : d;
    }
    const toISO = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); x.setHours(0, 0, 0, 0); return x; };
    const mondayOf = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; };
    const fmtDay = d => d.toLocaleDateString('en-GB', { weekday: 'short', day: '2-digit', month: 'short' });
    function adminName() { try { return (JSON.parse(localStorage.getItem('adminSession') || '{}').name) || ''; } catch { return ''; } }
    function toast(msg, isError) {
        const t = $('toast'); t.textContent = msg; t.className = 'toast show' + (isError ? ' error' : '');
        clearTimeout(t._h); t._h = setTimeout(() => t.className = 'toast', 4000);
    }
    function profileFromJob(j) {
        const address = [pick(j, ['Address', '1st line of address', 'address']), pick(j, ['2nd line of address'])].filter(Boolean).join(', ');
        return {
            jobType:   pick(j, ['Job Type', 'jobType']),
            engineer:  String(pick(j, ['Lead Engineer', 'lead engineer', 'Lead', 'Engineer', 'engineer'])).replace(/^["']|["']$/g, '').trim(),
            installDay: pick(j, ['Install Date', 'Booked Date', 'installedDate', 'bookingDate']),
            jobLength: pick(j, ['Job Length', 'Days', 'Job Length (days)', 'jobLength', 'Duration']),
            name:      pick(j, ['Name', 'Customer Name', 'customerName']),
            address,
            postcode:  pick(j, ['Postcode', 'postcode']),
            phone:     pick(j, ['Phone Number', 'Phone', 'Contact Number', 'Mobile']),
            email:     pick(j, ['Email Address', 'Email', 'Customer Email'])
        };
    }

    // ── PIN gate (remembered for this browser tab) ──────────────────────
    window.unlock = function () {
        if ($('gate-pin').value.trim() !== PAGE_PIN) { $('gate-err').textContent = 'Incorrect PIN.'; $('gate-pin').select(); return; }
        try { sessionStorage.setItem(PIN_KEY, '1'); } catch {}
        openPage();
    };
    function openPage() {
        $('gate').classList.add('hide');
        document.body.classList.remove('locked');
        if (!$('wc').value) { $('wc').value = toISO(mondayOf(new Date())); loadWeek(); }
    }

    // ── State ───────────────────────────────────────────────────────────
    let rows = [];          // one per job in the week
    let allJobsCache = null;
    let loadedWeek = '';

    const dirtyCount = () => rows.filter(r => r.dirty).length;
    function confirmDiscard() { return !dirtyCount() || confirm(`You have unsaved changes on ${dirtyCount()} job(s). Discard them?`); }
    window.addEventListener('beforeunload', e => { if (dirtyCount()) { e.preventDefault(); e.returnValue = ''; } });

    window.shiftWeek = n => {
        const cur = $('wc').value ? new Date($('wc').value + 'T00:00:00') : new Date();
        if (!confirmDiscard()) return;
        $('wc').value = toISO(addDays(mondayOf(cur), 7 * n)); loadWeek(true);
    };
    window.thisWeek = () => { if (!confirmDiscard()) return; $('wc').value = toISO(mondayOf(new Date())); loadWeek(true); };

    // ── Load ────────────────────────────────────────────────────────────
    window.loadWeek = async function (confirmed) {
        if (!$('wc').value) return;
        if (!confirmed && $('wc').value !== loadedWeek && !confirmDiscard()) { $('wc').value = loadedWeek; return; }
        const start = mondayOf(new Date($('wc').value + 'T00:00:00')), end = addDays(start, 7);
        $('wc').value = toISO(start); loadedWeek = $('wc').value;
        $('week-label').textContent = `Jobs installing ${fmtDay(start)} – ${fmtDay(addDays(start, 6))} ${addDays(start, 6).getFullYear()}`;
        $('grid-wrap').innerHTML = '<div class="empty"><span class="spinner"></span> Loading jobs…</div>';
        $('stats').innerHTML = '';
        rows = []; updateSavebar();
        try {
            if (!allJobsCache) allJobsCache = (await getDocs(collection(db, JOBS))).docs.map(d => ({ id: d.id, ...d.data() }));
            // Jobs whose first install day is in the week. Same job number uploaded twice: newest upload wins.
            const byJn = {};
            allJobsCache.forEach(j => {
                const jn = String(j['Job Number'] ?? '').trim();
                if (!jn) return;
                const prof = profileFromJob(j), d = parseDate(prof.installDay);
                if (!d || d < start || d >= end) return;
                if (String(prof.jobType).toUpperCase().includes('SURVEY')) return;
                if (!byJn[jn] || String(j.uploadDate || '') > String(byJn[jn].job.uploadDate || '')) byJn[jn] = { job: j, prof, date: d };
            });
            const list = Object.entries(byJn);
            const read = (col, id) => getDoc(doc(db, col, id)).then(s => s.exists() ? s.data() : null).catch(e => { console.warn(col, id, e); return null; });
            const extra = await Promise.all(list.map(([jn]) => Promise.all([read(PROJECTS, projectId(jn)), read(DATABRICKS, projectId(jn)), read(SCAFFOLD_SHEET, projectId(jn))])));
            if (loadedWeek !== toISO(start)) return;   // another week was picked meanwhile
            rows = list.map(([jn, x], i) => makeRow(jn, x, ...extra[i]));
            rows.sort((a, b) => a.date - b.date || a.prof.engineer.localeCompare(b.prof.engineer) || a.jn.localeCompare(b.jn));
            render();
        } catch (e) {
            console.error(e);
            $('grid-wrap').innerHTML = `<div class="empty">Couldn't load jobs: ${esc(e.message)}</div>`;
        }
    };

    function makeRow(jn, x, project, dbr, scr) {
        const p = project || {}, s = p.scaffolding || {}, c = p.cable || {}, j = p.job || {}, co = p.costs || {};
        const t = jobTypeInfo(x.prof.jobType);
        const r = {
            jn, job: x.job, prof: x.prof, date: x.date, kind: t.kind, label: t.label, prev: project, dirty: false, fromSheet: new Set(),
            status: String(x.job['Status Update'] || x.job.status || 'Scheduled'),
            v: {
                octo: !!s.octopusArranged, sides: s.sides ? String(s.sides) : '', requested: !!s.requested,
                erect: s.erectionDate || '', dismantle: s.dismantleDate || '',
                cableOrdered: !!c.ordered, cableNotes: c.notes || '',
                system: j.system || '', inverter: j.inverter || '', arrays: j.arrays ?? '', panels: j.panelQuantity ?? '', hours: j.aftercareHours ?? '',
                edm: co.edmundson ?? '', pvf: co.pvf ?? ''
            },
            pvfAuto: co.pvf == null || co.pvfSource === 'sides' || co.pvfSource === 'octopus'
        };
        // Blank fields are filled from the Google Sheet pastes, as on the project page
        const fill = (field, val) => { if (val == null || blank(val) || !blank(r.v[field])) return; r.v[field] = String(val); r.fromSheet.add(field); };
        if (dbr) { fill('panels', dbr.panels); fill('system', dbr.system); fill('arrays', dbr.arrays); }
        if (scr) {
            if (scaffApplies(r) && !r.v.octo) {
                fill('sides', [1, 2, 3].includes(Number(scr.sides)) ? String(Number(scr.sides)) : null);
                fill('erect', /^\d{4}-\d{2}-\d{2}$/.test(String(scr.erectDateISO || '')) ? scr.erectDateISO : null);
            }
        }
        if (r.kind === 'battery' || r.kind === 'aftercare') ['panels', 'arrays'].forEach(f => { if (r.fromSheet.delete(f)) r.v[f] = j[f === 'panels' ? 'panelQuantity' : 'arrays'] ?? ''; });
        if (r.pvfAuto && scaffApplies(r) && !r.v.octo) r.v.pvf = RATES.pay.pvfBySides[r.v.sides] ?? '';
        if (r.fromSheet.size) r.dirty = true;
        const install = new Date(x.date); install.setHours(0, 0, 0, 0);
        r.deadlines = { scaffold: addDays(install, -28), cable: addDays(install, -3) };
        return r;
    }
    const scaffApplies = r => r.kind === 'solar' || r.kind === 'unknown';
    const cableApplies = r => r.kind !== 'aftercare';

    // ── Render ──────────────────────────────────────────────────────────
    const TICK = (f, r, extra = '') => `<label class="tick ${extra}" data-tick="${f}"><input type="checkbox" data-f="${f}" ${r.v[f] ? 'checked' : ''}></label>`;
    const INPUT = (f, r, cls, type = 'text', attrs = '') => `<input class="in ${cls}${r.fromSheet.has(f) ? ' from-sheet' : ''}" type="${type}" data-f="${f}" value="${esc(r.v[f])}" ${attrs}>`;
    const NA = txt => `<span class="na">${txt}</span>`;

    function rowHtml(r, i) {
        const sc = scaffApplies(r), cab = cableApplies(r), cancelled = /cancel/i.test(r.status);
        const sidesOpts = ['', '1', '2', '3'].map(o => `<option value="${o}" ${String(r.v.sides) === o ? 'selected' : ''}>${o || '–'}</option>`).join('');
        return `<tr data-i="${i}">
            <td class="sticky-col"><a class="jn" href="Pingu-Project.html?job=${encodeURIComponent(r.jn)}" target="_blank" title="Open the project">#${esc(r.jn)}</a>
                <span class="status-chip">${esc(r.status)}</span></td>
            <td>${esc(fmtDay(r.date))}</td>
            <td><span class="type ${r.kind}${cancelled ? ' cancelled' : ''}" title="${esc(r.prof.jobType)}">${esc(r.label)}</span></td>
            <td>${esc(r.prof.engineer || '—')}<span class="sub" style="display:block">${esc(r.prof.postcode || '')}</span></td>

            ${sc ? `<td class="g-start c">${TICK('octo', r, 'octo')}</td>
            <td><select class="in w-xs" data-f="sides">${sidesOpts}</select></td>
            <td class="c">${TICK('requested', r)}</td>
            <td>${INPUT('erect', r, 'w-date', 'date')}</td>
            <td>${INPUT('dismantle', r, 'w-date', 'date')}</td>`
            : `<td class="g-start" colspan="5">${NA('Scaffolding not needed')}</td>`}

            ${cab ? `<td class="g-start c">${TICK('cableOrdered', r)}</td>
            <td>${INPUT('cableNotes', r, 'w-xl', 'text', 'placeholder="Notes"')}</td>`
            : `<td class="g-start" colspan="2">${NA('Cable not needed')}</td>`}

            <td class="g-start">${INPUT('system', r, 'w-xl')}</td>
            <td>${r.kind === 'solar' || r.kind === 'unknown' ? INPUT('arrays', r, 'w-xs num', 'number', 'min="0" step="1"') : NA('–')}</td>
            <td>${r.kind === 'aftercare' ? INPUT('hours', r, 'w-s num', 'number', 'min="0" step="0.5" placeholder="hrs" title="Aftercare hours"')
                 : r.kind === 'battery' ? NA('–') : INPUT('panels', r, 'w-s num', 'number', 'min="0" step="1"')}</td>

            <td class="g-start">${cab ? INPUT('edm', r, 'w-m num', 'number', 'min="0" step="0.01" placeholder="£"') : NA('–')}</td>
            <td>${sc ? INPUT('pvf', r, 'w-m num', 'number', 'min="0" step="0.01" placeholder="£"') : NA('–')}</td>
            <td class="money" data-out="pay"></td>
            <td class="money" data-out="recv"></td>
            <td class="money" data-out="margin"></td>
        </tr>`;
    }

    function render() {
        if (!rows.length) {
            $('grid-wrap').innerHTML = '<div class="empty">No jobs installing this week.</div>';
            renderStats(); return;
        }
        $('grid-wrap').innerHTML = `<table>
            <thead>
                <tr class="groups">
                    <th class="sticky-col" style="--gc:var(--g-job)" colspan="1">Job</th>
                    <th colspan="3" style="--gc:var(--g-job)"></th>
                    <th colspan="5" class="g-start" style="--gc:var(--g-scaff)">Scaffolding</th>
                    <th colspan="2" class="g-start" style="--gc:var(--g-cable)">Cable (Edmundson)</th>
                    <th colspan="3" class="g-start" style="--gc:var(--g-jobinfo)">Job info</th>
                    <th colspan="5" class="g-start" style="--gc:var(--g-cost)">Costs</th>
                </tr>
                <tr class="cols">
                    <th class="sticky-col">Job number</th><th>Install date</th><th>Job type</th><th>Engineer</th>
                    <th class="g-start" title="Scaffolding arranged by Octopus">Octopus</th><th>Sides</th><th>Requested</th><th>Erect date</th><th>Dismantle date</th>
                    <th class="g-start">Ordered</th><th>Notes</th>
                    <th class="g-start">System</th><th>Arrays</th><th>Panels / hrs</th>
                    <th class="g-start">Edmundson £</th><th>PVF £</th><th style="text-align:right">We pay</th><th style="text-align:right">We receive</th><th style="text-align:right">Margin</th>
                </tr>
            </thead>
            <tbody id="tbody">${rows.map(rowHtml).join('')}</tbody>
        </table>`;
        const tb = $('tbody');
        tb.addEventListener('input', onEdit);
        tb.addEventListener('change', onEdit);
        rows.forEach((r, i) => refreshRow(i));
        applyFilter();
        renderStats();
    }

    function onEdit(e) {
        const el = e.target, f = el.dataset.f, tr = el.closest('tr');
        if (!f || !tr) return;
        const i = +tr.dataset.i, r = rows[i];
        const val = el.type === 'checkbox' ? el.checked : el.value;
        const refillPvf = f === 'pvf' && e.type === 'change' && blank(val);   // PVF cleared and left: back to the standard rate
        if (r.v[f] === val && !refillPvf) return;
        r.v[f] = val;
        r.fromSheet.delete(f); el.classList.remove('from-sheet');
        if (f === 'pvf') r.pvfAuto = String(val).trim() === '';         // typing a PVF figure overrides the standard rate; clearing it goes back to the rate
        if (f === 'sides' || f === 'octo' || refillPvf) applyPvfRate(r, tr);
        r.dirty = true; tr.classList.remove('saved', 'err');
        refreshRow(i);
        renderStats();
    }

    function applyPvfRate(r, tr) {
        if (!scaffApplies(r) || r.v.octo || !r.pvfAuto) return;
        r.v.pvf = RATES.pay.pvfBySides[r.v.sides] ?? '';
        const el = tr.querySelector('[data-f="pvf"]'); if (el) el.value = r.v.pvf;
    }

    // Per-row: work out what's missing, disabled states and the money columns
    function gaps(r) {
        const g = {}, sc = scaffApplies(r) && !r.v.octo, today = new Date(); today.setHours(0, 0, 0, 0);
        if (sc) { if (!r.v.sides) g.sides = 1; if (!r.v.erect) g.erect = 1; if (!r.v.requested) g.requested = today > r.deadlines.scaffold ? 'late' : 1; if (blank(r.v.pvf)) g.pvf = 1; }
        if (cableApplies(r)) { if (!r.v.cableOrdered) g.cableOrdered = today > r.deadlines.cable ? 'late' : 1; if (blank(r.v.edm)) g.edm = 1; }
        if (r.kind !== 'aftercare' && blank(r.v.system)) g.system = 1;
        if (r.kind === 'solar') { if (blank(r.v.panels)) g.panels = 1; if (blank(r.v.arrays)) g.arrays = 1; }
        if (r.kind === 'aftercare' && blank(r.v.hours)) g.hours = 1;
        return g;
    }
    function finOf(r) {
        return calcFinancials(r.kind, numOrNull(r.v.panels), numOrNull(r.v.hours), numOrNull(r.v.sides), numOrNull(r.v.edm), numOrNull(r.v.pvf), scaffApplies(r) && r.v.octo);
    }

    function refreshRow(i) {
        const r = rows[i], tr = document.querySelector(`#tbody tr[data-i="${i}"]`);
        if (!tr) return;
        const octo = scaffApplies(r) && r.v.octo, g = gaps(r);
        ['sides', 'requested', 'erect', 'dismantle', 'pvf'].forEach(f => { const el = tr.querySelector(`[data-f="${f}"]`); if (el) el.disabled = octo; });
        if (octo) { const p = tr.querySelector('[data-f="pvf"]'); if (p) p.value = 0; }
        else if (scaffApplies(r)) { const p = tr.querySelector('[data-f="pvf"]'); if (p && String(p.value) !== String(r.v.pvf)) p.value = r.v.pvf; }
        tr.querySelectorAll('[data-f]').forEach(el => {
            const f = el.dataset.f, holder = el.type === 'checkbox' ? el.closest('.tick') : el;
            holder.classList.toggle('need', g[f] === 1);
            holder.classList.toggle('late', g[f] === 'late');
        });
        const pvfEl = tr.querySelector('[data-f="pvf"]');
        if (pvfEl) { pvfEl.classList.toggle('auto', r.pvfAuto && !octo && !blank(r.v.pvf));
            pvfEl.title = octo ? 'Arranged by Octopus: £0' : r.pvfAuto ? 'Standard rate for the sides. Type over it to enter the actual PVF cost.' : 'Entered by hand. Clear it to go back to the standard rate.'; }
        const reqTick = tr.querySelector('[data-tick="requested"]'), cabTick = tr.querySelector('[data-tick="cableOrdered"]');
        if (reqTick) reqTick.title = 'Request scaffold by ' + fmtDay(r.deadlines.scaffold);
        if (cabTick) cabTick.title = 'Order cable by ' + fmtDay(r.deadlines.cable);

        const f = finOf(r), out = k => tr.querySelector(`[data-out="${k}"]`);
        out('pay').textContent = gbp(f.totalPay);
        out('recv').textContent = gbp(f.totalReceive);
        const m = out('margin');
        m.className = 'money ' + (f.margin == null ? 'missing' : f.margin < 0 ? 'neg' : 'pos');
        m.innerHTML = f.margin == null ? 'Missing<span class="pct">fill in the gaps</span>'
            : `${f.margin < 0 ? '-' : ''}${gbp(Math.abs(f.margin))}<span class="pct">${f.marginPct == null ? '' : f.marginPct.toFixed(1) + '%'}${f.provisional ? ' <span class="prov">· provisional</span>' : ''}</span>`;
        m.title = f.provisional ? 'Provisional: an Edmundson or PVF cost is missing' : '';
        tr.classList.toggle('dirty', r.dirty);
        tr.dataset.gaps = Object.keys(g).length;
        updateSavebar();
    }

    window.applyFilter = function () {
        const only = $('only-missing').checked;
        document.querySelectorAll('#tbody tr').forEach(tr => tr.style.display = only && tr.dataset.gaps === '0' ? 'none' : '');
    };

    function renderStats() {
        const fins = rows.map(finOf), withGaps = rows.filter(r => Object.keys(gaps(r)).length).length;
        const counted = fins.filter(f => f.margin != null);
        const recv = counted.reduce((t, f) => t + f.totalReceive, 0), pay = counted.reduce((t, f) => t + f.totalPay, 0), margin = recv - pay;
        const stat = (l, v, cls = '', title = '') => `<div class="stat" title="${esc(title)}"><div class="l">${l}</div><div class="v ${cls}">${v}</div></div>`;
        $('stats').innerHTML = rows.length ? [
            stat('Jobs', rows.length),
            stat('Jobs with gaps', withGaps, withGaps ? 'warn' : 'pos'),
            stat('We receive', gbp(recv), '', 'Jobs whose margin can be worked out'),
            stat('We pay', gbp(pay), '', 'Jobs whose margin can be worked out'),
            stat('Margin', (margin < 0 ? '-' : '') + gbp(Math.abs(margin)) + (recv ? ` <span style="font-size:13px;color:var(--text-dim)">${(margin / recv * 100).toFixed(1)}%</span>` : ''), margin < 0 ? 'neg' : 'pos',
                 counted.length < rows.length ? `${rows.length - counted.length} job(s) left out: missing panels/hours` : ''),
            counted.some(f => f.provisional) ? stat('Provisional', counted.filter(f => f.provisional).length + ' jobs', 'warn', 'Margin includes jobs with an Edmundson or PVF cost still missing') : ''
        ].join('') : '';
    }

    function updateSavebar() {
        const n = dirtyCount();
        $('savebar').classList.toggle('show', n > 0);
        $('save-msg').textContent = `${n} job${n === 1 ? '' : 's'} changed`;
    }

    // ── Save (same record shape as Pingu-Project.html) ─────────────────
    function validate(r) {
        const int = f => { if (blank(r.v[f])) return null; const n = Number(r.v[f]); return Number.isInteger(n) && n >= 0 ? n : NaN; };
        const out = { panels: int('panels'), arrays: int('arrays'), hours: numOrNull(r.v.hours), edm: numOrNull(r.v.edm), pvf: numOrNull(r.v.pvf), sides: numOrNull(r.v.sides) };
        if (Number.isNaN(out.panels)) return 'panels must be a whole number';
        if (Number.isNaN(out.arrays)) return 'arrays must be a whole number';
        if (out.hours != null && out.hours < 0) return 'hours cannot be negative';
        if ((out.edm != null && out.edm < 0) || (out.pvf != null && out.pvf < 0)) return 'costs cannot be negative';
        return out;
    }

    async function saveRow(r) {
        const n = validate(r);
        if (typeof n === 'string') throw new Error(n);
        // Re-read the project so anything saved elsewhere since loading (notes, POs) is kept
        const snap = await getDoc(doc(db, PROJECTS, projectId(r.jn)));
        const prev = snap.exists() ? snap.data() : {};
        const now = new Date().toISOString();
        const sc = scaffApplies(r), octo = sc && r.v.octo, cab = cableApplies(r);
        const kind = r.kind;
        const ps = prev.scaffolding || {}, pc = prev.cable || {}, pj = prev.job || {}, pco = prev.costs || {};
        const panels = kind === 'battery' || kind === 'aftercare' ? (pj.panelQuantity ?? null) : n.panels;
        const arrays = kind === 'battery' || kind === 'aftercare' ? (pj.arrays ?? null) : n.arrays;
        const sReq = sc ? !!r.v.requested : !!ps.requested, cOrd = cab ? !!r.v.cableOrdered : !!pc.ordered;
        const costs = {
            edmundson: cab ? n.edm : (pco.edmundson ?? null),
            pvf: sc ? n.pvf : (pco.pvf ?? null),
            pvfSource: sc ? (r.pvfAuto ? 'sides' : 'manual') : (pco.pvfSource || 'sides')
        };
        if (octo) { costs.pvf = 0; costs.pvfSource = 'octopus'; }
        const sides = sc ? n.sides : (ps.sides ?? null);
        const fin = calcFinancials(kind, panels, n.hours, sides, costs.edmundson, costs.pvf, octo);
        const data = {
            jobNumber: r.jn,
            solarJobId: r.job.id,
            profile: { ...r.prof, installDay: String(r.prof.installDay || '') },
            scaffolding: {
                octopusArranged: octo,
                sides,
                requested: sReq,
                requestedAt: sReq ? (ps.requested && ps.requestedAt ? ps.requestedAt : now) : null,
                erectionDate: sc ? (r.v.erect || '') : (ps.erectionDate || ''),
                dismantleDate: sc ? (r.v.dismantle || '') : (ps.dismantleDate || ''),
                notes: ps.notes || ''
            },
            cable: {
                ordered: cOrd,
                orderedAt: cOrd ? (pc.ordered && pc.orderedAt ? pc.orderedAt : now) : null,
                notes: cab ? String(r.v.cableNotes).trim() : (pc.notes || '')
            },
            job: {
                panelQuantity: panels,
                aftercareHours: n.hours,
                system: String(r.v.system).trim(),
                inverter: pj.inverter || '',   // not on this page: keep what the project has
                arrays,
                notes: pj.notes || ''
            },
            costs,
            financials: { jobKind: kind, receive: fin.totalReceive, payOut: fin.totalPay, margin: fin.margin, complete: fin.complete },
            purchaseOrders: prev.purchaseOrders ?? null,
            createdAt: prev.createdAt || now,
            createdBy: prev.createdBy || adminName(),
            updatedAt: now,
            updatedBy: adminName()
        };
        await setDoc(doc(db, PROJECTS, projectId(r.jn)), data);
        r.prev = data; r.dirty = false; r.fromSheet.clear();
    }

    window.saveAll = async function () {
        const todo = rows.map((r, i) => [r, i]).filter(([r]) => r.dirty);
        if (!todo.length) return;
        const btn = $('save-btn'); btn.disabled = true; btn.innerHTML = '<span class="spinner" style="width:16px;height:16px;border-width:2px"></span> Saving…';
        const failed = [];
        for (const [r, i] of todo) {
            const tr = document.querySelector(`#tbody tr[data-i="${i}"]`);
            try {
                await saveRow(r);
                tr?.classList.add('saved'); tr?.classList.remove('err');
                tr?.querySelectorAll('.from-sheet').forEach(el => el.classList.remove('from-sheet'));
            } catch (e) {
                console.error('Save failed for', r.jn, e);
                failed.push(`#${r.jn}: ${e.message}`);
                tr?.classList.add('err');
            }
            refreshRow(i);
        }
        btn.disabled = false; btn.textContent = 'Save changes';
        renderStats();
        if (failed.length) toast(`Saved ${todo.length - failed.length} of ${todo.length}. Not saved: ${failed.join('; ')}`, true);
        else toast(`Saved ${todo.length} job${todo.length === 1 ? '' : 's'}`);
    };


    // ── Export to Excel (same layout as the timeline export, using what's on screen) ──
    let excelJsLoading = null;
    function loadExcelJs() {
        if (window.ExcelJS) return Promise.resolve();
        return excelJsLoading ??= new Promise((ok, fail) => {
            const sc = document.createElement('script');
            sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
            sc.onload = ok; sc.onerror = () => { excelJsLoading = null; fail(new Error('Could not load the Excel library. Check your internet connection.')); };
            document.head.appendChild(sc);
        });
    }
    window.exportWeek = async function () {
        if (!rows.length) { toast('No jobs to export for this week.', true); return; }
        const btn = $('export-btn'); btn.disabled = true;
        try {
            await loadExcelJs();
            const MISSING = { missing: true }, NA = { na: true };
            const val = v => blank(v) ? MISSING : v;
            const num = v => (v === MISSING || v === NA || isNaN(Number(v))) ? v : Number(v);
            const xlDate = d => new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));   // Excel stores dates as UTC
            const isoDate = v => blank(v) ? MISSING : xlDate(new Date(v + 'T00:00:00'));
            const xrows = rows.map(r => {
                const sc = scaffApplies(r), solar = r.kind === 'solar' || r.kind === 'unknown', octo = sc && r.v.octo;
                const panels = solar ? num(val(r.v.panels)) : NA;
                const sides = !sc ? NA : octo ? 'Octopus' : num(val(r.v.sides));
                const pvf = !sc ? NA : octo ? 0 : num(val(r.v.pvf));
                const R = RATES.receive, P = RATES.pay;
                const scaffRecv = !sc ? NA : octo ? 0 : (R.scaffold[r.v.sides] ?? MISSING);
                const labour = r.kind === 'battery' ? P.battery
                    : r.kind === 'aftercare' ? (blank(r.v.hours) ? MISSING : Number(r.v.hours) * P.aftercarePerHour)
                    : typeof panels === 'number' ? (band(P.solar, panels)?.amt ?? MISSING) : MISSING;
                const labourRecv = r.kind === 'battery' ? R.battery : r.kind === 'aftercare' ? R.aftercare
                    : typeof panels === 'number' ? (band(R.solar, panels)?.amt ?? MISSING) : MISSING;
                return [
                    r.jn, xlDate(r.date), val(r.prof.jobType), val(r.prof.engineer), val(r.prof.postcode), val(r.status),
                    sides, pvf, scaffRecv,
                    !sc ? NA : octo ? 'Arranged by Octopus' : isoDate(r.v.erect),
                    !cableApplies(r) ? NA : r.v.cableOrdered ? 'Yes' : MISSING,
                    !cableApplies(r) ? NA : num(val(r.v.edm)),
                    r.kind === 'aftercare' ? NA : R.consumables[r.kind] ?? R.consumables.solar,
                    r.kind === 'aftercare' && blank(r.v.system) ? NA : val(r.v.system),
                    solar ? num(val(r.v.arrays)) : NA,
                    panels, labour, labourRecv
                ];
            });
                const wb = new ExcelJS.Workbook(), ws = wb.addWorksheet('Jobs', { views: [{ state: 'frozen', ySplit: 1 }] });
                const heads = ['Job Number', 'Date', 'Job Type', 'Engineer', 'Postcode', 'Job Status', 'Scaffolding Number of Sides', 'PVF Scaffold Cost (£)', 'We Receive Scaffolding (£)', 'Scaffold Erection Date',
                               'Cable Ordered from Edmundsons', 'Edmundson Cost (£)', 'We Receive Consumables (£)', 'Job System', 'Jobs Number of Arrays', 'Number of Panels',
                               'Crew Labour (£)', 'We Receive Labour (£)',
                               'Total We Pay (£)', 'Total We Receive (£)', 'Profit (£)', 'Margin %', 'Figures Check'];
                const MONEY_COLS = [7, 8, 11, 12, 16, 17], GREEN_COLS = [8, 12, 17, 19], BLUE_COLS = [20, 21];   // green = money we receive
                const PAY_COLS = [7, 11, 16], RECV_COLS = [8, 12, 17];
                const L = i => String.fromCharCode(65 + i);   // column index -> letter (A–W)
                ws.columns = heads.map((h, i) => ({ header: h, width: [14, 12, 28, 22, 11, 16, 14, 14, 15, 18, 16, 14, 15, 26, 12, 12, 14, 15, 15, 15, 14, 11, 16][i] }));
                const GBP = '"£"#,##0.00;[Red]-"£"#,##0.00';
                const head = ws.getRow(1);
                head.font = { bold: true, color: { argb: 'FFFFFFFF' } };
                head.alignment = { vertical: 'middle', wrapText: true };
                head.height = 32;
                head.eachCell((cell, col) => cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: GREEN_COLS.includes(col - 1) ? 'FF15803D' : BLUE_COLS.includes(col - 1) ? 'FF1D4ED8' : 'FF1F2937' } });
                let missingCount = 0;
                const colTotals = {};   // column index -> running total, for the totals row
                const tally = (i, v) => { if (typeof v === 'number') colTotals[i] = (colTotals[i] || 0) + v; };
                xrows.forEach(r => {
                    const row = ws.addRow(r.map(v => v === MISSING ? 'Missing' : v === NA ? 'N/A' : v));
                    r.forEach((v, i) => {
                        const cell = row.getCell(i + 1);
                        if (v instanceof Date) cell.numFmt = 'dd/mm/yyyy';
                        if (typeof v === 'number' && MONEY_COLS.includes(i)) cell.numFmt = '"£"#,##0.00';
                        if (v === MISSING) { missingCount++;
                            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFF0000' } };
                            cell.font = { bold: true, color: { argb: 'FFFFFFFF' } }; }
                        if (v === NA) cell.font = { color: { argb: 'FF9CA3AF' } };
                        cell.alignment = { horizontal: i === 0 || i === 2 || i === 3 || i === 13 ? 'left' : 'center' };
                    });
                    // Totals for this job, as live Excel formulas (text like Missing / N/A counts as nothing)
                    const n = row.number, add = cols => cols.reduce((t, i) => t + (typeof r[i] === 'number' ? r[i] : 0), 0);
                    const pay = add(PAY_COLS), recv = add(RECV_COLS), gaps = MONEY_COLS.filter(i => r[i] === MISSING).length;
                    MONEY_COLS.forEach(i => tally(i, r[i])); tally(18, pay); tally(19, recv); tally(20, recv - pay);
                    const sumF = cols => 'SUM(' + cols.map(i => L(i) + n).join(',') + ')';
                    row.getCell(19).value = { formula: sumF(PAY_COLS), result: pay };
                    row.getCell(20).value = { formula: sumF(RECV_COLS), result: recv };
                    row.getCell(21).value = { formula: `T${n}-S${n}`, result: recv - pay };
                    row.getCell(22).value = { formula: `IF(T${n}=0,"",U${n}/T${n})`, result: recv ? (recv - pay) / recv : '' };
                    row.getCell(23).value = gaps ? `Incomplete (${gaps} missing)` : 'Complete';
                    [19, 20, 21].forEach(c => row.getCell(c).numFmt = GBP);
                    row.getCell(22).numFmt = '0.0%';
                    for (let c = 19; c <= 23; c++) row.getCell(c).alignment = { horizontal: 'center' };
                    if (gaps) row.getCell(23).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFDE68A' } };
                });
                ws.autoFilter = { from: 'A1', to: { row: 1, column: heads.length } };

                // Totals row (after a blank row so the filter leaves it alone). SUBTOTAL ignores filtered-out rows,
                // so filtering e.g. Job Status to hide Cancelled updates the totals.
                const last = xrows.length + 1, tr = ws.getRow(last + 2);
                tr.getCell(1).value = 'TOTALS';
                tr.getCell(2).value = { formula: `SUBTOTAL(103,A2:A${last})&" jobs"`, result: xrows.length + ' jobs' };
                [...MONEY_COLS, 18, 19, 20].forEach(i => {
                    const c = tr.getCell(i + 1), col = L(i);
                    c.value = { formula: `SUBTOTAL(109,${col}2:${col}${last})`, result: colTotals[i] || 0 };
                    c.numFmt = GBP;
                });
                tr.getCell(22).value = { formula: `IF(T${last + 2}=0,"",U${last + 2}/T${last + 2})`, result: colTotals[19] ? colTotals[20] / colTotals[19] : '' };
                tr.getCell(22).numFmt = '0.0%';
                tr.font = { bold: true };
                tr.eachCell(c => { c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE5E7EB' } }; c.alignment = { horizontal: 'center' }; });
                wb.calcProperties = { fullCalcOnLoad: true };
            const buf = await wb.xlsx.writeBuffer();
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
            a.download = `Pingu-summary_wc_${loadedWeek}.xlsx`;
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 10000);
            toast(`Exported ${xrows.length} jobs` + (dirtyCount() ? ' (includes changes not saved yet)' : ''));
        } catch (e) {
            console.error('Export failed', e);
            toast('Export failed: ' + e.message, true);
        } finally { btn.disabled = false; }
    };

    // ── Start ───────────────────────────────────────────────────────────
    let unlocked = false;
    try { unlocked = sessionStorage.getItem(PIN_KEY) === '1'; } catch {}
    if (unlocked) openPage(); else setTimeout(() => $('gate-pin').focus(), 50);
</script>
</body>
</html>
