<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey report | Pingu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* ═══ Pingu design system — base (copy verbatim into each page's <style>) ═══ */
        :root {
            /* Brand + status palette */
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --secondary: #FFC857;
            --accent: #00D9FF;
            --dark: #1A1A2E;
            --dark-light: #252541;
            --dark-lighter: #2F2F4A;
            --text: #EAEAEA;
            --text-dim: #9A9AB0;
            --success: #4ECCA3;
            --error: #FF6B6B;
            --warning: #FFC857;
            --in-progress: #00D9FF;
            --complete: #4ECCA3;
            --aborted: #FF6B6B;
            --cancelled: #9A9AB0;
            --short-notice: #90ee90;
            --on-hold: #FFDE00;
            --scheduled: #FF6B35;
            /* Surfaces & type */
            --bg: #161628;
            --surface: #1F1F35;
            --surface-2: #252541;
            --line: rgba(255,255,255,0.07);
            --line-2: rgba(255,255,255,0.12);
            --text-strong: #F4F4F8;
            --text-soft: #C8C8D6;
            --radius: 10px;
            --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: var(--font); font-size: 14px; line-height: 1.5;
            background: var(--bg); color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        button, input, select, textarea { font-family: inherit; }
        a { color: var(--accent); }
        .ico { width: 16px; height: 16px; flex: 0 0 auto; vertical-align: -3px; }
        .ico-lg { width: 20px; height: 20px; flex: 0 0 auto; }

        /* ── App bar + Pingu wordmark ── */
        .appbar {
            position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            height: 64px; padding: 0 28px;
            background: rgba(22, 22, 40, 0.92);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line);
        }
        .appbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .logo { display: inline-flex; align-items: center; text-decoration: none; }
        .wordmark {
            font-family: 'Inter', var(--font); font-weight: 800; font-size: 28px;
            letter-spacing: -0.045em; line-height: 1; color: var(--text-strong); padding-top: 6px;
        }
        .i-stem { position: relative; display: inline-block; }
        .i-paw {
            position: absolute; left: 50%; top: -0.17em; transform: translateX(-50%) rotate(-10deg);
            width: 0.5em; height: 0.5em; fill: var(--primary);
            filter: drop-shadow(0 1px 4px rgba(255,107,53,0.35));
            transition: transform .2s ease;
        }
        .logo:hover .i-paw { transform: translateX(-50%) rotate(4deg) scale(1.08); }
        .logo:hover .wordmark { color: #fff; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-soft); text-decoration: none; font-size: 13px; font-weight: 500;
            padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; cursor: pointer;
            transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .back-btn:hover { background: var(--surface-2); color: var(--text-strong); border-color: rgba(255,255,255,0.2); }

        /* ── Page layout ── */
        .container { padding: 24px 28px 40px; }
        .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
        h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-strong); line-height: 1.2; }
        h2 { font-size: 16px; font-weight: 600; color: var(--text-strong); letter-spacing: -0.01em; }
        h3 { font-size: 14px; font-weight: 600; color: var(--text-strong); }
        .muted { color: var(--text-dim); }
        .toolbar { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }

        /* ── Panels / cards ── */
        .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
        .panel + .panel { margin-top: 16px; }
        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -2px 0 14px; }
        .panel-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--text-strong); }
        .panel-title .ico { color: var(--primary); }

        /* ── Form controls ── */
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-label { color: var(--text-dim); font-size: 11.5px; font-weight: 500; }
        .control-input {
            height: 38px; background: var(--surface); border: 1px solid var(--line-2);
            color: var(--text-strong); padding: 0 12px; border-radius: 8px; font-size: 13.5px; width: 100%;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        textarea.control-input { height: auto; min-height: 84px; padding: 9px 11px; resize: vertical; }
        .control-input:hover { border-color: rgba(255,255,255,0.2); }
        .control-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.22); }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); cursor: pointer; }
        input[type="checkbox"], input[type="radio"] { accent-color: var(--primary); }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 7px;
            height: 38px; padding: 0 16px; border-radius: 8px; cursor: pointer;
            font-size: 13.5px; font-weight: 600; text-decoration: none; white-space: nowrap;
            border: 1px solid transparent; transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--surface-2); color: var(--text-strong); border-color: var(--line-2); }
        .btn-secondary:hover { background: var(--dark-lighter); border-color: rgba(255,255,255,0.25); }
        .btn-ghost { background: transparent; color: var(--text-soft); border-color: var(--line-2); }
        .btn-ghost:hover { background: var(--surface-2); color: var(--text-strong); }
        .btn-danger { background: rgba(255,107,107,0.12); color: #FF8A8A; border-color: rgba(255,107,107,0.4); }
        .btn-danger:hover { background: rgba(255,107,107,0.22); }
        .btn-success { background: rgba(78,204,163,0.14); color: var(--success); border-color: rgba(78,204,163,0.45); }
        .btn-success:hover { background: rgba(78,204,163,0.24); }
        .btn-sm { height: 32px; padding: 0 12px; font-size: 12.5px; }
        .btn:disabled, button:disabled { opacity: .45; cursor: not-allowed; }
        .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; height: 38px; }
        .seg button { background: var(--surface); color: var(--text-soft); border: 0; padding: 0 12px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .seg button + button { border-left: 1px solid var(--line-2); }
        .seg button:hover, .seg button.active { background: var(--surface-2); color: var(--text-strong); }

        /* ── KPI tiles ── */
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
        .stat-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; }
        .stat-label { display: flex; align-items: center; gap: 7px; color: var(--text-dim); font-size: 12px; font-weight: 500; white-space: nowrap; }
        .stat-label .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
        .stat-value { font-size: 22px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.02em; line-height: 1.25; margin-top: 2px; font-variant-numeric: tabular-nums; }

        /* ── Tables ── */
        .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
        thead th {
            position: sticky; top: 0; z-index: 2; background: var(--surface);
            text-align: left; padding: 10px 14px; font-size: 11.5px; font-weight: 600; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--line-2); white-space: nowrap;
        }
        tbody td { padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--text-soft); vertical-align: middle; }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover td { background: rgba(255,255,255,0.025); }
        td.strong, .cell-strong { color: var(--text-strong); font-weight: 600; }
        .mono { font-family: var(--mono); font-size: 12.5px; }

        /* ── Badges / status pills ── */
        .badge {
            --c: var(--text-dim);
            display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
            padding: 2px 9px; border-radius: 999px; color: var(--text-strong);
            background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
        }
        .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
        .badge.plain::before { display: none; }
        .tag { font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 4px; background: rgba(255,255,255,0.1); color: var(--text-soft); letter-spacing: .03em; }

        /* ── Notices ── */
        .notice { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 13px;
                  background: rgba(255,255,255,0.03); border: 1px solid var(--line-2); color: var(--text-soft); }
        .notice .ico { margin-top: 1px; }
        .notice.info    { border-color: rgba(0,217,255,0.35);  background: rgba(0,217,255,0.06); }
        .notice.success { border-color: rgba(78,204,163,0.4);  background: rgba(78,204,163,0.07); color: var(--success); }
        .notice.warning { border-color: rgba(255,200,87,0.4);  background: rgba(255,200,87,0.07); color: var(--warning); }
        .notice.error   { border-color: rgba(255,107,107,0.45); background: rgba(255,107,107,0.08); color: #FF8A8A; }

        /* ── Modals ── */
        .modal { display: none; position: fixed; inset: 0; background: rgba(10,10,22,0.72); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
        .modal.show, .modal.active, .modal.open { display: flex; }
        .modal-content { background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; width: 100%; max-width: 680px; max-height: 88vh; overflow-y: auto; box-shadow: 0 30px 80px -20px rgba(0,0,0,0.75); }
        .modal-header { position: sticky; top: 0; z-index: 2; background: var(--surface); display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
        .modal-title { font-size: 17px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.01em; }
        .modal-body { padding: 18px 20px 22px; }
        .close-btn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; border-radius: 8px; color: var(--text-dim); cursor: pointer; font-size: 20px; line-height: 1; }
        .close-btn:hover { background: var(--surface-2); color: var(--text-strong); }

        /* ── Feedback ── */
        .toast { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: none; max-width: 420px; padding: 12px 16px 12px 14px; border-radius: 10px;
                 background: #26263F; color: var(--text-strong); font-size: 13.5px; border: 1px solid var(--line-2); border-left: 3px solid var(--success);
                 box-shadow: 0 16px 40px -12px rgba(0,0,0,0.7); }
        .toast.show { display: block; }
        .toast.error { border-left-color: var(--error); }
        .empty-state, .loading { text-align: center; padding: 56px 16px; color: var(--text-dim); }
        .empty-state h3 { color: var(--text-strong); font-size: 16px; margin-bottom: 4px; }
        .empty-state .ico-lg { width: 32px; height: 32px; color: var(--text-dim); margin-bottom: 10px; }
        .spinner { width: 22px; height: 22px; border: 2px solid var(--line-2); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        *::-webkit-scrollbar { width: 10px; height: 10px; }
        *::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
        *::-webkit-scrollbar-track { background: transparent; }
        @media (max-width: 768px) {
            .appbar, .container { padding-left: 14px; padding-right: 14px; }
            .wordmark { font-size: 24px; }
        }
        /* ═══ end base ═══ */

        /* ── Page: survey report ── */
        :root { --kf: #B57BFF; --ripper: #FF6B35; }

        .share-pill { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 500; color: var(--text-soft);
                      padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line-2); }
        .share-pill .ico { width: 14px; height: 14px; color: var(--text-dim); }

        /* States */
        .state { text-align: center; padding: 72px 16px; color: var(--text-dim); }
        .state .icon { margin-bottom: 12px; }
        .state .icon .ico { width: 32px; height: 32px; }
        .state h2 { font-size: 18px; color: var(--text-strong); margin-bottom: 4px; }
        #state-error .icon { color: var(--error); }

        /* Hero */
        .hero { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
        .hero-top { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
        .hero-title { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-strong); line-height: 1.2; }
        .hero-title span { font-family: var(--mono); font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
        .type-badge { --c: var(--accent); display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
                      color: var(--text-strong); background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); }
        .type-badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
        .badge-bo  { --c: var(--accent); }
        .badge-bas { --c: var(--secondary); }
        .hero-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
        .hero-item { display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; }
        .hero-lbl { font-size: 12px; color: var(--text-dim); font-weight: 500; }
        .hero-val { font-size: 14px; color: var(--text-strong); font-weight: 600; word-break: break-word; }

        /* Sections (collapsible panels) */
        .section { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
        .section-hdr { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; cursor: pointer; user-select: none; transition: background .15s ease; }
        .section-hdr:hover { background: rgba(255,255,255,0.02); }
        .section-hdr-left { display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1; flex-wrap: wrap; }
        .section-hdr-left > .ico { color: var(--primary); }
        .section-title-text { font-size: 15px; font-weight: 600; color: var(--text-strong); }
        .section-chevron { color: var(--text-dim); display: inline-flex; transition: transform .2s ease; }
        .section.open .section-chevron { transform: rotate(180deg); }
        .section-body { display: none; border-top: 1px solid var(--line); }
        .section.open .section-body { display: block; }
        .section-inner { padding: 16px 20px 20px; }

        /* Fields */
        .fields-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px 20px; margin-bottom: 4px; }
        .field { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        .field-lbl { font-size: 12px; color: var(--text-dim); font-weight: 500; }
        .field-val { font-size: 14px; color: var(--text-strong); font-weight: 500; word-break: break-word; }
        .field-val .missing { color: var(--text-dim); font-style: italic; font-weight: 400; font-size: 13px; }
        .val-yes, .val-no, .val-na { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; color: var(--text-strong); }
        .val-yes::before, .val-no::before, .val-na::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
        .val-yes { --c: var(--complete); }
        .val-no  { --c: var(--aborted); }
        .val-na  { --c: var(--cancelled); }
        .val-yes, .val-no, .val-na { background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); }

        /* Photos */
        .photo-group { margin-top: 18px; }
        .photo-group-lbl { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; color: var(--text-soft); margin-bottom: 8px; }
        .photo-group-lbl .ico { width: 14px; height: 14px; color: var(--text-dim); }
        .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
        .photo-wrap { aspect-ratio: 1; border-radius: 8px; overflow: hidden; border: 1px solid var(--line-2); cursor: pointer; position: relative; background: var(--surface-2); transition: border-color .15s ease; }
        .photo-wrap:hover { border-color: var(--primary); }
        .photo-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .photo-wrap .photo-num { position: absolute; bottom: 4px; right: 4px; font-size: 10.5px; font-weight: 600; color: #fff; background: rgba(0,0,0,0.6); padding: 1px 6px; border-radius: 4px; }

        /* Materials */
        .materials-list { display: flex; flex-direction: column; gap: 6px; }
        .material-item { background: var(--bg); border: 1px solid var(--line); border-left: 3px solid var(--kf); border-radius: 8px; padding: 8px 12px; font-size: 13.5px; color: var(--text-strong); }
        .no-materials { color: var(--text-dim); font-style: italic; font-size: 13px; }

        /* Sign-off */
        .signoff-box { background: rgba(78,204,163,0.07); border: 1px solid rgba(78,204,163,0.35); border-radius: 10px; padding: 12px 16px; display: flex; gap: 32px; flex-wrap: wrap; }
        .signoff-item { display: flex; flex-direction: column; gap: 2px; }
        .signoff-lbl { font-size: 12px; color: var(--success); font-weight: 500; }
        .signoff-val { font-size: 14px; color: var(--text-strong); font-weight: 600; }

        /* Picklist */
        .pl-section-label { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; margin: 20px 0 8px; }
        .pl-section-label .ico { width: 14px; height: 14px; color: var(--primary); }
        .pl-section-label:first-child { margin-top: 0; }
        .pl-specs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin-bottom: 4px; }
        .pl-spec-card { background: var(--bg); border: 1px solid var(--line); border-left: 3px solid rgba(0,217,255,0.5); border-radius: 8px; padding: 9px 12px; }
        .pl-spec-card.no-val { opacity: .45; border-left-color: var(--line-2); }
        .pl-spec-card.cost-saving { border-left-color: var(--success); }
        .pl-spec-lbl { font-size: 12px; color: var(--text-dim); font-weight: 500; margin-bottom: 2px; }
        .pl-spec-note { font-size: 11px; color: var(--text-dim); font-style: italic; font-weight: 400; }
        .pl-spec-val { font-size: 14px; color: var(--text-strong); font-weight: 600; }
        .pl-spec-val.empty { font-style: italic; color: var(--text-dim); font-size: 13px; font-weight: 400; }
        .pl-spec-unit { font-size: 11.5px; color: var(--text-dim); margin-left: 3px; font-weight: 500; }

        .pl-roof-wrap, .pl-kf-wrap { margin-top: 18px; padding: 14px 16px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
        .pl-roof-header, .pl-kf-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .pl-roof-title, .pl-kf-title { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--text-strong); }
        .pl-roof-title .ico { color: var(--accent); }
        .pl-kf-title .ico { color: var(--kf); }
        .pl-legend { display: flex; gap: 14px; flex-wrap: wrap; }
        .pl-legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); }
        .pl-swatch { width: 18px; height: 12px; border-radius: 3px; display: inline-block; flex: 0 0 auto; }
        .pl-swatch.p { background: var(--primary); }
        .pl-swatch.l { background: var(--accent); width: 24px; }
        .pl-swatch.e { background: transparent; border: 1px dashed var(--line-2); }
        .pl-roof-grid-wrap { overflow-x: auto; padding-bottom: 4px; }
        .pl-roof-grid { display: inline-grid; gap: 3px; padding: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-width: 100%; }
        .pl-cell { width: 24px; height: 24px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9.5px; font-weight: 700; cursor: default; }
        .pl-cell.e { background: rgba(255,255,255,0.02); border: 1px dashed rgba(255,255,255,0.08); }
        .pl-cell.p { background: var(--primary); color: #fff; }
        .pl-cell.l { background: var(--accent); color: #062633; }
        .pl-roof-stats { display: flex; gap: 18px; margin-top: 10px; flex-wrap: wrap; }
        .pl-roof-stat { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-dim); }
        .pl-roof-stat strong { color: var(--text-strong); }

        .pl-kf-count { font-size: 12px; font-weight: 600; color: var(--text-soft); background: rgba(181,123,255,0.12); border: 1px solid rgba(181,123,255,0.35); padding: 2px 9px; border-radius: 999px; }
        .pl-kf-table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
        .pl-kf-table thead th { position: static; }
        .pl-kf-part { font-family: var(--mono); color: var(--text-strong); font-size: 12.5px; }
        .pl-kf-qty { display: inline-block; background: rgba(181,123,255,0.14); color: var(--text-strong); border: 1px solid rgba(181,123,255,0.35); padding: 1px 7px; border-radius: 5px; font-weight: 700; font-size: 12.5px; font-variant-numeric: tabular-nums; }
        .pl-kf-total td { border-top: 1px solid var(--line-2); color: var(--text-dim); font-size: 12.5px; }

        .pl-saved-pill, .ripper-saved-pill { font-size: 12px; color: var(--text-dim); font-weight: 500; margin-left: auto; }
        .pl-no-data { display: flex; align-items: center; gap: 9px; padding: 12px 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; color: var(--text-dim); font-size: 13px; }
        .pl-no-data .ico { color: var(--text-dim); }

        /* PDF ripper */
        .ripper-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
        .ripper-img-card { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
        .ripper-img-card-label { display: flex; align-items: center; gap: 7px; padding: 9px 14px; font-size: 12.5px; font-weight: 600; color: var(--text-soft); border-bottom: 1px solid var(--line); }
        .ripper-img-card-label .ico { width: 14px; height: 14px; color: var(--primary); }
        .ripper-img-card img { width: 100%; display: block; cursor: pointer; max-height: 360px; object-fit: contain; background: rgba(0,0,0,0.2); }
        .ripper-img-placeholder { padding: 32px 16px; text-align: center; color: var(--text-dim); font-size: 13px; font-style: italic; }
        .ripper-address-card { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin-bottom: 14px; }
        .ripper-address-label { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-dim); font-weight: 500; margin-bottom: 4px; }
        .ripper-address-label .ico { width: 14px; height: 14px; }
        .ripper-address-val { font-size: 15px; color: var(--text-strong); font-weight: 500; line-height: 1.6; }
        .ripper-meta-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        .ripper-meta-chip { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--text-strong); background: rgba(255,107,53,0.12); border: 1px solid rgba(255,107,53,0.35); padding: 2px 9px; border-radius: 999px; }
        .ripper-text-lbl { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-dim); font-weight: 500; margin-bottom: 6px; }
        .ripper-text-lbl .ico { width: 14px; height: 14px; }
        .ripper-text { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; font-size: 13px; white-space: pre-wrap; color: var(--text-soft); max-height: 300px; overflow-y: auto; }

        .footer { text-align: center; padding: 24px 0 8px; color: var(--text-dim); font-size: 12px; }

        /* Lightbox */
        .lightbox { position: fixed; inset: 0; background: rgba(10,10,22,0.94); z-index: 9000; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
        .lightbox.show { display: flex; }
        .lightbox img { max-width: 94vw; max-height: 78vh; border-radius: 10px; object-fit: contain; }
        .lb-nav { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
        .lb-btn { height: 38px; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2); border: 1px solid var(--line-2); color: var(--text-strong);
                  border-radius: 8px; font-size: 13.5px; font-weight: 600; cursor: pointer; transition: background .15s ease; }
        .lb-btn:hover { background: var(--dark-lighter); }
        .lb-counter { color: var(--text-soft); font-size: 13px; min-width: 60px; text-align: center; font-variant-numeric: tabular-nums; }
        .lb-close { position: absolute; top: 14px; right: 14px; width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center;
                    background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 8px; color: var(--text-strong); cursor: pointer; }
        .lb-close:hover { background: var(--dark-lighter); }
        .lb-close .ico { width: 20px; height: 20px; }
        .lb-label { color: var(--text-soft); font-size: 12.5px; margin-top: 8px; }

        @media (max-width: 768px) {
            .hero { padding: 16px; }
            .hero-title { font-size: 22px; }
            .hero-title span { font-size: 19px; }
            .hero-grid { grid-template-columns: 1fr 1fr; }
            .section-hdr { padding: 13px 14px; }
            .section-inner { padding: 14px; }
            .fields-grid { grid-template-columns: 1fr 1fr; gap: 12px 14px; }
            .photo-grid { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); }
            .pl-specs-grid { grid-template-columns: 1fr 1fr; }
            .ripper-grid { grid-template-columns: 1fr; }
            .share-pill span { display: none; }
        }
        @media (max-width: 420px) {
            .hero-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

const ICON = name => `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;

// ── Lightbox state ─────────────────────────────────────────────────────────
let allPhotos = []; // [{url, label}]
let lbIndex   = 0;

// ── Spec definitions matching the picklist generator ──────────────────────
const SPECS = {

        {label:'Enphase Pedestal',  col:'AO', row:17},

        {label:'DC Expansion',      col:'AO', row:21, note:'Tesla'},

};
const MOUNT_CHECK = [
    {label:'# Portrait Panels',        col:'I',  row:23},
    {label:'# Landscape Panels',       col:'I',  row:24},
    {label:'Total Panels',             col:'I',  row:25},

];

// ── Load ───────────────────────────────────────────────────────────────────
async function load() {
    const params = new URLSearchParams(window.location.search);
    const id     = params.get('id');
    if (!id) { showError(); return; }

    try {
        const surveySnap = await getDoc(doc(db, 'site-surveys', id));
        if (!surveySnap.exists()) { showError(); return; }

        const survey = { _id: surveySnap.id, ...surveySnap.data() };

        let picklistData = null;
        let jobData      = null;
        const promises   = [];

        if (survey.jobNumber) {
            // Picklist
            promises.push(
                getDocs(query(
                    collection(db, 'picklists'),
                    where('jobNumber', '==', survey.jobNumber),
                    orderBy('savedAt', 'desc'),
                    limit(1)
                )).then(snap => { if (!snap.empty) picklistData = snap.docs[0].data(); })
                  .catch(e => console.warn('Picklist load failed:', e))
            );
            // Job record (holds pdfRipper data)
            promises.push(
                getDocs(query(
                    collection(db, 'Solar-jobs'),
                    where('Job Number', '==', survey.jobNumber)
                )).then(snap => { if (!snap.empty) { const withRip = snap.docs.find(d => d.data().pdfRipper); jobData = (withRip || snap.docs[0]).data(); } })
                  .catch(e => console.warn('Job record load failed:', e))
            );
        }

        await Promise.all(promises);
        render(survey, picklistData, jobData);

    } catch(e) {
        console.error(e);
        showError();
    }
}

function showError() {
    document.getElementById('state-loading').style.display = 'none';
    document.getElementById('state-error').style.display   = 'block';
}

// ── Main render ────────────────────────────────────────────────────────────
function render(s, picklist, jobData) {
    document.getElementById('state-loading').style.display  = 'none';
    document.getElementById('survey-content').style.display = 'block';

    const sec       = s.sections || {};
    const sd        = sec.surveyDetails || {};
    const type      = s.surveyType || 'unknown';
    const typeLabel = type === 'battery-only' ? 'Battery Only'
                    : type === 'battery-and-solar' ? 'Battery & Solar' : 'Unknown';
    const badgeCls  = type === 'battery-only' ? 'badge-bo' : 'badge-bas';

    document.title = `Survey — Job #${s.jobNumber || '—'} | Pingu`;

    // Hero
    document.getElementById('hero-wrap').innerHTML = `
    <div class="hero">
        <div class="hero-top">
            <div>
                <div class="hero-title">Job <span>#${esc(s.jobNumber || '—')}</span></div>
                <div class="muted" style="font-size:13px;margin-top:2px">Site survey report</div>
            </div>
            <span class="type-badge ${badgeCls}">${typeLabel}</span>
        </div>
        <div class="hero-grid">
            ${hItem('Submitted',       fmtDatetime(s.submittedAt))}
            ${hItem('Surveyor',        sd.surveyor || '—')}
            ${hItem('Conducted On',    fmtDatetime(sd.conductedOn || ''))}
            ${hItem('Customer Present',sd.customerPresent || '—')}
            ${hItem('Risk Assessment', sec.riskAssessment?.riskAssessmentDone || '—')}
        </div>
    </div>`;

    // ── Build survey sections, keeping sign-off separate ──────────────────
    allPhotos = [];
    const wrap = document.getElementById('sections-wrap');

    const { mainSections, signoffSection } = buildSections(s, sec, type);
    const ripperData = jobData?.pdfRipper || null;

    // Render: main sections → PDF Ripper → sign-off (if present)
    const parts = [
        ...mainSections.map((sec, i) => buildSectionEl(sec, i)),
        buildRipperSection(ripperData, mainSections.length),
        ...(signoffSection ? [buildSectionEl(signoffSection, mainSections.length + 1)] : [])
    ];

    wrap.innerHTML = parts.join('');

    wrap.querySelectorAll('.section-hdr').forEach(hdr =>
        hdr.addEventListener('click', () => hdr.closest('.section').classList.toggle('open'))
    );
    const first = wrap.querySelector('.section');
    if (first) first.classList.add('open');

    // Picklist section
    document.getElementById('picklist-wrap').innerHTML = buildPicklistSection(picklist);
    document.querySelectorAll('#picklist-wrap .section-hdr').forEach(hdr =>
        hdr.addEventListener('click', () => hdr.closest('.section').classList.toggle('open'))
    );
}

function hItem(label, val) {
    return `<div class="hero-item">
        <div class="hero-lbl">${label}</div>
        <div class="hero-val">${esc(val)}</div>
    </div>`;
}

// ── Survey sections ────────────────────────────────────────────────────────
// Returns { mainSections, signoffSection } so render() can inject ripper between them
function buildSections(s, sec, type) {
    const el = sec.electricalSystem || {};
    const am = sec.additionalMaterials || [];
    const mainSections = [];

    mainSections.push({
        icon:'zap', title:'Electrical System',
        fields:[
            {l:'Meter Position',         v:el.meterPosition},
            {l:'Meter Work Needed',      v:el.meterWorkNeeded},
            {l:'Meter Work Details',     v:el.meterWorkDetails,        skip:!el.meterWorkDetails},
            {l:'Fuse Rating',            v:el.fuseRating},
            {l:'Earthing System',        v:el.earthingSystem},
            {l:'Gas Bonded',             v:el.gasBonded,               radio:true},
            {l:'Gas Bonding Equipment',  v:el.gasBondingEquipment,     skip:!el.gasBondingEquipment},
            {l:'Water Bonded',           v:el.waterBonded,             radio:true},
            {l:'Water Bonding Equipment',v:el.waterBondingEquipment,   skip:!el.waterBondingEquipment},
            {l:'Cable Run',              v:el.cableRun},
            {l:'Cable Run Length',       v:el.cableRunLength != null ? el.cableRunLength + ' m' : null},
            {l:'Battery Location',       v:el.batteryLocation},
            {l:'Surface Type',           v:el.surfaceType},
            {l:'Dimensions W/D/L',       v:`${el.batteryWidth||0} / ${el.batteryDepth||0} / ${el.batteryLength||0} mm`},
            {l:'Render / Cladding',      v:el.renderCladding},
            {l:'WiFi Signal',            v:el.wifiSignal},
        ],
        photos:[
            {label:'Meter Position',   urls:el.meterPositionPhotos},
            {label:'Meter Work',       urls:el.meterWorkPhotos},
            {label:'Earthing System',  urls:el.earthingSystemPhotos},
            {label:'Gas Bonded',       urls:el.gasBondedPhotos},
            {label:'Water Bonded',     urls:el.waterBondedPhotos},
            {label:'Cable Run',        urls:el.cableRunPhotos},
            {label:'Battery Location', urls:el.batteryLocationPhotos},
            {label:'Surface',          urls:el.surfacePhotos},
        ]
    });

    if (type === 'battery-and-solar') {
        const pi = sec.propertyInternal || {};
        const pe = sec.propertyExternal || {};
        const sc = sec.scaffolding      || {};

        mainSections.push({
            icon:'home', title:'Property — Internal',
            fields:[
                {l:'Loft Accessible',  v:pi.loftAccessible,  radio:true},
                {l:'Loft Ladder',      v:pi.loftLadder,      radio:true},
                {l:'Loft Boarded',     v:pi.loftBoarded,     radio:true},
                {l:'Asbestos',         v:pi.asbestos,         radio:true},
                {l:'Rafter W/D mm',    v:`${pi.rafterWidth||0} / ${pi.rafterDepth||0}`},
                {l:'Web W/D/L mm',     v:`${pi.webWidth||0} / ${pi.webDepth||0} / ${pi.webLength||0}`},
                {l:'Truss Spacing mm', v:pi.trussSpacing},
                {l:'Deflection',       v:pi.deflection,       radio:true},
                {l:'Rot / Damage',     v:pi.rotDamage,        radio:true},
                {l:'Roof Concern',     v:pi.roofConcern,      radio:true},
                {l:'Dwarf Walls',      v:pi.dwarfWalls,       radio:true},
                {l:'Structural Work',  v:pi.structuralWork,   radio:true},
            ],
            photos:[
                {label:'Loft Access',     urls:pi.loftAccessiblePhotos},
                {label:'Asbestos',        urls:pi.asbestosPhotos},
                {label:'Loft Space',      urls:pi.loftSpacePhotos},
                {label:'Deflection',      urls:pi.deflectionPhotos},
                {label:'Rot / Damage',    urls:pi.rotDamagePhotos},
                {label:'Roof Concern',    urls:pi.roofConcernPhotos},
                {label:'Dwarf Walls',     urls:pi.dwarfWallsPhotos},
                {label:'Structural Work', urls:pi.structuralWorkPhotos},
            ]
        });

        mainSections.push({
            icon:'building', title:'Property — External',
            fields:[
                {l:'Proposed Design Fits', v:pe.proposedDesignFit,            radio:true},
                {l:'Design Reason',        v:pe.proposedDesignReasonWhyNot,   skip:!pe.proposedDesignReasonWhyNot},
                {l:'Roof Covering',        v:pe.roofCovering},
                {l:'No. of Stories',       v:pe.numberStories},
                {l:'Roof Condition',       v:pe.roofCondition},
                {l:'Roof Work Age',        v:pe.roofWorkAge != null ? pe.roofWorkAge + ' yrs ago' : null},
                {l:'Roof Obstructions',    v:pe.roofObstructions,             radio:true},
                {l:'Obstruction Detail',   v:pe.obstructionsDescription,      skip:!pe.obstructionsDescription},
                {l:'Shading',              v:pe.roofShading,                  radio:true},
                {l:'Additional Notes',     v:pe.additionalNotesProperty,      skip:!pe.additionalNotesProperty},
            ],
            photos:[
                {label:'Property',      urls:pe.propertyPhotos},
                {label:'Roof Covering', urls:pe.roofCoveringPhotos},
                {label:'Roof Condition',urls:pe.roofConditionPhotos},
                {label:'Obstructions',  urls:pe.obstructionsPhotos},
                {label:'Shading',       urls:pe.shadingPhotos},
            ]
        });

        mainSections.push({
            icon:'wrench', title:'Scaffolding',
            fields:[
                {l:'Access Type',         v:sc.accessType},
                {l:'Parking Available',   v:sc.parkingAvailable,              radio:true},
                {l:'Overhead Powerlines', v:sc.overheadPowerlines,            radio:true},
                {l:'On Pavement/Highway', v:sc.propertyOnPavement,            radio:true},
                {l:'Ground Type',         v:sc.groundType},
                {l:'Access Issues',       v:sc.accessIssues},
                {l:'Gutter Obstacles',    v:sc.gutterObstacles,               radio:true},
                {l:'Obstacle Detail',     v:sc.gutterObstaclesDescription,    skip:!sc.gutterObstaclesDescription},
                {l:'Lower Roofs',         v:sc.lowerRoofs,                    skip:!sc.lowerRoofs},
                {l:'Additional Notes',    v:sc.additionalNotes,               skip:!sc.additionalNotes},
            ],
            photos:[
                {label:'Powerlines',       urls:sc.powerlinesPhotos},
                {label:'Pavement',         urls:sc.pavementPhotos},
                {label:'Ground Type',      urls:sc.groundTypePhotos},
                {label:'Gutter Obstacles', urls:sc.gutterObstaclesPhotos},
                {label:'Lower Roofs',      urls:sc.lowerRoofsPhotos},
            ]
        });
    }

    mainSections.push({
        icon:'package', title:'Additional Materials',
        materials: am
    });

    // Sign-off is returned separately so the ripper can be injected before it
    const signoffData = sec.customerSignOff || {};
    const signoffSection = (signoffData.name || signoffData.date)
        ? { icon:'pen', title:'Customer Sign-off', signoff: signoffData }
        : null;

    return { mainSections, signoffSection };
}

function buildSectionEl(sec, idx) {
    let body = '';
    if (sec.fields) {
        const shown = sec.fields.filter(f => !f.skip);
        if (shown.length) body += `<div class="fields-grid">${shown.map(f => fieldEl(f.l, f.v, f.radio)).join('')}</div>`;
    }
    if (sec.photos) {
        sec.photos.forEach(pg => {
            if (!Array.isArray(pg.urls) || !pg.urls.length) return;
            const startIdx = allPhotos.length;
            pg.urls.forEach(u => allPhotos.push({url:u, label:pg.label}));
            body += `<div class="photo-group">
                <div class="photo-group-lbl">${ICON('camera')}${esc(pg.label)}</div>
                <div class="photo-grid">
                    ${pg.urls.map((u,i) => `
                        <div class="photo-wrap" onclick="openLb(${startIdx+i})">
                            <img src="${esc(u)}" alt="Photo" loading="lazy">
                            <span class="photo-num">${i+1}</span>
                        </div>`).join('')}
                </div>
            </div>`;
        });
    }
    if (sec.materials !== undefined) {
        body += sec.materials.length
            ? `<div class="materials-list">${sec.materials.map(m=>`<div class="material-item">${esc(m)}</div>`).join('')}</div>`
            : `<div class="no-materials">None requested</div>`;
    }
    if (sec.signoff) {
        body += `<div class="signoff-box">
            <div class="signoff-item">
                <div class="signoff-lbl">Customer Name</div>
                <div class="signoff-val">${esc(sec.signoff.name || '—')}</div>
            </div>
            <div class="signoff-item">
                <div class="signoff-lbl">Date</div>
                <div class="signoff-val">${esc(fmtDate(sec.signoff.date))}</div>
            </div>
        </div>`;
    }
    return `
    <div class="section">
        <div class="section-hdr">
            <div class="section-hdr-left">
                ${ICON(sec.icon)}
                <span class="section-title-text">${sec.title}</span>
            </div>
            <span class="section-chevron">${ICON('chevronDown')}</span>
        </div>
        <div class="section-body">
            <div class="section-inner">${body || '<div class="no-materials">No data recorded</div>'}</div>
        </div>
    </div>`;
}

// ── Picklist section ───────────────────────────────────────────────────────
function buildPicklistSection(d) {
    const savedDate = d?.savedAt
        ? new Date(d.savedAt).toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'})
        : null;

    const savedPill = savedDate
        ? `<span class="pl-saved-pill">Saved ${savedDate}</span>`
        : '';

    let body = '';

    if (!d) {
        body = `<div class="pl-no-data">${ICON('inbox')}No picklist found for this job.</div>`;
    } else {
        const specCard = (def) => {
            const val  = d.specs?.[def.label] || '';
            const hasV = !!val;
            const note = def.note ? `<span class="pl-spec-note"> (${def.note})</span>` : '';
            const unit = (val && def.unit) ? `<span class="pl-spec-unit">${def.unit}</span>` : '';
            const extra = def.highlight ? ' cost-saving' : '';
            return `<div class="pl-spec-card${hasV?'':' no-val'}${extra}">
                <div class="pl-spec-lbl">${esc(def.label)}${note}</div>
                <div class="pl-spec-val${hasV?'':' empty'}">${hasV ? esc(val)+unit : '—'}</div>
            </div>`;
        };

        if (d.specs) {
            body += `<div class="pl-section-label">${ICON('zap')}System configuration</div>
                     <div class="pl-specs-grid">${SPECS.system.map(specCard).join('')}</div>`;
            body += `<div class="pl-section-label">${ICON('settings')}Mounting &amp; hardware</div>
                     <div class="pl-specs-grid">${SPECS.mounting.map(specCard).join('')}</div>`;
            body += `<div class="pl-section-label">${ICON('plug')}Electrical &amp; supply</div>
                     <div class="pl-specs-grid">${SPECS.electrical.map(specCard).join('')}</div>`;
        }

        if (d.mountCheck) {
            const mcCards = MOUNT_CHECK.map(def => {
                const val  = d.mountCheck[def.label] || '';
                const hasV = !!val;
                const extra = def.highlight ? ' cost-saving' : '';
                return `<div class="pl-spec-card${hasV?'':' no-val'}${extra}">
                    <div class="pl-spec-lbl">${esc(def.label)}</div>
                    <div class="pl-spec-val${hasV?'':' empty'}">${hasV ? esc(val) : '—'}</div>
                </div>`;
            }).join('');
            body += `<div class="pl-section-label">${ICON('check')}Mount system sense check</div>
                     <div class="pl-specs-grid">${mcCards}</div>`;
        }

        const flatArr = d.panelFlat || (d.panelGrid ? d.panelGrid.flat() : null);
        const cols    = d.panelCols || (d.panelGrid?.[0]?.length) || 0;
        if (flatArr && cols) {
            let pC = 0, lC = 0, cells = '';
            flatArr.forEach(v => {
                if (v === 'P') pC++; if (v === 'L') lC++;
                const cls = v === 'P' ? 'p' : v === 'L' ? 'l' : 'e';
                cells += `<div class="pl-cell ${cls}" title="${v==='P'?'Portrait':v==='L'?'Landscape':'Empty'}">${v==='P'?'P':v==='L'?'L':''}</div>`;
            });
            if (pC || lC) {
                body += `<div class="pl-roof-wrap">
                    <div class="pl-roof-header">
                        <div class="pl-roof-title">${ICON('grid')}Roof panel layout</div>
                        <div class="pl-legend">
                            <div class="pl-legend-item"><div class="pl-swatch p"></div>Portrait</div>
                            <div class="pl-legend-item"><div class="pl-swatch l"></div>Landscape</div>
                            <div class="pl-legend-item"><div class="pl-swatch e"></div>Empty</div>
                        </div>
                    </div>
                    <div class="pl-roof-grid-wrap">
                        <div class="pl-roof-grid" style="grid-template-columns:repeat(${cols},24px)">${cells}</div>
                    </div>
                    <div class="pl-roof-stats">
                        <div class="pl-roof-stat"><span class="pl-swatch p"></span>Portrait: <strong>${pC}</strong></div>
                        <div class="pl-roof-stat"><span class="pl-swatch l"></span>Landscape: <strong>${lC}</strong></div>
                        <div class="pl-roof-stat">Total: <strong>${pC+lC}</strong></div>
                    </div>
                </div>`;
            }
        }

        if (Array.isArray(d.kfPicklist) && d.kfPicklist.length) {
            let totalQty = 0;
            d.kfPicklist.forEach(it => { const q = parseFloat(it.qty); if (!isNaN(q)) totalQty += q; });
            const rows = d.kfPicklist.map((it,i) => `
                <tr>
                    <td style="color:var(--text-dim);font-size:12px">${i+1}</td>
                    <td><span class="pl-kf-part">${esc(it.partCode || '—')}</span></td>
                    <td><span class="pl-kf-qty">${esc(it.qty || '—')}</span></td>
                </tr>`).join('') +
                `<tr class="pl-kf-total">
                    <td></td>
                    <td style="color:var(--text-dim)">Total qty</td>
                    <td><span class="pl-kf-qty">${totalQty}</span></td>
                </tr>`;
            body += `<div class="pl-kf-wrap">
                <div class="pl-kf-header">
                    <div class="pl-kf-title">${ICON('puzzle')}KF picklist</div>
                    <span class="pl-kf-count">${d.kfPicklist.length} item${d.kfPicklist.length!==1?'s':''}</span>
                </div>
                <div class="pl-kf-table-wrap">
                    <table class="pl-kf-table">
                        <thead><tr><th>#</th><th>Part Code</th><th>Qty</th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            </div>`;
        }

        if (!body) {
            body = `<div class="pl-no-data">Picklist found but contains no displayable data.</div>`;
        }
    }

    return `
    <div class="section picklist-section">
        <div class="section-hdr">
            <div class="section-hdr-left">
                ${ICON('list')}
                <span class="section-title-text">Picklist</span>
                ${savedPill}
            </div>
            <span class="section-chevron">${ICON('chevronDown')}</span>
        </div>
        <div class="section-body">
            <div class="section-inner">${body}</div>
        </div>
    </div>`;
}

// ── PDF Ripper section ─────────────────────────────────────────────────────
function buildRipperSection(d, idx) {
    const savedDate = d?.savedAt
        ? new Date(d.savedAt).toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'})
        : null;

    const savedPill = savedDate
        ? `<span class="ripper-saved-pill">Ripped ${savedDate}</span>`
        : '';

    let body = '';

    if (!d) {
        body = `<div class="pl-no-data">${ICON('inbox')}No PDF Ripper data found for this job.</div>`;
    } else {
        const hasLayout     = !!d.proposedLayoutUrl;
        const hasAssessment = !!d.siteAssessmentUrl;
        const hasAddress    = !!d.address;
        const hasText       = !!d.siteAssessmentText;

        if (hasAddress) {
            body += `<div class="ripper-address-card">
                <div class="ripper-address-label">${ICON('pin')}Property address</div>
                <div class="ripper-address-val">${esc(d.address).replace(/\n/g,'<br>')}</div>
                ${d.jobNumber ? `<div class="ripper-meta-row"><span class="ripper-meta-chip">Job #${esc(d.jobNumber)}</span></div>` : ''}
            </div>`;
        }

        if (hasLayout || hasAssessment) {
            body += `<div class="ripper-grid">`;

            if (hasLayout) {
                body += `<div class="ripper-img-card">
                    <div class="ripper-img-card-label">${ICON('map')}Proposed layout <span style="margin-left:auto;font-size:11.5px;font-weight:500;color:var(--text-dim)">PDF page 3</span></div>
                    <img src="${esc(d.proposedLayoutUrl)}" alt="Proposed Layout"
                         onclick="openRipperImg('${esc(d.proposedLayoutUrl)}','Proposed Layout')"
                         loading="lazy">
                </div>`;
            } else {
                body += `<div class="ripper-img-card">
                    <div class="ripper-img-card-label">${ICON('map')}Proposed layout</div>
                    <div class="ripper-img-placeholder">No layout image saved</div>
                </div>`;
            }

            if (hasAssessment) {
                body += `<div class="ripper-img-card">
                    <div class="ripper-img-card-label">${ICON('clipboard')}Site assessment <span style="margin-left:auto;font-size:11.5px;font-weight:500;color:var(--text-dim)">PDF page 4</span></div>
                    <img src="${esc(d.siteAssessmentUrl)}" alt="Site Assessment"
                         onclick="openRipperImg('${esc(d.siteAssessmentUrl)}','Site Assessment')"
                         loading="lazy">
                </div>`;
            } else {
                body += `<div class="ripper-img-card">
                    <div class="ripper-img-card-label">${ICON('clipboard')}Site assessment</div>
                    <div class="ripper-img-placeholder">No site assessment image saved</div>
                </div>`;
            }

            body += `</div>`;
        }

        if (hasText && !hasAssessment) {
            body += `<div style="margin-top:12px">
                <div class="ripper-text-lbl">${ICON('file')}Site assessment text</div>
                <div class="ripper-text">${esc(d.siteAssessmentText)}</div>
            </div>`;
        }

        if (!hasLayout && !hasAssessment && !hasAddress && !hasText) {
            body = `<div class="pl-no-data">PDF Ripper record found but contains no displayable data.</div>`;
        }
    }

    return `
    <div class="section ripper-section">
        <div class="section-hdr">
            <div class="section-hdr-left">
                ${ICON('file')}
                <span class="section-title-text">PDF Ripper data</span>
                ${savedPill}
            </div>
            <span class="section-chevron">${ICON('chevronDown')}</span>
        </div>
        <div class="section-body">
            <div class="section-inner">${body}</div>
        </div>
    </div>`;
}

// ── Lightbox ───────────────────────────────────────────────────────────────
window.openLb = function(idx) {
    lbIndex = idx;
    updateLb();
    document.getElementById('lightbox').classList.add('show');
};
window.closeLb = function() {
    document.getElementById('lightbox').classList.remove('show');
};
window.lbNav = function(dir) {
    lbIndex = Math.max(0, Math.min(allPhotos.length - 1, lbIndex + dir));
    updateLb();
};
function updateLb() {
    const p = allPhotos[lbIndex];
    document.getElementById('lb-img').src             = p.url;
    document.getElementById('lb-label').textContent   = p.label;
    document.getElementById('lb-counter').textContent = `${lbIndex+1} / ${allPhotos.length}`;
    document.getElementById('lb-prev').disabled = lbIndex === 0;
    document.getElementById('lb-next').disabled = lbIndex === allPhotos.length - 1;
}

window.openRipperImg = function(url, label) {
    const tempIdx = allPhotos.length;
    allPhotos.push({ url, label });
    lbIndex = tempIdx;
    updateLb();
    document.getElementById('lightbox').classList.add('show');
};

document.getElementById('lightbox').addEventListener('click', e => {
    if (e.target === document.getElementById('lightbox')) closeLb();
});
document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('show')) return;
    if (e.key === 'ArrowLeft')  lbNav(-1);
    if (e.key === 'ArrowRight') lbNav(1);
    if (e.key === 'Escape')     closeLb();
});

// ── Utils ──────────────────────────────────────────────────────────────────
function esc(t) {
    const d = document.createElement('div');
    d.textContent = String(t ?? '');
    return d.innerHTML;
}
function fmtDatetime(str) {
    if (!str) return '—';
    const d = new Date(str);
    return isNaN(d) ? str : d.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function fmtDate(str) {
    if (!str) return '—';
    const d = new Date(str.length===10 ? str+'T00:00:00' : str);
    return isNaN(d) ? str : d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}

function fieldEl(label, value, isRadio) {
    const hasVal = value !== null && value !== undefined && value !== '';
    let display;
    if (!hasVal) {
        display = '<span class="missing">Not recorded</span>';
    } else if (isRadio) {
        const map = { Yes:'<span class="val-yes">Yes</span>', No:'<span class="val-no">No</span>', 'N/A':'<span class="val-na">N/A</span>' };
        display = map[value] || esc(value);
    } else {
        display = esc(String(value));
    }
    return `<div class="field">
        <div class="field-lbl">${label}</div>
        <div class="field-val">${display}</div>
    </div>`;
}

// ── Boot ───────────────────────────────────────────────────────────────────
load();
