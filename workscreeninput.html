<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Installs Dashboard | Pingu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* ═══ Pingu design system — base (copy verbatim into each page's <style>) ═══ */
        :root {
            /* Brand + status palette */
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --secondary: #FFC857;
            --accent: #00D9FF;
            --dark: #1A1A2E;
            --dark-light: #252541;
            --dark-lighter: #2F2F4A;
            --text: #EAEAEA;
            --text-dim: #9A9AB0;
            --success: #4ECCA3;
            --error: #FF6B6B;
            --warning: #FFC857;
            --in-progress: #00D9FF;
            --complete: #4ECCA3;
            --aborted: #FF6B6B;
            --cancelled: #9A9AB0;
            --short-notice: #90ee90;
            --on-hold: #FFDE00;
            --scheduled: #FF6B35;
            /* Surfaces & type */
            --bg: #161628;
            --surface: #1F1F35;
            --surface-2: #252541;
            --line: rgba(255,255,255,0.07);
            --line-2: rgba(255,255,255,0.12);
            --text-strong: #F4F4F8;
            --text-soft: #C8C8D6;
            --radius: 10px;
            --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: var(--font); font-size: 14px; line-height: 1.5;
            background: var(--bg); color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        button, input, select, textarea { font-family: inherit; }
        a { color: var(--accent); }
        .ico { width: 16px; height: 16px; flex: 0 0 auto; vertical-align: -3px; }
        .ico-lg { width: 20px; height: 20px; flex: 0 0 auto; }

        /* ── App bar + Pingu wordmark ── */
        .appbar {
            position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            height: 64px; padding: 0 28px;
            background: rgba(22, 22, 40, 0.92);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line);
        }
        .appbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .logo { display: inline-flex; align-items: center; text-decoration: none; }
        .wordmark {
            font-family: 'Inter', var(--font); font-weight: 800; font-size: 28px;
            letter-spacing: -0.045em; line-height: 1; color: var(--text-strong); padding-top: 6px;
        }
        .i-stem { position: relative; display: inline-block; }
        .i-paw {
            position: absolute; left: 50%; top: -0.17em; transform: translateX(-50%) rotate(-10deg);
            width: 0.5em; height: 0.5em; fill: var(--primary);
            filter: drop-shadow(0 1px 4px rgba(255,107,53,0.35));
            transition: transform .2s ease;
        }
        .logo:hover .i-paw { transform: translateX(-50%) rotate(4deg) scale(1.08); }
        .logo:hover .wordmark { color: #fff; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-soft); text-decoration: none; font-size: 13px; font-weight: 500;
            padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; cursor: pointer;
            transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .back-btn:hover { background: var(--surface-2); color: var(--text-strong); border-color: rgba(255,255,255,0.2); }

        /* ── Page layout ── */
        .container { padding: 24px 28px 40px; }
        .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
        h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-strong); line-height: 1.2; }
        h2 { font-size: 16px; font-weight: 600; color: var(--text-strong); letter-spacing: -0.01em; }
        h3 { font-size: 14px; font-weight: 600; color: var(--text-strong); }
        .muted { color: var(--text-dim); }
        .toolbar { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }

        /* ── Panels / cards ── */
        .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
        .panel + .panel { margin-top: 16px; }
        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -2px 0 14px; }
        .panel-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--text-strong); }
        .panel-title .ico { color: var(--primary); }

        /* ── Form controls ── */
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-label { color: var(--text-dim); font-size: 11.5px; font-weight: 500; }
        .control-input {
            height: 38px; background: var(--surface); border: 1px solid var(--line-2);
            color: var(--text-strong); padding: 0 12px; border-radius: 8px; font-size: 13.5px; width: 100%;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        textarea.control-input { height: auto; min-height: 84px; padding: 9px 11px; resize: vertical; }
        .control-input:hover { border-color: rgba(255,255,255,0.2); }
        .control-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.22); }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); cursor: pointer; }
        input[type="checkbox"], input[type="radio"] { accent-color: var(--primary); }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 7px;
            height: 38px; padding: 0 16px; border-radius: 8px; cursor: pointer;
            font-size: 13.5px; font-weight: 600; text-decoration: none; white-space: nowrap;
            border: 1px solid transparent; transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--surface-2); color: var(--text-strong); border-color: var(--line-2); }
        .btn-secondary:hover { background: var(--dark-lighter); border-color: rgba(255,255,255,0.25); }
        .btn-ghost { background: transparent; color: var(--text-soft); border-color: var(--line-2); }
        .btn-ghost:hover { background: var(--surface-2); color: var(--text-strong); }
        .btn-danger { background: rgba(255,107,107,0.12); color: #FF8A8A; border-color: rgba(255,107,107,0.4); }
        .btn-danger:hover { background: rgba(255,107,107,0.22); }
        .btn-success { background: rgba(78,204,163,0.14); color: var(--success); border-color: rgba(78,204,163,0.45); }
        .btn-success:hover { background: rgba(78,204,163,0.24); }
        .btn-sm { height: 32px; padding: 0 12px; font-size: 12.5px; }
        .btn:disabled, button:disabled { opacity: .45; cursor: not-allowed; }
        .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; height: 38px; }
        .seg button { background: var(--surface); color: var(--text-soft); border: 0; padding: 0 12px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .seg button + button { border-left: 1px solid var(--line-2); }
        .seg button:hover, .seg button.active { background: var(--surface-2); color: var(--text-strong); }

        /* ── KPI tiles ── */
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
        .stat-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; }
        .stat-label { display: flex; align-items: center; gap: 7px; color: var(--text-dim); font-size: 12px; font-weight: 500; white-space: nowrap; }
        .stat-label .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
        .stat-value { font-size: 22px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.02em; line-height: 1.25; margin-top: 2px; font-variant-numeric: tabular-nums; }

        /* ── Tables ── */
        .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
        thead th {
            position: sticky; top: 0; z-index: 2; background: var(--surface);
            text-align: left; padding: 10px 14px; font-size: 11.5px; font-weight: 600; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--line-2); white-space: nowrap;
        }
        tbody td { padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--text-soft); vertical-align: middle; }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover td { background: rgba(255,255,255,0.025); }
        td.strong, .cell-strong { color: var(--text-strong); font-weight: 600; }
        .mono { font-family: var(--mono); font-size: 12.5px; }

        /* ── Badges / status pills ── */
        .badge {
            --c: var(--text-dim);
            display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
            padding: 2px 9px; border-radius: 999px; color: var(--text-strong);
            background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
        }
        .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
        .badge.plain::before { display: none; }
        .tag { font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 4px; background: rgba(255,255,255,0.1); color: var(--text-soft); letter-spacing: .03em; }

        /* ── Notices ── */
        .notice { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 13px;
                  background: rgba(255,255,255,0.03); border: 1px solid var(--line-2); color: var(--text-soft); }
        .notice .ico { margin-top: 1px; }
        .notice.info    { border-color: rgba(0,217,255,0.35);  background: rgba(0,217,255,0.06); }
        .notice.success { border-color: rgba(78,204,163,0.4);  background: rgba(78,204,163,0.07); color: var(--success); }
        .notice.warning { border-color: rgba(255,200,87,0.4);  background: rgba(255,200,87,0.07); color: var(--warning); }
        .notice.error   { border-color: rgba(255,107,107,0.45); background: rgba(255,107,107,0.08); color: #FF8A8A; }

        /* ── Modals ── */
        .modal { display: none; position: fixed; inset: 0; background: rgba(10,10,22,0.72); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
        .modal.show, .modal.active, .modal.open { display: flex; }
        .modal-content { background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; width: 100%; max-width: 680px; max-height: 88vh; overflow-y: auto; box-shadow: 0 30px 80px -20px rgba(0,0,0,0.75); }
        .modal-header { position: sticky; top: 0; z-index: 2; background: var(--surface); display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
        .modal-title { font-size: 17px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.01em; }
        .modal-body { padding: 18px 20px 22px; }
        .close-btn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; border-radius: 8px; color: var(--text-dim); cursor: pointer; font-size: 20px; line-height: 1; }
        .close-btn:hover { background: var(--surface-2); color: var(--text-strong); }

        /* ── Feedback ── */
        .toast { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: none; max-width: 420px; padding: 12px 16px 12px 14px; border-radius: 10px;
                 background: #26263F; color: var(--text-strong); font-size: 13.5px; border: 1px solid var(--line-2); border-left: 3px solid var(--success);
                 box-shadow: 0 16px 40px -12px rgba(0,0,0,0.7); }
        .toast.show { display: block; }
        .toast.error { border-left-color: var(--error); }
        .empty-state, .loading { text-align: center; padding: 56px 16px; color: var(--text-dim); }
        .empty-state h3 { color: var(--text-strong); font-size: 16px; margin-bottom: 4px; }
        .empty-state .ico-lg { width: 32px; height: 32px; color: var(--text-dim); margin-bottom: 10px; }
        .spinner { width: 22px; height: 22px; border: 2px solid var(--line-2); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        *::-webkit-scrollbar { width: 10px; height: 10px; }
        *::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
        *::-webkit-scrollbar-track { background: transparent; }
        @media (max-width: 768px) {
            .appbar, .container { padding-left: 14px; padding-right: 14px; }
            .wordmark { font-size: 24px; }
        }
        /* ═══ end base ═══ */

        /* ═══ Work screen input ═══ */
        .layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 16px; align-items: start; }
        .panel + .panel { margin-top: 0; }
        #job-form { display: flex; flex-direction: column; gap: 14px; }
        #job-form .btn { width: 100%; margin-top: 4px; }

        .week-nav { display: inline-flex; }
        .panel-head { flex-wrap: wrap; }

        .timeline-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
        #timeline-table { font-size: 13px; }
        #timeline-table th, #timeline-table td {
            padding: 8px; text-align: left; vertical-align: top; min-width: 140px;
            border-bottom: 1px solid var(--line); border-left: 1px solid var(--line);
        }
        #timeline-table thead th {
            position: sticky; top: 0; z-index: 2; background: var(--surface);
            padding: 10px 12px; font-size: 11.5px; font-weight: 600; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--line-2);
        }
        #timeline-table thead th:first-child, #timeline-table tbody th { border-left: 0; }
        #timeline-table tbody th {
            position: sticky; left: 0; z-index: 1; background: var(--surface);
            min-width: 92px; padding: 10px 12px; font-family: var(--mono); font-size: 12.5px; font-weight: 700;
            color: var(--text-strong); border-right: 1px solid var(--line);
        }
        #timeline-table tbody tr:last-child th, #timeline-table tbody tr:last-child td { border-bottom: 0; }
        #timeline-table tbody tr:hover th, #timeline-table tbody tr:hover td { background: rgba(255,255,255,0.02); }
        #timeline-table tbody tr:hover th { background: #24243C; }

        .job-card {
            --c: var(--scheduled);
            background: color-mix(in srgb, var(--c) 20%, #1d1d33);
            border: 1px solid color-mix(in srgb, var(--c) 42%, transparent);
            border-left: 4px solid var(--c);
            border-radius: 7px; padding: 6px 9px; margin: 0 0 6px;
            font-size: 12.5px; line-height: 1.4; color: var(--text-strong);
            cursor: pointer; transition: background .15s ease, box-shadow .15s ease;
        }
        .job-card:last-child { margin-bottom: 0; }
        .job-card:hover { background: color-mix(in srgb, var(--c) 28%, #1d1d33); box-shadow: 0 0 0 1px color-mix(in srgb, var(--c) 70%, transparent); }
        .job-card.pending     { --c: var(--scheduled); }
        .job-card.in-progress { --c: var(--in-progress); }
        .job-card.complete    { --c: var(--complete); }
        .job-card.aborted     { --c: var(--aborted); }
        .job-card.cancelled   { --c: var(--cancelled); }

        .legend { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-dim); margin-bottom: 12px; }
        .legend-item { display: inline-flex; align-items: center; gap: 6px; }
        .legend-sw { width: 14px; height: 10px; border-radius: 3px; background: color-mix(in srgb, var(--c) 30%, var(--surface)); border-left: 3px solid var(--c); }

        /* Status modal */
        .modal-content { max-width: 420px; }
        .status-buttons { display: flex; flex-direction: column; gap: 8px; }
        .status-buttons .btn[data-status] {
            --c: var(--scheduled);
            justify-content: flex-start; height: 44px; color: var(--text-strong);
            background: color-mix(in srgb, var(--c) 10%, transparent);
            border: 1px solid color-mix(in srgb, var(--c) 40%, transparent);
        }
        .status-buttons .btn[data-status]::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: 0 0 auto; }
        .status-buttons .btn[data-status]:hover { background: color-mix(in srgb, var(--c) 24%, transparent); border-color: var(--c); }
        .status-buttons .btn[data-status="in-progress"] { --c: var(--in-progress); }
        .status-buttons .btn[data-status="complete"]    { --c: var(--complete); }
        .status-buttons .btn[data-status="aborted"]     { --c: var(--aborted); }
        .status-buttons .btn[data-status="cancelled"]   { --c: var(--cancelled); }
        .status-buttons .btn-secondary { margin-top: 6px; height: 40px; background: transparent; color: var(--text-soft); }
        .status-buttons .btn-secondary:hover { background: var(--surface-2); color: var(--text-strong); }

        /* Feedback toast */
        .status-message {
            position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: none; max-width: 420px;
            padding: 12px 16px 12px 14px; border-radius: 10px; background: #26263F; color: var(--text-strong); font-size: 13.5px;
            border: 1px solid var(--line-2); border-left: 3px solid var(--success); box-shadow: 0 16px 40px -12px rgba(0,0,0,0.7);
        }
        .status-message.show { display: block; }
        .status-message.error { border-left-color: var(--error); }

        @media (max-width: 1000px) { .layout { grid-template-columns: minmax(0, 1fr); } }
        @media (max-width: 768px) {
            #timeline-table th, #timeline-table td { min-width: 120px; }
        }
    </style>
</head>
<body>
    <header class="appbar">
        <a href="index.html" class="logo" aria-label="Pingu home">
            <span class="wordmark">P<span class="i-stem">ı<svg class="i-paw" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="16.2" rx="5.6" ry="4.6"/><ellipse cx="4.6" cy="10.4" rx="2.2" ry="2.7" transform="rotate(-18 4.6 10.4)"/><ellipse cx="9.2" cy="5.6" rx="2.3" ry="2.9" transform="rotate(-6 9.2 5.6)"/><ellipse cx="14.8" cy="5.6" rx="2.3" ry="2.9" transform="rotate(6 14.8 5.6)"/><ellipse cx="19.4" cy="10.4" rx="2.2" ry="2.7" transform="rotate(18 19.4 10.4)"/></svg></span>ngu</span>
        </a>
        <div class="appbar-actions">
            <a href="upload.html" class="back-btn"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>To upload</a>
        </div>
    </header>

    <div class="container">
        <div class="page-head">
            <h1>Solar installs dashboard</h1>
        </div>

        <div class="layout">
            <div class="panel">
                <div class="panel-head">
                    <h2 class="panel-title"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Quick job entry</h2>
                </div>
                <form id="job-form">
                    <div class="control-group">
                        <label class="control-label" for="team">Team</label>
                        <select id="team" class="control-input" required><option value="">Select team</option></select>
                    </div>
                    <div class="control-group">
                        <label class="control-label" for="postcode">Postcode</label>
                        <input type="text" id="postcode" class="control-input" placeholder="e.g. SW1A 1AA" required>
                    </div>
                    <div class="control-group">
                        <label class="control-label" for="job-type">Job type</label>
                        <select id="job-type" class="control-input" required>
                            <option value="">Select job type</option>
                            <option value="Solar Install">Solar Install</option>
                            <option value="Battery">Battery</option>
                            <option value="Survey">Survey</option>
                            <option value="Revisit">Revisit</option>
                            <option value="Revisit Chargeable">Revisit Chargeable</option>
                            <option value="Aftercare">Aftercare</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label class="control-label" for="date">Start date</label>
                        <input type="date" id="date" class="control-input" required>
                    </div>
                    <div class="control-group">
                        <label class="control-label" for="days">Days</label>
                        <select id="days" class="control-input" required>
                            <option value="">Select days</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add job</button>
                </form>
            </div>

            <div class="panel">
                <div class="panel-head">
                    <h2 class="panel-title"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Jobs timeline</h2>
                    <div class="seg week-nav" role="group" aria-label="Move by week">
                        <button type="button" id="prev-week"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Previous week</button>
                        <button type="button" id="next-week">Next week<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
                    </div>
                </div>
                <div class="legend">
                    <span class="legend-item"><span class="legend-sw" style="--c:var(--scheduled)"></span>Pending</span>
                    <span class="legend-item"><span class="legend-sw" style="--c:var(--in-progress)"></span>In progress</span>
                    <span class="legend-item"><span class="legend-sw" style="--c:var(--complete)"></span>Complete</span>
                    <span class="legend-item"><span class="legend-sw" style="--c:var(--aborted)"></span>Aborted</span>
                </div>
                <div class="timeline-scroll">
                    <table id="timeline-table">
                        <thead id="timeline-header"></thead>
                        <tbody id="timeline-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="status-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Update this day</h3>
            </div>
            <div class="modal-body">
                <div class="status-buttons">
                    <button class="btn btn-primary" data-status="in-progress">Job in progress</button>
                    <button class="btn btn-primary" data-status="complete">Mark as complete</button>
                    <button class="btn btn-primary" data-status="aborted">Mark as aborted</button>
                    <button class="btn btn-primary" data-status="cancelled">Mark as cancelled</button>
                    <button class="btn btn-secondary" onclick="closeStatusModal()">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <div class="status-message" id="status-message"></div>

<script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAc_yJQ_rkzuOBh-Yxg0Q4eooXtB-tQjm0",
            authDomain: "pingu-solar.firebaseapp.com",
            projectId: "pingu-solar",
            storageBucket: "pingu-solar.firebasestorage.app",
            messagingSenderId: "232764952866",
            appId: "1:232764952866:web:5923b7f419de6355d6157b",
            measurementId: "G-PFH059DZ64"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let jobs = [];
        const teams = Array.from({length: 16}, (_, i) => `NGU${String(i+1).padStart(2, '0')}`);
        let selectedJobId = null;
        let currentWeekStart = getMondayOfCurrentWeek();

        const teamSelect = document.getElementById('team');
        teams.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t; opt.textContent = t;
            teamSelect.appendChild(opt);
        });

        document.getElementById('prev-week').onclick = () => {
            currentWeekStart.setDate(currentWeekStart.getDate() - 7);
            renderTimeline();
        };

        document.getElementById('next-week').onclick = () => {
            currentWeekStart.setDate(currentWeekStart.getDate() + 7);
            renderTimeline();
        };

        function getMondayOfCurrentWeek() {
            const d = new Date();
            const day = d.getDay();
            const diff = day === 0 ? -6 : 1 - day;
            d.setDate(d.getDate() + diff);
            d.setHours(0,0,0,0);
            return d;
        }

        document.getElementById('job-form').addEventListener('submit', async e => {
            e.preventDefault();
            const team = document.getElementById('team').value;
            const postcode = document.getElementById('postcode').value.trim().toUpperCase();
            const jobType = document.getElementById('job-type').value;
            const startDateStr = document.getElementById('date').value;
            const days = parseInt(document.getElementById('days').value);

            if (!team || !postcode || !jobType || !startDateStr || !days) return;

            const startDate = new Date(startDateStr);

            try {
                for (let i = 0; i < days; i++) {
                    const dayDate = new Date(startDate);
                    dayDate.setDate(startDate.getDate() + i);
                    const dayStr = dayDate.toISOString().split('T')[0];

                    await addDoc(collection(db, 'workscreeninput'), {
                        Team: team,
                        Postcode: postcode,
                        'Job Type': jobType,
                        Date: dayStr,
                        'Job Length': days,
                        DayIndex: i + 1,
                        Status: 'pending',
                        createdAt: new Date().toISOString()
                    });
                }
                showStatus(`Added ${days} day(s) successfully`, 'success');
                e.target.reset();
            } catch (err) {
                showStatus('Error adding job: ' + err.message, 'error');
                console.error(err);
            }
        });

        onSnapshot(collection(db, 'workscreeninput'), snapshot => {
            jobs = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
            renderTimeline();
        });

        function renderTimeline() {
            const dates = [];
            const start = new Date(currentWeekStart);
            for (let i = 0; i < 7; i++) {
                const d = new Date(start);
                d.setDate(start.getDate() + i);
                dates.push(d.toISOString().split('T')[0]);
            }

            let header = '<tr><th>Team</th>';
            dates.forEach(date => {
                const day = new Date(date).toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
                header += `<th>${day}</th>`;
            });
            header += '</tr>';
            document.getElementById('timeline-header').innerHTML = header;

            let body = '';
            teams.forEach(team => {
                body += `<tr><th>${team}</th>`;
                dates.forEach(date => {
                    const cellJobs = jobs.filter(j => j.Team === team && j.Date === date && j.Status !== 'cancelled');
                    let content = '';
                    cellJobs.forEach(job => {
                        const statusClass = job.Status || 'pending';
                        content += `
                            <div class="job-card ${statusClass}"
                                 onclick="openStatusModal('${job.id}')"
                                 title="Update this specific day">
                                ${job['Job Type']}<br>
                                ${job.Postcode || '?'} • Day ${job.DayIndex || '?'}/${job['Job Length'] || '?'}
                            </div>
                        `;
                    });
                    body += `<td>${content}</td>`;
                });
                body += '</tr>';
            });
            document.getElementById('timeline-body').innerHTML = body;
        }

        window.openStatusModal = id => {
            selectedJobId = id;
            document.getElementById('status-modal').classList.add('show');
        };

        window.closeStatusModal = () => {
            document.getElementById('status-modal').classList.remove('show');
            selectedJobId = null;
        };

        document.querySelectorAll('.status-buttons button[data-status]').forEach(btn => {
            btn.addEventListener('click', async () => {
                if (!selectedJobId) return;
                const status = btn.dataset.status;
                try {
                    await updateDoc(doc(db, 'workscreeninput', selectedJobId), {
                        Status: status,
                        updatedAt: new Date().toISOString()
                    });
                    showStatus(`Day updated to ${status.replace('-', ' ')}`, 'success');
                } catch (err) {
                    showStatus('Update failed', 'error');
                    console.error(err);
                }
                closeStatusModal();
            });
        });

        function showStatus(msg, type = 'success') {
            const el = document.getElementById('status-message');
            el.textContent = msg;
            el.className = `status-message ${type} show`;
            setTimeout(() => el.classList.remove('show'), 4000);
        }

        renderTimeline();
    </script>
</body>
</html>
