<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Check | Pingu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* ═══ Pingu design system — base (copy verbatim into each page's <style>) ═══ */
        :root {
            /* Brand + status palette */
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --secondary: #FFC857;
            --accent: #00D9FF;
            --dark: #1A1A2E;
            --dark-light: #252541;
            --dark-lighter: #2F2F4A;
            --text: #EAEAEA;
            --text-dim: #9A9AB0;
            --success: #4ECCA3;
            --error: #FF6B6B;
            --warning: #FFC857;
            --in-progress: #00D9FF;
            --complete: #4ECCA3;
            --aborted: #FF6B6B;
            --cancelled: #9A9AB0;
            --short-notice: #90ee90;
            --on-hold: #FFDE00;
            --scheduled: #FF6B35;
            /* Surfaces & type */
            --bg: #161628;
            --surface: #1F1F35;
            --surface-2: #252541;
            --line: rgba(255,255,255,0.07);
            --line-2: rgba(255,255,255,0.12);
            --text-strong: #F4F4F8;
            --text-soft: #C8C8D6;
            --radius: 10px;
            --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: var(--font); font-size: 14px; line-height: 1.5;
            background: var(--bg); color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        button, input, select, textarea { font-family: inherit; }
        a { color: var(--accent); }
        .ico { width: 16px; height: 16px; flex: 0 0 auto; vertical-align: -3px; }
        .ico-lg { width: 20px; height: 20px; flex: 0 0 auto; }

        /* ── App bar + Pingu wordmark ── */
        .appbar {
            position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            height: 64px; padding: 0 28px;
            background: rgba(22, 22, 40, 0.92);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line);
        }
        .appbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .logo { display: inline-flex; align-items: center; text-decoration: none; }
        .wordmark {
            font-family: 'Inter', var(--font); font-weight: 800; font-size: 28px;
            letter-spacing: -0.045em; line-height: 1; color: var(--text-strong); padding-top: 6px;
        }
        .i-stem { position: relative; display: inline-block; }
        .i-paw {
            position: absolute; left: 50%; top: -0.17em; transform: translateX(-50%) rotate(-10deg);
            width: 0.5em; height: 0.5em; fill: var(--primary);
            filter: drop-shadow(0 1px 4px rgba(255,107,53,0.35));
            transition: transform .2s ease;
        }
        .logo:hover .i-paw { transform: translateX(-50%) rotate(4deg) scale(1.08); }
        .logo:hover .wordmark { color: #fff; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-soft); text-decoration: none; font-size: 13px; font-weight: 500;
            padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; cursor: pointer;
            transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .back-btn:hover { background: var(--surface-2); color: var(--text-strong); border-color: rgba(255,255,255,0.2); }

        /* ── Page layout ── */
        .container { padding: 24px 28px 40px; }
        .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
        h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-strong); line-height: 1.2; }
        h2 { font-size: 16px; font-weight: 600; color: var(--text-strong); letter-spacing: -0.01em; }
        h3 { font-size: 14px; font-weight: 600; color: var(--text-strong); }
        .muted { color: var(--text-dim); }
        .toolbar { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }

        /* ── Panels / cards ── */
        .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
        .panel + .panel { margin-top: 16px; }
        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -2px 0 14px; }
        .panel-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--text-strong); }
        .panel-title .ico { color: var(--primary); }

        /* ── Form controls ── */
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-label { color: var(--text-dim); font-size: 11.5px; font-weight: 500; }
        .control-input {
            height: 38px; background: var(--surface); border: 1px solid var(--line-2);
            color: var(--text-strong); padding: 0 12px; border-radius: 8px; font-size: 13.5px; width: 100%;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        textarea.control-input { height: auto; min-height: 84px; padding: 9px 11px; resize: vertical; }
        .control-input:hover { border-color: rgba(255,255,255,0.2); }
        .control-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.22); }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); cursor: pointer; }
        input[type="checkbox"], input[type="radio"] { accent-color: var(--primary); }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 7px;
            height: 38px; padding: 0 16px; border-radius: 8px; cursor: pointer;
            font-size: 13.5px; font-weight: 600; text-decoration: none; white-space: nowrap;
            border: 1px solid transparent; transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--surface-2); color: var(--text-strong); border-color: var(--line-2); }
        .btn-secondary:hover { background: var(--dark-lighter); border-color: rgba(255,255,255,0.25); }
        .btn-ghost { background: transparent; color: var(--text-soft); border-color: var(--line-2); }
        .btn-ghost:hover { background: var(--surface-2); color: var(--text-strong); }
        .btn-danger { background: rgba(255,107,107,0.12); color: #FF8A8A; border-color: rgba(255,107,107,0.4); }
        .btn-danger:hover { background: rgba(255,107,107,0.22); }
        .btn-success { background: rgba(78,204,163,0.14); color: var(--success); border-color: rgba(78,204,163,0.45); }
        .btn-success:hover { background: rgba(78,204,163,0.24); }
        .btn-sm { height: 32px; padding: 0 12px; font-size: 12.5px; }
        .btn:disabled, button:disabled { opacity: .45; cursor: not-allowed; }
        .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; height: 38px; }
        .seg button { background: var(--surface); color: var(--text-soft); border: 0; padding: 0 12px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .seg button + button { border-left: 1px solid var(--line-2); }
        .seg button:hover, .seg button.active { background: var(--surface-2); color: var(--text-strong); }

        /* ── KPI tiles ── */
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
        .stat-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; }
        .stat-label { display: flex; align-items: center; gap: 7px; color: var(--text-dim); font-size: 12px; font-weight: 500; white-space: nowrap; }
        .stat-label .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
        .stat-value { font-size: 22px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.02em; line-height: 1.25; margin-top: 2px; font-variant-numeric: tabular-nums; }

        /* ── Tables ── */
        .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
        thead th {
            position: sticky; top: 0; z-index: 2; background: var(--surface);
            text-align: left; padding: 10px 14px; font-size: 11.5px; font-weight: 600; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--line-2); white-space: nowrap;
        }
        tbody td { padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--text-soft); vertical-align: middle; }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover td { background: rgba(255,255,255,0.025); }
        td.strong, .cell-strong { color: var(--text-strong); font-weight: 600; }
        .mono { font-family: var(--mono); font-size: 12.5px; }

        /* ── Badges / status pills ── */
        .badge {
            --c: var(--text-dim);
            display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
            padding: 2px 9px; border-radius: 999px; color: var(--text-strong);
            background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
        }
        .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
        .badge.plain::before { display: none; }
        .tag { font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 4px; background: rgba(255,255,255,0.1); color: var(--text-soft); letter-spacing: .03em; }

        /* ── Notices ── */
        .notice { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 13px;
                  background: rgba(255,255,255,0.03); border: 1px solid var(--line-2); color: var(--text-soft); }
        .notice .ico { margin-top: 1px; }
        .notice.info    { border-color: rgba(0,217,255,0.35);  background: rgba(0,217,255,0.06); }
        .notice.success { border-color: rgba(78,204,163,0.4);  background: rgba(78,204,163,0.07); color: var(--success); }
        .notice.warning { border-color: rgba(255,200,87,0.4);  background: rgba(255,200,87,0.07); color: var(--warning); }
        .notice.error   { border-color: rgba(255,107,107,0.45); background: rgba(255,107,107,0.08); color: #FF8A8A; }

        /* ── Modals ── */
        .modal { display: none; position: fixed; inset: 0; background: rgba(10,10,22,0.72); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
        .modal.show, .modal.active, .modal.open { display: flex; }
        .modal-content { background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; width: 100%; max-width: 680px; max-height: 88vh; overflow-y: auto; box-shadow: 0 30px 80px -20px rgba(0,0,0,0.75); }
        .modal-header { position: sticky; top: 0; z-index: 2; background: var(--surface); display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
        .modal-title { font-size: 17px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.01em; }
        .modal-body { padding: 18px 20px 22px; }
        .close-btn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; border-radius: 8px; color: var(--text-dim); cursor: pointer; font-size: 20px; line-height: 1; }
        .close-btn:hover { background: var(--surface-2); color: var(--text-strong); }

        /* ── Feedback ── */
        .toast { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: none; max-width: 420px; padding: 12px 16px 12px 14px; border-radius: 10px;
                 background: #26263F; color: var(--text-strong); font-size: 13.5px; border: 1px solid var(--line-2); border-left: 3px solid var(--success);
                 box-shadow: 0 16px 40px -12px rgba(0,0,0,0.7); }
        .toast.show { display: block; }
        .toast.error { border-left-color: var(--error); }
        .empty-state, .loading { text-align: center; padding: 56px 16px; color: var(--text-dim); }
        .empty-state h3 { color: var(--text-strong); font-size: 16px; margin-bottom: 4px; }
        .empty-state .ico-lg { width: 32px; height: 32px; color: var(--text-dim); margin-bottom: 10px; }
        .spinner { width: 22px; height: 22px; border: 2px solid var(--line-2); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        *::-webkit-scrollbar { width: 10px; height: 10px; }
        *::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
        *::-webkit-scrollbar-track { background: transparent; }
        @media (max-width: 768px) {
            .appbar, .container { padding-left: 14px; padding-right: 14px; }
            .wordmark { font-size: 24px; }
        }
        /* ═══ end base ═══ */

        /* ═══ Inventory Check — page styles ═══ */
        :root { --kf: #B57BFF; }
        .page-sub { font-size: 13px; margin-top: 4px; }

        /* Controls */
        .controls-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 14px; }
        .ctrl-group { display: flex; flex-direction: column; gap: 5px; }
        .ctrl-label { color: var(--text-dim); font-size: 11.5px; font-weight: 500; }
        .ctrl-select { min-width: 190px; cursor: pointer; }
        .ctrl-input { min-width: 240px; }
        .ctrl-input::placeholder { color: var(--text-dim); }
        .refresh-btn { margin-left: auto; }
        #refresh-icon { display: inline-flex; }

        /* KPI tiles */
        .stats-bar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
        .stat-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; }

        .state-msg { display: none; text-align: center; padding: 48px 16px; color: var(--text-dim); font-size: 13.5px; }
        .state-msg.show { display: block; }
        .state-msg .icon { margin-bottom: 8px; }
        .state-msg .icon .ico { width: 28px; height: 28px; }

        /* Two-column layout */
        .page-body { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }

        /* Rankings */
        .rankings-panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; position: sticky; top: 80px; }
        .rankings-title { display: flex; align-items: center; gap: 8px; padding: 13px 16px; border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 600; color: var(--text-strong); }
        .rankings-title .ico { color: var(--primary); }
        .rankings-note { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--text-dim); }
        .rank-empty { padding: 14px 16px; color: var(--text-dim); font-size: 13px; }
        .ranking-row { display: grid; grid-template-columns: 24px 1fr; gap: 10px; padding: 11px 16px; border-bottom: 1px solid var(--line); align-items: start; }
        .ranking-row:last-child { border-bottom: 0; }
        .ranking-row:hover { background: rgba(255,255,255,0.025); }
        .rank-num { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 700; color: var(--text-dim); background: var(--surface-2); border: 1px solid var(--line-2); font-variant-numeric: tabular-nums; }
        .rank-num.gold   { color: #1d1d33; background: #FFD25A; border-color: #FFD25A; }
        .rank-num.silver { color: #1d1d33; background: #C9CBD6; border-color: #C9CBD6; }
        .rank-num.bronze { color: #1d1d33; background: #D49A63; border-color: #D49A63; }
        .rank-name { font-size: 13px; font-weight: 600; color: var(--text-strong); line-height: 1.3; margin: 1px 0 5px; }
        .rank-stats { display: flex; flex-direction: column; gap: 1px; }
        .rank-stat { display: flex; justify-content: space-between; align-items: center; }
        .rank-stat-label { font-size: 12px; color: var(--text-dim); }
        .rank-stat-value { font-size: 12.5px; font-weight: 600; color: var(--text-soft); font-variant-numeric: tabular-nums; }
        .rank-stat-value.avg { color: var(--text-strong); }
        .rank-bar-wrap { margin-top: 7px; height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
        .rank-bar { height: 100%; border-radius: 2px; background: var(--primary); }

        /* Surveyor blocks */
        #content { min-width: 0; }
        .surveyor-block { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 12px; }
        .surveyor-header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; }
        .surveyor-avatar { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 700; color: #fff; background: var(--primary); }
        .surveyor-avatar.dim { background: var(--surface-2); color: var(--text-dim); border: 1px solid var(--line-2); }
        .surveyor-name { font-size: 14.5px; font-weight: 600; color: var(--text-strong); }
        .surveyor-header.no-mats .surveyor-name { color: var(--text-soft); }
        .surveyor-pills { display: flex; gap: 6px; align-items: center; margin-left: auto; flex-wrap: wrap; }
        .pill { --c: var(--text-dim); display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; color: var(--text-strong); background: color-mix(in srgb, var(--c) 16%, transparent); border: 1px solid color-mix(in srgb, var(--c) 40%, transparent); }
        .pill .ico { width: 13px; height: 13px; }
        .pill-cable { --c: var(--success); }
        .pill-mats  { --c: var(--kf); }
        .pill-none  { --c: var(--success); color: var(--text-soft); }
        .no-mats-bar { display: flex; align-items: center; gap: 8px; padding: 10px 16px 12px 62px; margin-top: -6px; font-size: 12.5px; color: var(--text-dim); }

        .jobs-list { border-top: 1px solid var(--line); }
        .job-row { border-bottom: 1px solid var(--line); }
        .job-row:last-child { border-bottom: 0; }
        .job-summary { display: flex; align-items: center; gap: 12px; padding: 10px 16px; cursor: pointer; user-select: none; transition: background .15s ease; }
        .job-summary:hover { background: rgba(255,255,255,0.025); }
        .job-chevron { display: inline-flex; color: var(--text-dim); flex-shrink: 0; transition: transform .15s ease; }
        .job-row.open .job-chevron { transform: rotate(90deg); color: var(--text-strong); }
        .job-num { font-family: var(--mono); font-size: 12.5px; font-weight: 700; color: var(--text-strong); white-space: nowrap; min-width: 96px; }
        .job-date { color: var(--text-dim); font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .job-cable, .job-type-badge, .job-mat-count { --c: var(--text-dim); padding: 1px 8px; border-radius: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap; color: var(--text-strong); background: color-mix(in srgb, var(--c) 15%, transparent); border: 1px solid color-mix(in srgb, var(--c) 38%, transparent); }
        .job-cable { --c: var(--success); }
        .badge-bas { --c: var(--accent); }
        .badge-bo  { --c: var(--secondary); }
        .job-mat-count { --c: var(--kf); margin-left: auto; }

        .job-detail { display: none; padding: 12px 16px 14px 44px; border-top: 1px solid var(--line); background: var(--bg); }
        .job-row.open .job-detail { display: block; }
        .mat-cat-block { margin-bottom: 12px; }
        .mat-cat-block:last-child { margin-bottom: 0; }
        .mat-cat-label { --c: var(--text-dim); display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
        .mat-cat-label::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--c); }
        .mat-cat-label.electrical { --c: var(--primary); }
        .mat-cat-label.roof       { --c: var(--accent); }
        .mat-cat-label.kf         { --c: var(--kf); }
        .mat-cat-label.other      { --c: var(--text-dim); }
        .mat-item { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); max-width: 760px; }
        .mat-item:last-child { border-bottom: 0; }
        .mat-desc { font-size: 13px; color: var(--text-strong); flex: 1; min-width: 0; }
        .mat-qty { flex-shrink: 0; padding: 1px 8px; border-radius: 6px; font-size: 12.5px; font-weight: 600; color: var(--text-strong); background: color-mix(in srgb, var(--kf) 16%, transparent); border: 1px solid color-mix(in srgb, var(--kf) 38%, transparent); font-variant-numeric: tabular-nums; }

        #back-top { position: fixed; bottom: 24px; right: 24px; z-index: 100; display: none; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 10px; cursor: pointer; background: var(--surface-2); color: var(--text-strong); border: 1px solid var(--line-2); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.7); }
        #back-top.show { display: flex; }
        #back-top:hover { background: var(--dark-lighter); }
        #back-top .ico { transform: rotate(-90deg); }

        @media (max-width: 1000px) {
            .page-body { grid-template-columns: 1fr; }
            .rankings-panel { position: static; }
        }
        @media (max-width: 768px) {
            .stats-bar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .ctrl-group { flex: 1 1 160px; }
            .ctrl-select, .ctrl-input { min-width: 0; }
            .refresh-btn { margin-left: 0; flex: 1 1 auto; }
            .job-summary { flex-wrap: wrap; gap: 8px; }
            .job-mat-count { margin-left: 0; }
            .surveyor-pills { margin-left: 0; width: 100%; }
            .no-mats-bar { padding-left: 16px; }
            .job-detail { padding-left: 16px; }
        }
        @media print {
            .appbar, .controls-bar, .page-head .toolbar, #back-top, .back-btn { display: none !important; }
            .job-detail { display: block !important; }
            body { background: white; color: black; }
        }
    </style>
</head>
<body>
<header class="appbar">
    <a href="teamview.html" class="logo" aria-label="Pingu home">
        <span class="wordmark">P<span class="i-stem">ı<svg class="i-paw" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="16.2" rx="5.6" ry="4.6"/><ellipse cx="4.6" cy="10.4" rx="2.2" ry="2.7" transform="rotate(-18 4.6 10.4)"/><ellipse cx="9.2" cy="5.6" rx="2.3" ry="2.9" transform="rotate(-6 9.2 5.6)"/><ellipse cx="14.8" cy="5.6" rx="2.3" ry="2.9" transform="rotate(6 14.8 5.6)"/><ellipse cx="19.4" cy="10.4" rx="2.2" ry="2.7" transform="rotate(18 19.4 10.4)"/></svg></span>ngu</span>
    </a>
    <div class="appbar-actions">
        <a href="teamview.html" class="back-btn"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Back to Dashboard</a>
    </div>
</header>

<div class="container">

    <div class="page-head">
        <div>
            <h1>Inventory Check</h1>
            <p class="muted page-sub">Only surveys with additional materials shown. Click any job to expand. Cable run totals include all jobs.</p>
        </div>
        <div class="toolbar">
            <button class="export-btn btn btn-secondary" onclick="exportCSV()"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/></svg>Export CSV</button>
            <button class="export-btn btn btn-secondary" onclick="window.print()"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>Print</button>
        </div>
    </div>

    <div class="controls-bar">
        <div class="ctrl-group">
            <label class="ctrl-label" for="filter-surveyor">Surveyor</label>
            <select class="ctrl-select control-input" id="filter-surveyor"><option value="">All surveyors</option></select>
        </div>
        <div class="ctrl-group">
            <label class="ctrl-label" for="filter-type">Type</label>
            <select class="ctrl-select control-input" id="filter-type">
                <option value="">All types</option>
                <option value="battery-only">Battery only</option>
                <option value="battery-and-solar">Battery &amp; solar</option>
            </select>
        </div>
        <div class="ctrl-group">
            <label class="ctrl-label" for="search-input">Search</label>
            <input type="text" class="ctrl-input control-input" id="search-input" placeholder="Job number, material…" />
        </div>
        <button class="refresh-btn btn btn-secondary" id="refresh-btn" onclick="loadSurveys()">
            <span id="refresh-icon"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/></svg></span>Refresh
        </button>
    </div>

    <div class="stats-bar">
        <div class="stat-card"><div class="stat-label"><span class="dot" style="background:var(--primary)"></span>Surveys with materials</div><div class="stat-value" id="stat-surveys">—</div></div>
        <div class="stat-card"><div class="stat-label"><span class="dot" style="background:var(--kf)"></span>Total material lines</div><div class="stat-value" id="stat-lines">—</div></div>
        <div class="stat-card"><div class="stat-label">Surveyors</div><div class="stat-value" id="stat-surveyors">—</div></div>
        <div class="stat-card"><div class="stat-label"><span class="dot" style="background:var(--success)"></span>Total cable run</div><div class="stat-value" id="stat-cable">—</div></div>
    </div>

    <div class="state-msg" id="loading-state"><div class="icon"><span class="spinner"></span></div>Loading survey data…</div>
    <div class="state-msg" id="empty-state"><div class="icon"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1z"/></svg></div>No surveys found.</div>

    <div class="page-body">
        <div class="rankings-panel" id="rankings-panel">
            <div class="rankings-title"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg>Cable rankings <span class="rankings-note">avg/job</span></div>
            <div id="rankings-body"><div class="rank-empty">Loading…</div></div>
        </div>
        <div id="content"></div>
    </div>
</div>

<button id="back-top" aria-label="Back to top"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, collection, getDocs, query, orderBy }
        from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const app = initializeApp({
        apiKey: "AIzaSyAc_yJQ_rkzuOBh-Yxg0Q4eooXtB-tQjm0",
        authDomain: "pingu-solar.firebaseapp.com",
        projectId: "pingu-solar",
        storageBucket: "pingu-solar.firebasestorage.app",
        messagingSenderId: "232764952866",
        appId: "1:232764952866:web:5923b7f419de6355d6157b"
    });
    const db = getFirestore(app);
    window._allSurveys = [];

    function esc(t) { const d=document.createElement('div'); d.textContent=String(t||''); return d.innerHTML; }

    // Line icons (kit/icons.md)
    const ICONS = {
        alert:   '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
        ruler:   '<path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.4 2.4 0 0 1 0-3.4l2.6-2.6a2.4 2.4 0 0 1 3.4 0z"/><path d="m14.5 12.5 2-2M11.5 9.5l2-2M8.5 6.5l2-2M17.5 15.5l2-2"/>',
        wrench:  '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"/>',
        check:   '<path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="m9 11 3 3L22 4"/>',
        'chevron-right': '<path d="m9 18 6-6-6-6"/>'
    };
    const ICON = name => `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;
    function initials(n) { return n.trim().split(/\s+/).map(w=>w[0]).join('').toUpperCase().substring(0,2)||'?'; }
    function getSurveyor(s) { return s.sections?.surveyDetails?.surveyor?.trim() || 'Unknown Surveyor'; }
    function getSurveyType(s) { return s.surveyType || ''; }
    function getCable(s) {
        const v = s.sections?.electricalSystem?.cableRunLength;
        return (v === undefined || v === null || v === '') ? 0 : parseFloat(v) || 0;
    }
    function getDisplayDate(s) {
        const raw = s.sections?.surveyDetails?.conductedOn || s.submittedAt || '';
        if (!raw) return '—';
        const d = new Date(raw);
        return isNaN(d) ? raw : d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
    }
    function getMaterials(s) {
        const raw = s.sections?.additionalMaterials;
        if (!Array.isArray(raw) || !raw.length) return [];
        return raw.map(line => {
            const m = line.match(/^•\s*(Electrical|Roof|KF):\s*(.+)\s*×\s*(\d+)$/i);
            if (m) return { category: m[1].toLowerCase(), desc: m[2].trim(), qty: parseInt(m[3]) };
            return { category: 'other', desc: line.replace(/^•\s*/,''), qty: null };
        }).filter(i => i.desc && (i.qty === null || i.qty > 0));
    }

    window.loadSurveys = async function() {
        const btn  = document.getElementById('refresh-btn');
        const icon = document.getElementById('refresh-icon');
        document.getElementById('loading-state').classList.add('show');
        document.getElementById('empty-state').classList.remove('show');
        document.getElementById('content').innerHTML = '';
        btn.disabled = true;
        icon.style.animation = 'spin 0.8s linear infinite';
        try {
            const snap = await getDocs(query(collection(db,'site-surveys'), orderBy('submittedAt','desc')));
            window._allSurveys = snap.docs.map(d => ({id:d.id,...d.data()}));
            const surveyors = [...new Set(window._allSurveys.map(getSurveyor))].sort();
            const sel = document.getElementById('filter-surveyor');
            const prev = sel.value;
            sel.innerHTML = '<option value="">All surveyors</option>' +
                surveyors.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');
            if (prev) sel.value = prev;
            renderAll();
        } catch(e) {
            document.getElementById('content').innerHTML =
                `<div class="state-msg show"><div class="icon">${ICON('alert')}</div>Error: ${esc(e.message)}</div>`;
        } finally {
            document.getElementById('loading-state').classList.remove('show');
            btn.disabled = false;
            icon.style.animation = '';
        }
    };

    window.renderAll = function() {
        const fSurveyor = document.getElementById('filter-surveyor').value;
        const fType     = document.getElementById('filter-type').value;
        const search    = document.getElementById('search-input').value.toLowerCase();

        // All surveys matching surveyor/type filters (for cable totals)
        const allFiltered = window._allSurveys.filter(s => {
            if (fSurveyor && getSurveyor(s) !== fSurveyor) return false;
            if (fType     && getSurveyType(s) !== fType)   return false;
            return true;
        });

        // Only those with materials (+ optional search)
        const withMats = allFiltered.filter(s => {
            const mats = getMaterials(s);
            if (!mats.length) return false;
            if (search) {
                const blob = (s.jobNumber||'') + ' ' + mats.map(m=>m.desc).join(' ');
                return blob.toLowerCase().includes(search);
            }
            return true;
        });

        // Stats — cable from ALL surveys (no filter on materials)
        const totalCable = window._allSurveys.reduce((a,s) => a + getCable(s), 0);
        const totalLines = withMats.reduce((a,s) => a + getMaterials(s).length, 0);
        const uniqueSurveyors = [...new Set(allFiltered.map(getSurveyor))];
        document.getElementById('stat-surveys').textContent   = withMats.length;
        document.getElementById('stat-lines').textContent     = totalLines;
        document.getElementById('stat-surveyors').textContent = uniqueSurveyors.length;
        document.getElementById('stat-cable').textContent     = totalCable > 0 ? totalCable.toFixed(1)+'m' : '—';

        const emptyEl = document.getElementById('empty-state');
        const content = document.getElementById('content');
        if (!allFiltered.length) { emptyEl.classList.add('show'); content.innerHTML=''; return; }
        emptyEl.classList.remove('show');

        // Cable totals per surveyor — ALL surveys (no filter), only jobs with cable > 0 counted for avg
        const cablePerSurveyor   = {};
        const jobsWithCable      = {};  // jobs that have a cable value (for avg)
        const jobsTotalPerSurveyor = {};
        const matsPerSurveyor    = {};

        window._allSurveys.forEach(s => {
            const sv = getSurveyor(s);
            const c  = getCable(s);
            if (c > 0) {
                cablePerSurveyor[sv]   = (cablePerSurveyor[sv]||0) + c;
                jobsWithCable[sv]      = (jobsWithCable[sv]||0) + 1;
            }
            jobsTotalPerSurveyor[sv]   = (jobsTotalPerSurveyor[sv]||0) + 1;
            if (!matsPerSurveyor[sv]) matsPerSurveyor[sv] = [];
        });
        withMats.forEach(s => {
            const sv = getSurveyor(s);
            if (!matsPerSurveyor[sv]) matsPerSurveyor[sv] = [];
            matsPerSurveyor[sv].push(s);
        });

        // Rankings: all surveyors with at least one cable job, sorted by avg desc
        const rankData = Object.keys(cablePerSurveyor).map(sv => ({
            name: sv,
            total: cablePerSurveyor[sv],
            jobsWithCable: jobsWithCable[sv]||0,
            avg: jobsWithCable[sv] ? cablePerSurveyor[sv] / jobsWithCable[sv] : 0
        })).sort((a,b) => b.avg - a.avg);
        renderRankings(rankData);

        // All unique surveyors from allFiltered for main list
        const allSurveyors = [...new Set(allFiltered.map(getSurveyor))].sort();

        content.innerHTML = allSurveyors
            .map((sv, idx) => buildSurveyorBlock(
                sv,
                matsPerSurveyor[sv] || [],
                cablePerSurveyor[sv]||0,
                jobsWithCable[sv]||0,
                idx
            )).join('');
    };

    function buildSurveyorBlock(sv, jobs, totalCable, totalJobs, idx) {
        const totalMatLines = jobs.reduce((a,s) => a + getMaterials(s).length, 0);
        const hasMats = jobs.length > 0;
        const cableStr = totalCable > 0
            ? `${ICON('ruler')}${totalCable.toFixed(1)}m · ${totalJobs} job${totalJobs!==1?'s':''} w/ cable`
            : `No cable data`;
        const jobsHtml = hasMats
            ? `<div class="jobs-list">${jobs.map(s => buildJobRow(s)).join('')}</div>`
            : `<div class="no-mats-bar">No additional materials requested</div>`;
        const matsPill = hasMats
            ? `<span class="pill pill-mats">${ICON('wrench')}${totalMatLines} item${totalMatLines!==1?'s':''}</span>`
            : `<span class="pill pill-none">${ICON('check')}Clear</span>`;
        return `<div class="surveyor-block" style="animation-delay:${idx*0.06}s">
            <div class="surveyor-header ${hasMats ? '' : 'no-mats'}">
                <div class="surveyor-avatar ${hasMats ? '' : 'dim'}">${esc(initials(sv))}</div>
                <div class="surveyor-name">${esc(sv)}</div>
                <div class="surveyor-pills">
                    <span class="pill pill-cable">${cableStr}</span>
                    ${matsPill}
                </div>
            </div>
            ${jobsHtml}
        </div>`;
    }

    function buildJobRow(s) {
        const jobNum = s.jobNumber || s.id || '—';
        const date   = getDisplayDate(s);
        const cable  = getCable(s);
        const type   = getSurveyType(s);
        const mats   = getMaterials(s);

        const badgeClass = type==='battery-and-solar' ? 'badge-bas' : 'badge-bo';
        const badgeLabel = type==='battery-and-solar' ? 'B+S' : 'BO';
        const cableHtml  = cable > 0 ? `<span class="job-cable">${cable}m</span>` : '';

        const cats = { electrical:[], roof:[], kf:[], other:[] };
        mats.forEach(m => (cats[m.category]!==undefined ? cats[m.category] : cats.other).push(m));

        let detailHtml = '';
        const catLabels = { electrical:'Electrical', roof:'Roof', kf:'KF Picklist', other:'Other' };
        Object.entries(cats).forEach(([cat, items]) => {
            if (!items.length) return;
            detailHtml += `<div class="mat-cat-block">
                <div class="mat-cat-label ${cat}">${catLabels[cat]}</div>
                ${items.map(i=>`<div class="mat-item">
                    <div class="mat-desc">${esc(i.desc)}</div>
                    ${i.qty!==null?`<div class="mat-qty">×${i.qty}</div>`:''}
                </div>`).join('')}
            </div>`;
        });

        return `<div class="job-row" onclick="toggleRow(this)">
            <div class="job-summary">
                <span class="job-chevron">${ICON('chevron-right')}</span>
                <span class="job-num">${esc(jobNum)}</span>
                <span class="job-date">${esc(date)}</span>
                <span class="job-type-badge ${badgeClass}">${badgeLabel}</span>
                ${cableHtml}
                <span class="job-mat-count">${mats.length} item${mats.length!==1?'s':''}</span>
            </div>
            <div class="job-detail">${detailHtml}</div>
        </div>`;
    }

    window.toggleRow = function(row) { row.classList.toggle('open'); };

    function renderRankings(data) {
        const body = document.getElementById('rankings-body');
        if (!data.length) { body.innerHTML = '<div class="rank-empty">No cable data yet.</div>'; return; }
        const maxAvg = data[0].avg || 1;
        body.innerHTML = data.map((row, i) => {
            const pct = Math.round((row.avg / maxAvg) * 100);
            const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
            const rankLabel = i + 1;
            return `<div class="ranking-row">
                <div class="rank-num ${rankClass}">${rankLabel}</div>
                <div class="rank-body">
                    <div class="rank-name">${esc(row.name)}</div>
                    <div class="rank-stats">
                        <div class="rank-stat">
                            <span class="rank-stat-label">Avg/job</span>
                            <span class="rank-stat-value avg">${row.avg.toFixed(1)}m</span>
                        </div>
                        <div class="rank-stat">
                            <span class="rank-stat-label">Total</span>
                            <span class="rank-stat-value total">${row.total.toFixed(1)}m</span>
                        </div>
                        <div class="rank-stat">
                            <span class="rank-stat-label">Jobs (w/ cable)</span>
                            <span class="rank-stat-value jobs">${row.jobsWithCable}</span>
                        </div>
                    </div>
                    <div class="rank-bar-wrap"><div class="rank-bar" style="width:${pct}%"></div></div>
                </div>
            </div>`;
        }).join('');
    }

    window.exportCSV = function() {
        const rows = [['Surveyor','Job Number','Survey Date','Survey Type','Cable Run (m)','Category','Material','Qty']];
        window._allSurveys.forEach(s => {
            const mats = getMaterials(s);
            if (!mats.length) return;
            const sv   = getSurveyor(s);
            const job  = s.jobNumber || s.id || '';
            const date = getDisplayDate(s);
            const type = getSurveyType(s);
            const cable= getCable(s) || '';
            mats.forEach(m => rows.push([sv, job, date, type, cable, m.category, m.desc, m.qty??'']));
        });
        const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
        a.download = `inventory-check-${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
    };

    document.addEventListener('DOMContentLoaded', () => {
        loadSurveys();
        ['filter-surveyor','filter-type'].forEach(id =>
            document.getElementById(id).addEventListener('change', renderAll));
        document.getElementById('search-input').addEventListener('input', renderAll);
        window.addEventListener('scroll', () =>
            document.getElementById('back-top').classList.toggle('show', window.scrollY > 400));
        document.getElementById('back-top').addEventListener('click', () =>
            window.scrollTo({top:0,behavior:'smooth'}));
    });
</script>
</body>
</html>
