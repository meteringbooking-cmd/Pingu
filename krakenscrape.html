<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kraken Scrape | Pingu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* ═══ Pingu design system — base (copy verbatim into each page's <style>) ═══ */
        :root {
            /* Brand + status palette */
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --secondary: #FFC857;
            --accent: #00D9FF;
            --dark: #1A1A2E;
            --dark-light: #252541;
            --dark-lighter: #2F2F4A;
            --text: #EAEAEA;
            --text-dim: #9A9AB0;
            --success: #4ECCA3;
            --error: #FF6B6B;
            --warning: #FFC857;
            --in-progress: #00D9FF;
            --complete: #4ECCA3;
            --aborted: #FF6B6B;
            --cancelled: #9A9AB0;
            --short-notice: #90ee90;
            --on-hold: #FFDE00;
            --scheduled: #FF6B35;
            /* Surfaces & type */
            --bg: #161628;
            --surface: #1F1F35;
            --surface-2: #252541;
            --line: rgba(255,255,255,0.07);
            --line-2: rgba(255,255,255,0.12);
            --text-strong: #F4F4F8;
            --text-soft: #C8C8D6;
            --radius: 10px;
            --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: var(--font); font-size: 14px; line-height: 1.5;
            background: var(--bg); color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        button, input, select, textarea { font-family: inherit; }
        a { color: var(--accent); }
        .ico { width: 16px; height: 16px; flex: 0 0 auto; vertical-align: -3px; }
        .ico-lg { width: 20px; height: 20px; flex: 0 0 auto; }

        /* ── App bar + Pingu wordmark ── */
        .appbar {
            position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            height: 64px; padding: 0 28px;
            background: rgba(22, 22, 40, 0.92);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line);
        }
        .appbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .logo { display: inline-flex; align-items: center; text-decoration: none; }
        .wordmark {
            font-family: 'Inter', var(--font); font-weight: 800; font-size: 28px;
            letter-spacing: -0.045em; line-height: 1; color: var(--text-strong); padding-top: 6px;
        }
        .i-stem { position: relative; display: inline-block; }
        .i-paw {
            position: absolute; left: 50%; top: -0.17em; transform: translateX(-50%) rotate(-10deg);
            width: 0.5em; height: 0.5em; fill: var(--primary);
            filter: drop-shadow(0 1px 4px rgba(255,107,53,0.35));
            transition: transform .2s ease;
        }
        .logo:hover .i-paw { transform: translateX(-50%) rotate(4deg) scale(1.08); }
        .logo:hover .wordmark { color: #fff; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-soft); text-decoration: none; font-size: 13px; font-weight: 500;
            padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; cursor: pointer;
            transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .back-btn:hover { background: var(--surface-2); color: var(--text-strong); border-color: rgba(255,255,255,0.2); }

        /* ── Page layout ── */
        .container { padding: 24px 28px 40px; }
        .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
        h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-strong); line-height: 1.2; }
        h2 { font-size: 16px; font-weight: 600; color: var(--text-strong); letter-spacing: -0.01em; }
        h3 { font-size: 14px; font-weight: 600; color: var(--text-strong); }
        .muted { color: var(--text-dim); }
        .toolbar { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }

        /* ── Panels / cards ── */
        .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
        .panel + .panel { margin-top: 16px; }
        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -2px 0 14px; }
        .panel-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--text-strong); }
        .panel-title .ico { color: var(--primary); }

        /* ── Form controls ── */
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-label { color: var(--text-dim); font-size: 11.5px; font-weight: 500; }
        .control-input {
            height: 38px; background: var(--surface); border: 1px solid var(--line-2);
            color: var(--text-strong); padding: 0 12px; border-radius: 8px; font-size: 13.5px; width: 100%;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        textarea.control-input { height: auto; min-height: 84px; padding: 9px 11px; resize: vertical; }
        .control-input:hover { border-color: rgba(255,255,255,0.2); }
        .control-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.22); }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); cursor: pointer; }
        input[type="checkbox"], input[type="radio"] { accent-color: var(--primary); }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 7px;
            height: 38px; padding: 0 16px; border-radius: 8px; cursor: pointer;
            font-size: 13.5px; font-weight: 600; text-decoration: none; white-space: nowrap;
            border: 1px solid transparent; transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--surface-2); color: var(--text-strong); border-color: var(--line-2); }
        .btn-secondary:hover { background: var(--dark-lighter); border-color: rgba(255,255,255,0.25); }
        .btn-ghost { background: transparent; color: var(--text-soft); border-color: var(--line-2); }
        .btn-ghost:hover { background: var(--surface-2); color: var(--text-strong); }
        .btn-danger { background: rgba(255,107,107,0.12); color: #FF8A8A; border-color: rgba(255,107,107,0.4); }
        .btn-danger:hover { background: rgba(255,107,107,0.22); }
        .btn-success { background: rgba(78,204,163,0.14); color: var(--success); border-color: rgba(78,204,163,0.45); }
        .btn-success:hover { background: rgba(78,204,163,0.24); }
        .btn-sm { height: 32px; padding: 0 12px; font-size: 12.5px; }
        .btn:disabled, button:disabled { opacity: .45; cursor: not-allowed; }
        .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; height: 38px; }
        .seg button { background: var(--surface); color: var(--text-soft); border: 0; padding: 0 12px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .seg button + button { border-left: 1px solid var(--line-2); }
        .seg button:hover, .seg button.active { background: var(--surface-2); color: var(--text-strong); }

        /* ── KPI tiles ── */
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
        .stat-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; }
        .stat-label { display: flex; align-items: center; gap: 7px; color: var(--text-dim); font-size: 12px; font-weight: 500; white-space: nowrap; }
        .stat-label .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
        .stat-value { font-size: 22px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.02em; line-height: 1.25; margin-top: 2px; font-variant-numeric: tabular-nums; }

        /* ── Tables ── */
        .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
        thead th {
            position: sticky; top: 0; z-index: 2; background: var(--surface);
            text-align: left; padding: 10px 14px; font-size: 11.5px; font-weight: 600; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--line-2); white-space: nowrap;
        }
        tbody td { padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--text-soft); vertical-align: middle; }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover td { background: rgba(255,255,255,0.025); }
        td.strong, .cell-strong { color: var(--text-strong); font-weight: 600; }
        .mono { font-family: var(--mono); font-size: 12.5px; }

        /* ── Badges / status pills ── */
        .badge {
            --c: var(--text-dim);
            display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
            padding: 2px 9px; border-radius: 999px; color: var(--text-strong);
            background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
        }
        .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
        .badge.plain::before { display: none; }
        .tag { font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 4px; background: rgba(255,255,255,0.1); color: var(--text-soft); letter-spacing: .03em; }

        /* ── Notices ── */
        .notice { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 13px;
                  background: rgba(255,255,255,0.03); border: 1px solid var(--line-2); color: var(--text-soft); }
        .notice .ico { margin-top: 1px; }
        .notice.info    { border-color: rgba(0,217,255,0.35);  background: rgba(0,217,255,0.06); }
        .notice.success { border-color: rgba(78,204,163,0.4);  background: rgba(78,204,163,0.07); color: var(--success); }
        .notice.warning { border-color: rgba(255,200,87,0.4);  background: rgba(255,200,87,0.07); color: var(--warning); }
        .notice.error   { border-color: rgba(255,107,107,0.45); background: rgba(255,107,107,0.08); color: #FF8A8A; }

        /* ── Modals ── */
        .modal { display: none; position: fixed; inset: 0; background: rgba(10,10,22,0.72); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
        .modal.show, .modal.active, .modal.open { display: flex; }
        .modal-content { background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; width: 100%; max-width: 680px; max-height: 88vh; overflow-y: auto; box-shadow: 0 30px 80px -20px rgba(0,0,0,0.75); }
        .modal-header { position: sticky; top: 0; z-index: 2; background: var(--surface); display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
        .modal-title { font-size: 17px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.01em; }
        .modal-body { padding: 18px 20px 22px; }
        .close-btn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; border-radius: 8px; color: var(--text-dim); cursor: pointer; font-size: 20px; line-height: 1; }
        .close-btn:hover { background: var(--surface-2); color: var(--text-strong); }

        /* ── Feedback ── */
        .toast { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: none; max-width: 420px; padding: 12px 16px 12px 14px; border-radius: 10px;
                 background: #26263F; color: var(--text-strong); font-size: 13.5px; border: 1px solid var(--line-2); border-left: 3px solid var(--success);
                 box-shadow: 0 16px 40px -12px rgba(0,0,0,0.7); }
        .toast.show { display: block; }
        .toast.error { border-left-color: var(--error); }
        .empty-state, .loading { text-align: center; padding: 56px 16px; color: var(--text-dim); }
        .empty-state h3 { color: var(--text-strong); font-size: 16px; margin-bottom: 4px; }
        .empty-state .ico-lg { width: 32px; height: 32px; color: var(--text-dim); margin-bottom: 10px; }
        .spinner { width: 22px; height: 22px; border: 2px solid var(--line-2); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        *::-webkit-scrollbar { width: 10px; height: 10px; }
        *::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
        *::-webkit-scrollbar-track { background: transparent; }
        @media (max-width: 768px) {
            .appbar, .container { padding-left: 14px; padding-right: 14px; }
            .wordmark { font-size: 24px; }
        }
        /* ═══ end base ═══ */

        /* ═══ Kraken Scrape (CSV tool) ═══ */
        /* Job-type colours, mapped onto the Pingu palette */
        .type-solar-pv        { --c: var(--primary); }
        .type-solar-aftercare { --c: var(--secondary); }
        .type-battery         { --c: var(--accent); }
        .type-structural      { --c: var(--success); }
        .type-electrical      { --c: var(--error); }
        .type-unknown         { --c: var(--cancelled); }

        .upload-zone {
            position: relative; overflow: hidden; margin-bottom: 16px;
            border: 1px dashed rgba(255,255,255,0.18); border-radius: 12px; background: var(--surface);
            padding: 40px 24px; text-align: center; cursor: pointer;
            transition: border-color .15s ease, background .15s ease;
        }
        .upload-zone:hover, .upload-zone.dragover { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 5%, var(--surface)); }
        .upload-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
        .upload-icon {
            display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; margin-bottom: 12px;
            border-radius: 12px; background: rgba(255,107,53,0.12); color: var(--primary);
        }
        .upload-icon .ico { width: 24px; height: 24px; }
        .upload-zone h3 { font-size: 15px; font-weight: 600; color: var(--text-strong); margin-bottom: 6px; }
        .upload-zone p { color: var(--text-dim); font-size: 13px; line-height: 1.7; }
        .upload-zone p strong { color: var(--text-soft); font-weight: 600; }
        .tag-pill {
            display: inline-block; font-family: var(--mono); font-size: 11.5px; color: var(--text-soft);
            background: var(--surface-2); border: 1px solid var(--line-2); padding: 1px 8px; border-radius: 6px; margin: 2px;
        }

        .status-bar { display: none; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
        .status-bar.success { display: block; border: 1px solid rgba(78,204,163,0.4); background: rgba(78,204,163,0.07); color: var(--success); }
        .status-bar.error   { display: block; border: 1px solid rgba(255,107,107,0.45); background: rgba(255,107,107,0.08); color: #FF8A8A; }

        /* Summary strip (built in JS) */
        .summary-strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
        .summary-item {
            display: flex; flex-direction: column-reverse; justify-content: flex-end; gap: 2px;
            background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px;
        }
        .summary-item .s-count { font-size: 22px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.02em; line-height: 1.25; font-variant-numeric: tabular-nums; }
        .summary-item .s-label { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 500; color: var(--text-dim); line-height: 1.35; }
        .summary-item.s-solar     { --c: var(--primary); }
        .summary-item.s-aftercare { --c: var(--secondary); }
        .summary-item.s-battery   { --c: var(--accent); }
        .summary-item.s-struct    { --c: var(--success); }
        .summary-item.s-elec      { --c: var(--error); }
        .summary-item:not(.s-total) .s-label::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: 0 0 auto; }

        .controls { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
        .btn-green { background: rgba(78,204,163,0.14); color: var(--success); border-color: rgba(78,204,163,0.45); }
        .btn-green:hover { background: rgba(78,204,163,0.24); }
        .controls-divider { width: 1px; height: 24px; background: var(--line-2); margin: 0 4px; }

        /* Results table */
        .results-wrap { overflow: auto; max-height: calc(100vh - 140px); }
        #resultsTable thead th { border-right: 1px solid var(--line); }
        #resultsTable thead th:first-child { min-width: 170px; color: var(--text-dim) !important; background: var(--surface) !important; }
        #resultsTable thead th:last-child { border-right: 0; }
        #resultsTable tbody td { vertical-align: top; border-right: 1px solid var(--line); padding: 10px 12px; min-width: 180px; }
        #resultsTable tbody td:last-child { border-right: 0; }
        #resultsTable tbody td:first-child { font-weight: 600; color: var(--text-strong); white-space: nowrap; position: sticky; left: 0; z-index: 1; background: var(--surface); }
        #resultsTable tbody tr:hover td:first-child { background: #24243C; }

        .day-entry {
            --c: var(--line-2);
            margin-bottom: 6px; padding: 6px 9px; border-radius: 7px;
            background: color-mix(in srgb, var(--c) 12%, #1d1d33);
            border: 1px solid color-mix(in srgb, var(--c) 30%, transparent); border-left: 3px solid var(--c);
        }
        .day-entry:last-child { margin-bottom: 0; }
        .day-entry:has(.type-solar-pv)        { --c: var(--primary); }
        .day-entry:has(.type-solar-aftercare) { --c: var(--secondary); }
        .day-entry:has(.type-battery)         { --c: var(--accent); }
        .day-entry:has(.type-structural)      { --c: var(--success); }
        .day-entry:has(.type-electrical)      { --c: var(--error); }
        .day-entry:has(.type-unknown)         { --c: var(--cancelled); }
        .job-number { font-family: var(--mono); font-size: 12.5px; font-weight: 700; color: var(--text-strong); display: block; }
        .job-type-tag { display: inline-block; font-size: 11.5px; font-weight: 500; color: var(--text-soft); margin-top: 1px; }
        .empty-cell { color: var(--text-dim); font-size: 12px; opacity: 0.5; }

        @media (max-width: 1200px) { .summary-strip { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
        @media (max-width: 768px) {
            .summary-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .upload-zone { padding: 28px 16px; }
            .results-wrap { max-height: none; }
        }
    </style>
</head>
<body>
    <header class="appbar">
        <span class="logo" aria-label="Pingu">
            <span class="wordmark">P<span class="i-stem">ı<svg class="i-paw" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="16.2" rx="5.6" ry="4.6"/><ellipse cx="4.6" cy="10.4" rx="2.2" ry="2.7" transform="rotate(-18 4.6 10.4)"/><ellipse cx="9.2" cy="5.6" rx="2.3" ry="2.9" transform="rotate(-6 9.2 5.6)"/><ellipse cx="14.8" cy="5.6" rx="2.3" ry="2.9" transform="rotate(6 14.8 5.6)"/><ellipse cx="19.4" cy="10.4" rx="2.2" ry="2.7" transform="rotate(18 19.4 10.4)"/></svg></span>ngu</span>
        </span>
    </header>

<div class="container">
    <div class="page-head">
        <h1>Kraken Scrape</h1>
    </div>

    <div class="upload-zone" id="uploadZone">
        <input type="file" id="csvFile" accept=".csv">
        <span class="upload-icon"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5M12 3v12"/></svg></span>
        <h3>Drop your CSV here or click to browse</h3>
        <p>
            Expected columns: <strong>Name, Monday, Tuesday, Wednesday, Thursday, Friday</strong><br>
            Extracts:
            <span class="tag-pill">J-XXXXXXXX</span>
            <span class="tag-pill">Solar PV Install</span>
            <span class="tag-pill">Solar PV Install (Aftercare)</span>
            <span class="tag-pill">Battery Install</span>
            <span class="tag-pill">Solar PIV - Structural</span>
            <span class="tag-pill">Solar PIV - Electrical</span>
        </p>
    </div>

    <div class="status-bar" id="statusBar"></div>

    <div id="resultsArea" style="display:none;">
        <div class="summary-strip" id="summaryStrip"></div>
        <div class="controls">
            <button class="btn btn-primary" onclick="exportCSV()"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/></svg>Export schedule CSV</button>
            <button class="btn btn-green" onclick="exportJobList()"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/></svg>Export job list CSV</button>
            <div class="controls-divider"></div>
            <button class="btn btn-secondary" onclick="clearResults()">Clear</button>
        </div>
        <div class="results-wrap table-wrap">
            <table id="resultsTable">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday'];

    const JOB_TYPES = [
        { pattern: /Solar PV Install[^a-zA-Z]*Aftercare/i, displayLabel: 'Solar PV Install (Aftercare)', key: 'aftercare', css: 'type-solar-aftercare' },
        { pattern: /Solar PV Install(?!\s*Aftercare)/i,    displayLabel: 'Solar PV Install',             key: 'solar',     css: 'type-solar-pv' },
        { pattern: /Battery Install/i,                     displayLabel: 'Battery Install',              key: 'battery',   css: 'type-battery' },
        { pattern: /Solar PIV\s*-\s*Structural/i,          displayLabel: 'Solar PIV - Structural',       key: 'struct',    css: 'type-structural' },
        { pattern: /Solar PIV\s*-\s*Electrical/i,          displayLabel: 'Solar PIV - Electrical',       key: 'elec',      css: 'type-electrical' },
    ];

    // drag-drop
    const zone = document.getElementById('uploadZone');
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
    zone.addEventListener('drop', e => {
        e.preventDefault();
        zone.classList.remove('dragover');
        const file = e.dataTransfer.files[0];
        if (file) readFile(file);
    });
    document.getElementById('csvFile').addEventListener('change', e => {
        if (e.target.files[0]) readFile(e.target.files[0]);
    });

    function readFile(file) {
        const reader = new FileReader();
        reader.onload = ev => {
            try { processCSV(ev.target.result); }
            catch(err) { showStatus('Error: ' + err.message, 'error'); }
        };
        reader.readAsText(file);
    }

    function parseCSVLine(line) {
        const values = [];
        let cur = '', inQ = false;
        for (const ch of line) {
            if (ch === '"') { inQ = !inQ; }
            else if (ch === ',' && !inQ) { values.push(cur.trim()); cur = ''; }
            else cur += ch;
        }
        values.push(cur.trim());
        return values;
    }

    function extractFromCell(cell) {
        const tokens = [];
        for (const m of cell.matchAll(/J-[A-Za-z0-9]{8}/g)) {
            tokens.push({ pos: m.index, kind: 'job', value: m[0] });
        }
        for (const jt of JOB_TYPES) {
            const re = new RegExp(jt.pattern.source, 'gi');
            for (const m of cell.matchAll(re)) {
                tokens.push({ pos: m.index, kind: 'type', jt });
            }
        }
        tokens.sort((a, b) => a.pos - b.pos);
        const pairs = [];
        let pendingType = null;
        for (const tok of tokens) {
            if (tok.kind === 'type') {
                pendingType = tok.jt;
            } else {
                pairs.push({ job: tok.value, jt: pendingType });
                pendingType = null;
            }
        }
        return pairs;
    }

    function cleanName(raw) {
        const idx = raw.indexOf('SEngineer');
        return idx !== -1 ? raw.substring(0, idx).trim() : raw.trim();
    }

    function processCSV(csv) {
        const lines = csv.split('\n').filter(l => l.trim());
        if (lines.length < 2) { showStatus('CSV appears empty.', 'error'); return; }

        const headers = parseCSVLine(lines[0]);
        const nameIdx = headers.findIndex(h => /name/i.test(h));
        const dayIndices = DAYS.map(d => headers.findIndex(h => h.trim().toLowerCase() === d.toLowerCase()));

        const rows = [];
        for (let i = 1; i < lines.length; i++) {
            const vals = parseCSVLine(lines[i]);
            if (!vals.length) continue;
            const nameRaw = nameIdx >= 0 ? (vals[nameIdx] || '') : (vals[0] || '');
            const name = cleanName(nameRaw);
            if (!name) continue;

            const dayData = {};
            DAYS.forEach((day, di) => {
                const colIdx = dayIndices[di];
                const cell = colIdx >= 0 ? (vals[colIdx] || '') : '';
                dayData[day] = extractFromCell(cell);
            });
            rows.push({ name, dayData });
        }

        if (!rows.length) { showStatus('No data rows found.', 'error'); return; }
        window._processedRows = rows;

        const typeTotals = {};
        JOB_TYPES.forEach(jt => { typeTotals[jt.key] = 0; });
        let totalUniqueJobs = 0;

        rows.forEach(row => {
            const seenJobs = new Set();
            const typeJobSets = {};
            JOB_TYPES.forEach(jt => { typeJobSets[jt.key] = new Set(); });

            DAYS.forEach(d => {
                row.dayData[d].forEach(({ job, jt }) => {
                    seenJobs.add(job);
                    if (jt) typeJobSets[jt.key].add(job);
                });
            });

            totalUniqueJobs += seenJobs.size;
            JOB_TYPES.forEach(jt => { typeTotals[jt.key] += typeJobSets[jt.key].size; });
        });

        window._typeTotals = typeTotals;

        document.getElementById('summaryStrip').innerHTML = `
            <div class="summary-item s-total"><span class="s-count">${rows.length}</span><span class="s-label">Engineers</span></div>
            <div class="summary-item s-total"><span class="s-count">${totalUniqueJobs}</span><span class="s-label">Total unique jobs</span></div>
            <div class="summary-item s-solar"><span class="s-count">${typeTotals.solar}</span><span class="s-label">Solar PV Install</span></div>
            <div class="summary-item s-aftercare"><span class="s-count">${typeTotals.aftercare}</span><span class="s-label">Solar PV Install (Aftercare)</span></div>
            <div class="summary-item s-battery"><span class="s-count">${typeTotals.battery}</span><span class="s-label">Battery Install</span></div>
            <div class="summary-item s-struct"><span class="s-count">${typeTotals.struct}</span><span class="s-label">Solar PIV – Structural</span></div>
            <div class="summary-item s-elec"><span class="s-count">${typeTotals.elec}</span><span class="s-label">Solar PIV – Electrical</span></div>
        `;

        renderTable(rows);
        showStatus(`Processed ${rows.length} engineers across ${DAYS.length} days.`, 'success');
        document.getElementById('resultsArea').style.display = 'block';
    }

    function renderTable(rows) {
        const head = document.getElementById('tableHead');
        const body = document.getElementById('tableBody');
        const dayClass = ['col-monday','col-tuesday','col-wednesday','col-thursday','col-friday'];

        head.innerHTML = `<tr>
            <th style="background:var(--surface2);color:var(--muted)">Name</th>
            ${DAYS.map((d,i) => `<th class="${dayClass[i]}">${d}</th>`).join('')}
        </tr>`;

        body.innerHTML = rows.map(row => {
            const cells = DAYS.map(day => {
                const pairs = row.dayData[day];
                if (!pairs.length) return `<td><span class="empty-cell">—</span></td>`;

                const html = pairs.map(({ job, jt }) => {
                    const typeHtml = jt
                        ? `<span class="job-type-tag ${jt.css}">${jt.displayLabel}</span>`
                        : `<span class="job-type-tag type-unknown">Unknown</span>`;
                    return `<div class="day-entry">
                        <span class="job-number">${escHtml(job)}</span>
                        ${typeHtml}
                    </div>`;
                }).join('');

                return `<td>${html}</td>`;
            }).join('');

            return `<tr><td>${escHtml(row.name)}</td>${cells}</tr>`;
        }).join('');
    }

    // ── Export 1: original schedule export ──────────────────────────
    function exportCSV() {
        const rows = window._processedRows;
        const totals = window._typeTotals;
        if (!rows) return;

        const lines = [];

        lines.push('WEEKLY SUMMARY');
        lines.push(`"Solar PV Install","${totals.solar}"`);
        lines.push(`"Solar PV Install (Aftercare)","${totals.aftercare}"`);
        lines.push(`"Battery Install","${totals.battery}"`);
        lines.push(`"Solar PIV - Structural","${totals.struct}"`);
        lines.push(`"Solar PIV - Electrical","${totals.elec}"`);
        lines.push('');

        const header = ['Name', ...DAYS];
        lines.push(header.map(h => `"${h}"`).join(','));

        rows.forEach(row => {
            const cells = [`"${row.name}"`];
            DAYS.forEach(day => {
                const pairs = row.dayData[day];
                const val = pairs.map(({ job, jt }) =>
                    jt ? `${job} (${jt.displayLabel})` : job
                ).join(' | ');
                cells.push(`"${val}"`);
            });
            lines.push(cells.join(','));
        });

        downloadCSV(lines.join('\n'), `kraken_schedule_${today()}.csv`);
    }

    // ── Export 2: unique job list ────────────────────────────────────
    function exportJobList() {
        const rows = window._processedRows;
        if (!rows) return;

        // Map: jobNumber -> { type, engineer, firstDayIndex, dayCount (Set of day indices) }
        const jobMap = new Map();

        rows.forEach(row => {
            DAYS.forEach((day, di) => {
                row.dayData[day].forEach(({ job, jt }) => {
                    if (!jobMap.has(job)) {
                        jobMap.set(job, {
                            type: jt ? jt.displayLabel : 'Unknown',
                            engineer: row.name,
                            firstDayIndex: di,
                            days: new Set([di])
                        });
                    } else {
                        const entry = jobMap.get(job);
                        entry.days.add(di);
                        // Track earliest day
                        if (di < entry.firstDayIndex) {
                            entry.firstDayIndex = di;
                            // Update type and engineer to match the first occurrence
                            entry.type = jt ? jt.displayLabel : 'Unknown';
                            entry.engineer = row.name;
                        }
                    }
                });
            });
        });

        const lines = [];
        lines.push('"Job Number","Job Type","Engineer","First Day","Days Covered"');

        // Sort by first day, then alphabetically by job number
        const sorted = [...jobMap.entries()].sort((a, b) => {
            if (a[1].firstDayIndex !== b[1].firstDayIndex) return a[1].firstDayIndex - b[1].firstDayIndex;
            return a[0].localeCompare(b[0]);
        });

        sorted.forEach(([job, info]) => {
            const firstDay = DAYS[info.firstDayIndex];
            const dayCount = info.days.size;
            lines.push(`"${job}","${info.type}","${info.engineer}","${firstDay}","${dayCount}"`);
        });

        downloadCSV(lines.join('\n'), `kraken_joblist_${today()}.csv`);
    }

    function downloadCSV(content, filename) {
        const blob = new Blob([content], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
    }

    function today() {
        return new Date().toISOString().slice(0, 10);
    }

    function clearResults() {
        window._processedRows = null;
        document.getElementById('resultsArea').style.display = 'none';
        document.getElementById('statusBar').className = 'status-bar';
        document.getElementById('csvFile').value = '';
    }

    function showStatus(msg, type) {
        const el = document.getElementById('statusBar');
        el.textContent = msg;
        el.className = 'status-bar ' + type;
    }

    function escHtml(t) {
        const d = document.createElement('div');
        d.textContent = t;
        return d.innerHTML;
    }
</script>
</body>
</html>
