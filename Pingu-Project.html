<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Pingu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* ═══ Pingu design system — base (copy verbatim into each page's <style>) ═══ */
        :root {
            /* Brand + status palette */
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --secondary: #FFC857;
            --accent: #00D9FF;
            --dark: #1A1A2E;
            --dark-light: #252541;
            --dark-lighter: #2F2F4A;
            --text: #EAEAEA;
            --text-dim: #9A9AB0;
            --success: #4ECCA3;
            --error: #FF6B6B;
            --warning: #FFC857;
            --in-progress: #00D9FF;
            --complete: #4ECCA3;
            --aborted: #FF6B6B;
            --cancelled: #9A9AB0;
            --short-notice: #90ee90;
            --on-hold: #FFDE00;
            --scheduled: #FF6B35;
            /* Surfaces & type */
            --bg: #161628;
            --surface: #1F1F35;
            --surface-2: #252541;
            --line: rgba(255,255,255,0.07);
            --line-2: rgba(255,255,255,0.12);
            --text-strong: #F4F4F8;
            --text-soft: #C8C8D6;
            --radius: 10px;
            --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: var(--font); font-size: 14px; line-height: 1.5;
            background: var(--bg); color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        button, input, select, textarea { font-family: inherit; }
        a { color: var(--accent); }
        .ico { width: 16px; height: 16px; flex: 0 0 auto; vertical-align: -3px; }
        .ico-lg { width: 20px; height: 20px; flex: 0 0 auto; }

        /* ── App bar + Pingu wordmark ── */
        .appbar {
            position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            height: 64px; padding: 0 28px;
            background: rgba(22, 22, 40, 0.92);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line);
        }
        .appbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .logo { display: inline-flex; align-items: center; text-decoration: none; }
        .wordmark {
            font-family: 'Inter', var(--font); font-weight: 800; font-size: 28px;
            letter-spacing: -0.045em; line-height: 1; color: var(--text-strong); padding-top: 6px;
        }
        .i-stem { position: relative; display: inline-block; }
        .i-paw {
            position: absolute; left: 50%; top: -0.17em; transform: translateX(-50%) rotate(-10deg);
            width: 0.5em; height: 0.5em; fill: var(--primary);
            filter: drop-shadow(0 1px 4px rgba(255,107,53,0.35));
            transition: transform .2s ease;
        }
        .logo:hover .i-paw { transform: translateX(-50%) rotate(4deg) scale(1.08); }
        .logo:hover .wordmark { color: #fff; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-soft); text-decoration: none; font-size: 13px; font-weight: 500;
            padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; cursor: pointer;
            transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .back-btn:hover { background: var(--surface-2); color: var(--text-strong); border-color: rgba(255,255,255,0.2); }

        /* ── Page layout ── */
        .container { padding: 24px 28px 40px; }
        .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
        h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-strong); line-height: 1.2; }
        h2 { font-size: 16px; font-weight: 600; color: var(--text-strong); letter-spacing: -0.01em; }
        h3 { font-size: 14px; font-weight: 600; color: var(--text-strong); }
        .muted { color: var(--text-dim); }
        .toolbar { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }

        /* ── Panels / cards ── */
        .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
        .panel + .panel { margin-top: 16px; }
        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -2px 0 14px; }
        .panel-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--text-strong); }
        .panel-title .ico { color: var(--primary); }

        /* ── Form controls ── */
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-label { color: var(--text-dim); font-size: 11.5px; font-weight: 500; }
        .control-input {
            height: 38px; background: var(--surface); border: 1px solid var(--line-2);
            color: var(--text-strong); padding: 0 12px; border-radius: 8px; font-size: 13.5px; width: 100%;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        textarea.control-input { height: auto; min-height: 84px; padding: 9px 11px; resize: vertical; }
        .control-input:hover { border-color: rgba(255,255,255,0.2); }
        .control-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.22); }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); cursor: pointer; }
        input[type="checkbox"], input[type="radio"] { accent-color: var(--primary); }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 7px;
            height: 38px; padding: 0 16px; border-radius: 8px; cursor: pointer;
            font-size: 13.5px; font-weight: 600; text-decoration: none; white-space: nowrap;
            border: 1px solid transparent; transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--surface-2); color: var(--text-strong); border-color: var(--line-2); }
        .btn-secondary:hover { background: var(--dark-lighter); border-color: rgba(255,255,255,0.25); }
        .btn-ghost { background: transparent; color: var(--text-soft); border-color: var(--line-2); }
        .btn-ghost:hover { background: var(--surface-2); color: var(--text-strong); }
        .btn-danger { background: rgba(255,107,107,0.12); color: #FF8A8A; border-color: rgba(255,107,107,0.4); }
        .btn-danger:hover { background: rgba(255,107,107,0.22); }
        .btn-success { background: rgba(78,204,163,0.14); color: var(--success); border-color: rgba(78,204,163,0.45); }
        .btn-success:hover { background: rgba(78,204,163,0.24); }
        .btn-sm { height: 32px; padding: 0 12px; font-size: 12.5px; }
        .btn:disabled, button:disabled { opacity: .45; cursor: not-allowed; }
        .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; height: 38px; }
        .seg button { background: var(--surface); color: var(--text-soft); border: 0; padding: 0 12px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .seg button + button { border-left: 1px solid var(--line-2); }
        .seg button:hover, .seg button.active { background: var(--surface-2); color: var(--text-strong); }

        /* ── KPI tiles ── */
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
        .stat-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; }
        .stat-label { display: flex; align-items: center; gap: 7px; color: var(--text-dim); font-size: 12px; font-weight: 500; white-space: nowrap; }
        .stat-label .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
        .stat-value { font-size: 22px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.02em; line-height: 1.25; margin-top: 2px; font-variant-numeric: tabular-nums; }

        /* ── Tables ── */
        .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
        thead th {
            position: sticky; top: 0; z-index: 2; background: var(--surface);
            text-align: left; padding: 10px 14px; font-size: 11.5px; font-weight: 600; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--line-2); white-space: nowrap;
        }
        tbody td { padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--text-soft); vertical-align: middle; }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover td { background: rgba(255,255,255,0.025); }
        td.strong, .cell-strong { color: var(--text-strong); font-weight: 600; }
        .mono { font-family: var(--mono); font-size: 12.5px; }

        /* ── Badges / status pills ── */
        .badge {
            --c: var(--text-dim);
            display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
            padding: 2px 9px; border-radius: 999px; color: var(--text-strong);
            background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
        }
        .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
        .badge.plain::before { display: none; }
        .tag { font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 4px; background: rgba(255,255,255,0.1); color: var(--text-soft); letter-spacing: .03em; }

        /* ── Notices ── */
        .notice { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 13px;
                  background: rgba(255,255,255,0.03); border: 1px solid var(--line-2); color: var(--text-soft); }
        .notice .ico { margin-top: 1px; }
        .notice.info    { border-color: rgba(0,217,255,0.35);  background: rgba(0,217,255,0.06); }
        .notice.success { border-color: rgba(78,204,163,0.4);  background: rgba(78,204,163,0.07); color: var(--success); }
        .notice.warning { border-color: rgba(255,200,87,0.4);  background: rgba(255,200,87,0.07); color: var(--warning); }
        .notice.error   { border-color: rgba(255,107,107,0.45); background: rgba(255,107,107,0.08); color: #FF8A8A; }

        /* ── Modals ── */
        .modal { display: none; position: fixed; inset: 0; background: rgba(10,10,22,0.72); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
        .modal.show, .modal.active, .modal.open { display: flex; }
        .modal-content { background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; width: 100%; max-width: 680px; max-height: 88vh; overflow-y: auto; box-shadow: 0 30px 80px -20px rgba(0,0,0,0.75); }
        .modal-header { position: sticky; top: 0; z-index: 2; background: var(--surface); display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
        .modal-title { font-size: 17px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.01em; }
        .modal-body { padding: 18px 20px 22px; }
        .close-btn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; border-radius: 8px; color: var(--text-dim); cursor: pointer; font-size: 20px; line-height: 1; }
        .close-btn:hover { background: var(--surface-2); color: var(--text-strong); }

        /* ── Feedback ── */
        .toast { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: none; max-width: 420px; padding: 12px 16px 12px 14px; border-radius: 10px;
                 background: #26263F; color: var(--text-strong); font-size: 13.5px; border: 1px solid var(--line-2); border-left: 3px solid var(--success);
                 box-shadow: 0 16px 40px -12px rgba(0,0,0,0.7); }
        .toast.show { display: block; }
        .toast.error { border-left-color: var(--error); }
        .empty-state, .loading { text-align: center; padding: 56px 16px; color: var(--text-dim); }
        .empty-state h3 { color: var(--text-strong); font-size: 16px; margin-bottom: 4px; }
        .empty-state .ico-lg { width: 32px; height: 32px; color: var(--text-dim); margin-bottom: 10px; }
        .spinner { width: 22px; height: 22px; border: 2px solid var(--line-2); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        *::-webkit-scrollbar { width: 10px; height: 10px; }
        *::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
        *::-webkit-scrollbar-track { background: transparent; }
        @media (max-width: 768px) {
            .appbar, .container { padding-left: 14px; padding-right: 14px; }
            .wordmark { font-size: 24px; }
        }
        /* ═══ end base ═══ */
        /* ═══ Pingu Project — page styles ═══ */
        .layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
        .main-col, .side-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
        .side-col { position: sticky; top: 80px; }

        .search-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
        .search-row .control-group { flex: 1 1 220px; }
        .job-input { font-family: var(--mono); font-size: 14px; letter-spacing: .02em; }
        #search-status { margin-top: 12px; }

        /* Project header */
        .project-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
        .project-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .project-title h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
        .project-title .job-no { font-family: var(--mono); color: var(--primary); }
        .project-meta { color: var(--text-dim); font-size: 12.5px; margin-top: 2px; }
        .save-wrap { display: flex; align-items: center; gap: 10px; }
        .dirty-note { color: var(--warning); font-size: 12.5px; font-weight: 500; display: none; }
        .dirty .dirty-note { display: inline; }

        /* Tabs */
        .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line-2); margin: 18px -20px 18px; padding: 0 20px; overflow-x: auto; }
        .tab {
            display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
            background: transparent; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
            color: var(--text-dim); font-size: 13.5px; font-weight: 600; padding: 10px 14px; cursor: pointer;
        }
        .tab:hover { color: var(--text-strong); }
        .tab.active { color: var(--text-strong); border-bottom-color: var(--primary); }
        .tab .ico { color: currentColor; }
        .tab .tick { width: 16px; height: 16px; border-radius: 50%; display: none; align-items: center; justify-content: center; background: rgba(78,204,163,0.18); color: var(--success); }
        .tab .tick .ico { width: 11px; height: 11px; vertical-align: 0; }
        .tab.done .tick { display: inline-flex; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* Profile grid */
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
        .detail-row { display: grid; grid-template-columns: 150px 1fr; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
        .detail-row:nth-child(odd) { border-right: 1px solid var(--line); }
        .detail-row.wide { grid-column: 1 / -1; border-right: 0; }
        .detail-label { color: var(--text-dim); font-size: 12.5px; }
        .detail-value { color: var(--text-strong); font-weight: 500; font-size: 13.5px; word-break: break-word; }
        .detail-value a { color: var(--accent); text-decoration: none; }
        .detail-value a:hover { text-decoration: underline; }
        .detail-value.empty { color: var(--text-dim); font-weight: 400; }
        .source-note { color: var(--text-dim); font-size: 12px; margin-top: 10px; display: flex; align-items: center; gap: 6px; }

        /* Form layout inside tabs */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .form-grid .full { grid-column: 1 / -1; }
        .check-card {
            display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 10px; cursor: pointer;
            background: var(--surface-2); border: 1px solid var(--line-2); transition: border-color .15s ease, background .15s ease;
        }
        .check-card:hover { border-color: rgba(255,255,255,0.22); }
        .check-card input { width: 20px; height: 20px; cursor: pointer; flex: 0 0 auto; }
        .check-card .check-text { display: flex; flex-direction: column; }
        .check-card .check-title { color: var(--text-strong); font-weight: 600; font-size: 14px; }
        .check-card .check-sub { color: var(--text-dim); font-size: 12.5px; }
        .check-card.on { border-color: rgba(78,204,163,0.5); background: rgba(78,204,163,0.07); }
        .check-card.on .check-sub { color: var(--success); }
        .hint { color: var(--text-dim); font-size: 12px; }
        .hint.warn { color: var(--warning); }
        .panel-qty { max-width: 200px; font-family: var(--mono); font-size: 15px; }

        /* Projects list */
        .proj-list { display: flex; flex-direction: column; max-height: calc(100vh - 220px); overflow-y: auto; margin: 0 -20px -18px; }
        .proj-item { display: block; width: 100%; text-align: left; background: transparent; border: 0; border-top: 1px solid var(--line); padding: 11px 20px; cursor: pointer; color: var(--text-soft); }
        .proj-item:hover { background: rgba(255,255,255,0.03); }
        .proj-item.current { background: rgba(255,107,53,0.08); box-shadow: inset 3px 0 0 var(--primary); }
        .proj-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
        .proj-no { font-family: var(--mono); font-weight: 700; color: var(--text-strong); font-size: 13px; }
        .proj-date { color: var(--text-dim); font-size: 12px; white-space: nowrap; }
        .proj-name { font-size: 12.5px; color: var(--text-soft); margin: 1px 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .proj-flags { display: flex; gap: 6px; flex-wrap: wrap; }
        .flag { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--text-dim); }
        .flag.on { color: var(--success); border-color: rgba(78,204,163,0.45); background: rgba(78,204,163,0.1); }
        .list-filter { margin-bottom: 12px; }

        @media (max-width: 1000px) {
            .layout { grid-template-columns: 1fr; }
            .side-col { position: static; }
            .proj-list { max-height: 420px; }
        }
        @media (max-width: 640px) {
            .details-grid, .form-grid { grid-template-columns: 1fr; }
            .detail-row { grid-template-columns: 120px 1fr; }
            .detail-row:nth-child(odd) { border-right: 0; }
            .tabs { margin-left: -14px; margin-right: -14px; padding: 0 14px; }
        }
    </style>
</head>
<body>
<header class="appbar">
    <a href="index.html" class="logo" aria-label="Pingu home">
        <span class="wordmark">P<span class="i-stem">ı<svg class="i-paw" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="16.2" rx="5.6" ry="4.6"/><ellipse cx="4.6" cy="10.4" rx="2.2" ry="2.7" transform="rotate(-18 4.6 10.4)"/><ellipse cx="9.2" cy="5.6" rx="2.3" ry="2.9" transform="rotate(-6 9.2 5.6)"/><ellipse cx="14.8" cy="5.6" rx="2.3" ry="2.9" transform="rotate(6 14.8 5.6)"/><ellipse cx="19.4" cy="10.4" rx="2.2" ry="2.7" transform="rotate(18 19.4 10.4)"/></svg></span>ngu</span>
    </a>
    <div class="appbar-actions">
        <a href="viewtimeline.html" class="back-btn"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Job timeline</a>
        <a href="index.html" class="back-btn"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Back to Home</a>
    </div>
</header>

<div class="container">
    <div class="page-head">
        <div>
            <h1>Projects</h1>
            <div class="muted">One project per job: profile, scaffolding, cable and job details in one place.</div>
        </div>
    </div>

    <div class="layout">
    <div class="main-col">

        <!-- Job search -->
        <div class="panel">
            <div class="panel-head">
                <div class="panel-title"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>Find job</div>
            </div>
            <form class="search-row" onsubmit="event.preventDefault(); searchJob();">
                <div class="control-group">
                    <label class="control-label" for="job-number-input">Job number</label>
                    <input type="text" class="control-input job-input" id="job-number-input" placeholder="e.g. 12345" autocomplete="off" inputmode="text">
                </div>
                <button type="submit" class="btn btn-primary" id="search-btn">
                    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>Search
                </button>
            </form>
            <div id="search-status"></div>
        </div>

        <!-- Project -->
        <div class="panel" id="project-panel" style="display:none;">
            <div class="project-head">
                <div>
                    <div class="project-title">
                        <h2>Job <span class="job-no" id="p-job-no"></span></h2>
                        <span class="badge" id="p-state-badge"></span>
                    </div>
                    <div class="project-meta" id="p-meta"></div>
                </div>
                <div class="save-wrap" id="save-wrap">
                    <span class="dirty-note">Unsaved changes</span>
                    <button class="btn btn-primary" id="save-btn" onclick="saveProject()">
                        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg><span id="save-label">Create project</span>
                    </button>
                </div>
            </div>

            <div class="tabs" role="tablist">
                <button class="tab active" role="tab" data-tab="profile" onclick="showTab('profile')">
                    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile
                </button>
                <button class="tab" role="tab" data-tab="scaffolding" onclick="showTab('scaffolding')">
                    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3v18M20 3v18M4 8h16M4 14h16M4 8l16 6"/></svg>Scaffolding<span class="tick"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
                </button>
                <button class="tab" role="tab" data-tab="cable" onclick="showTab('cable')">
                    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a1 1 0 0 1-1-1v-1a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1a1 1 0 0 1-1 1v2M19 15V6.5a3.5 3.5 0 0 0-7 0v11a3.5 3.5 0 0 1-7 0V9M5 9V3M3 9h4"/></svg>Cable<span class="tick"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
                </button>
                <button class="tab" role="tab" data-tab="job" onclick="showTab('job')">
                    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>Job<span class="tick"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
                </button>
            </div>

            <!-- Profile -->
            <div class="tab-panel active" id="tab-profile">
                <div class="details-grid" id="profile-grid"></div>
                <div class="source-note"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>Pulled live from the job record (Solar-jobs). Edit these on the job itself.</div>
            </div>

            <!-- Scaffolding -->
            <div class="tab-panel" id="tab-scaffolding">
                <div class="form-grid">
                    <label class="check-card full" id="scaff-card">
                        <input type="checkbox" id="scaff-requested">
                        <span class="check-text">
                            <span class="check-title">Scaffolding requested</span>
                            <span class="check-sub" id="scaff-requested-sub">Not requested yet</span>
                        </span>
                    </label>
                    <div class="control-group">
                        <label class="control-label" for="scaff-erect">Scaffold erection date</label>
                        <input type="date" class="control-input" id="scaff-erect">
                    </div>
                    <div class="control-group">
                        <label class="control-label" for="scaff-dismantle">Projected dismantle date</label>
                        <input type="date" class="control-input" id="scaff-dismantle">
                        <span class="hint warn" id="scaff-date-warn" style="display:none;">Dismantle date is before the erection date.</span>
                    </div>
                    <div class="control-group full">
                        <label class="control-label" for="scaff-notes">Additional notes</label>
                        <textarea class="control-input" id="scaff-notes" rows="4" placeholder="Scaffold company, access issues, anything the team should know…"></textarea>
                    </div>
                </div>
            </div>

            <!-- Cable -->
            <div class="tab-panel" id="tab-cable">
                <div class="form-grid">
                    <label class="check-card full" id="cable-card">
                        <input type="checkbox" id="cable-ordered">
                        <span class="check-text">
                            <span class="check-title">Cable ordered</span>
                            <span class="check-sub" id="cable-ordered-sub">Not ordered yet</span>
                        </span>
                    </label>
                    <div class="control-group full">
                        <label class="control-label" for="cable-notes">Additional notes</label>
                        <textarea class="control-input" id="cable-notes" rows="4" placeholder="Cable type, lengths, supplier, delivery date…"></textarea>
                    </div>
                </div>
            </div>

            <!-- Job -->
            <div class="tab-panel" id="tab-job">
                <div class="form-grid">
                    <div class="control-group full">
                        <label class="control-label" for="job-panels">Panel quantity</label>
                        <input type="number" class="control-input panel-qty" id="job-panels" min="0" step="1" placeholder="0">
                    </div>
                    <div class="control-group full">
                        <label class="control-label" for="job-notes">Additional notes</label>
                        <textarea class="control-input" id="job-notes" rows="5" placeholder="Anything else about this job…"></textarea>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Existing projects -->
    <div class="side-col">
        <div class="panel">
            <div class="panel-head">
                <div class="panel-title"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Projects <span class="tag" id="proj-count">0</span></div>
                <button class="btn btn-ghost btn-sm" onclick="loadProjects()" title="Refresh">Refresh</button>
            </div>
            <input type="text" class="control-input list-filter" id="proj-filter" placeholder="Filter by job number or name…" oninput="renderProjects()">
            <div class="proj-list" id="proj-list"><div class="loading"><span class="spinner"></span></div></div>
        </div>
    </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, collection, query, where, getDocs, doc, getDoc, setDoc }
        from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const cfg = {
        apiKey:"AIzaSyAc_yJQ_rkzuOBh-Yxg0Q4eooXtB-tQjm0",
        authDomain:"pingu-solar.firebaseapp.com",
        projectId:"pingu-solar",
        storageBucket:"pingu-solar.firebasestorage.app",
        messagingSenderId:"232764952866",
        appId:"1:232764952866:web:5923b7f419de6355d6157b",
        measurementId:"G-PFH059DZ64"
    };

    const PROJECTS = 'pingu-projects';
    const JOBS     = 'Solar-jobs';

    let db;
    try {
        db = getFirestore(initializeApp(cfg));
    } catch (e) {
        toast('Firebase error: ' + e.message, true);
    }

    // ── State ─────────────────────────────────────────────────────────
    let currentJob     = null;   // Solar-jobs record
    let currentProject = null;   // pingu-projects record (null = not created yet)
    let allProjects    = [];
    let dirty          = false;

    // ── Helpers ───────────────────────────────────────────────────────
    const $ = id => document.getElementById(id);
    const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const pick = (obj, keys) => { for (const k of keys) { const v = obj?.[k]; if (v !== undefined && v !== null && String(v).trim() !== '') return v; } return ''; };
    const projectId = jn => String(jn).trim().replace(/\//g, '-');

    function parseDate(v) {
        if (!v) return null;
        if (v && typeof v.toDate === 'function') v = v.toDate();
        if (typeof v === 'string' && v.includes('/')) {
            const p = v.split('/');
            if (p.length === 3) { const d = new Date(+p[2], +p[1] - 1, +p[0]); if (!isNaN(d)) return d; }
        }
        const d = new Date(v);
        return isNaN(d) ? null : d;
    }
    const fmtDate = v => { const d = parseDate(v); return d ? d.toLocaleDateString('en-GB', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' }) : ''; };
    const fmtShort = v => { const d = parseDate(v); return d ? d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : ''; };
    const fmtStamp = iso => { const d = iso ? new Date(iso) : null; return d && !isNaN(d) ? d.toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : ''; };

    function adminName() {
        try { return (JSON.parse(localStorage.getItem('adminSession') || '{}').name) || ''; } catch { return ''; }
    }

    function toast(msg, isError) {
        const t = $('toast');
        t.textContent = msg;
        t.className = 'toast show' + (isError ? ' error' : '');
        clearTimeout(t._h); t._h = setTimeout(() => t.className = 'toast', 3500);
    }

    function notice(html, type) {
        $('search-status').innerHTML = html ? `<div class="notice ${type || 'info'}">${html}</div>` : '';
    }

    // Profile fields, in display order. Each lists the Solar-jobs column names to try.
    function profileFromJob(j) {
        const address = [pick(j, ['Address', '1st line of address', 'address']), pick(j, ['2nd line of address'])].filter(Boolean).join(', ');
        return {
            jobType:   pick(j, ['Job Type', 'jobType']),
            engineer:  String(pick(j, ['Lead Engineer', 'lead engineer', 'Lead', 'Engineer', 'engineer'])).replace(/^["']|["']$/g, '').trim(),
            installDay: pick(j, ['Install Date', 'Booked Date', 'installedDate', 'bookingDate']),
            jobLength: pick(j, ['Job Length', 'Days', 'Job Length (days)', 'jobLength', 'Duration']),
            name:      pick(j, ['Name', 'Customer Name', 'customerName']),
            address,
            postcode:  pick(j, ['Postcode', 'postcode']),
            phone:     pick(j, ['Phone Number', 'Phone', 'Contact Number', 'Mobile']),
            email:     pick(j, ['Email Address', 'Email', 'Customer Email'])
        };
    }

    // ── Search ────────────────────────────────────────────────────────
    async function searchJob(jnArg) {
        if (dirty && !confirm('You have unsaved changes on this project. Discard them?')) return;
        const jn = String(jnArg ?? $('job-number-input').value).trim().replace(/^#/, '');
        $('job-number-input').value = jn;
        if (!jn) { notice('Enter a job number.', 'warning'); return; }

        const btn = $('search-btn');
        btn.disabled = true;
        notice('<span class="spinner" style="width:16px;height:16px;"></span> Searching for job ' + esc(jn) + '…', 'info');

        try {
            let snap = await getDocs(query(collection(db, JOBS), where('Job Number', '==', jn)));
            if (snap.empty && /^\d+$/.test(jn)) {
                snap = await getDocs(query(collection(db, JOBS), where('Job Number', '==', Number(jn))));
            }
            if (snap.empty) {
                notice(`No job found with number <strong>${esc(jn)}</strong>. Check the number, or upload the job first.`, 'error');
                $('project-panel').style.display = 'none';
                currentJob = null; currentProject = null;
                return;
            }
            // If the same job number was uploaded more than once, use the most recent upload.
            const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            docs.sort((a, b) => String(b.uploadDate || '').localeCompare(String(a.uploadDate || '')));
            currentJob = docs[0];

            const pSnap = await getDoc(doc(db, PROJECTS, projectId(jn)));
            currentProject = pSnap.exists() ? pSnap.data() : null;

            notice(docs.length > 1 ? `This job number appears ${docs.length} times in Solar-jobs. Showing the most recent upload.` : '', 'warning');
            renderProject(jn);
            history.replaceState(null, '', '?job=' + encodeURIComponent(jn));
        } catch (e) {
            console.error(e);
            notice('Search failed: ' + esc(e.message), 'error');
        } finally {
            btn.disabled = false;
        }
    }

    // ── Render ────────────────────────────────────────────────────────
    function renderProject(jn) {
        const prof = profileFromJob(currentJob);
        const p = currentProject || {};

        $('p-job-no').textContent = '#' + jn;
        setStateBadge();

        const telHref = prof.phone ? 'tel:' + String(prof.phone).replace(/[^\d+]/g, '') : '';
        const rows = [
            ['Job type', esc(prof.jobType)],
            ['Engineer', esc(prof.engineer)],
            ['Install day (first day)', esc(fmtDate(prof.installDay) || prof.installDay)],
            ['Job length (days)', esc(prof.jobLength)],
            ['Customer name', esc(prof.name)],
            ['Contact number', prof.phone ? `<a href="${esc(telHref)}">${esc(prof.phone)}</a>` : ''],
            ['Email address', prof.email ? `<a href="mailto:${esc(prof.email)}">${esc(prof.email)}</a>` : ''],
            ['Postcode', esc(prof.postcode)],
            ['Address', esc(prof.address), true]
        ];
        $('profile-grid').innerHTML = rows.map(([label, val, wide]) => `
            <div class="detail-row${wide ? ' wide' : ''}">
                <div class="detail-label">${label}</div>
                <div class="detail-value${val ? '' : ' empty'}">${val || 'Not recorded'}</div>
            </div>`).join('');

        const s = p.scaffolding || {}, c = p.cable || {}, j = p.job || {};
        $('scaff-requested').checked = !!s.requested;
        $('scaff-erect').value       = s.erectionDate || '';
        $('scaff-dismantle').value   = s.dismantleDate || '';
        $('scaff-notes').value       = s.notes || '';
        $('cable-ordered').checked   = !!c.ordered;
        $('cable-notes').value       = c.notes || '';
        $('job-panels').value        = j.panelQuantity ?? '';
        $('job-notes').value         = j.notes || '';

        refreshIndicators();
        setDirty(false);
        $('project-panel').style.display = 'block';
        showTab('profile');
        renderProjects();
    }

    function setStateBadge() {
        const b = $('p-state-badge');
        if (currentProject) {
            b.textContent = 'Project saved';
            b.style.setProperty('--c', 'var(--success)');
            const who = currentProject.updatedBy ? ' by ' + currentProject.updatedBy : '';
            $('p-meta').textContent = 'Last updated ' + fmtStamp(currentProject.updatedAt) + who;
            $('save-label').textContent = 'Save changes';
        } else {
            b.textContent = 'New project';
            b.style.setProperty('--c', 'var(--scheduled)');
            $('p-meta').textContent = 'No project for this job yet. Fill in the tabs and click Create project.';
            $('save-label').textContent = 'Create project';
        }
    }

    function refreshIndicators() {
        const p = currentProject || {};
        const sReq = $('scaff-requested').checked, cOrd = $('cable-ordered').checked;
        $('scaff-card').classList.toggle('on', sReq);
        $('cable-card').classList.toggle('on', cOrd);

        const sAt = p.scaffolding?.requested && p.scaffolding?.requestedAt;
        $('scaff-requested-sub').textContent = sReq ? (sAt ? 'Requested ' + fmtStamp(sAt) : 'Requested (saved when you click Save)') : 'Not requested yet';
        const cAt = p.cable?.ordered && p.cable?.orderedAt;
        $('cable-ordered-sub').textContent = cOrd ? (cAt ? 'Ordered ' + fmtStamp(cAt) : 'Ordered (saved when you click Save)') : 'Not ordered yet';

        const e = $('scaff-erect').value, d = $('scaff-dismantle').value;
        $('scaff-date-warn').style.display = (e && d && d < e) ? 'block' : 'none';

        document.querySelector('.tab[data-tab="scaffolding"]').classList.toggle('done', sReq);
        document.querySelector('.tab[data-tab="cable"]').classList.toggle('done', cOrd);
        document.querySelector('.tab[data-tab="job"]').classList.toggle('done', $('job-panels').value !== '');
    }

    function setDirty(v) {
        dirty = v;
        $('save-wrap').classList.toggle('dirty', v);
    }

    function showTab(name) {
        document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + name));
    }

    // ── Save ──────────────────────────────────────────────────────────
    async function saveProject() {
        if (!currentJob) return;
        const jn = String(currentJob['Job Number'] ?? $('job-number-input').value).trim();
        const prev = currentProject || {};
        const now = new Date().toISOString();

        const sReq = $('scaff-requested').checked;
        const cOrd = $('cable-ordered').checked;
        const panelsRaw = $('job-panels').value.trim();
        const panels = panelsRaw === '' ? null : parseInt(panelsRaw, 10);
        if (panels !== null && (isNaN(panels) || panels < 0)) { toast('Panel quantity must be a whole number.', true); showTab('job'); return; }

        const prof = profileFromJob(currentJob);
        const data = {
            jobNumber: jn,
            solarJobId: currentJob.id,
            // Snapshot of the profile at save time, so the project list can show it without reloading every job.
            profile: { ...prof, installDay: String(prof.installDay || '') },
            scaffolding: {
                requested: sReq,
                requestedAt: sReq ? (prev.scaffolding?.requested && prev.scaffolding?.requestedAt ? prev.scaffolding.requestedAt : now) : null,
                erectionDate: $('scaff-erect').value || '',
                dismantleDate: $('scaff-dismantle').value || '',
                notes: $('scaff-notes').value.trim()
            },
            cable: {
                ordered: cOrd,
                orderedAt: cOrd ? (prev.cable?.ordered && prev.cable?.orderedAt ? prev.cable.orderedAt : now) : null,
                notes: $('cable-notes').value.trim()
            },
            job: {
                panelQuantity: panels,
                notes: $('job-notes').value.trim()
            },
            createdAt: prev.createdAt || now,
            createdBy: prev.createdBy || adminName(),
            updatedAt: now,
            updatedBy: adminName()
        };

        const btn = $('save-btn');
        btn.disabled = true;
        try {
            await setDoc(doc(db, PROJECTS, projectId(jn)), data);
            const wasNew = !currentProject;
            currentProject = data;
            setStateBadge();
            refreshIndicators();
            setDirty(false);
            toast(wasNew ? `Project created for job #${jn}` : `Project #${jn} saved`);
            upsertProjectInList(projectId(jn), data);
        } catch (e) {
            console.error(e);
            toast('Save failed: ' + e.message, true);
        } finally {
            btn.disabled = false;
        }
    }

    // ── Projects list ─────────────────────────────────────────────────
    async function loadProjects() {
        $('proj-list').innerHTML = '<div class="loading"><span class="spinner"></span></div>';
        try {
            const snap = await getDocs(collection(db, PROJECTS));
            allProjects = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            renderProjects();
        } catch (e) {
            console.error(e);
            $('proj-list').innerHTML = `<div class="empty-state"><h3>Couldn't load projects</h3>${esc(e.message)}</div>`;
        }
    }

    function upsertProjectInList(id, data) {
        const i = allProjects.findIndex(p => p.id === id);
        if (i >= 0) allProjects[i] = { id, ...data }; else allProjects.push({ id, ...data });
        renderProjects();
    }

    function renderProjects() {
        const f = $('proj-filter').value.trim().toLowerCase();
        const cur = currentJob ? projectId(currentJob['Job Number'] ?? '') : '';
        const list = allProjects
            .filter(p => !f || String(p.jobNumber).toLowerCase().includes(f) || String(p.profile?.name || '').toLowerCase().includes(f))
            .sort((a, b) => {
                const da = parseDate(a.profile?.installDay), dbb = parseDate(b.profile?.installDay);
                if (da && dbb) return da - dbb;
                if (da) return -1; if (dbb) return 1;
                return String(b.updatedAt || '').localeCompare(String(a.updatedAt || ''));
            });
        $('proj-count').textContent = allProjects.length;
        if (!list.length) {
            $('proj-list').innerHTML = `<div class="empty-state" style="padding:32px 16px;">${allProjects.length ? 'No projects match that filter.' : 'No projects yet. Search a job to create the first one.'}</div>`;
            return;
        }
        $('proj-list').innerHTML = list.map(p => `
            <button class="proj-item${p.id === cur ? ' current' : ''}" data-job="${esc(p.jobNumber)}">
                <div class="proj-top"><span class="proj-no">#${esc(p.jobNumber)}</span><span class="proj-date">${esc(fmtShort(p.profile?.installDay))}</span></div>
                <div class="proj-name">${esc(p.profile?.name || '')}${p.profile?.postcode ? ' · ' + esc(p.profile.postcode) : ''}</div>
                <div class="proj-flags">
                    <span class="flag${p.scaffolding?.requested ? ' on' : ''}">Scaffold${p.scaffolding?.requested ? ' ✓' : ''}</span>
                    <span class="flag${p.cable?.ordered ? ' on' : ''}">Cable${p.cable?.ordered ? ' ✓' : ''}</span>
                    <span class="flag${p.job?.panelQuantity != null ? ' on' : ''}">${p.job?.panelQuantity != null ? esc(p.job.panelQuantity) + ' panels' : 'Panels'}</span>
                </div>
            </button>`).join('');
    }

    // ── Wire up ───────────────────────────────────────────────────────
    ['scaff-requested', 'scaff-erect', 'scaff-dismantle', 'scaff-notes', 'cable-ordered', 'cable-notes', 'job-panels', 'job-notes']
        .forEach(id => {
            $(id).addEventListener('input', () => { setDirty(true); refreshIndicators(); });
            $(id).addEventListener('change', () => { setDirty(true); refreshIndicators(); });
        });
    $('proj-list').addEventListener('click', e => {
        const b = e.target.closest('.proj-item');
        if (b) searchJob(b.dataset.job);
    });
    window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
    document.addEventListener('keydown', e => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && currentJob) { e.preventDefault(); saveProject(); }
    });

    Object.assign(window, { searchJob, saveProject, showTab, loadProjects, renderProjects });

    if (db) {
        loadProjects();
        const jn = new URLSearchParams(location.search).get('job');
        if (jn) searchJob(jn);
    }
</script>
</body>
</html>
