<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Database | Pingu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* ═══ Pingu design system — base (copy verbatim into each page's <style>) ═══ */
        :root {
            /* Brand + status palette */
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --secondary: #FFC857;
            --accent: #00D9FF;
            --dark: #1A1A2E;
            --dark-light: #252541;
            --dark-lighter: #2F2F4A;
            --text: #EAEAEA;
            --text-dim: #9A9AB0;
            --success: #4ECCA3;
            --error: #FF6B6B;
            --warning: #FFC857;
            --in-progress: #00D9FF;
            --complete: #4ECCA3;
            --aborted: #FF6B6B;
            --cancelled: #9A9AB0;
            --short-notice: #90ee90;
            --on-hold: #FFDE00;
            --scheduled: #FF6B35;
            /* Surfaces & type */
            --bg: #161628;
            --surface: #1F1F35;
            --surface-2: #252541;
            --line: rgba(255,255,255,0.07);
            --line-2: rgba(255,255,255,0.12);
            --text-strong: #F4F4F8;
            --text-soft: #C8C8D6;
            --radius: 10px;
            --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: var(--font); font-size: 14px; line-height: 1.5;
            background: var(--bg); color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        button, input, select, textarea { font-family: inherit; }
        a { color: var(--accent); }
        .ico { width: 16px; height: 16px; flex: 0 0 auto; vertical-align: -3px; }
        .ico-lg { width: 20px; height: 20px; flex: 0 0 auto; }

        /* ── App bar + Pingu wordmark ── */
        .appbar {
            position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            height: 64px; padding: 0 28px;
            background: rgba(22, 22, 40, 0.92);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line);
        }
        .appbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .logo { display: inline-flex; align-items: center; text-decoration: none; }
        .wordmark {
            font-family: 'Inter', var(--font); font-weight: 800; font-size: 28px;
            letter-spacing: -0.045em; line-height: 1; color: var(--text-strong); padding-top: 6px;
        }
        .i-stem { position: relative; display: inline-block; }
        .i-paw {
            position: absolute; left: 50%; top: -0.17em; transform: translateX(-50%) rotate(-10deg);
            width: 0.5em; height: 0.5em; fill: var(--primary);
            filter: drop-shadow(0 1px 4px rgba(255,107,53,0.35));
            transition: transform .2s ease;
        }
        .logo:hover .i-paw { transform: translateX(-50%) rotate(4deg) scale(1.08); }
        .logo:hover .wordmark { color: #fff; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-soft); text-decoration: none; font-size: 13px; font-weight: 500;
            padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; cursor: pointer;
            transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .back-btn:hover { background: var(--surface-2); color: var(--text-strong); border-color: rgba(255,255,255,0.2); }

        /* ── Page layout ── */
        .container { padding: 24px 28px 40px; }
        .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
        h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-strong); line-height: 1.2; }
        h2 { font-size: 16px; font-weight: 600; color: var(--text-strong); letter-spacing: -0.01em; }
        h3 { font-size: 14px; font-weight: 600; color: var(--text-strong); }
        .muted { color: var(--text-dim); }
        .toolbar { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }

        /* ── Panels / cards ── */
        .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
        .panel + .panel { margin-top: 16px; }
        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -2px 0 14px; }
        .panel-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--text-strong); }
        .panel-title .ico { color: var(--primary); }

        /* ── Form controls ── */
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-label { color: var(--text-dim); font-size: 11.5px; font-weight: 500; }
        .control-input {
            height: 38px; background: var(--surface); border: 1px solid var(--line-2);
            color: var(--text-strong); padding: 0 12px; border-radius: 8px; font-size: 13.5px; width: 100%;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        textarea.control-input { height: auto; min-height: 84px; padding: 9px 11px; resize: vertical; }
        .control-input:hover { border-color: rgba(255,255,255,0.2); }
        .control-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.22); }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); cursor: pointer; }
        input[type="checkbox"], input[type="radio"] { accent-color: var(--primary); }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 7px;
            height: 38px; padding: 0 16px; border-radius: 8px; cursor: pointer;
            font-size: 13.5px; font-weight: 600; text-decoration: none; white-space: nowrap;
            border: 1px solid transparent; transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--surface-2); color: var(--text-strong); border-color: var(--line-2); }
        .btn-secondary:hover { background: var(--dark-lighter); border-color: rgba(255,255,255,0.25); }
        .btn-ghost { background: transparent; color: var(--text-soft); border-color: var(--line-2); }
        .btn-ghost:hover { background: var(--surface-2); color: var(--text-strong); }
        .btn-danger { background: rgba(255,107,107,0.12); color: #FF8A8A; border-color: rgba(255,107,107,0.4); }
        .btn-danger:hover { background: rgba(255,107,107,0.22); }
        .btn-success { background: rgba(78,204,163,0.14); color: var(--success); border-color: rgba(78,204,163,0.45); }
        .btn-success:hover { background: rgba(78,204,163,0.24); }
        .btn-sm { height: 32px; padding: 0 12px; font-size: 12.5px; }
        .btn:disabled, button:disabled { opacity: .45; cursor: not-allowed; }
        .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; height: 38px; }
        .seg button { background: var(--surface); color: var(--text-soft); border: 0; padding: 0 12px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .seg button + button { border-left: 1px solid var(--line-2); }
        .seg button:hover, .seg button.active { background: var(--surface-2); color: var(--text-strong); }

        /* ── KPI tiles ── */
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
        .stat-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; }
        .stat-label { display: flex; align-items: center; gap: 7px; color: var(--text-dim); font-size: 12px; font-weight: 500; white-space: nowrap; }
        .stat-label .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
        .stat-value { font-size: 22px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.02em; line-height: 1.25; margin-top: 2px; font-variant-numeric: tabular-nums; }

        /* ── Tables ── */
        .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
        thead th {
            position: sticky; top: 0; z-index: 2; background: var(--surface);
            text-align: left; padding: 10px 14px; font-size: 11.5px; font-weight: 600; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--line-2); white-space: nowrap;
        }
        tbody td { padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--text-soft); vertical-align: middle; }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover td { background: rgba(255,255,255,0.025); }
        td.strong, .cell-strong { color: var(--text-strong); font-weight: 600; }
        .mono { font-family: var(--mono); font-size: 12.5px; }

        /* ── Badges / status pills ── */
        .badge {
            --c: var(--text-dim);
            display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
            padding: 2px 9px; border-radius: 999px; color: var(--text-strong);
            background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
        }
        .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
        .badge.plain::before { display: none; }
        .tag { font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 4px; background: rgba(255,255,255,0.1); color: var(--text-soft); letter-spacing: .03em; }

        /* ── Notices ── */
        .notice { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 13px;
                  background: rgba(255,255,255,0.03); border: 1px solid var(--line-2); color: var(--text-soft); }
        .notice .ico { margin-top: 1px; }
        .notice.info    { border-color: rgba(0,217,255,0.35);  background: rgba(0,217,255,0.06); }
        .notice.success { border-color: rgba(78,204,163,0.4);  background: rgba(78,204,163,0.07); color: var(--success); }
        .notice.warning { border-color: rgba(255,200,87,0.4);  background: rgba(255,200,87,0.07); color: var(--warning); }
        .notice.error   { border-color: rgba(255,107,107,0.45); background: rgba(255,107,107,0.08); color: #FF8A8A; }

        /* ── Modals ── */
        .modal { display: none; position: fixed; inset: 0; background: rgba(10,10,22,0.72); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
        .modal.show, .modal.active, .modal.open { display: flex; }
        .modal-content { background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; width: 100%; max-width: 680px; max-height: 88vh; overflow-y: auto; box-shadow: 0 30px 80px -20px rgba(0,0,0,0.75); }
        .modal-header { position: sticky; top: 0; z-index: 2; background: var(--surface); display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
        .modal-title { font-size: 17px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.01em; }
        .modal-body { padding: 18px 20px 22px; }
        .close-btn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; border-radius: 8px; color: var(--text-dim); cursor: pointer; font-size: 20px; line-height: 1; }
        .close-btn:hover { background: var(--surface-2); color: var(--text-strong); }

        /* ── Feedback ── */
        .toast { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: none; max-width: 420px; padding: 12px 16px 12px 14px; border-radius: 10px;
                 background: #26263F; color: var(--text-strong); font-size: 13.5px; border: 1px solid var(--line-2); border-left: 3px solid var(--success);
                 box-shadow: 0 16px 40px -12px rgba(0,0,0,0.7); }
        .toast.show { display: block; }
        .toast.error { border-left-color: var(--error); }
        .empty-state, .loading { text-align: center; padding: 56px 16px; color: var(--text-dim); }
        .empty-state h3 { color: var(--text-strong); font-size: 16px; margin-bottom: 4px; }
        .empty-state .ico-lg { width: 32px; height: 32px; color: var(--text-dim); margin-bottom: 10px; }
        .spinner { width: 22px; height: 22px; border: 2px solid var(--line-2); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        *::-webkit-scrollbar { width: 10px; height: 10px; }
        *::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
        *::-webkit-scrollbar-track { background: transparent; }
        @media (max-width: 768px) {
            .appbar, .container { padding-left: 14px; padding-right: 14px; }
            .wordmark { font-size: 24px; }
        }
        /* ═══ end base ═══ */

        /* ── KPI tiles ── */
        .global-stats { grid-template-columns: repeat(2, minmax(150px, 220px)); }

        /* ── Layout ── */
        .main-layout { display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: 16px; align-items: start; }
        .build-panel { position: sticky; top: 80px; }
        .panel-header { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
        .panel-header .ico { color: var(--primary); }
        .panel-header h2 { font-size: 15px; }

        /* ── Form ── */
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; color: var(--text-dim); font-size: 11.5px; font-weight: 500; margin-bottom: 5px; }
        .form-input {
            width: 100%; height: 38px; background: var(--bg); border: 1px solid var(--line-2);
            color: var(--text-strong); padding: 0 12px; border-radius: 8px; font-size: 13.5px;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        .form-input:hover { border-color: rgba(255,255,255,0.2); }
        .form-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.22); }
        .form-input::placeholder { color: var(--text-dim); opacity: .7; }

        .section-divider {
            display: flex; align-items: center; gap: 7px; margin: 16px 0 8px;
            font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text-dim);
        }
        .section-divider:first-child { margin-top: 0; }
        .section-divider .ico { width: 14px; height: 14px; color: var(--primary); }

        .lead-block { background: transparent; }
        .lead-block .form-group:last-child { margin-bottom: 0; }

        .engineer-slots { display: flex; flex-direction: column; gap: 8px; }
        .engineer-slot { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 12px; }
        .engineer-slot:focus-within { border-color: var(--line-2); }
        .slot-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
        .slot-num { font-size: 11.5px; font-weight: 600; color: var(--text-soft); }
        .slot-remove {
            display: inline-flex; align-items: center; gap: 4px;
            background: none; border: 0; color: var(--text-dim); cursor: pointer;
            font-size: 12px; padding: 3px 8px; border-radius: 6px; transition: color .15s ease, background .15s ease;
        }
        .slot-remove:hover { color: #FF8A8A; background: rgba(255,107,107,0.1); }
        .slot-remove .ico { width: 13px; height: 13px; }

        .add-engineer-btn {
            display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; height: 38px; margin-top: 8px;
            background: transparent; border: 1px dashed var(--line-2); color: var(--text-soft);
            border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer;
            transition: border-color .15s ease, color .15s ease, background .15s ease;
        }
        .add-engineer-btn:hover { border-color: var(--primary); color: var(--text-strong); background: rgba(255,107,53,0.06); }

        .submit-btn {
            width: 100%; height: 40px; margin-top: 16px;
            background: var(--primary); color: #fff; border: 0; border-radius: 8px;
            font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s ease;
        }
        .submit-btn:hover { background: var(--primary-dark); }
        .submit-btn:disabled { background: var(--surface-2); color: var(--text-dim); }

        /* ── Team cards ── */
        .teams-panel { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
        .team-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
        .team-card-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
        .team-card-title { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .team-emoji {
            width: 38px; height: 38px; border-radius: 10px; flex: 0 0 auto;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,107,53,0.12); color: var(--primary);
        }
        .team-name-display { font-size: 15px; font-weight: 600; color: var(--text-strong); }
        .team-meta { color: var(--text-dim); font-size: 12px; }
        .team-card-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }

        .chip {
            --c: var(--text-dim);
            display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
            padding: 2px 9px; border-radius: 999px; color: var(--text-strong);
            background: color-mix(in srgb, var(--c) 16%, transparent); border: 1px solid color-mix(in srgb, var(--c) 40%, transparent);
        }
        .chip.lead { --c: var(--complete); }
        .chip.members { --c: var(--text-dim); }

        .btn-icon {
            width: 32px; height: 32px; border-radius: 8px; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
            background: transparent; border: 1px solid var(--line-2); color: var(--text-soft);
            transition: background .15s ease, color .15s ease, border-color .15s ease;
        }
        .btn-icon:hover { background: var(--surface-2); color: var(--text-strong); }
        .btn-icon.delete:hover { background: rgba(255,107,107,0.12); color: #FF8A8A; border-color: rgba(255,107,107,0.4); }

        .team-body { padding: 14px 18px 16px; }
        .lead-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; }
        .lead-avatar, .eng-avatar {
            width: 36px; height: 36px; border-radius: 50%; flex: 0 0 auto;
            display: flex; align-items: center; justify-content: center;
            font-size: 12.5px; font-weight: 700;
        }
        .lead-avatar { background: rgba(255,107,53,0.16); color: var(--primary); }
        .eng-avatar  { width: 32px; height: 32px; font-size: 12px; background: rgba(255,255,255,0.07); color: var(--text-soft); }
        .lead-info-name { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--text-strong); }
        .badge-lead { font-size: 10.5px; font-weight: 700; letter-spacing: .03em; padding: 1px 7px; border-radius: 4px; background: rgba(255,107,53,0.16); color: var(--primary); }
        .engineers-label { color: var(--text-dim); font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
        .engineers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
        .engineer-card { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; }
        .engineer-card .eng-name { font-size: 13px; font-weight: 500; color: var(--text-strong); }

        .teams-panel .empty-state { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
        .empty-icon { display: flex; justify-content: center; }

        /* ── Modal ── */
        .modal-buttons { display: flex; gap: 10px; margin-top: 18px; }
        .modal-buttons .btn-danger { margin-right: auto; }

        /* ── Toast ── */
        .toast { top: 80px; bottom: auto; }
        .toast.show { display: block; }

        @media (max-width: 1024px) {
            .main-layout { grid-template-columns: 1fr; }
            .build-panel { position: static; }
        }
        @media (max-width: 600px) {
            .modal-buttons { flex-direction: column-reverse; }
            .modal-buttons .btn-danger { margin-right: 0; }
            .team-card-header { flex-wrap: wrap; }
            .toast { left: 14px; right: 14px; top: 76px; }
        }
    </style>
</head>
<body>
<header class="appbar">
    <a href="index.html" class="logo" aria-label="Pingu home">

    </a>
    <div class="appbar-actions">
        <a href="index.html" class="back-btn"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Back to Home</a>
    </div>
</header>

<div class="container">
    <div class="page-head">
        <h1>Team database</h1>
    </div>

    <div class="stats-row global-stats">
        <div class="stat-item stat-card">
            <div class="stat-label">Total teams</div>
            <div class="stat-value" id="stat-teams">0</div>
        </div>
        <div class="stat-item stat-card">
            <div class="stat-label">Total engineers</div>
            <div class="stat-value" id="stat-engs">0</div>
        </div>
    </div>

    <div class="main-layout">

        <!-- Build Panel -->
        <div class="panel build-panel">
            <div class="panel-header">
                <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                <h2>Create a team</h2>
            </div>

            <form id="build-form" onsubmit="saveTeam(event)">
                <div class="section-divider"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg><span>Lead engineer</span></div>

                <div class="lead-block">
                    <div class="form-group">
                        <label for="lead-name">Full name *</label>
                        <input type="text" id="lead-name" class="form-input" placeholder="e.g. James Carter" required />
                    </div>
                </div>

                <div class="section-divider"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg><span>Engineers</span></div>

                <div class="engineer-slots" id="engineer-slots"></div>

                <button type="button" class="add-engineer-btn" onclick="addSlot('engineer-slots','add')">
                    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add engineer
                </button>

                <button type="submit" class="submit-btn" id="submit-btn">Create team</button>
            </form>
        </div>

        <!-- Teams List -->
        <div class="teams-panel" id="teams-panel">
            <div class="empty-state">
                <div class="empty-icon"><svg class="ico-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg></div>
                <h3>No teams yet</h3>
                <p>Create your first team using the panel on the left</p>
            </div>
        </div>
    </div>
</div>

<!-- Edit Modal -->
<div class="modal" id="edit-modal">
    <div class="modal-content" style="max-width:560px;">
        <div class="modal-header">
            <h2 class="modal-title">Edit team</h2>
            <button class="close-btn" onclick="closeModal()" aria-label="Close"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="modal-body">
            <form id="edit-form" onsubmit="updateTeam(event)">
                <input type="hidden" id="edit-id" />

                <div class="section-divider"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg><span>Lead engineer</span></div>
                <div class="lead-block">
                    <div class="form-group">
                        <label for="edit-lead-name">Full name *</label>
                        <input type="text" id="edit-lead-name" class="form-input" required />
                    </div>
                </div>

                <div class="section-divider"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg><span>Engineers</span></div>
                <div class="engineer-slots" id="edit-slots"></div>
                <button type="button" class="add-engineer-btn" onclick="addSlot('edit-slots','edit')">
                    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add engineer
                </button>

                <div class="modal-buttons">
                    <button type="button" class="btn btn-danger" onclick="deleteTeam()"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Delete team</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase -->
<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy }
        from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const firebaseConfig = {
        apiKey: "AIzaSyAc_yJQ_rkzuOBh-Yxg0Q4eooXtB-tQjm0",
        authDomain: "pingu-solar.firebaseapp.com",
        projectId: "pingu-solar",
        storageBucket: "pingu-solar.appspot.com",
        messagingSenderId: "232764952866",
        appId: "1:232764952866:web:5923b7f419de6355d6157b",
        measurementId: "G-PFH059DZ64"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.db = db;
    window.FM = { collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy };
    window.addEventListener('DOMContentLoaded', () => window.initPage());
</script>

<script>
    let allTeams = [];
    let editingId = null;
    let addSlotCount = 0;
    let editSlotCount = 0;

    // Line icons used in JS-generated markup
    const ICONS = {
        users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
        edit:  '<path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>',
        trash: '<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
        close: '<path d="M18 6 6 18M6 6l12 12"/>'
    };
    const ICON = (name, cls = 'ico') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;

    window.initPage = async function() {
        await loadTeams();
    };

    window.addSlot = function(containerId, mode) {
        const container = document.getElementById(containerId);
        if (mode === 'add') addSlotCount++;
        else editSlotCount++;
        const num = mode === 'add' ? addSlotCount : editSlotCount;
        const slotId = `${mode}-eng-${num}`;

        const div = document.createElement('div');
        div.className = 'engineer-slot';
        div.id = slotId;
        div.innerHTML = `
            <div class="slot-header">
                <span class="slot-num">Engineer #${num}</span>
                <button type="button" class="slot-remove" onclick="removeSlot('${slotId}')">${ICON('close')}Remove</button>
            </div>
            <input type="text" class="form-input eng-name" placeholder="Full name *" />
        `;
        container.appendChild(div);
    };

    window.removeSlot = function(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
    };

    function collectEngineers(containerId) {
        const slots = document.querySelectorAll('#' + containerId + ' .engineer-slot');
        const result = [];
        slots.forEach(slot => {
            const name = slot.querySelector('.eng-name')?.value.trim() || '';
            if (name) result.push({ name });
        });
        return result;
    }

    window.saveTeam = async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        btn.disabled = true; btn.textContent = 'Saving...';

        const leadName  = document.getElementById('lead-name').value.trim();
        const engineers = collectEngineers('engineer-slots');

        try {
            const { collection, addDoc } = window.FM;
            await addDoc(collection(window.db, 'team-database'), {
                lead: { name: leadName },
                engineers: engineers,
                createdAt: new Date().toISOString()
            });
            showToast('Team created!', 'success');
            document.getElementById('build-form').reset();
            document.getElementById('engineer-slots').innerHTML = '';
            addSlotCount = 0;
            await loadTeams();
        } catch (err) {
            showToast('Error: ' + err.message, 'error');
        } finally {
            btn.disabled = false; btn.textContent = 'Create team';
        }
    };

    async function loadTeams() {
        try {
            const { collection, getDocs, query, orderBy } = window.FM;
            const snap = await getDocs(query(collection(window.db, 'team-database'), orderBy('createdAt','desc')));
            allTeams = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            renderTeams();
            updateStats();
        } catch (err) {
            showToast('Error loading teams: ' + err.message, 'error');
        }
    }

    function renderTeams() {
        const panel = document.getElementById('teams-panel');
        if (allTeams.length === 0) {
            panel.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">${ICON('users', 'ico-lg')}</div>
                    <h3>No teams yet</h3>
                    <p>Create your first team using the panel on the left</p>
                </div>`;
            return;
        }

        panel.innerHTML = allTeams.map(team => {
            const engs = team.engineers || [];
            return `
            <div class="team-card">
                <div class="team-card-header">
                    <div class="team-card-title">
                        <span class="team-emoji">${ICON('users', 'ico-lg')}</span>
                        <div>
                            <div class="team-name-display">${esc(team.lead?.name || '—')}'s Team</div>
                            <div class="team-meta">${engs.length} engineer${engs.length !== 1 ? 's' : ''}</div>
                        </div>
                    </div>
                    <div class="team-card-actions">
                        <span class="chip lead">Lead assigned</span>
                        <span class="chip members">${engs.length} eng</span>
                        <button class="btn-icon" title="Edit" aria-label="Edit" onclick="openEdit('${team.id}')">${ICON('edit')}</button>
                        <button class="btn-icon delete" title="Delete" aria-label="Delete" onclick="quickDelete('${team.id}')">${ICON('trash')}</button>
                    </div>
                </div>
                <div class="team-body">
                    <div class="lead-row">
                        <div class="lead-avatar">${initials(team.lead?.name)}</div>
                        <div>
                            <div class="lead-info-name">
                                ${esc(team.lead?.name || '—')}
                                <span class="badge-lead">Lead</span>
                            </div>
                        </div>
                    </div>
                    ${engs.length > 0 ? `
                        <div class="engineers-label">Team engineers</div>
                        <div class="engineers-grid">
                            ${engs.map(eng => `
                            <div class="engineer-card">
                                <div class="eng-avatar">${initials(eng.name)}</div>
                                <div>
                                    <div class="eng-name">${esc(eng.name)}</div>
                                </div>
                            </div>`).join('')}
                        </div>
                    ` : '<p style="color:var(--text-dim);font-size:0.85rem;margin-top:0.3rem;">No engineers assigned.</p>'}
                </div>
            </div>`;
        }).join('');
    }

    window.openEdit = function(teamId) {
        const team = allTeams.find(t => t.id === teamId);
        if (!team) return;
        editingId = teamId;

        document.getElementById('edit-id').value = teamId;
        document.getElementById('edit-lead-name').value = team.lead?.name || '';

        const slotsEl = document.getElementById('edit-slots');
        slotsEl.innerHTML = '';
        editSlotCount = 0;

        (team.engineers || []).forEach(eng => {
            addSlot('edit-slots', 'edit');
            const slot = slotsEl.lastElementChild;
            slot.querySelector('.eng-name').value = eng.name || '';
        });

        document.getElementById('edit-modal').classList.add('show');
    };

    window.closeModal = function() {
        document.getElementById('edit-modal').classList.remove('show');
        editingId = null;
    };

    window.updateTeam = async function(e) {
        e.preventDefault();
        if (!editingId) return;

        const leadName  = document.getElementById('edit-lead-name').value.trim();
        const engineers = collectEngineers('edit-slots');

        try {
            const { doc, updateDoc } = window.FM;
            await updateDoc(doc(window.db, 'team-database', editingId), {
                lead: { name: leadName },
                engineers,
                updatedAt: new Date().toISOString()
            });
            showToast('Team updated!', 'success');
            closeModal();
            await loadTeams();
        } catch (err) {
            showToast('Error: ' + err.message, 'error');
        }
    };

    window.deleteTeam = async function() {
        if (!editingId) return;
        if (!confirm('Delete this team? This cannot be undone.')) return;
        try {
            const { doc, deleteDoc } = window.FM;
            await deleteDoc(doc(window.db, 'team-database', editingId));
            showToast('Team deleted', 'success');
            closeModal();
            await loadTeams();
        } catch (err) {
            showToast('Error: ' + err.message, 'error');
        }
    };

    window.quickDelete = async function(teamId) {
        if (!confirm('Delete this team? This cannot be undone.')) return;
        try {
            const { doc, deleteDoc } = window.FM;
            await deleteDoc(doc(window.db, 'team-database', teamId));
            showToast('Team deleted', 'success');
            await loadTeams();
        } catch (err) {
            showToast('Error: ' + err.message, 'error');
        }
    };

    function updateStats() {
        document.getElementById('stat-teams').textContent = allTeams.length;
        const total = allTeams.reduce((sum, t) => sum + (t.engineers?.length || 0), 0);
        document.getElementById('stat-engs').textContent = total;
    }

    function initials(name) {
        return (name || '?').split(' ').map(w => w[0]).join('').toUpperCase().substring(0, 2);
    }

    function esc(text) {
        const d = document.createElement('div');
        d.textContent = text || '';
        return d.innerHTML;
    }

    function showToast(msg, type) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.className = 'toast ' + type + ' show';
        setTimeout(() => el.classList.remove('show'), 3500);
    }

    document.getElementById('edit-modal').addEventListener('click', e => {
        if (e.target.id === 'edit-modal') closeModal();
    });
</script>
</body>
</html>
