<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Datasheet | Pingu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* ═══ Pingu design system — base (copy verbatim into each page's <style>) ═══ */
        :root {
            /* Brand + status palette */
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --secondary: #FFC857;
            --accent: #00D9FF;
            --dark: #1A1A2E;
            --dark-light: #252541;
            --dark-lighter: #2F2F4A;
            --text: #EAEAEA;
            --text-dim: #9A9AB0;
            --success: #4ECCA3;
            --error: #FF6B6B;
            --warning: #FFC857;
            --in-progress: #00D9FF;
            --complete: #4ECCA3;
            --aborted: #FF6B6B;
            --cancelled: #9A9AB0;
            --short-notice: #90ee90;
            --on-hold: #FFDE00;
            --scheduled: #FF6B35;
            /* Surfaces & type */
            --bg: #161628;
            --surface: #1F1F35;
            --surface-2: #252541;
            --line: rgba(255,255,255,0.07);
            --line-2: rgba(255,255,255,0.12);
            --text-strong: #F4F4F8;
            --text-soft: #C8C8D6;
            --radius: 10px;
            --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: var(--font); font-size: 14px; line-height: 1.5;
            background: var(--bg); color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        button, input, select, textarea { font-family: inherit; }
        a { color: var(--accent); }
        .ico { width: 16px; height: 16px; flex: 0 0 auto; vertical-align: -3px; }
        .ico-lg { width: 20px; height: 20px; flex: 0 0 auto; }

        /* ── App bar + Pingu wordmark ── */
        .appbar {
            position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            height: 64px; padding: 0 28px;
            background: rgba(22, 22, 40, 0.92);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line);
        }
        .appbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .logo { display: inline-flex; align-items: center; text-decoration: none; }
        .wordmark {
            font-family: 'Inter', var(--font); font-weight: 800; font-size: 28px;
            letter-spacing: -0.045em; line-height: 1; color: var(--text-strong); padding-top: 6px;
        }
        .i-stem { position: relative; display: inline-block; }
        .i-paw {
            position: absolute; left: 50%; top: -0.17em; transform: translateX(-50%) rotate(-10deg);
            width: 0.5em; height: 0.5em; fill: var(--primary);
            filter: drop-shadow(0 1px 4px rgba(255,107,53,0.35));
            transition: transform .2s ease;
        }
        .logo:hover .i-paw { transform: translateX(-50%) rotate(4deg) scale(1.08); }
        .logo:hover .wordmark { color: #fff; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-soft); text-decoration: none; font-size: 13px; font-weight: 500;
            padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; cursor: pointer;
            transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .back-btn:hover { background: var(--surface-2); color: var(--text-strong); border-color: rgba(255,255,255,0.2); }

        /* ── Page layout ── */
        .container { padding: 24px 28px 40px; }
        .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
        h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-strong); line-height: 1.2; }
        h2 { font-size: 16px; font-weight: 600; color: var(--text-strong); letter-spacing: -0.01em; }
        h3 { font-size: 14px; font-weight: 600; color: var(--text-strong); }
        .muted { color: var(--text-dim); }
        .toolbar { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }

        /* ── Panels / cards ── */
        .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
        .panel + .panel { margin-top: 16px; }
        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -2px 0 14px; }
        .panel-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--text-strong); }
        .panel-title .ico { color: var(--primary); }

        /* ── Form controls ── */
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-label { color: var(--text-dim); font-size: 11.5px; font-weight: 500; }
        .control-input {
            height: 38px; background: var(--surface); border: 1px solid var(--line-2);
            color: var(--text-strong); padding: 0 12px; border-radius: 8px; font-size: 13.5px; width: 100%;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        textarea.control-input { height: auto; min-height: 84px; padding: 9px 11px; resize: vertical; }
        .control-input:hover { border-color: rgba(255,255,255,0.2); }
        .control-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.22); }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); cursor: pointer; }
        input[type="checkbox"], input[type="radio"] { accent-color: var(--primary); }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 7px;
            height: 38px; padding: 0 16px; border-radius: 8px; cursor: pointer;
            font-size: 13.5px; font-weight: 600; text-decoration: none; white-space: nowrap;
            border: 1px solid transparent; transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--surface-2); color: var(--text-strong); border-color: var(--line-2); }
        .btn-secondary:hover { background: var(--dark-lighter); border-color: rgba(255,255,255,0.25); }
        .btn-ghost { background: transparent; color: var(--text-soft); border-color: var(--line-2); }
        .btn-ghost:hover { background: var(--surface-2); color: var(--text-strong); }
        .btn-danger { background: rgba(255,107,107,0.12); color: #FF8A8A; border-color: rgba(255,107,107,0.4); }
        .btn-danger:hover { background: rgba(255,107,107,0.22); }
        .btn-success { background: rgba(78,204,163,0.14); color: var(--success); border-color: rgba(78,204,163,0.45); }
        .btn-success:hover { background: rgba(78,204,163,0.24); }
        .btn-sm { height: 32px; padding: 0 12px; font-size: 12.5px; }
        .btn:disabled, button:disabled { opacity: .45; cursor: not-allowed; }
        .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; height: 38px; }
        .seg button { background: var(--surface); color: var(--text-soft); border: 0; padding: 0 12px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .seg button + button { border-left: 1px solid var(--line-2); }
        .seg button:hover, .seg button.active { background: var(--surface-2); color: var(--text-strong); }

        /* ── KPI tiles ── */
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
        .stat-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; }
        .stat-label { display: flex; align-items: center; gap: 7px; color: var(--text-dim); font-size: 12px; font-weight: 500; white-space: nowrap; }
        .stat-label .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
        .stat-value { font-size: 22px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.02em; line-height: 1.25; margin-top: 2px; font-variant-numeric: tabular-nums; }

        /* ── Tables ── */
        .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
        thead th {
            position: sticky; top: 0; z-index: 2; background: var(--surface);
            text-align: left; padding: 10px 14px; font-size: 11.5px; font-weight: 600; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--line-2); white-space: nowrap;
        }
        tbody td { padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--text-soft); vertical-align: middle; }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover td { background: rgba(255,255,255,0.025); }
        td.strong, .cell-strong { color: var(--text-strong); font-weight: 600; }
        .mono { font-family: var(--mono); font-size: 12.5px; }

        /* ── Badges / status pills ── */
        .badge {
            --c: var(--text-dim);
            display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
            padding: 2px 9px; border-radius: 999px; color: var(--text-strong);
            background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
        }
        .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
        .badge.plain::before { display: none; }
        .tag { font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 4px; background: rgba(255,255,255,0.1); color: var(--text-soft); letter-spacing: .03em; }

        /* ── Notices ── */
        .notice { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 13px;
                  background: rgba(255,255,255,0.03); border: 1px solid var(--line-2); color: var(--text-soft); }
        .notice .ico { margin-top: 1px; }
        .notice.info    { border-color: rgba(0,217,255,0.35);  background: rgba(0,217,255,0.06); }
        .notice.success { border-color: rgba(78,204,163,0.4);  background: rgba(78,204,163,0.07); color: var(--success); }
        .notice.warning { border-color: rgba(255,200,87,0.4);  background: rgba(255,200,87,0.07); color: var(--warning); }
        .notice.error   { border-color: rgba(255,107,107,0.45); background: rgba(255,107,107,0.08); color: #FF8A8A; }

        /* ── Modals ── */
        .modal { display: none; position: fixed; inset: 0; background: rgba(10,10,22,0.72); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
        .modal.show, .modal.active, .modal.open { display: flex; }
        .modal-content { background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; width: 100%; max-width: 680px; max-height: 88vh; overflow-y: auto; box-shadow: 0 30px 80px -20px rgba(0,0,0,0.75); }
        .modal-header { position: sticky; top: 0; z-index: 2; background: var(--surface); display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
        .modal-title { font-size: 17px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.01em; }
        .modal-body { padding: 18px 20px 22px; }
        .close-btn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; border-radius: 8px; color: var(--text-dim); cursor: pointer; font-size: 20px; line-height: 1; }
        .close-btn:hover { background: var(--surface-2); color: var(--text-strong); }

        /* ── Feedback ── */
        .toast { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: none; max-width: 420px; padding: 12px 16px 12px 14px; border-radius: 10px;
                 background: #26263F; color: var(--text-strong); font-size: 13.5px; border: 1px solid var(--line-2); border-left: 3px solid var(--success);
                 box-shadow: 0 16px 40px -12px rgba(0,0,0,0.7); }
        .toast.show { display: block; }
        .toast.error { border-left-color: var(--error); }
        .empty-state, .loading { text-align: center; padding: 56px 16px; color: var(--text-dim); }
        .empty-state h3 { color: var(--text-strong); font-size: 16px; margin-bottom: 4px; }
        .empty-state .ico-lg { width: 32px; height: 32px; color: var(--text-dim); margin-bottom: 10px; }
        .spinner { width: 22px; height: 22px; border: 2px solid var(--line-2); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        *::-webkit-scrollbar { width: 10px; height: 10px; }
        *::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
        *::-webkit-scrollbar-track { background: transparent; }
        @media (max-width: 768px) {
            .appbar, .container { padding-left: 14px; padding-right: 14px; }
            .wordmark { font-size: 24px; }
        }
        /* ═══ end base ═══ */

        /* ═══ page ═══ */
        :root { --snc: var(--short-notice); }

        .refresh-btn.loading { opacity: .6; cursor: not-allowed; }

        /* Loading / error */
        .loading-state, .error-state { text-align: center; padding: 64px 16px; color: var(--text-dim); }
        .loading-spinner { width: 28px; height: 28px; border: 2px solid var(--line-2); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 14px; }
        .error-state .ico-lg { width: 32px; height: 32px; color: var(--error); margin-bottom: 10px; }
        .error-title { color: var(--text-strong); font-size: 16px; font-weight: 600; margin-bottom: 4px; }

        /* Three-column week grid */
        .weeks-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }

        .week-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
        .week-card.last-week { border-top: 3px solid var(--text-dim); }
        .week-card.this-week { border-top: 3px solid var(--primary); }
        .week-card.next-week { border-top: 3px solid var(--accent); }

        .week-header { padding: 16px 20px 14px; border-bottom: 1px solid var(--line); }
        .week-badge {
            display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600;
            padding: 2px 9px; border-radius: 999px; margin-bottom: 8px; color: var(--text-strong);
        }
        .week-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
        .badge-last { background: rgba(154,154,176,0.16); border: 1px solid rgba(154,154,176,0.4); }
        .badge-last::before { background: var(--text-dim); }
        .badge-this { background: rgba(255,107,53,0.16); border: 1px solid rgba(255,107,53,0.45); }
        .badge-this::before { background: var(--primary); }
        .badge-next { background: rgba(0,217,255,0.12); border: 1px solid rgba(0,217,255,0.4); }
        .badge-next::before { background: var(--accent); }
        .week-title { font-size: 16px; font-weight: 600; color: var(--text-strong); letter-spacing: -0.01em; line-height: 1.3; }
        .week-dates { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; font-variant-numeric: tabular-nums; }

        /* Big number */
        .total-jobs-banner { padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; background: var(--surface-2); border-bottom: 1px solid var(--line); }
        .total-label { font-size: 12px; color: var(--text-dim); font-weight: 500; }
        .total-sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
        .total-number { font-size: 32px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }

        /* Stat rows */
        .stats-list { padding: 4px 20px 14px; display: flex; flex-direction: column; }
        .stat-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); }
        .stat-row:last-child { border-bottom: 0; }
        .stat-left { display: flex; align-items: center; gap: 9px; }
        .stat-icon { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
        .stat-name { font-size: 13px; color: var(--text-soft); }
        .stat-val { font-size: 16px; font-weight: 700; color: var(--text-strong); font-variant-numeric: tabular-nums; }

        /* Progress */
        .progress-section { padding: 0 20px 16px; }
        .progress-label { font-size: 12px; color: var(--text-dim); margin-bottom: 7px; display: flex; justify-content: space-between; }
        .progress-label span { color: var(--text-strong); font-weight: 700; }
        .progress-track { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 99px; }
        .fill-green { background: var(--complete); }
        .fill-orange { background: var(--primary); }

        /* Insight notes */
        .insight-box { margin: 0 20px 14px; padding: 10px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; display: flex; align-items: flex-start; gap: 9px; }
        .insight-box .ico { margin-top: 2px; }
        .insight-good   { background: rgba(78,204,163,0.07); border: 1px solid rgba(78,204,163,0.4); color: var(--success); }
        .insight-warn   { background: rgba(255,200,87,0.07); border: 1px solid rgba(255,200,87,0.4); color: var(--warning); }
        .insight-danger { background: rgba(255,107,107,0.08); border: 1px solid rgba(255,107,107,0.45); color: #FF8A8A; }
        .insight-info   { background: rgba(0,217,255,0.06); border: 1px solid rgba(0,217,255,0.35); color: var(--accent); }

        /* Breakdown tables */
        .breakdown-section { padding: 14px 20px 16px; border-top: 1px solid var(--line); }
        .breakdown-title { font-size: 11.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; margin-bottom: 6px; }
        .engineer-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .engineer-table th { position: static; background: transparent; padding: 6px 0; font-size: 11px; }
        .engineer-table th:last-child { text-align: right; }
        .engineer-table td { padding: 7px 0; color: var(--text-soft); border-bottom: 1px solid var(--line); }
        .engineer-table td:last-child { text-align: right; font-weight: 700; color: var(--text-strong); font-variant-numeric: tabular-nums; }
        .engineer-table tr:last-child td { border-bottom: none; }
        .engineer-table tr:hover td { background: transparent; color: var(--text-strong); }
        .type-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
        .type-bar { width: 56px; height: 4px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
        .type-bar > div { height: 100%; border-radius: 99px; }
        .type-count { font-weight: 700; color: var(--text-strong); min-width: 18px; text-align: right; }

        /* Status bar */
        .status-bar { display: flex; height: 6px; border-radius: 99px; overflow: hidden; margin: 14px 20px 6px; gap: 2px; }
        .status-bar-seg { height: 100%; border-radius: 2px; }

        .footer-ts { text-align: center; color: var(--text-dim); font-size: 12px; margin-top: 24px; }

        @media (max-width: 1100px) { .weeks-grid { grid-template-columns: minmax(0, 1fr); } }
    </style>
</head>

        appId:             "1:232764952866:web:5923b7f419de6355d6157b",
        measurementId:     "G-PFH059DZ64"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);
    window._fb = { db, collection, getDocs, query, orderBy };
    console.log('✅ Firebase ready');
    window.loadData();
</script>

<script>
/* ════════════════════════════════════════════
   UTILS
════════════════════════════════════════════ */
function parseDate(v) {
    if (!v) return null;
    if (typeof v === 'string' && v.includes('/')) {
        const p = v.split('/');
        if (p.length === 3) {
            const d = new Date(+p[2], +p[1]-1, +p[0]);
            if (!isNaN(d)) { d.setHours(0,0,0,0); return d; }
        }
    }
    const d = new Date(v);
    if (!isNaN(d)) { d.setHours(0,0,0,0); return d; }
    return null;
}

function weekBounds(offsetWeeks = 0) {
    const today = new Date(); today.setHours(0,0,0,0);
    const day   = today.getDay();
    const diffToMon = (day === 0) ? 6 : day - 1;
    const mon   = new Date(today); mon.setDate(today.getDate() - diffToMon + offsetWeeks * 7);
    const sun   = new Date(mon);   sun.setDate(mon.getDate() + 6); sun.setHours(23,59,59,999);
    return { start: mon, end: sun };
}

function fmtDate(d) {
    if (!d) return '–';
    return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short' });
}

function fmtFull(d) {
    if (!d) return '–';
    return d.toLocaleDateString('en-GB', { weekday:'short', day:'2-digit', month:'short', year:'numeric' });
}

function esc(s) {
    const d = document.createElement('div'); d.textContent = String(s ?? ''); return d.innerHTML;
}

const ICONS = {
    refresh: '<path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/>',
    check:   '<path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="m9 11 3 3L22 4"/>',
    alert:   '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
    trend:   '<path d="m22 7-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/>',
    chart:   '<path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/>',
    inbox:   '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1z"/>',
    ban:     '<circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/>',
    calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>'
};
const ICON = (name, cls = 'ico') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;

/* ════════════════════════════════════════════
   LOAD
════════════════════════════════════════════ */
window.loadData = async function() {
    const btn = document.getElementById('refresh-btn');
    btn.classList.add('loading'); btn.innerHTML = ICON('refresh') + 'Loading…';

    document.getElementById('content').innerHTML = `
        <div class="loading-state">
            <div class="loading-spinner"></div>
            <div>Fetching jobs…</div>
        </div>`;

    try {
        const { db, collection, getDocs, query, orderBy } = window._fb;

        // ── Fetch Solar-jobs ──
        const solarSnap = await getDocs(query(collection(db,'Solar-jobs'), orderBy('uploadDate','desc')));
        // ── Fetch jobs ──
        const jobsSnap  = { forEach() {}, docs: [], size: 0, empty: true }; // legacy 'jobs' collection retired — Solar-jobs only

        const processDoc = (snap, source) => {
            const data = snap.data();

            let parsedDate = null;
            for (const f of ['Booked Date','Install Date','Projected Completion Date','installedDate','bookingDate']) {
                if (data[f]) { parsedDate = parseDate(data[f]); if (parsedDate) break; }
            }

            let jobLength = 1;
            for (const f of ['Days','Job Length (days)','Job Length','jobLength','Duration','duration']) {
                if (data[f] != null && data[f] !== '') {
                    const p = parseInt(data[f],10); if (!isNaN(p) && p > 0) { jobLength = p; break; }
                }
            }

            let engineer = 'Unassigned';
            for (const f of ['Lead','Lead Engineer','Engineer','engineer']) {
                if (data[f]?.trim()) { engineer = data[f].trim(); break; }
            }

            return {
                id:          snap.id,
                source,
                jobNumber:   String(data['Job Number'] || 'N/A').trim(),
                parsedDate,
                jobLength,
                engineer,
                jobType:     data['Job Type'] || 'Standard',
                status:      data['Status Update'] || data['status'] || 'Scheduled',
                completedDays: data['completedDays'] || [],
            };
        };

        const solarMap = new Map();
        solarSnap.forEach(d => {
            const j = processDoc(d,'solar');
            if (!solarMap.has(j.jobNumber)) solarMap.set(j.jobNumber, j);
        });

        const jobsMapLocal = new Map();
        jobsSnap.forEach(d => {
            const j = processDoc(d,'jobs');
            if (!jobsMapLocal.has(j.jobNumber)) jobsMapLocal.set(j.jobNumber, j);
        });

        // Merge
        const allJobs = [];
        solarMap.forEach((j, jn) => {
            allJobs.push({ ...j, source: jobsMapLocal.has(jn) ? 'both' : 'solar' });
        });
        jobsMapLocal.forEach((j, jn) => {
            if (!solarMap.has(jn)) allJobs.push(j);
        });

        // Only jobs with a date
        const jobs = allJobs.filter(j => j.parsedDate != null);

        renderDashboard(jobs);

        document.getElementById('footer-ts').textContent =
            `Last refreshed: ${new Date().toLocaleString('en-GB')} · ${jobs.length} total jobs loaded`;

    } catch(err) {
        document.getElementById('content').innerHTML = `
            <div class="error-state">
                ${ICON('alert', 'ico-lg')}
                <div class="error-title">Failed to load data</div>
                <div style="font-size:13px;color:var(--text-dim);">${esc(err.message)}</div>
            </div>`;
    } finally {
        btn.classList.remove('loading'); btn.innerHTML = ICON('refresh') + 'Refresh';
    }
};

/* ════════════════════════════════════════════
   ANALYSE WEEK
════════════════════════════════════════════ */
function analyseWeek(allJobs, bounds) {
    const jobs = allJobs.filter(j => {
        const s = new Date(j.parsedDate); s.setHours(0,0,0,0);
        return s >= bounds.start && s <= bounds.end;
    });

    const booked     = jobs.length;
    const complete   = jobs.filter(j => j.status === 'Complete').length;
    const inProgress = jobs.filter(j => j.status === 'In-Progress').length;
    const aborted    = jobs.filter(j => j.status === 'Aborted').length;
    const cancelled  = jobs.filter(j => j.status === 'Cancelled').length;
    const snc        = jobs.filter(j => j.status === 'Short Notice Cancellation').length;
    const scheduled  = jobs.filter(j => !['Complete','In-Progress','Aborted','Cancelled','Short Notice Cancellation'].includes(j.status)).length;

    // Engineer breakdown
    const engMap = {};
    jobs.forEach(j => {
        const e = j.engineer || 'Unassigned';
        engMap[e] = (engMap[e] || 0) + 1;
    });
    const engineers = Object.entries(engMap).sort((a,b) => b[1]-a[1]);

    // Job type breakdown
    const typeMap = {};
    jobs.forEach(j => {
        const t = j.jobType || 'Standard';
        typeMap[t] = (typeMap[t] || 0) + 1;
    });
    const jobTypes = Object.entries(typeMap).sort((a,b) => b[1]-a[1]);

    return { jobs, booked, complete, inProgress, aborted, cancelled, snc, scheduled, engineers, jobTypes };
}

/* ════════════════════════════════════════════
   ON-TRACK LOGIC (for "this week")
   On-track = (complete + in-progress) / (booked - cancelled - snc - aborted) >= 60%
════════════════════════════════════════════ */
function onTrackInsight(data) {
    const active = data.booked - data.cancelled - data.snc - data.aborted;
    if (active <= 0) return null;
    const done   = data.complete;
    const pct    = Math.round((done / active) * 100);
    const today  = new Date(); today.setHours(0,0,0,0);
    const thisBounds = weekBounds(0);
    const daysLeft   = Math.ceil((thisBounds.end - today) / 86400000);
    const daysPassed = 7 - daysLeft;

    // Expected completion pace based on days passed
    const expectedPct = Math.round((daysPassed / 7) * 100);

    if (data.scheduled === 0 && data.inProgress === 0 && data.complete > 0) {
        return { cls:'insight-good', icon:ICON('check'), text:`All active jobs complete — great week!` };
    }
    if (pct >= expectedPct + 10) {
        return { cls:'insight-good', icon:ICON('trend'), text:`Ahead of pace — ${pct}% complete vs ${expectedPct}% expected by now` };
    }
    if (pct >= expectedPct - 10) {
        return { cls:'insight-warn', icon:ICON('chart'), text:`On track — ${pct}% complete, ${data.scheduled + data.inProgress} job${data.scheduled+data.inProgress!==1?'s':''} still running` };
    }
    return { cls:'insight-danger', icon:ICON('alert'), text:`Behind pace — only ${pct}% complete vs ${expectedPct}% expected. ${data.scheduled + data.inProgress} jobs outstanding` };
}

/* ════════════════════════════════════════════
   RENDER
════════════════════════════════════════════ */
function renderDashboard(allJobs) {
    const last = weekBounds(-1);
    const curr = weekBounds(0);
    const next = weekBounds(1);

    const lastData = analyseWeek(allJobs, last);
    const currData = analyseWeek(allJobs, curr);
    const nextData = analyseWeek(allJobs, next);

    const insight  = onTrackInsight(currData);

    const html = `
    <div class="weeks-grid">
        ${renderLastWeek(lastData, last)}
        ${renderThisWeek(currData, curr, insight)}
        ${renderNextWeek(nextData, next)}
    </div>`;

    document.getElementById('content').innerHTML = html;
}

/* ── Shared: status bar ── */
function statusBar(data) {
    if (!data.booked) return '';
    const b  = data.booked;
    const segs = [
        { pct: (data.complete/b)*100,   cls:'fill-green',  color:'var(--complete)' },
        { pct: (data.inProgress/b)*100, cls:'',            color:'var(--in-progress)' },
        { pct: (data.aborted/b)*100,    cls:'',            color:'var(--aborted)' },
        { pct: (data.cancelled/b)*100,  cls:'',            color:'var(--cancelled)' },
        { pct: (data.snc/b)*100,        cls:'',            color:'var(--snc)' },
        { pct: (data.scheduled/b)*100,  cls:'',            color:'var(--scheduled)' },
    ].filter(s => s.pct > 0);

    return `<div class="status-bar">
        ${segs.map(s => `<div class="status-bar-seg" style="width:${s.pct}%;background:${s.color};"></div>`).join('')}
    </div>`;
}

/* ── Shared: engineer table ── */
function engTable(engineers) {
    if (!engineers.length) return '';
    const rows = engineers.slice(0,8).map(([name, count]) =>
        `<tr><td>${esc(name)}</td><td>${count}</td></tr>`
    ).join('');
    const more = engineers.length > 8
        ? `<tr><td style="color:var(--text-dim);font-size:12px;">+ ${engineers.length-8} more engineers…</td><td></td></tr>` : '';
    return `
    <div class="breakdown-section">
        <div class="breakdown-title">Jobs by engineer</div>
        <table class="engineer-table">
            <thead><tr><th>Engineer</th><th style="text-align:right;">Jobs</th></tr></thead>
            <tbody>${rows}${more}</tbody>
        </table>
    </div>`;
}

/* ── Shared: job type table ── */
function typeTable(jobTypes) {
    if (!jobTypes.length) return '';
    // colour accent cycles
    const accents = [
        'var(--primary)', 'var(--accent)', 'var(--secondary)',
        'var(--success)', 'var(--snc)', 'var(--in-progress)',
        '#B65EFF', '#FF6B6B', '#FFC857', '#00D9FF'
    ];
    const total = jobTypes.reduce((s,[,c]) => s+c, 0);
    const rows = jobTypes.map(([type, count], i) => {
        const pct   = total > 0 ? Math.round((count/total)*100) : 0;
        const color = accents[i % accents.length];
        return `<tr>
            <td>
                <div style="display:flex;align-items:center;gap:8px;">
                    <span class="type-dot" style="background:${color};"></span>
                    ${esc(type)}
                </div>
            </td>
            <td>
                <div style="display:flex;align-items:center;gap:10px;justify-content:flex-end;">
                    <div class="type-bar">
                        <div style="width:${pct}%;background:${color};"></div>
                    </div>
                    <span class="type-count">${count}</span>
                </div>
            </td>
        </tr>`;
    }).join('');
    return `
    <div class="breakdown-section">
        <div class="breakdown-title">Jobs by type</div>
        <table class="engineer-table">
            <thead><tr><th>Type</th><th style="text-align:right;">Count</th></tr></thead>
            <tbody>${rows}</tbody>
        </table>
    </div>`;
}

/* ── Shared: job type table ── */
function typeTable(jobTypes) {
    if (!jobTypes.length) return '';
    const accents = [
        'var(--primary)', 'var(--accent)', 'var(--secondary)',
        'var(--success)', 'var(--snc)', 'var(--in-progress)',
        '#B65EFF', '#FF6B6B', '#FFC857', '#00D9FF'
    ];
    const total = jobTypes.reduce((s,[,c]) => s+c, 0);
    const rows = jobTypes.map(([type, count], i) => {
        const pct   = total > 0 ? Math.round((count/total)*100) : 0;
        const color = accents[i % accents.length];
        return `<tr>
            <td>
                <div style="display:flex;align-items:center;gap:8px;">
                    <span class="type-dot" style="background:${color};"></span>
                    ${esc(type)}
                </div>
            </td>
            <td>
                <div style="display:flex;align-items:center;gap:10px;justify-content:flex-end;">
                    <div class="type-bar">
                        <div style="width:${pct}%;background:${color};"></div>
                    </div>
                    <span class="type-count">${count}</span>
                </div>
            </td>
        </tr>`;
    }).join('');
    return `
    <div class="breakdown-section">
        <div class="breakdown-title">Jobs by type</div>
        <table class="engineer-table">
            <thead><tr><th>Type</th><th style="text-align:right;">Count</th></tr></thead>
            <tbody>${rows}</tbody>
        </table>
    </div>`;
}


// first argument is now the status colour shown as a dot
function statRow(icon, label, value, valClass) {
    return `<div class="stat-row">
        <div class="stat-left">
            <span class="stat-icon" style="background:${icon}"></span>
            <span class="stat-name">${label}</span>
        </div>
        <span class="stat-val ${valClass}">${value}</span>
    </div>`;
}

/* ════════
   LAST WEEK
════════ */
function renderLastWeek(d, bounds) {
    const cancelledTotal = d.cancelled + d.snc;
    const completionRate = d.booked > 0 ? Math.round((d.complete / d.booked) * 100) : 0;

    return `
    <div class="week-card last-week">
        <div class="week-header">
            <div class="week-badge badge-last">Last week</div>
            <div class="week-title">How did we do?</div>
            <div class="week-dates">${fmtDate(bounds.start)} – ${fmtDate(bounds.end)}</div>
        </div>

        <div class="total-jobs-banner">
            <div>
                <div class="total-label">Jobs booked</div>
                <div class="total-sub">${d.engineers.length} engineer${d.engineers.length!==1?'s':''}</div>
            </div>
            <div class="total-number">${d.booked}</div>
        </div>

        ${statusBar(d)}

        <div class="stats-list">
            ${statRow('var(--complete)','Completed',  d.complete,  'val-complete')}
            ${statRow('var(--in-progress)','In progress',d.inProgress,'val-inprogress')}
            ${statRow('var(--aborted)','Aborted',    d.aborted,   'val-aborted')}
            ${statRow('var(--cancelled)','Cancelled',  d.cancelled, 'val-cancelled')}
            ${statRow('var(--short-notice)','SNC',        d.snc,       'val-snc')}
        </div>

        ${d.booked > 0 ? `
        <div class="progress-section">
            <div class="progress-label">Completion rate <span>${completionRate}%</span></div>
            <div class="progress-track">
                <div class="progress-fill fill-green" style="width:${completionRate}%;"></div>
            </div>
        </div>` : ''}

        ${cancelledTotal > 0 ? `
        <div class="insight-box insight-warn">
            ${ICON('alert')}<span>${cancelledTotal} job${cancelledTotal!==1?'s':''} lost to cancellation last week</span>
        </div>` : d.booked > 0 ? `
        <div class="insight-box insight-good">
            ${ICON('check')}<span>Zero cancellations last week</span>
        </div>` : `
        <div class="insight-box insight-info">
            ${ICON('inbox')}<span>No jobs were booked this week</span>
        </div>`}

        ${engTable(d.engineers)}
        ${typeTable(d.jobTypes)}
    </div>`;
}

/* ════════
   THIS WEEK
════════ */
function renderThisWeek(d, bounds, insight) {
    const cancelledSoFar = d.cancelled + d.snc;
    const activeJobs     = d.booked - d.cancelled - d.snc - d.aborted;
    const pctDone        = activeJobs > 0 ? Math.round((d.complete / activeJobs) * 100) : 0;

    return `
    <div class="week-card this-week">
        <div class="week-header">
            <div class="week-badge badge-this">This week</div>
            <div class="week-title">Current status</div>
            <div class="week-dates">${fmtDate(bounds.start)} – ${fmtDate(bounds.end)}</div>
        </div>

        <div class="total-jobs-banner">
            <div>
                <div class="total-label">Jobs booked</div>
                <div class="total-sub">${d.engineers.length} engineer${d.engineers.length!==1?'s':''}</div>
            </div>
            <div class="total-number">${d.booked}</div>
        </div>

        ${statusBar(d)}

        <div class="stats-list">
            ${statRow('var(--complete)','Complete',    d.complete,   'val-complete')}
            ${statRow('var(--in-progress)','In progress', d.inProgress, 'val-inprogress')}
            ${statRow('var(--scheduled)','Scheduled',   d.scheduled,  'val-scheduled')}
            ${statRow('var(--aborted)','Aborted',     d.aborted,    'val-aborted')}
            ${statRow('var(--cancelled)','Cancelled',   d.cancelled,  'val-cancelled')}
            ${statRow('var(--short-notice)','SNC',         d.snc,        'val-snc')}
        </div>

        ${activeJobs > 0 ? `
        <div class="progress-section">
            <div class="progress-label">Progress (excl. cancellations) <span>${pctDone}%</span></div>
            <div class="progress-track">
                <div class="progress-fill fill-orange" style="width:${pctDone}%;"></div>
            </div>
        </div>` : ''}

        ${insight ? `<div class="insight-box ${insight.cls}">${insight.icon}<span>${insight.text}</span></div>` : ''}

        ${cancelledSoFar > 0 ? `
        <div class="insight-box insight-warn">
            ${ICON('ban')}<span>${cancelledSoFar} cancellation${cancelledSoFar!==1?'s':''} so far this week</span>
        </div>` : ''}

        ${engTable(d.engineers)}
        ${typeTable(d.jobTypes)}
    </div>`;
}

/* ════════
   NEXT WEEK
════════ */
function renderNextWeek(d, bounds) {
    return `
    <div class="week-card next-week">
        <div class="week-header">
            <div class="week-badge badge-next">Next week</div>
            <div class="week-title">What's coming?</div>
            <div class="week-dates">${fmtDate(bounds.start)} – ${fmtDate(bounds.end)}</div>
        </div>

        <div class="total-jobs-banner">
            <div>
                <div class="total-label">Jobs booked</div>
                <div class="total-sub">${d.engineers.length} engineer${d.engineers.length!==1?'s':''}</div>
            </div>
            <div class="total-number">${d.booked}</div>
        </div>

        <div class="stats-list" style="padding-top:8px">
            ${statRow('var(--scheduled)','Scheduled',  d.scheduled,  'val-scheduled')}
            ${statRow('var(--in-progress)','In progress',d.inProgress, 'val-inprogress')}
            ${statRow('var(--cancelled)','Cancelled',  d.cancelled,  'val-cancelled')}
            ${statRow('var(--short-notice)','SNC',        d.snc,        'val-snc')}
        </div>

        ${d.booked === 0 ? `
        <div class="insight-box insight-info">
            ${ICON('inbox')}<span>Nothing booked yet — calendar is clear</span>
        </div>` : d.booked <= 5 ? `
        <div class="insight-box insight-warn">
            ${ICON('calendar')}<span>Light week ahead — only ${d.booked} job${d.booked!==1?'s':''} booked</span>
        </div>` : `
        <div class="insight-box insight-good">
            ${ICON('trend')}<span>${d.booked} job${d.booked!==1?'s':''} lined up for next week</span>
        </div>`}

        ${engTable(d.engineers)}
        ${typeTable(d.jobTypes)}
    </div>`;
}
</script>
</body>
</html>
