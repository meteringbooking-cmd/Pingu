<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stocktake Review | Pingu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* ═══ Pingu design system — base (copy verbatim into each page's <style>) ═══ */
        :root {
            /* Brand + status palette */
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --secondary: #FFC857;
            --accent: #00D9FF;
            --dark: #1A1A2E;
            --dark-light: #252541;
            --dark-lighter: #2F2F4A;
            --text: #EAEAEA;
            --text-dim: #9A9AB0;
            --success: #4ECCA3;
            --error: #FF6B6B;
            --warning: #FFC857;
            --in-progress: #00D9FF;
            --complete: #4ECCA3;
            --aborted: #FF6B6B;
            --cancelled: #9A9AB0;
            --short-notice: #90ee90;
            --on-hold: #FFDE00;
            --scheduled: #FF6B35;
            /* Surfaces & type */
            --bg: #161628;
            --surface: #1F1F35;
            --surface-2: #252541;
            --line: rgba(255,255,255,0.07);
            --line-2: rgba(255,255,255,0.12);
            --text-strong: #F4F4F8;
            --text-soft: #C8C8D6;
            --radius: 10px;
            --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: var(--font); font-size: 14px; line-height: 1.5;
            background: var(--bg); color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        button, input, select, textarea { font-family: inherit; }
        a { color: var(--accent); }
        .ico { width: 16px; height: 16px; flex: 0 0 auto; vertical-align: -3px; }
        .ico-lg { width: 20px; height: 20px; flex: 0 0 auto; }

        /* ── App bar + Pingu wordmark ── */
        .appbar {
            position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            height: 64px; padding: 0 28px;
            background: rgba(22, 22, 40, 0.92);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line);
        }
        .appbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .logo { display: inline-flex; align-items: center; text-decoration: none; }
        .wordmark {
            font-family: 'Inter', var(--font); font-weight: 800; font-size: 28px;
            letter-spacing: -0.045em; line-height: 1; color: var(--text-strong); padding-top: 6px;
        }
        .i-stem { position: relative; display: inline-block; }
        .i-paw {
            position: absolute; left: 50%; top: -0.17em; transform: translateX(-50%) rotate(-10deg);
            width: 0.5em; height: 0.5em; fill: var(--primary);
            filter: drop-shadow(0 1px 4px rgba(255,107,53,0.35));
            transition: transform .2s ease;
        }
        .logo:hover .i-paw { transform: translateX(-50%) rotate(4deg) scale(1.08); }
        .logo:hover .wordmark { color: #fff; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-soft); text-decoration: none; font-size: 13px; font-weight: 500;
            padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; cursor: pointer;
            transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .back-btn:hover { background: var(--surface-2); color: var(--text-strong); border-color: rgba(255,255,255,0.2); }

        /* ── Page layout ── */
        .container { padding: 24px 28px 40px; }
        .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
        h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-strong); line-height: 1.2; }
        h2 { font-size: 16px; font-weight: 600; color: var(--text-strong); letter-spacing: -0.01em; }
        h3 { font-size: 14px; font-weight: 600; color: var(--text-strong); }
        .muted { color: var(--text-dim); }
        .toolbar { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }

        /* ── Panels / cards ── */
        .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
        .panel + .panel { margin-top: 16px; }
        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -2px 0 14px; }
        .panel-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--text-strong); }
        .panel-title .ico { color: var(--primary); }

        /* ── Form controls ── */
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-label { color: var(--text-dim); font-size: 11.5px; font-weight: 500; }
        .control-input {
            height: 38px; background: var(--surface); border: 1px solid var(--line-2);
            color: var(--text-strong); padding: 0 12px; border-radius: 8px; font-size: 13.5px; width: 100%;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        textarea.control-input { height: auto; min-height: 84px; padding: 9px 11px; resize: vertical; }
        .control-input:hover { border-color: rgba(255,255,255,0.2); }
        .control-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.22); }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); cursor: pointer; }
        input[type="checkbox"], input[type="radio"] { accent-color: var(--primary); }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 7px;
            height: 38px; padding: 0 16px; border-radius: 8px; cursor: pointer;
            font-size: 13.5px; font-weight: 600; text-decoration: none; white-space: nowrap;
            border: 1px solid transparent; transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--surface-2); color: var(--text-strong); border-color: var(--line-2); }
        .btn-secondary:hover { background: var(--dark-lighter); border-color: rgba(255,255,255,0.25); }
        .btn-ghost { background: transparent; color: var(--text-soft); border-color: var(--line-2); }
        .btn-ghost:hover { background: var(--surface-2); color: var(--text-strong); }
        .btn-danger { background: rgba(255,107,107,0.12); color: #FF8A8A; border-color: rgba(255,107,107,0.4); }
        .btn-danger:hover { background: rgba(255,107,107,0.22); }
        .btn-success { background: rgba(78,204,163,0.14); color: var(--success); border-color: rgba(78,204,163,0.45); }
        .btn-success:hover { background: rgba(78,204,163,0.24); }
        .btn-sm { height: 32px; padding: 0 12px; font-size: 12.5px; }
        .btn:disabled, button:disabled { opacity: .45; cursor: not-allowed; }
        .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; height: 38px; }
        .seg button { background: var(--surface); color: var(--text-soft); border: 0; padding: 0 12px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .seg button + button { border-left: 1px solid var(--line-2); }
        .seg button:hover, .seg button.active { background: var(--surface-2); color: var(--text-strong); }

        /* ── KPI tiles ── */
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
        .stat-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; }
        .stat-label { display: flex; align-items: center; gap: 7px; color: var(--text-dim); font-size: 12px; font-weight: 500; white-space: nowrap; }
        .stat-label .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
        .stat-value { font-size: 22px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.02em; line-height: 1.25; margin-top: 2px; font-variant-numeric: tabular-nums; }

        /* ── Tables ── */
        .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
        thead th {
            position: sticky; top: 0; z-index: 2; background: var(--surface);
            text-align: left; padding: 10px 14px; font-size: 11.5px; font-weight: 600; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--line-2); white-space: nowrap;
        }
        tbody td { padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--text-soft); vertical-align: middle; }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover td { background: rgba(255,255,255,0.025); }
        td.strong, .cell-strong { color: var(--text-strong); font-weight: 600; }
        .mono { font-family: var(--mono); font-size: 12.5px; }

        /* ── Badges / status pills ── */
        .badge {
            --c: var(--text-dim);
            display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
            padding: 2px 9px; border-radius: 999px; color: var(--text-strong);
            background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
        }
        .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
        .badge.plain::before { display: none; }
        .tag { font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 4px; background: rgba(255,255,255,0.1); color: var(--text-soft); letter-spacing: .03em; }

        /* ── Notices ── */
        .notice { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 13px;
                  background: rgba(255,255,255,0.03); border: 1px solid var(--line-2); color: var(--text-soft); }
        .notice .ico { margin-top: 1px; }
        .notice.info    { border-color: rgba(0,217,255,0.35);  background: rgba(0,217,255,0.06); }
        .notice.success { border-color: rgba(78,204,163,0.4);  background: rgba(78,204,163,0.07); color: var(--success); }
        .notice.warning { border-color: rgba(255,200,87,0.4);  background: rgba(255,200,87,0.07); color: var(--warning); }
        .notice.error   { border-color: rgba(255,107,107,0.45); background: rgba(255,107,107,0.08); color: #FF8A8A; }

        /* ── Modals ── */
        .modal { display: none; position: fixed; inset: 0; background: rgba(10,10,22,0.72); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
        .modal.show, .modal.active, .modal.open { display: flex; }
        .modal-content { background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; width: 100%; max-width: 680px; max-height: 88vh; overflow-y: auto; box-shadow: 0 30px 80px -20px rgba(0,0,0,0.75); }
        .modal-header { position: sticky; top: 0; z-index: 2; background: var(--surface); display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
        .modal-title { font-size: 17px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.01em; }
        .modal-body { padding: 18px 20px 22px; }
        .close-btn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; border-radius: 8px; color: var(--text-dim); cursor: pointer; font-size: 20px; line-height: 1; }
        .close-btn:hover { background: var(--surface-2); color: var(--text-strong); }

        /* ── Feedback ── */
        .toast { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: none; max-width: 420px; padding: 12px 16px 12px 14px; border-radius: 10px;
                 background: #26263F; color: var(--text-strong); font-size: 13.5px; border: 1px solid var(--line-2); border-left: 3px solid var(--success);
                 box-shadow: 0 16px 40px -12px rgba(0,0,0,0.7); }
        .toast.show { display: block; }
        .toast.error { border-left-color: var(--error); }
        .empty-state, .loading { text-align: center; padding: 56px 16px; color: var(--text-dim); }
        .empty-state h3 { color: var(--text-strong); font-size: 16px; margin-bottom: 4px; }
        .empty-state .ico-lg { width: 32px; height: 32px; color: var(--text-dim); margin-bottom: 10px; }
        .spinner { width: 22px; height: 22px; border: 2px solid var(--line-2); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        *::-webkit-scrollbar { width: 10px; height: 10px; }
        *::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
        *::-webkit-scrollbar-track { background: transparent; }
        @media (max-width: 768px) {
            .appbar, .container { padding-left: 14px; padding-right: 14px; }
            .wordmark { font-size: 24px; }
        }
        /* ═══ end base ═══ */

        /* ── Page: stocktake review ── */
        .controls-bar { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
        .month-select { min-width: 180px; cursor: pointer; }
        .search-field { position: relative; }
        .search-field .ico { position: absolute; left: 11px; top: 11px; color: var(--text-dim); pointer-events: none; }
        .search-input { width: 260px; padding-left: 34px; }
        #refresh-icon { display: inline-flex; }

        .stat-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; }

        /* States */
        .state-msg { display: none; text-align: center; padding: 56px 16px; color: var(--text-dim); }
        .state-msg.show { display: block; }
        .state-msg .icon { display: flex; justify-content: center; margin-bottom: 10px; }
        .state-msg .icon .ico-lg { width: 32px; height: 32px; }

        /* Person groups */
        .groups-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 620px), 1fr)); gap: 12px; align-items: start; }
        .person-group { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
        .person-group:hover, .person-group.open { border-color: var(--line-2); }

        .group-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; cursor: pointer; user-select: none; flex-wrap: wrap; }
        .group-header:hover { background: rgba(255,255,255,0.02); }
        .group-header-left { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
        .group-avatar {
            width: 36px; height: 36px; border-radius: 50%; flex: 0 0 auto;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,107,53,0.14); border: 1px solid rgba(255,107,53,0.4); color: var(--text-strong);
            font-size: 13px; font-weight: 700; letter-spacing: .02em;
        }
        .group-name { font-size: 14.5px; font-weight: 600; color: var(--text-strong); }
        .group-sub { font-size: 12px; color: var(--text-dim); }
        .group-header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .sub-count-badge { --c: var(--in-progress); }
        .latest-badge { --c: var(--complete); }
        .chevron, .sub-chevron { display: inline-flex; color: var(--text-dim); transition: transform .2s ease; flex: 0 0 auto; }
        .person-group.open .chevron { transform: rotate(180deg); }

        /* Submissions */
        .submissions-wrap { max-height: 0; overflow: hidden; transition: max-height .3s ease; border-top: 0 solid var(--line); }
        .person-group.open .submissions-wrap { max-height: 9999px; border-top-width: 1px; }
        .submission-card { border-bottom: 1px solid var(--line); }
        .submission-card:last-child { border-bottom: 0; }
        .submission-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; cursor: pointer; background: var(--bg); transition: background .15s ease; }
        .submission-header:hover { background: #1a1a2e; }
        .sub-header-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .sub-date { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 600; color: var(--text-strong); }
        .sub-date .ico { color: var(--primary); width: 15px; height: 15px; }
        .sub-time { font-size: 12.5px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
        .sub-items-summary { font-size: 12.5px; color: var(--text-soft); }
        .submission-card.open .sub-chevron { transform: rotate(180deg); }

        .submission-body { max-height: 0; overflow: hidden; transition: max-height .3s ease; }
        .submission-card.open .submission-body { max-height: 9999px; }
        .items-table thead th { position: static; background: var(--surface); }
        .items-table td.qty { text-align: center; font-weight: 700; color: var(--text-strong); font-variant-numeric: tabular-nums; }
        .items-table td.qty.zero { color: var(--text-dim); font-weight: 400; }
        .items-table tbody td { color: var(--text-soft); }

        @media (max-width: 768px) {
            .controls-bar { width: 100%; }
            .controls-bar .control-group { flex: 1 1 140px; }
            .search-field { flex: 1 1 100%; order: 3; }
            .search-input, .month-select { width: 100%; min-width: 0; }
            .group-header-right { width: 100%; padding-left: 48px; }
            .group-header-right .chevron { margin-left: auto; }
            .submission-header { padding: 10px 14px; }
        }
    </style>
</head>

});
const db = getFirestore(app);

const SVG = p => `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICON_CHEVRON  = SVG('<path d="m6 9 6 6 6-6"/>');
const ICON_CALENDAR = SVG('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>');
const ICON_ALERT_LG = '<svg class="ico-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>';

window._allSubmissions = [];

window.loadData = async function() {
    const btn  = document.getElementById('refresh-btn');
    const icon = document.getElementById('refresh-icon');
    btn.disabled = true;
    icon.style.animation = 'spin 0.8s linear infinite';
    document.getElementById('loading-state').classList.add('show');
    document.getElementById('empty-state').classList.remove('show');
    document.getElementById('groups-list').innerHTML = '';

    try {
        const snap = await getDocs(query(collection(db, 'stocktake'), orderBy('submittedAt', 'desc')));
        window._allSubmissions = snap.docs.map(d => ({ _id: d.id, ...d.data() }));
        buildMonthFilter();
        renderAll();
    } catch(e) {
        document.getElementById('groups-list').innerHTML =
            `<div class="state-msg show"><div class="icon">${ICON_ALERT_LG}</div>Error: ${esc(e.message)}</div>`;
    } finally {
        btn.disabled = false;
        icon.style.animation = '';
        document.getElementById('loading-state').classList.remove('show');
    }
};

function buildMonthFilter() {
    const months = new Set();
    window._allSubmissions.forEach(s => {
        const d = s.date || s.submittedAt?.slice(0,10) || '';
        if (d) months.add(d.slice(0,7)); // YYYY-MM
    });
    const sel = document.getElementById('month-select');
    const cur = sel.value;
    sel.innerHTML = '<option value="">All Time</option>';
    Array.from(months).sort().reverse().forEach(m => {
        const [y,mo] = m.split('-');
        const label = new Date(+y, +mo-1, 1).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
        const opt = document.createElement('option');
        opt.value = m; opt.textContent = label;
        if (m === cur) opt.selected = true;
        sel.appendChild(opt);
    });
}

window.renderAll = function() {
    const monthFilter  = document.getElementById('month-select').value;
    const searchFilter = document.getElementById('search-input').value.trim().toLowerCase();
    const now          = new Date();
    const curMonth     = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

    // Filter submissions
    let filtered = window._allSubmissions.filter(s => {
        const d = s.date || s.submittedAt?.slice(0,10) || '';
        if (monthFilter && !d.startsWith(monthFilter)) return false;
        const name = (s.countedBy || '').toLowerCase();
        if (searchFilter && !name.includes(searchFilter)) return false;
        return true;
    });

    // Stats
    const thisMonthCount = window._allSubmissions.filter(s => {
        const d = s.date || s.submittedAt?.slice(0,10) || '';
        return d.startsWith(curMonth);
    }).length;
    const allPeople = new Set(window._allSubmissions.map(s => (s.countedBy||'Unknown').trim()));
    const avgItems  = filtered.length
        ? Math.round(filtered.reduce((a,s) => a + (s.items?.length||0), 0) / filtered.length)
        : 0;

    document.getElementById('stat-total').textContent  = window._allSubmissions.length;
    document.getElementById('stat-month').textContent  = thisMonthCount;
    document.getElementById('stat-people').textContent = allPeople.size;
    document.getElementById('stat-items').textContent  = avgItems || '—';

    const listEl  = document.getElementById('groups-list');
    const emptyEl = document.getElementById('empty-state');

    if (!filtered.length) {
        emptyEl.classList.add('show');
        listEl.innerHTML = '';
        return;
    }
    emptyEl.classList.remove('show');

    // Group by person
    const groups = {};
    filtered.forEach(s => {
        const name = (s.countedBy || 'Unknown').trim();
        if (!groups[name]) groups[name] = [];
        groups[name].push(s);
    });

    // Sort groups by most recent submission
    const sortedGroups = Object.entries(groups).sort((a,b) => {
        const da = a[1][0].submittedAt || a[1][0].date || '';
        const db2 = b[1][0].submittedAt || b[1][0].date || '';
        return db2.localeCompare(da);
    });

    listEl.innerHTML = sortedGroups.map(([name, subs], gi) => buildGroup(name, subs, gi)).join('');
};

function buildGroup(name, subs, gi) {
    const initials = name.split(' ').map(w=>w[0]||'').join('').slice(0,2).toUpperCase();
    const latest   = subs[0];
    const latestDate = fmtDate(latest.date || latest.submittedAt?.slice(0,10));

    const subsHtml = subs.map((s,si) => buildSubmission(s, si, name, gi)).join('');

    return `
    <div class="person-group" id="group-${gi}">
        <div class="group-header" onclick="toggleGroup(${gi})">
            <div class="group-header-left">
                <div class="group-avatar">${esc(initials)}</div>
                <div>
                    <div class="group-name">${esc(name)}</div>
                    <div class="group-sub">${subs.length} submission${subs.length!==1?'s':''}</div>
                </div>
            </div>
            <div class="group-header-right">
                <span class="sub-count-badge badge">${subs.length} count${subs.length!==1?'s':''}</span>
                <span class="latest-badge badge">Latest: ${latestDate}</span>
                <span class="chevron">${ICON_CHEVRON}</span>
            </div>
        </div>
        <div class="submissions-wrap" id="wrap-${gi}">
            ${subsHtml}
        </div>
    </div>`;
}

function buildSubmission(s, si, personName, gi) {
    const date     = fmtDate(s.date || s.submittedAt?.slice(0,10));
    const timeStr  = s.submittedAt ? fmtTime(s.submittedAt) : '';
    const items    = Array.isArray(s.items) ? s.items : [];
    const nonZero  = items.filter(i => i.quantity > 0).length;
    const total    = items.length;

    const rowsHtml = items.map(item => `
        <tr>
            <td>${esc(item.description)}</td>
            <td class="qty ${item.quantity === 0 ? 'zero' : ''}">${item.quantity ?? 0}</td>
        </tr>`).join('');

    const id = `sub-${gi}-${si}`;

    return `
    <div class="submission-card" id="${id}">
        <div class="submission-header" onclick="toggleSubmission('${id}')">
            <div class="sub-header-left">
                <span class="sub-date">${ICON_CALENDAR}${date}</span>
                ${timeStr ? `<span class="sub-time">${timeStr}</span>` : ''}
                <span class="sub-items-summary">${nonZero} / ${total} items with stock</span>
            </div>
            <span class="sub-chevron">${ICON_CHEVRON}</span>
        </div>
        <div class="submission-body">
            <table class="items-table">
                <thead>
                    <tr>
                        <th>Item</th>
                        <th style="text-align:center;width:90px">Quantity</th>
                    </tr>
                </thead>
                <tbody>${rowsHtml}</tbody>
            </table>
        </div>
    </div>`;
}

window.toggleGroup = function(gi) {
    const group = document.getElementById(`group-${gi}`);
    group.classList.toggle('open');
};

window.toggleSubmission = function(id) {
    document.getElementById(id).classList.toggle('open');
};

// ── Utils ──────────────────────────────────────────────────────────────────
function esc(t) {
    const d = document.createElement('div');
    d.textContent = String(t ?? '');
    return d.innerHTML;
}

function fmtDate(str) {
    if (!str) return '—';
    const d = new Date(str + (str.length === 10 ? 'T00:00:00' : ''));
    return isNaN(d) ? str : d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}

function fmtTime(iso) {
    const d = new Date(iso);
    return isNaN(d) ? '' : d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}

// ── Init ───────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => window.loadData());
</script>
</body>
</html>
