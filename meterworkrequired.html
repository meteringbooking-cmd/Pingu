<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meter Work Required | Pingu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* ═══ Pingu design system — base (copy verbatim into each page's <style>) ═══ */
        :root {
            /* Brand + status palette */
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --secondary: #FFC857;
            --accent: #00D9FF;
            --dark: #1A1A2E;
            --dark-light: #252541;
            --dark-lighter: #2F2F4A;
            --text: #EAEAEA;
            --text-dim: #9A9AB0;
            --success: #4ECCA3;
            --error: #FF6B6B;
            --warning: #FFC857;
            --in-progress: #00D9FF;
            --complete: #4ECCA3;
            --aborted: #FF6B6B;
            --cancelled: #9A9AB0;
            --short-notice: #90ee90;
            --on-hold: #FFDE00;
            --scheduled: #FF6B35;
            /* Surfaces & type */
            --bg: #161628;
            --surface: #1F1F35;
            --surface-2: #252541;
            --line: rgba(255,255,255,0.07);
            --line-2: rgba(255,255,255,0.12);
            --text-strong: #F4F4F8;
            --text-soft: #C8C8D6;
            --radius: 10px;
            --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: var(--font); font-size: 14px; line-height: 1.5;
            background: var(--bg); color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        button, input, select, textarea { font-family: inherit; }
        a { color: var(--accent); }
        .ico { width: 16px; height: 16px; flex: 0 0 auto; vertical-align: -3px; }
        .ico-lg { width: 20px; height: 20px; flex: 0 0 auto; }

        /* ── App bar + Pingu wordmark ── */
        .appbar {
            position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            height: 64px; padding: 0 28px;
            background: rgba(22, 22, 40, 0.92);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line);
        }
        .appbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .logo { display: inline-flex; align-items: center; text-decoration: none; }
        .wordmark {
            font-family: 'Inter', var(--font); font-weight: 800; font-size: 28px;
            letter-spacing: -0.045em; line-height: 1; color: var(--text-strong); padding-top: 6px;
        }
        .i-stem { position: relative; display: inline-block; }
        .i-paw {
            position: absolute; left: 50%; top: -0.17em; transform: translateX(-50%) rotate(-10deg);
            width: 0.5em; height: 0.5em; fill: var(--primary);
            filter: drop-shadow(0 1px 4px rgba(255,107,53,0.35));
            transition: transform .2s ease;
        }
        .logo:hover .i-paw { transform: translateX(-50%) rotate(4deg) scale(1.08); }
        .logo:hover .wordmark { color: #fff; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-soft); text-decoration: none; font-size: 13px; font-weight: 500;
            padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; cursor: pointer;
            transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .back-btn:hover { background: var(--surface-2); color: var(--text-strong); border-color: rgba(255,255,255,0.2); }

        /* ── Page layout ── */
        .container { padding: 24px 28px 40px; }
        .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
        h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-strong); line-height: 1.2; }
        h2 { font-size: 16px; font-weight: 600; color: var(--text-strong); letter-spacing: -0.01em; }
        h3 { font-size: 14px; font-weight: 600; color: var(--text-strong); }
        .muted { color: var(--text-dim); }
        .toolbar { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }

        /* ── Panels / cards ── */
        .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
        .panel + .panel { margin-top: 16px; }
        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -2px 0 14px; }
        .panel-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--text-strong); }
        .panel-title .ico { color: var(--primary); }

        /* ── Form controls ── */
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-label { color: var(--text-dim); font-size: 11.5px; font-weight: 500; }
        .control-input {
            height: 38px; background: var(--surface); border: 1px solid var(--line-2);
            color: var(--text-strong); padding: 0 12px; border-radius: 8px; font-size: 13.5px; width: 100%;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        textarea.control-input { height: auto; min-height: 84px; padding: 9px 11px; resize: vertical; }
        .control-input:hover { border-color: rgba(255,255,255,0.2); }
        .control-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.22); }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); cursor: pointer; }
        input[type="checkbox"], input[type="radio"] { accent-color: var(--primary); }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 7px;
            height: 38px; padding: 0 16px; border-radius: 8px; cursor: pointer;
            font-size: 13.5px; font-weight: 600; text-decoration: none; white-space: nowrap;
            border: 1px solid transparent; transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--surface-2); color: var(--text-strong); border-color: var(--line-2); }
        .btn-secondary:hover { background: var(--dark-lighter); border-color: rgba(255,255,255,0.25); }
        .btn-ghost { background: transparent; color: var(--text-soft); border-color: var(--line-2); }
        .btn-ghost:hover { background: var(--surface-2); color: var(--text-strong); }
        .btn-danger { background: rgba(255,107,107,0.12); color: #FF8A8A; border-color: rgba(255,107,107,0.4); }
        .btn-danger:hover { background: rgba(255,107,107,0.22); }
        .btn-success { background: rgba(78,204,163,0.14); color: var(--success); border-color: rgba(78,204,163,0.45); }
        .btn-success:hover { background: rgba(78,204,163,0.24); }
        .btn-sm { height: 32px; padding: 0 12px; font-size: 12.5px; }
        .btn:disabled, button:disabled { opacity: .45; cursor: not-allowed; }
        .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; height: 38px; }
        .seg button { background: var(--surface); color: var(--text-soft); border: 0; padding: 0 12px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .seg button + button { border-left: 1px solid var(--line-2); }
        .seg button:hover, .seg button.active { background: var(--surface-2); color: var(--text-strong); }

        /* ── KPI tiles ── */
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
        .stat-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; }
        .stat-label { display: flex; align-items: center; gap: 7px; color: var(--text-dim); font-size: 12px; font-weight: 500; white-space: nowrap; }
        .stat-label .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
        .stat-value { font-size: 22px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.02em; line-height: 1.25; margin-top: 2px; font-variant-numeric: tabular-nums; }

        /* ── Tables ── */
        .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
        thead th {
            position: sticky; top: 0; z-index: 2; background: var(--surface);
            text-align: left; padding: 10px 14px; font-size: 11.5px; font-weight: 600; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--line-2); white-space: nowrap;
        }
        tbody td { padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--text-soft); vertical-align: middle; }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover td { background: rgba(255,255,255,0.025); }
        td.strong, .cell-strong { color: var(--text-strong); font-weight: 600; }
        .mono { font-family: var(--mono); font-size: 12.5px; }

        /* ── Badges / status pills ── */
        .badge {
            --c: var(--text-dim);
            display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
            padding: 2px 9px; border-radius: 999px; color: var(--text-strong);
            background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
        }
        .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
        .badge.plain::before { display: none; }
        .tag { font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 4px; background: rgba(255,255,255,0.1); color: var(--text-soft); letter-spacing: .03em; }

        /* ── Notices ── */
        .notice { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 13px;
                  background: rgba(255,255,255,0.03); border: 1px solid var(--line-2); color: var(--text-soft); }
        .notice .ico { margin-top: 1px; }
        .notice.info    { border-color: rgba(0,217,255,0.35);  background: rgba(0,217,255,0.06); }
        .notice.success { border-color: rgba(78,204,163,0.4);  background: rgba(78,204,163,0.07); color: var(--success); }
        .notice.warning { border-color: rgba(255,200,87,0.4);  background: rgba(255,200,87,0.07); color: var(--warning); }
        .notice.error   { border-color: rgba(255,107,107,0.45); background: rgba(255,107,107,0.08); color: #FF8A8A; }

        /* ── Modals ── */
        .modal { display: none; position: fixed; inset: 0; background: rgba(10,10,22,0.72); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
        .modal.show, .modal.active, .modal.open { display: flex; }
        .modal-content { background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; width: 100%; max-width: 680px; max-height: 88vh; overflow-y: auto; box-shadow: 0 30px 80px -20px rgba(0,0,0,0.75); }
        .modal-header { position: sticky; top: 0; z-index: 2; background: var(--surface); display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
        .modal-title { font-size: 17px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.01em; }
        .modal-body { padding: 18px 20px 22px; }
        .close-btn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; border-radius: 8px; color: var(--text-dim); cursor: pointer; font-size: 20px; line-height: 1; }
        .close-btn:hover { background: var(--surface-2); color: var(--text-strong); }

        /* ── Feedback ── */
        .toast { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: none; max-width: 420px; padding: 12px 16px 12px 14px; border-radius: 10px;
                 background: #26263F; color: var(--text-strong); font-size: 13.5px; border: 1px solid var(--line-2); border-left: 3px solid var(--success);
                 box-shadow: 0 16px 40px -12px rgba(0,0,0,0.7); }
        .toast.show { display: block; }
        .toast.error { border-left-color: var(--error); }
        .empty-state, .loading { text-align: center; padding: 56px 16px; color: var(--text-dim); }
        .empty-state h3 { color: var(--text-strong); font-size: 16px; margin-bottom: 4px; }
        .empty-state .ico-lg { width: 32px; height: 32px; color: var(--text-dim); margin-bottom: 10px; }
        .spinner { width: 22px; height: 22px; border: 2px solid var(--line-2); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        *::-webkit-scrollbar { width: 10px; height: 10px; }
        *::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
        *::-webkit-scrollbar-track { background: transparent; }
        @media (max-width: 768px) {
            .appbar, .container { padding-left: 14px; padding-right: 14px; }
            .wordmark { font-size: 24px; }
        }
        /* ═══ end base ═══ */

        /* ═══ Meter Work Required — page styles ═══ */
        .page-sub { font-size: 13px; margin-top: 4px; }

        /* Controls */
        .controls-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
        .filter-tabs { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; height: 38px; }
        .ftab { display: inline-flex; align-items: center; gap: 7px; background: var(--surface); color: var(--text-soft); border: 0; padding: 0 14px; font-size: 13px; font-weight: 500; cursor: pointer; transition: background .15s ease, color .15s ease; }
        .ftab + .ftab { border-left: 1px solid var(--line-2); }
        .ftab:hover { background: var(--surface-2); color: var(--text-strong); }
        .ftab .dot { width: 7px; height: 7px; border-radius: 50%; }
        .ftab.f-all, .ftab.f-scheduled, .ftab.f-completed { background: var(--surface-2); color: var(--text-strong); font-weight: 600; box-shadow: inset 0 -2px 0 var(--primary); }
        #ftab-pending.f-all { box-shadow: inset 0 -2px 0 var(--warning); }
        .ftab.f-scheduled { box-shadow: inset 0 -2px 0 var(--scheduled); }
        .ftab.f-completed { box-shadow: inset 0 -2px 0 var(--complete); }
        .ctrl-sep { display: none; }
        .refresh-btn { margin-left: auto; }
        #refresh-icon { display: inline-flex; }

        /* KPI tiles */
        .stats-bar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
        .stat-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; }
        .stat-lbl { display: flex; align-items: center; gap: 7px; color: var(--text-dim); font-size: 12px; font-weight: 500; white-space: nowrap; }
        .stat-lbl .dot { width: 8px; height: 8px; border-radius: 50%; }
        .stat-val { font-size: 22px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.02em; line-height: 1.25; margin-top: 2px; font-variant-numeric: tabular-nums; }
        .c-warning { color: var(--warning); }
        .c-cyan    { color: var(--scheduled); }
        .c-green   { color: var(--complete); }

        .state-msg { display: none; text-align: center; padding: 56px 16px; color: var(--text-dim); font-size: 13.5px; grid-column: 1 / -1; }
        .state-msg.show { display: block; }
        .state-msg .icon { margin-bottom: 8px; }
        .state-msg .icon .ico { width: 28px; height: 28px; }

        /* Cards */
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 14px; align-items: start; }
        .job-card { --c: var(--warning); background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 12px; overflow: hidden; transition: border-color .15s ease; }
        .job-card:hover { border-color: var(--line-2); border-left-color: var(--c); }
        .job-card:has(.s-scheduled) { --c: var(--scheduled); }
        .job-card.is-completed { --c: var(--complete); }
        .card-stripe { display: none; }

        .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 14px 16px 10px; }
        .card-head > div { min-width: 0; }
        .card-job { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--text-strong); }
        .card-cust { font-size: 13px; color: var(--text-soft); margin-top: 1px; }
        .card-addr { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--text-dim); margin-top: 2px; }
        .card-addr .ico { width: 13px; height: 13px; }
        .badge { flex-shrink: 0; }
        .b-pending   { --c: var(--warning); }
        .b-scheduled { --c: var(--scheduled); }
        .b-completed { --c: var(--complete); }

        .card-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; padding: 0 16px 12px; border-bottom: 1px solid var(--line); }
        .meta-item { display: flex; flex-direction: column; gap: 0; min-width: 0; }
        .meta-lbl { font-size: 12px; color: var(--text-dim); }
        .meta-val { font-size: 13px; color: var(--text-strong); font-weight: 500; word-break: break-word; }
        .meta-val.unset { color: var(--warning); }
        .meta-val.ok { color: var(--success); }

        .card-work { padding: 11px 16px; border-bottom: 1px solid var(--line); background: rgba(255,200,87,0.04); }
        .work-lbl { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--warning); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
        .work-lbl .ico { width: 14px; height: 14px; }
        .work-text { font-size: 13px; color: var(--text-strong); line-height: 1.55; }

        .card-done-info { display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: rgba(78,204,163,0.05); }
        .done-item { display: flex; flex-direction: column; }
        .done-lbl { font-size: 12px; color: var(--text-dim); }
        .done-val { font-size: 13px; color: var(--success); font-weight: 600; }

        .card-expand { overflow: hidden; max-height: 0; transition: max-height .3s ease; }
        .card-expand.open { max-height: 560px; }
        .expand-inner { display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
        .field-lbl { color: var(--text-dim); font-size: 11.5px; font-weight: 500; margin-bottom: 5px; }
        .expand-input { height: 38px; width: 100%; background: var(--surface); border: 1px solid var(--line-2); color: var(--text-strong); padding: 0 12px; border-radius: 8px; font-size: 13.5px; transition: border-color .15s ease, box-shadow .15s ease; }
        .expand-input::placeholder { color: var(--text-dim); }
        .expand-input:hover { border-color: rgba(255,255,255,0.2); }
        .expand-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.22); }
        .expand-input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); cursor: pointer; }

        .action-row { display: flex; gap: 8px; }
        .btn-save, .btn-complete, .btn-other, .btn-reopen { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .15s ease, border-color .15s ease, color .15s ease; }
        .btn-save { flex: 1; background: var(--primary); color: #fff; border: 1px solid var(--primary); }
        .btn-save:hover:not(:disabled) { background: var(--primary-dark); }
        .btn-complete { flex: 1; background: rgba(78,204,163,0.12); color: var(--success); border: 1px solid rgba(78,204,163,0.45); }
        .btn-complete:hover:not(:disabled) { background: rgba(78,204,163,0.22); }
        .btn-complete.is-done { background: var(--success); color: #10241d; border-color: var(--success); }
        .btn-other { width: 100%; height: 34px; background: transparent; color: var(--text-soft); border: 1px solid var(--line-2); font-weight: 500; }
        .btn-other:hover { background: var(--surface-2); color: var(--text-strong); }
        .btn-reopen { width: 100%; height: 34px; background: transparent; color: var(--text-dim); border: 1px solid var(--line-2); font-weight: 500; }
        .btn-reopen:hover { color: var(--text-strong); border-color: rgba(255,107,53,0.5); }
        .btn-save .ico, .btn-complete .ico, .btn-other .ico, .btn-reopen .ico { width: 15px; height: 15px; }

        .card-toggle { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px; background: transparent; border: 0; color: var(--text-soft); font-size: 13px; font-weight: 500; text-align: left; cursor: pointer; transition: background .15s ease, color .15s ease; }
        .card-toggle:hover { background: rgba(255,255,255,0.025); color: var(--text-strong); }
        .chevron { display: inline-flex; color: var(--text-dim); transition: transform .2s ease; }
        .chevron.open { transform: rotate(180deg); }

        #back-top { position: fixed; bottom: 24px; right: 24px; z-index: 100; display: none; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 10px; cursor: pointer; background: var(--surface-2); color: var(--text-strong); border: 1px solid var(--line-2); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.7); }
        #back-top.show { display: flex; }
        #back-top:hover { background: var(--dark-lighter); }
        #back-top .ico { transform: rotate(-90deg); }

        @media (max-width: 768px) {
            .stats-bar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .filter-tabs { width: 100%; }
            .ftab { flex: 1; justify-content: center; padding: 0 6px; font-size: 12.5px; }
            .refresh-btn { margin-left: 0; width: 100%; }
            .action-row { flex-direction: column; }
        }
    </style>
</head>
<body>
<header class="appbar">
    <a href="teamview.html" class="logo" aria-label="Pingu home">
        <span class="wordmark">P<span class="i-stem">ı<svg class="i-paw" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="16.2" rx="5.6" ry="4.6"/><ellipse cx="4.6" cy="10.4" rx="2.2" ry="2.7" transform="rotate(-18 4.6 10.4)"/><ellipse cx="9.2" cy="5.6" rx="2.3" ry="2.9" transform="rotate(-6 9.2 5.6)"/><ellipse cx="14.8" cy="5.6" rx="2.3" ry="2.9" transform="rotate(6 14.8 5.6)"/><ellipse cx="19.4" cy="10.4" rx="2.2" ry="2.7" transform="rotate(18 19.4 10.4)"/></svg></span>ngu</span>
    </a>
    <div class="appbar-actions">
        <a href="teamview.html" class="back-btn"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Back to Dashboard</a>
    </div>
</header>

<div class="container">

    <div class="page-head">
        <div>
            <h1>Meter Work Required</h1>
            <p class="muted page-sub">Jobs flagged during survey as needing meter work — schedule, assign an engineer, and mark complete.</p>
        </div>
    </div>

    <div class="controls-bar">
        <div class="filter-tabs" role="group" aria-label="Status filter">
            <button class="ftab f-all"  id="ftab-all"       onclick="setFilter('all')">All</button>
            <button class="ftab"        id="ftab-pending"   onclick="setFilter('pending')"><span class="dot" style="background:var(--warning)"></span>Pending</button>
            <button class="ftab"        id="ftab-scheduled" onclick="setFilter('scheduled')"><span class="dot" style="background:var(--scheduled)"></span>Scheduled</button>
            <button class="ftab"        id="ftab-completed" onclick="setFilter('completed')"><span class="dot" style="background:var(--complete)"></span>Completed</button>
        </div>
        <div class="ctrl-sep"></div>
        <button class="refresh-btn btn btn-secondary" id="refresh-btn" onclick="loadData()">
            <span id="refresh-icon"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/></svg></span>Refresh
        </button>
    </div>

    <div class="stats-bar">
        <div class="stat-card"><div class="stat-lbl">Total jobs</div><div class="stat-val" id="stat-total">—</div></div>
        <div class="stat-card"><div class="stat-lbl"><span class="dot" style="background:var(--warning)"></span>Pending</div><div class="stat-val c-warning" id="stat-pending">—</div></div>
        <div class="stat-card"><div class="stat-lbl"><span class="dot" style="background:var(--scheduled)"></span>Scheduled</div><div class="stat-val c-cyan" id="stat-sched">—</div></div>
        <div class="stat-card"><div class="stat-lbl"><span class="dot" style="background:var(--complete)"></span>Completed</div><div class="stat-val c-green" id="stat-done">—</div></div>
    </div>

    <div class="state-msg" id="loading-state"><div class="icon"><span class="spinner"></span></div>Loading meter work jobs…</div>
    <div class="state-msg" id="empty-state"><div class="icon"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="m9 11 3 3L22 4"/></svg></div>No jobs matching this filter.</div>

    <div class="cards-grid" id="cards-grid"></div>
</div>

<button id="back-top" title="Back to top" aria-label="Back to top"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import {
    getFirestore, collection, getDocs, doc, updateDoc, setDoc
} from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const app = initializeApp({
    apiKey:            "AIzaSyAc_yJQ_rkzuOBh-Yxg0Q4eooXtB-tQjm0",
    authDomain:        "pingu-solar.firebaseapp.com",
    projectId:         "pingu-solar",
    storageBucket:     "pingu-solar.firebasestorage.app",
    messagingSenderId: "232764952866",
    appId:             "1:232764952866:web:5923b7f419de6355d6157b"
});
const db = getFirestore(app);

window._jobs   = [];
window._filter = 'all';

// ── helpers ──────────────────────────────────────────────────────────────────
function esc(t) {
    const d = document.createElement('div');
    d.textContent = String(t || '');
    return d.innerHTML;
}

function fmtDate(str) {
    if (!str) return '—';
    const d = new Date(str);
    return isNaN(d) ? str : d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
}

// meterWorkNeeded is saved as a freetext "yes"/"no" field in the survey
function meterNeeded(s) {
    const v = s.sections?.electricalSystem?.meterWorkNeeded || '';
    return v.trim().toLowerCase() === 'yes';
}

function getDetails(s)   { return (s.sections?.electricalSystem?.meterWorkDetails || '').trim(); }
function getSurveyor(s)  { return s.sections?.surveyDetails?.surveyor || '—'; }
function getCustomer(s)  { return s.sections?.customerSignOff?.name || ''; }
function getSurveyDate(s){ return fmtDate(s.sections?.surveyDetails?.conductedOn || s.submittedAt); }
function getTypeLabel(s) { return s.surveyType === 'battery-and-solar' ? 'Battery & Solar' : 'Battery Only'; }

function getStatus(s) {
    if (s.meterCompleted)               return 'completed';
    if (s.meterDate || s.meterEngineer) return 'scheduled';
    return 'pending';
}

// ── load ─────────────────────────────────────────────────────────────────────
window.loadData = async function () {
    const btn  = document.getElementById('refresh-btn');
    const icon = document.getElementById('refresh-icon');
    document.getElementById('loading-state').classList.add('show');
    document.getElementById('empty-state').classList.remove('show');
    document.getElementById('cards-grid').innerHTML = '';
    btn.disabled = true;
    icon.style.animation = 'spin 0.8s linear infinite';

    try {
        // Fetch both site-surveys and jobs collections in parallel
        const [surveysSnap, jobsSnap] = await Promise.all([
            getDocs(collection(db, 'site-surveys')),
            getDocs(collection(db, 'Solar-jobs'))
        ]);

        // Build job number -> address/postcode/customer lookup from jobs collection
        const jobMap = {};
        jobsSnap.forEach(d => {
            const jd = d.data();
            const num = String(jd['Job Number'] || '').trim();
            if (num) jobMap[num] = jd;
        });

        // Filter surveys to only those flagged for meter work
        const meterJobs = surveysSnap.docs
            .map(d => ({ _docId: d.id, ...d.data() }))
            .filter(s => (s.sections?.electricalSystem?.meterWorkNeeded || '').trim().toLowerCase() === 'yes')
            .sort((a, b) => {
                const ta = a.submittedAt || a.sections?.surveyDetails?.conductedOn || a._docId;
                const tb = b.submittedAt || b.sections?.surveyDetails?.conductedOn || b._docId;
                return String(tb).localeCompare(String(ta));
            });

        // Attach address, postcode & customer name from jobs collection by matching job number
        window._jobs = meterJobs.map(j => {
            const num = String(j.jobNumber || '').trim();
            const jd  = jobMap[num] || {};
            return {
                ...j,
                _address:  jd['1st line of address'] || '',
                _postcode: jd['Postcode'] || '',
                _custName: jd['Name'] || '',
            };
        });
        renderAll();
    } catch (e) {
        document.getElementById('cards-grid').innerHTML =
            `<div class="state-msg show">Firebase error: ${esc(e.message)}</div>`;
    } finally {
        btn.disabled = false;
        icon.style.animation = '';
        document.getElementById('loading-state').classList.remove('show');
    }
};

// ── filter ────────────────────────────────────────────────────────────────────
window.setFilter = function (f) {
    window._filter = f;
    // reset all tabs
    document.querySelectorAll('.ftab').forEach(b => {
        b.className = 'ftab';
    });
    const tab = document.getElementById('ftab-' + f);
    const cls = f === 'completed' ? 'f-completed' : f === 'scheduled' ? 'f-scheduled' : 'f-all';
    tab.classList.add(cls);
    renderAll();
};

// ── render ────────────────────────────────────────────────────────────────────
window.renderAll = function () {
    const f     = window._filter;
    const all   = window._jobs;
    const shown = all.filter(s => f === 'all' || getStatus(s) === f);

    document.getElementById('stat-total').textContent   = all.length;
    document.getElementById('stat-pending').textContent  = all.filter(s => getStatus(s) === 'pending').length;
    document.getElementById('stat-sched').textContent    = all.filter(s => getStatus(s) === 'scheduled').length;
    document.getElementById('stat-done').textContent     = all.filter(s => getStatus(s) === 'completed').length;

    const grid    = document.getElementById('cards-grid');
    const emptyEl = document.getElementById('empty-state');

    if (!shown.length) { emptyEl.classList.add('show'); grid.innerHTML = ''; return; }
    emptyEl.classList.remove('show');
    grid.innerHTML = shown.map((s, i) => buildCard(s, i)).join('');
};

// ── card HTML ─────────────────────────────────────────────────────────────────
function buildCard(s, idx) {
    const id       = s._docId;
    const status   = getStatus(s);
    const jobNum   = esc(s.jobNumber || id);
    const customer = esc(s._custName || getCustomer(s));
    const surveyor = esc(getSurveyor(s));
    const address  = esc(s._address || '');
    const postcode = esc(s._postcode || '');
    const details  = esc(getDetails(s));
    const mDate    = s.meterDate || '';
    const engName  = s.meterEngineer || '';
    const compAt   = s.meterCompletedAt ? fmtDate(s.meterCompletedAt) : '';
    const compBy   = esc(s.meterCompletedBy || '');

    const stripeClass = status === 'completed' ? 's-completed' : status === 'scheduled' ? 's-scheduled' : 's-pending';
    const badgeClass  = status === 'completed' ? 'b-completed' : status === 'scheduled' ? 'b-scheduled' : 'b-pending';
    const badgeLabel  = status === 'completed' ? 'Completed' : status === 'scheduled' ? 'Scheduled' : 'Pending';
    const toggleLabel = status === 'completed' ? 'View / edit details' : 'Schedule &amp; assign engineer';

    const doneStrip = status === 'completed' ? `
        <div class="card-done-info">
            ${compAt  ? `<div class="done-item"><div class="done-lbl">Completed</div><div class="done-val">${compAt}</div></div>` : ''}
            ${compBy  ? `<div class="done-item"><div class="done-lbl">By</div><div class="done-val">${compBy}</div></div>` : ''}
            ${mDate   ? `<div class="done-item"><div class="done-lbl">Was Booked</div><div class="done-val">${fmtDate(mDate)}</div></div>` : ''}
            ${engName            ? `<div class="done-item"><div class="done-lbl">Engineer</div><div class="done-val">${esc(engName)}</div></div>` : ''}
            ${s.meterJobNumber  ? `<div class="done-item"><div class="done-lbl">Meter Job #</div><div class="done-val">${esc(s.meterJobNumber)}</div></div>` : ''}
        </div>` : '';

    const reopenBtn = status === 'completed'
        ? `<button class="btn-reopen" onclick="reopenJob('${id}')">↩ Re-open job</button>` : '';

    return `
    <div class="job-card${status==='completed'?' is-completed':''}" id="card-${id}" style="animation-delay:${idx*0.045}s">
        <div class="card-stripe ${stripeClass}"></div>

        <div class="card-head">
            <div>
                <div class="card-job">#${jobNum}</div>
                <div class="card-cust">${customer || surveyor}</div>
                ${address || postcode ? `<div class="card-addr">${address}${address && postcode ? ', ' : ''}${postcode}</div>` : ''}
            </div>
            <span class="badge ${badgeClass}">${badgeLabel}</span>
        </div>

        <div class="card-meta">
            ${s._address ? `
            <div class="meta-item">
                <div class="meta-lbl">Address</div>
                <div class="meta-val">${esc(s._address)}</div>
            </div>` : ''}
            ${s._postcode ? `
            <div class="meta-item">
                <div class="meta-lbl">Postcode</div>
                <div class="meta-val">${esc(s._postcode)}</div>
            </div>` : ''}
            <div class="meta-item">
                <div class="meta-lbl">Survey Date</div>
                <div class="meta-val">${getSurveyDate(s)}</div>
            </div>
            <div class="meta-item">
                <div class="meta-lbl">Survey Type</div>
                <div class="meta-val">${getTypeLabel(s)}</div>
            </div>
            <div class="meta-item">
                <div class="meta-lbl">Surveyor</div>
                <div class="meta-val">${surveyor}</div>
            </div>
            <div class="meta-item">
                <div class="meta-lbl">Work Booked</div>
                <div class="meta-val ${mDate ? 'ok' : 'unset'}">${mDate ? fmtDate(mDate) : 'Not scheduled'}</div>
            </div>
            ${s.meterJobNumber ? `
            <div class="meta-item">
                <div class="meta-lbl">Meter Job #</div>
                <div class="meta-val ok">${esc(s.meterJobNumber)}</div>
            </div>` : ''}
        </div>

        ${details ? `
        <div class="card-work">
            <div class="work-lbl">Work Required</div>
            <div class="work-text">${details}</div>
        </div>` : ''}

        ${doneStrip}

        <div class="card-expand" id="exp-${id}">
            <div class="expand-inner">
                <div>
                    <div class="field-lbl">Date for Meter Work</div>
                    <input type="date" class="expand-input" id="date-${id}" value="${mDate}" />
                </div>
                <div>
                    <div class="field-lbl">Assigned Engineer</div>
                    <input type="text" class="expand-input" id="eng-${id}"
                        value="${esc(engName)}" placeholder="Enter engineer name…" />
                </div>
                <div>
                    <div class="field-lbl">Meter Work Job Number</div>
                    <input type="text" class="expand-input" id="mjob-${id}"
                        value="${esc(s.meterJobNumber || '')}" placeholder="Enter meter work job number…" />
                </div>
                <div class="action-row">
                    <button class="btn-save" id="save-${id}" onclick="saveDetails('${id}')">Save</button>
                    <button class="btn-complete${status==='completed'?' is-done':''}"
                        id="cmp-${id}" onclick="markComplete('${id}')">
                        ${status === 'completed' ? 'Done' : 'Mark Complete'}
                    </button>
                </div>
                ${status !== 'completed' ? `<button class="btn-other" onclick="markCompleteByOther('${id}')">Completed by Other</button>` : ''}
                ${reopenBtn}
            </div>
        </div>

        <button class="card-toggle" id="tog-${id}" onclick="toggleCard('${id}')">
            <span>${toggleLabel}</span>
            <span class="chevron" id="chv-${id}">▼</span>
        </button>
    </div>`;
}

// ── interactions ──────────────────────────────────────────────────────────────
window.toggleCard = function (id) {
    const exp  = document.getElementById('exp-' + id);
    const chv  = document.getElementById('chv-' + id);
    const open = exp.classList.toggle('open');
    chv.classList.toggle('open', open);
};

window.saveDetails = async function (id) {
    const dateVal = document.getElementById('date-'  + id).value;
    const engVal  = document.getElementById('eng-'   + id).value.trim();
    const mjobVal = document.getElementById('mjob-'  + id).value.trim();
    const btn     = document.getElementById('save-'  + id);
    btn.disabled  = true;
    btn.textContent = 'Saving…';
    try {
        await updateDoc(doc(db, 'site-surveys', id), {
            meterDate: dateVal, meterEngineer: engVal, meterJobNumber: mjobVal
        });
        const job = window._jobs.find(s => s._docId === id);
        if (job) { job.meterDate = dateVal; job.meterEngineer = engVal; job.meterJobNumber = mjobVal; }
        // Mirror to meterworkrequired collection
        try { await setDoc(doc(db, 'meterworkrequired', id), { ...job, meterDate: dateVal, meterEngineer: engVal, meterJobNumber: mjobVal }); } catch(_) {}
        renderAll();
        setTimeout(() => toggleCard(id), 40);
    } catch (e) {
        alert('Save failed: ' + e.message);
        btn.disabled = false;
        btn.textContent = 'Save';
    }
};

window.markComplete = async function (id) {
    const engVal  = document.getElementById('eng-'   + id)?.value?.trim() || '';
    const dateVal = document.getElementById('date-'  + id)?.value || '';
    const mjobVal = document.getElementById('mjob-'  + id)?.value?.trim() || '';
    const btn     = document.getElementById('cmp-'   + id);
    if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
    try {
        await updateDoc(doc(db, 'site-surveys', id), {
            meterCompleted:   true,
            meterCompletedAt: new Date().toISOString(),
            meterCompletedBy: engVal,
            meterEngineer:    engVal,
            meterDate:        dateVal,
            meterJobNumber:   mjobVal
        });
        const job = window._jobs.find(s => s._docId === id);
        if (job) {
            job.meterCompleted   = true;
            job.meterCompletedAt = new Date().toISOString();
            job.meterCompletedBy = engVal;
            job.meterEngineer    = engVal;
            job.meterDate        = dateVal;
            job.meterJobNumber   = mjobVal;
        }
        // Mirror to meterworkrequired collection
        try { await setDoc(doc(db, 'meterworkrequired', id), { ...job }); } catch(_) {}
        renderAll();
    } catch (e) {
        alert('Could not mark complete: ' + e.message);
        if (btn) { btn.disabled = false; btn.textContent = 'Mark Complete'; }
    }
};

window.reopenJob = async function (id) {
    if (!confirm('Re-open this job as pending?')) return;
    try {
        await updateDoc(doc(db, 'site-surveys', id), {
            meterCompleted:   false,
            meterCompletedAt: null,
            meterCompletedBy: ''
        });
        const job = window._jobs.find(s => s._docId === id);
        if (job) { job.meterCompleted = false; job.meterCompletedAt = null; job.meterCompletedBy = ''; }
        renderAll();
    } catch (e) {
        alert('Could not re-open: ' + e.message);
    }
};

window.markCompleteByOther = async function (id) {
    if (!confirm('Mark as completed by another party? No engineer details will be saved.')) return;
    try {
        await updateDoc(doc(db, 'site-surveys', id), {
            meterCompleted:   true,
            meterCompletedAt: new Date().toISOString(),
            meterCompletedBy: 'Other'
        });
        const job = window._jobs.find(s => s._docId === id);
        if (job) {
            job.meterCompleted   = true;
            job.meterCompletedAt = new Date().toISOString();
            job.meterCompletedBy = 'Other';
        }
        // Mirror to meterworkrequired collection
        try { await setDoc(doc(db, 'meterworkrequired', id), { ...job }); } catch(_) {}
        renderAll();
    } catch (e) {
        alert('Could not mark complete: ' + e.message);
    }
};

// ── init ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
    loadData();
    window.addEventListener('scroll', () =>
        document.getElementById('back-top').classList.toggle('show', scrollY > 400));
    document.getElementById('back-top').addEventListener('click', () =>
        window.scrollTo({ top: 0, behavior: 'smooth' }));
});
</script>
</body>
</html>
